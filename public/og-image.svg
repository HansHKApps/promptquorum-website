  <text x="765" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6750A4" text-anchor="middle">9 Languages</text>

  <rect x="860" y="482" width="190" height="36" rx="18" fill="#6750A4" opacity="0.1"/>
  <text x="955" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6750A4" text-anchor="middle">788+ Articles</text>

