<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">上下文窗口：标称上限与32K规划上限</text>

  <!-- token conversion note, top right -->
  <text x="740" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">1 token ≈ 0.75 个词</text>

  <!-- bar track -->
  <rect x="60" y="140" width="700" height="52" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- reliable zone (0-32K) -->
  <rect x="60" y="140" width="175" height="52" rx="8" fill="#34A853"/>
  <rect x="150" y="140" width="85" height="52" fill="#34A853"/>
  <text x="147" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">规划区</text>

  <!-- degraded zone (32K-128K) -->
  <rect x="235" y="140" width="525" height="52" fill="#F4B400"/>
  <rect x="650" y="140" width="110" height="52" rx="8" fill="#F4B400"/>
  <text x="497" y="171" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">长输入有风险——文风漂移、遗忘情节要点</text>

  <!-- divider at 32K -->
  <line x1="235" y1="122" x2="235" y2="200" stroke="#6750A4" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="235" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">32K token</text>
  <text x="235" y="216" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">约24,000字（规划上限）</text>

  <!-- start label -->
  <text x="60" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="start">0</text>

  <!-- end label -->
  <text x="760" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="end">128K–262K token</text>
  <text x="760" y="216" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="end">标称窗口（上限，不保证质量）</text>

  <!-- comparison badges -->
  <circle cx="180" cy="270" r="14" fill="#34A853"/>
  <text x="180" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="205" y="266" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Qwen3.6 27B, Gemma 4 31B, Llama 3.3 70B</text>
  <text x="205" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">配合会话文档可保持在32K规划区内</text>

  <circle cx="180" cy="312" r="14" fill="#F4B400"/>
  <text x="180" y="317" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">!</text>
  <text x="205" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Kimi-K2.6（256K上下文，约1T参数）</text>
  <text x="205" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">权重约500 GB（4位，估算）——服务器级，非消费级硬件</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">会话文档技术将工作上下文控制在4,000 token以内，每次生成调用都处于规划区内。</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
