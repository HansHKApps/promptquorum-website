  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Mac Mini M5(24GB)는 1–1.5초로 가장 빠르고, Raspberry Pi 5(8GB)는 5–8초로 가장 느리지만 비용은 약 100달러입니다.</text>
