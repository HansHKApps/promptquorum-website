  <text x="150" y="108" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">3 299 € (Mac Studio)</text>

  <text x="48" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Mémoire :</text>
  <text x="150" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">128 GB unifiée</text>

