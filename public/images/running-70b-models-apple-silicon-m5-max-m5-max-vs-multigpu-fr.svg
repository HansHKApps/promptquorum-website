  <text x="452" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F4B400">△ Plus rapide, mais complexe à</text>
  <text x="452" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F4B400">  construire et maintenir</text>
