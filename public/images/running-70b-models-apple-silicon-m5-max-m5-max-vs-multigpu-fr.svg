  <text x="48" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">  sans complexité multi-GPU</text>

  <rect x="432" y="50" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
