<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Roman en 4 phases</text>

  <!-- Step 1 -->
  <circle cx="110" cy="120" r="22" fill="#6750A4"/>
  <text x="110" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Outline</text>
  <text x="110" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">10–30 chapitres</text>
  <text x="110" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">1 phrase chacun</text>

  <text x="205" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="120" r="22" fill="#6750A4"/>
  <text x="300" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Beat sheets</text>
  <text x="300" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">3–8 scènes</text>
  <text x="300" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">par chapitre</text>

  <text x="395" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="490" cy="120" r="22" fill="#6750A4"/>
  <text x="490" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Génération de scènes</text>
  <text x="490" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">une scène par session</text>
  <text x="490" y="200" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">200–600 mots</text>

  <text x="585" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="680" cy="120" r="22" fill="#6750A4"/>
  <text x="680" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Passes de révision</text>
  <text x="680" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">prompts ciblés</text>
  <text x="680" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">une scène par appel</text>

  <!-- session document banner -->
  <rect x="60" y="250" width="680" height="70" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Document de session (fiches personnages + résumés de chapitres + cadre de la scène)</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">réinjecté au début de chaque appel de la phase 3 — moins de 4 000 tokens</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Générez une scène à la fois — ne demandez jamais au modèle de « continuer » un document qui grandit au-delà de 32K tokens.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
