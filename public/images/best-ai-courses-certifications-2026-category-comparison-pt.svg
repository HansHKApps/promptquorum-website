<text x="250" y="160" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">Desenvolver habilidade</text>
<text x="250" y="175" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">prática e aplicada</text>
