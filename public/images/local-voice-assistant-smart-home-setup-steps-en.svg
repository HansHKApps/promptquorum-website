<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Six Steps to a Local Voice Setup</text>

  <!-- Step 1 -->
  <circle cx="70" cy="130" r="26" fill="#6750A4"/>
  <text x="70" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="70" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Enable Assist</text>
  <text x="70" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Settings →</text>
  <text x="70" y="211" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Voice assistants</text>

  <text x="140" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="210" cy="130" r="26" fill="#6750A4"/>
  <text x="210" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="210" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Add Whisper</text>
  <text x="210" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">STT add-on</text>

  <text x="280" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="350" cy="130" r="26" fill="#6750A4"/>
  <text x="350" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="350" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Add Piper</text>
  <text x="350" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">TTS add-on</text>

  <text x="420" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="490" cy="130" r="26" fill="#6750A4"/>
  <text x="490" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="490" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Connect Wyoming</text>
  <text x="490" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">wires the services</text>

  <text x="560" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 5 -->
  <circle cx="630" cy="130" r="26" fill="#6750A4"/>
  <text x="630" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="630" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Add wake word</text>
  <text x="630" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">openWakeWord</text>

  <text x="700" y="138" font-family="system-ui, sans-serif" font-size="18" fill="#79747E" text-anchor="middle">→</text>

  <!-- Step 6 (optional) -->
  <circle cx="740" cy="130" r="26" fill="#FFFFFF" stroke="#79747E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="740" y="138" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#79747E" text-anchor="middle">6</text>
  <text x="740" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local LLM</text>
  <text x="740" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">optional</text>

  <line x1="30" y1="240" x2="770" y2="240" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="400" y="280" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Steps 1–5 give you a working intent-only assistant with no cloud calls</text>
  <text x="400" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Step 6 adds natural-language understanding — set a local LLM as the conversation agent</text>
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="11.5" fill="#79747E" text-anchor="middle">A mini PC handles all six steps comfortably; a Raspberry Pi is best kept to steps 1–5.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
