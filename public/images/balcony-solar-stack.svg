<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" fill="none"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect x="0" y="0" width="960" height="480" rx="24" fill="#FAFAF9"/>

  <!-- Boundary: the local network / home -->
  <rect x="24" y="24" width="912" height="432" rx="20" fill="none" stroke="#D6D3D1" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Connections (drawn first, under nodes) -->
  <g stroke="#C4B5FD" stroke-width="3" fill="none">
    <path d="M480 240 L 220 140"/>
    <path d="M480 240 L 220 340"/>
    <path d="M480 240 L 740 140"/>
    <path d="M480 240 L 740 340"/>
    <path d="M480 240 L 480 130"/>
  </g>

  <!-- Center node: Home Assistant hub -->
  <g>
    <circle cx="480" cy="240" r="64" fill="#6750A4"/>
    <circle cx="480" cy="240" r="64" fill="none" stroke="#4F3A8C" stroke-width="2"/>
    <!-- house glyph -->
    <path d="M480 205 L 512 232 V 272 H 452 V 232 Z" fill="#FFFFFF"/>
    <rect x="470" y="248" width="20" height="24" fill="#6750A4"/>
  </g>

  <!-- Top node: Solar panel -->
  <g>
    <rect x="430" y="60" width="100" height="70" rx="16" fill="#F59E0B"/>
    <path d="M448 80 a20 20 0 0 1 32 -8" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="446" y="94" width="68" height="24" rx="3" fill="none" stroke="#FFF" stroke-width="3"/>
    <line x1="463" y1="94" x2="463" y2="118" stroke="#FFF" stroke-width="3"/>
    <line x1="480" y1="94" x2="480" y2="118" stroke="#FFF" stroke-width="3"/>
    <line x1="497" y1="94" x2="497" y2="118" stroke="#FFF" stroke-width="3"/>
    <line x1="446" y1="106" x2="514" y2="106" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Left-top node: Micro-inverter -->
  <g>
    <rect x="140" y="96" width="100" height="88" rx="16" fill="#8B5CF6"/>
    <path d="M196 116 L178 148 h16 l-8 24 24-34 h-16 z" fill="#FFF"/>
  </g>

  <!-- Left-bottom node: battery storage -->
  <g>
    <rect x="140" y="296" width="100" height="88" rx="16" fill="#10B981"/>
    <rect x="168" y="322" width="44" height="36" rx="4" fill="none" stroke="#FFF" stroke-width="4"/>
    <rect x="212" y="333" width="8" height="14" rx="2" fill="#FFF"/>
    <rect x="176" y="330" width="10" height="20" fill="#FFF"/>
    <rect x="190" y="330" width="10" height="20" fill="#FFF"/>
  </g>

  <!-- Right-top node: wall outlet / grid connection -->
  <g>
    <rect x="700" y="96" width="100" height="88" rx="16" fill="#64748B"/>
    <circle cx="750" cy="140" r="24" fill="none" stroke="#FFF" stroke-width="4"/>
    <circle cx="740" cy="134" r="4" fill="#FFF"/>
    <circle cx="760" cy="134" r="4" fill="#FFF"/>
    <path d="M742 152 q8 8 16 0" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right-bottom node: local monitoring dashboard -->
  <g>
    <rect x="700" y="296" width="100" height="88" rx="16" fill="#0EA5E9"/>
    <rect x="724" y="350" width="12" height="18" rx="2" fill="#FFF"/>
