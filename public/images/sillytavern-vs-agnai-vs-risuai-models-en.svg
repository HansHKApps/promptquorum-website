<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Recommended Models for Local Roleplay (All 3 Frontends)
  </text>

  <!-- Model 1: Llama 3.3 70B -->
  <rect x="40" y="65" width="160" height="260" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="40" y="65" width="160" height="4" fill="#6750A4"/>

  <text x="120" y="95" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Llama 3.3 70B</text>
  <circle cx="120" cy="125" r="12" fill="#34A853"/>
  <text x="120" y="132" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">★</text>

  <text x="120" y="155" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Best all-round</text>
  <text x="120" y="175" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Voice consistency</text>
  <text x="120" y="190" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Dialogue depth</text>
  <text x="120" y="205" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Handles dark themes</text>
  <line x1="50" y1="220" x2="190" y2="220" stroke="#F7F2FA" stroke-width="1"/>
  <text x="120" y="242" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">42 GB VRAM</text>
  <text x="120" y="257" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">RTX 4090 / M5 Max</text>
  <text x="120" y="312" font-size="9" font-weight="700" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">THE STANDARD</text>

  <!-- Model 2: Qwen3 32B -->
  <rect x="240" y="65" width="160" height="260" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="240" y="65" width="160" height="4" fill="#6750A4"/>

  <text x="320" y="95" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Qwen3 32B</text>
  <circle cx="320" cy="125" r="12" fill="#34A853"/>
  <text x="320" y="132" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">★</text>

  <text x="320" y="155" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">24 GB default pick</text>
  <text x="320" y="175" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Nearly 70B quality</text>
  <text x="320" y="190" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">70% of 70B size</text>
  <text x="320" y="205" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Laptops & desktops</text>
  <line x1="250" y1="220" x2="390" y2="220" stroke="#F7F2FA" stroke-width="1"/>
  <text x="320" y="242" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">24 GB VRAM</text>
  <text x="320" y="257" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">RTX 4070 / M3 Pro</text>
  <text x="320" y="312" font-size="9" font-weight="700" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">MOST POPULAR</text>

  <!-- Model 3: Command R+ -->
  <rect x="440" y="65" width="160" height="260" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="440" y="65" width="160" height="4" fill="#6750A4"/>

  <text x="520" y="95" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Command R+ 104B</text>
  <circle cx="520" cy="125" r="12" fill="#34A853"/>
  <text x="520" y="132" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">◆</text>

  <text x="520" y="155" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Dialogue specialist</text>
  <text x="520" y="175" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Character distinction</text>
  <text x="520" y="190" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Group scenes</text>
  <text x="520" y="205" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Natural voices</text>
  <line x1="450" y1="220" x2="590" y2="220" stroke="#F7F2FA" stroke-width="1"/>
  <text x="520" y="242" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">62 GB VRAM</text>
  <text x="520" y="257" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">RTX 4090 only</text>
  <text x="520" y="312" font-size="9" font-weight="700" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">GROUP SCENES</text>

  <!-- Model 4: Hermes 3 -->
  <rect x="640" y="65" width="140" height="260" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="640" y="65" width="140" height="4" fill="#EA4335"/>

  <text x="710" y="95" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Hermes 3</text>
  <circle cx="710" cy="125" r="12" fill="#EA4335"/>
  <text x="710" y="132" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">⚠</text>

  <text x="710" y="155" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Uncensored 70B</text>
  <text x="710" y="175" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">No safety layer</text>
  <text x="710" y="190" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Mature themes</text>
  <text x="710" y="205" font-size="9" fill="#79747E" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Follows prompts</text>
  <line x1="650" y1="220" x2="770" y2="220" stroke="#F7F2FA" stroke-width="1"/>
  <text x="710" y="242" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">42 GB VRAM</text>
  <text x="710" y="257" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Same as 70B</text>
  <text x="710" y="312" font-size="9" font-weight="700" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">DUAL INSTALL</text>

  <!-- Legend -->
  <text x="50" y="335" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">★ = All-purpose. ◆ = Specialized. ⚠ = Uncensored (read the room). Avoid models <13B without creative fine-tunes.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>