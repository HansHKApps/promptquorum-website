<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    SillyTavern vs Agnai vs RisuAI: Key Features Comparison
  </text>

  <!-- Headers -->
  <text x="100" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Feature</text>
  <text x="250" y="65" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">SillyTavern</text>
  <text x="450" y="65" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">Agnai</text>
  <text x="650" y="65" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">RisuAI</text>
  <line x1="20" y1="72" x2="780" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: Setup time -->
  <text x="50" y="99" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Setup Time</text>
  <text x="250" y="99" font-size="11" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">~15 min</text>
  <text x="450" y="99" font-size="11" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">~10 min</text>
  <text x="650" y="99" font-size="11" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">~5 min</text>
  <line x1="20" y1="108" x2="780" y2="108" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Character cards -->
  <text x="50" y="135" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Character Cards</text>
  <text x="250" y="135" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Tavern v2 + ext</text>
  <text x="450" y="135" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Tavern v2</text>
  <text x="650" y="135" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Tavern v2 +</text>
  <line x1="20" y1="144" x2="780" y2="144" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: Lore books -->
  <text x="50" y="171" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Lore Books</text>
  <circle cx="250" cy="165" r="10" fill="#34A853"/>
  <text x="250" y="172" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Deep</text>
  <text x="450" y="171" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Simpler</text>
  <text x="650" y="171" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Simpler</text>
  <line x1="20" y1="180" x2="780" y2="180" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: Group chat -->
  <text x="50" y="207" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Group Chat</text>
  <circle cx="250" cy="201" r="10" fill="#34A853"/>
  <text x="250" y="208" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">✓</text>
  <text x="450" y="207" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">✓ Simpler</text>
  <text x="650" y="207" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">✓ Simpler</text>
  <line x1="20" y1="216" x2="780" y2="216" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: Multi-user -->
  <text x="50" y="243" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Multi-User Mode</text>
  <circle cx="250" cy="237" r="10" fill="#EA4335"/>
  <text x="250" y="244" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">✗</text>
  <circle cx="450" cy="237" r="10" fill="#34A853"/>
  <text x="450" y="244" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">✓</text>
  <circle cx="650" cy="237" r="10" fill="#EA4335"/>
  <text x="650" y="244" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">✗</text>
  <line x1="20" y1="252" x2="780" y2="252" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6: Extensions -->
  <text x="50" y="279" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Extensions</text>
  <circle cx="250" cy="273" r="10" fill="#34A853"/>
  <text x="250" y="280" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">⊙</text>
  <text x="450" y="279" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Limited</text>
  <text x="650" y="279" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Limited</text>
  <line x1="20" y1="288" x2="780" y2="288" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 7: Mobile -->
  <text x="50" y="315" font-size="11" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Mobile Apps</text>
  <text x="250" y="315" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Termux only</text>
  <text x="450" y="315" font-size="10" fill="#1C1B1F" font-family="'SF Mono', Monaco, monospace">Browser</text>
  <circle cx="650" cy="309" r="10" fill="#34A853"/>
  <text x="650" y="316" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">✓</text>
  <line x1="20" y1="324" x2="780" y2="324" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Verdict -->
  <rect x="40" y="335" width="720" height="75" fill="#F7F2FA" rx="4" stroke="#E8DEF8" stroke-width="1"/>
  <text x="60" y="355" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Quick Verdict:</text>
  <text x="60" y="375" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">SillyTavern: deepest features, largest community, best for solo users wanting customisation. Agnai: only multi-user option with shared-server mode.</text>
  <text x="60" y="392" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">RisuAI: simplest first-run (5 minutes), mobile apps built-in, lighter feature set. All three load the same Tavern v2 character cards.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>