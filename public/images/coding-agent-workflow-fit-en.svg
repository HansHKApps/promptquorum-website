<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Workflow Fit by Use Case</text>
  <!-- Column headers -->
  <text x="18" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Use Case</text>
  <text x="390" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Best Fit</text>
  <text x="555" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Why</text>
  <!-- Header divider -->
  <line x1="10" y1="65" x2="790" y2="65" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1 -->
  <text x="18" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Adding a function with autocomplete</text>
  <text x="390" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#6750A4">Continue.dev</text>
  <text x="555" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">FIM is natural primitive</text>
  <line x1="10" y1="97" x2="790" y2="97" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2 -->
  <text x="18" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">In-editor "what does this do?" chat</text>
  <text x="390" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#6750A4">Continue.dev</text>
  <text x="555" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">In-IDE @file chat</text>
  <line x1="10" y1="129" x2="790" y2="129" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3 -->
  <text x="18" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Refactoring across 5+ files</text>
  <text x="390" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#F4B400">Cline</text>
  <text x="555" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Native multi-file + approvals</text>
  <line x1="10" y1="161" x2="790" y2="161" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 4 -->
  <text x="18" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Find why a test is flaky (exploratory)</text>
  <text x="390" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#F4B400">Cline</text>
  <text x="555" y="183" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Runs commands, reads logs</text>
  <line x1="10" y1="193" x2="790" y2="193" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 5 -->
  <text x="18" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Repo-wide rename with reviewable commits</text>
  <text x="390" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#34A853">Aider</text>
  <text x="555" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Every edit is a commit</text>
  <line x1="10" y1="225" x2="790" y2="225" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 6 -->
  <text x="18" y="247" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">SSH onto a server, no IDE</text>
  <text x="390" y="247" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#34A853">Aider</text>
  <text x="555" y="247" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Terminal-only by design</text>
  <line x1="10" y1="257" x2="790" y2="257" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 7 -->
  <text x="18" y="279" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Vim/Neovim daily driver</text>
  <text x="390" y="279" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#34A853">Aider</text>
  <text x="555" y="279" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Natural terminal pairing</text>
  <line x1="10" y1="289" x2="790" y2="289" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 8 -->
  <text x="18" y="311" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">JetBrains user</text>
  <text x="390" y="311" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#6750A4">Continue.dev or Aider</text>
  <text x="555" y="311" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Cline is VS Code-only</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
