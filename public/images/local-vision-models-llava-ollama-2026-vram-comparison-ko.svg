  <line x1="18" y1="345" x2="782" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">MiniCPM-V 4.5와 Qwen3-VL 8B는 6GB VRAM에서 문서 OCR을 선도하며, Llama 3.2 Vision 11B는</text>
  <text x="400" y="395" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Ollama를 통해 8GB에서 최고의 범용 모델입니다.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
