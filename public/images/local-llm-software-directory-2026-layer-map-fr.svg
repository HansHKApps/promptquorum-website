<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <style>
      .tier { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .tier-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .tier-desc { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .tier-new { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">7 catégories de logiciels LLM locaux (227 outils)</text>

  <!-- Category 1: Run & Serve -->
  <rect x="50" y="60" width="900" height="40" class="tier"/>
  <text x="60" y="85" class="tier-title">1. Exécution &amp; Hébergement (41 outils)</text>
  <text x="550" y="85" class="tier-desc">Ollama, llama.cpp, vLLM, LocalAI, TensorRT-LLM...</text>

  <!-- Category 2: Chat & Assistants -->
  <rect x="50" y="110" width="900" height="40" class="tier"/>
  <text x="60" y="135" class="tier-title">2. Chat &amp; Assistants (56 outils)</text>
  <text x="550" y="135" class="tier-desc">LM Studio, Jan, GPT4All, Open WebUI, LibreChat, SillyTavern...</text>

  <!-- Category 3: Code & Development -->
  <rect x="50" y="160" width="900" height="40" class="tier"/>
  <text x="60" y="185" class="tier-title">3. Code &amp; Développement (59 outils)</text>
  <text x="550" y="185" class="tier-desc">Continue.dev, Cline, Aider, LangChain, CrewAI, SuperAGI...</text>

  <!-- Category 4: Knowledge & Retrieval -->
  <rect x="50" y="210" width="900" height="40" class="tier"/>
  <text x="60" y="235" class="tier-title">4. Connaissances &amp; Recherche (34 outils)</text>
  <text x="550" y="235" class="tier-desc">AnythingLLM, PrivateGPT, LlamaIndex, Haystack, Quivr...</text>

  <!-- Category 5: Voice & Audio -->
  <rect x="50" y="260" width="900" height="40" class="tier"/>
  <text x="60" y="285" class="tier-title">5. Voix &amp; Audio (16 outils)</text>
  <text x="550" y="285" class="tier-desc">Whisper.cpp, faster-whisper, Piper, Coqui TTS, XTTS v2...</text>

  <!-- Category 6: Images & Video -->
  <rect x="50" y="310" width="900" height="40" class="tier"/>
  <text x="60" y="335" class="tier-title">6. Images &amp; Vidéo (17 outils)</text>
  <text x="550" y="335" class="tier-desc">Stable Diffusion, ComfyUI, AUTOMATIC1111, Invoke AI...</text>

  <!-- Category 7: Train & Operate (emerging) -->
  <rect x="50" y="360" width="900" height="40" class="tier-new"/>
  <text x="60" y="385" class="tier-title" fill="#2e7d32">7. Entraînement &amp; Exploitation (4 outils) ★ ÉMERGENT</text>
  <text x="550" y="385" class="tier-desc">Fine-tuning, jeux de données, évaluation, observabilité — couverture naissante</text>

  <text x="500" y="425" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">De nombreux outils relèvent de plusieurs catégories — le nombre indique la catégorie principale de chaque outil.</text>
<text x="8" y="455" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="start">Chiffres du répertoire au 2026-09-25 — mis à jour à mesure que de nouveaux outils sont ajoutés.</text>
<text x="992" y="455" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
