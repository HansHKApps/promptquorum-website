<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Latência do assistente de voz por nível de hardware: de 1,5 a 8 segundos</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="250" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Raspberry Pi 5 (8 GB)</text>
  <rect x="260" y="75" width="390" height="24" fill="#EA4335" rx="4"/>
  <text x="658" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">5–8 s</text>
  <text x="250" y="136" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Mini PC (16 GB RAM)</text>
  <rect x="260" y="117" width="240" height="24" fill="#F4B400" rx="4"/>
  <text x="508" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">3–5 s</text>
  <text x="250" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Desktop RTX 3060</text>
  <rect x="260" y="159" width="90" height="24" fill="#6750A4" rx="4"/>
  <text x="358" y="176" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">1–2 s</text>
  <text x="250" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Mac Mini M5 (24 GB)</text>
  <rect x="260" y="201" width="75" height="24" fill="#34A853" rx="4"/>
  <text x="343" y="218" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">1–1,5 s — o mais rápido</text>
  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">O Mac Mini M5 (24 GB) tem a latência mais rápida, 1–1,5 s; o Raspberry Pi 5 (8 GB) é o mais lento, 5–8 s, mas custa apenas ~US$ 100.</text>
