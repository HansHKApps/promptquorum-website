  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lista de Verificação de Conformidade do GDPR por Artigo: LLM Local vs API na Nuvem</text>

  <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Artigo GDPR</text>
  <text x="330" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">LLM Local</text>
  <text x="565" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">API na Nuvem</text>
  <line x1="18" y1="68" x2="782" y2="68" stroke="#E8DEF8" stroke-width="1.5"/>

  <rect x="18" y="70" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 5 — Minimização de Dados</text>
  <text x="330" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Nunca sai da infraestrutura</text>
  <text x="565" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Transferido ao provedor</text>
  <rect x="18" y="122" width="764" height="48" fill="#FFFFFF" rx="4"/>
  <text x="40" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 25 — Proteção de Dados desde a Concepção</text>
  <text x="330" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Prevenção por design</text>
  <text x="565" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Requer controles contratuais</text>
  <rect x="18" y="174" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 32 — Medidas Técnicas</text>
  <text x="330" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Criptografia sob controle da organização</text>
  <text x="565" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Implementado pelo provedor</text>
  <rect x="18" y="226" width="764" height="48" fill="#FFFFFF" rx="4"/>
  <text x="40" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 44 — Transferências Internacionais</text>
  <text x="330" y="256" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Sem transferência</text>
  <text x="565" y="256" font-family="system-ui, sans-serif" font-size="11" fill="#EA4335">❌ Ocorre a transferência</text>
  <rect x="18" y="278" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 28 — Obrigações do Operador</text>
