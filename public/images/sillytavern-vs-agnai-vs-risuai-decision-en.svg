<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Choose Your Roleplay Frontend: 3 Questions
  </text>

  <!-- Question 1 -->
  <circle cx="80" cy="100" r="22" fill="#6750A4"/>
  <text x="80" y="108" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">?</text>
  <text x="80" y="145" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Sharing with</text>
  <text x="80" y="162" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">other writers?</text>

  <!-- Arrow 1 -->
  <text x="140" y="108" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Question 2 -->
  <circle cx="200" cy="100" r="22" fill="#6750A4"/>
  <text x="200" y="108" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">?</text>
  <text x="200" y="145" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Want deep</text>
  <text x="200" y="162" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">customisation?</text>

  <!-- Arrow 2 -->
  <text x="260" y="108" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Question 3 -->
  <circle cx="320" cy="100" r="22" fill="#6750A4"/>
  <text x="320" y="108" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">?</text>
  <text x="320" y="145" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Mobile first</text>
  <text x="320" y="162" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">or desktop?</text>

  <!-- Branches -->
  <!-- Branch 1: Sharing? Yes → Agnai -->
  <line x1="80" y1="122" x2="80" y2="200" stroke="#6750A4" stroke-width="2"/>
  <text x="50" y="165" font-size="10" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">YES</text>

  <rect x="35" y="200" width="90" height="50" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="80" y="220" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">AGNAI</text>
  <text x="80" y="240" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Multi-user</text>

  <!-- Branch 1 No: Skip to next question -->
  <text x="110" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">NO</text>

  <!-- Branch 2: Deep customisation? Yes → SillyTavern -->
  <line x1="200" y1="122" x2="200" y2="200" stroke="#6750A4" stroke-width="2"/>
  <text x="170" y="165" font-size="10" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">YES</text>

  <rect x="155" y="200" width="90" height="50" rx="4" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="200" y="220" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SILLYTAVERN</text>
  <text x="200" y="240" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Deep features</text>

  <!-- Branch 2 No: Skip to next question -->
  <text x="230" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">NO</text>

  <!-- Branch 3: Mobile first? Yes → RisuAI -->
  <line x1="320" y1="122" x2="320" y2="200" stroke="#6750A4" stroke-width="2"/>
  <text x="290" y="165" font-size="10" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">YES</text>

  <rect x="275" y="200" width="90" height="50" rx="4" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="320" y="220" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">RISUAI</text>
  <text x="320" y="240" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Mobile apps</text>

  <!-- Branch 3 No: Default to SillyTavern -->
  <line x1="350" y1="165" x2="380" y2="165" stroke="#49454F" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="355" y="180" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">NO</text>

  <rect x="380" y="155" width="90" height="50" rx="4" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="425" y="175" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SILLYTAVERN</text>
  <text x="425" y="195" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Default pick</text>

  <!-- Verdict box -->
  <rect x="50" y="290" width="700" height="80" fill="#F7F2FA" rx="4" stroke="#E8DEF8" stroke-width="1"/>
  <text x="70" y="312" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Bottom Line:</text>
  <text x="70" y="332" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">All three load the same Tavern v2 character cards. You can move your characters between them without conversion. Start with</text>
  <text x="70" y="347" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">whichever fits your workflow today; switching later is trivial. Most users end up on SillyTavern eventually — 80% share a similar workflow.</text>
  <text x="70" y="362" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">If in doubt, try RisuAI first (5-minute install) — the overhead to switch is nearly zero.</text>
<text x="792" y="375" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>