<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Context Window Strategy</text>
  <!-- Column headers -->
  <text x="18" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Harness</text>
  <text x="180" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Context Method</text>
  <text x="440" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Token Footprint</text>
  <text x="700" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Min Window</text>
  <!-- Header divider -->
  <line x1="10" y1="67" x2="790" y2="67" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1 - Continue.dev -->
  <text x="18" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Continue.dev</text>
  <text x="180" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Index + @-pinned chunks</text>
  <text x="440" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Low — on-demand retrieval</text>
  <circle cx="700" cy="91" r="14" fill="#34A853"/>
  <text x="700" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">32K</text>
  <line x1="10" y1="110" x2="790" y2="110" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2 - Cline -->
  <text x="18" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Cline</text>
  <text x="180" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Full file streaming</text>
  <text x="440" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">High — 25K–40K per task</text>
  <circle cx="700" cy="141" r="14" fill="#EA4335"/>
  <text x="700" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">128K</text>
  <line x1="10" y1="160" x2="790" y2="160" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3 - Aider -->
  <text x="18" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Aider</text>
  <text x="180" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Repo map + /add files</text>
  <text x="440" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F">Medium — ~2K map + files</text>
  <circle cx="700" cy="191" r="14" fill="#34A853"/>
  <text x="700" y="195" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">32K</text>
  <!-- Footer -->
  <rect x="10" y="225" width="780" height="52" fill="#F7F2FA" rx="6"/>
  <text x="400" y="247" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Cline needs 128K for non-trivial multi-file tasks.</text>
  <text x="400" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Continue.dev and Aider are comfortable at 32K.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
