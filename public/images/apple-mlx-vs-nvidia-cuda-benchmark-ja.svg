<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="推論速度ベンチマーク：Apple M5 Max vs NVIDIA RTX 4090 トークン/秒"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <title>Apple MLX vs NVIDIA CUDA ベンチマーク：モデルサイズ別トークン/秒</title>
  <rect width="800" height="350" fill="#F6F5FA"/>
