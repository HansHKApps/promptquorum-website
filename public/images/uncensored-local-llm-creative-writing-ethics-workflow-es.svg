<svg viewBox="0 0 800 455" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="455" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Flujo de trabajo práctico para escritores de ficción</text>
  <line x1="46" y1="78" x2="46" y2="350" stroke="#E8DEF8" stroke-width="2"/>
  <circle cx="46" cy="78" r="16" fill="#6750A4"/>
  <text x="46" y="83" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="78" y="74" font-size="14" font-weight="700" fill="#1C1B1F">Redactar con un modelo estándar</text>
  <text x="78" y="93" font-size="12" fill="#49454F">Llama 3.3 70B o Qwen3 32B manejan temas oscuros y complejidad moral.</text>
  <circle cx="46" cy="146" r="16" fill="#6750A4"/>
  <text x="46" y="151" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="78" y="142" font-size="14" font-weight="700" fill="#1C1B1F">Cambiar a sin censura para escenas puntuales</text>
  <text x="78" y="161" font-size="12" fill="#49454F">Ejecuta Hermes 3 solo para esa escena — sin datos entre sesiones.</text>
  <circle cx="46" cy="214" r="16" fill="#6750A4"/>
  <text x="46" y="219" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="78" y="210" font-size="14" font-weight="700" fill="#1C1B1F">Reutilizar las mismas plantillas de prompt</text>
  <text x="78" y="229" font-size="12" fill="#49454F">Los prompts de escena, subtexto y contradicción funcionan igual.</text>
  <circle cx="46" cy="282" r="16" fill="#6750A4"/>
  <text x="46" y="287" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="78" y="278" font-size="14" font-weight="700" fill="#1C1B1F">Sin instrucciones que no darías a un humano</text>
  <text x="78" y="297" font-size="12" fill="#49454F">El modelo es una herramienta, no una estructura de permiso.</text>
  <circle cx="46" cy="350" r="16" fill="#6750A4"/>
  <text x="46" y="355" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="78" y="346" font-size="14" font-weight="700" fill="#1C1B1F">Revisar antes de distribuir</text>
  <text x="78" y="365" font-size="12" fill="#49454F">Aplica la revisión editorial estándar al contenido asistido por IA.</text>
  <text x="400" y="433" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">La mayoría de los escritores usan el modelo sin censura solo para escenas específicas, no como reemplazo por defecto.</text>
<text x="792" y="450" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>