<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text x="400" y="36" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">GPU-Wahl in 4 Fragen</text>

  <!-- Pfeile zwischen den Schritten -->
  <text x="205" y="106" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>
  <text x="390" y="106" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>
  <text x="575" y="106" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>

  <!-- Schritt 1 -->
  <circle cx="120" cy="98" r="26" fill="#6750A4"/>
  <text x="120" y="106" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="120" y="152" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Größtes Modell?</text>
  <text x="120" y="176" font-size="11" fill="#49454F" text-anchor="middle">7B &#8594; Budget-Klasse</text>
  <text x="120" y="193" font-size="11" fill="#49454F" text-anchor="middle">14B &#8594; Mittelklasse</text>
  <text x="120" y="210" font-size="11" fill="#49454F" text-anchor="middle">22B &#8594; Oberklasse</text>
  <text x="120" y="227" font-size="11" fill="#49454F" text-anchor="middle">33B &#8594; 4090 / 70B &#8594; 5090</text>

  <!-- Schritt 2 -->
  <circle cx="305" cy="98" r="26" fill="#6750A4"/>
  <text x="305" y="106" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="305" y="152" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Budgetgrenze?</text>
  <text x="305" y="176" font-size="11" fill="#49454F" text-anchor="middle">Knapp: RTX 3060</text>
  <text x="305" y="193" font-size="11" fill="#49454F" text-anchor="middle">bis ~800 €: 4060 Ti 16GB</text>
  <text x="305" y="210" font-size="11" fill="#49454F" text-anchor="middle">~1.400 €: 4070 Ti Super</text>
  <text x="305" y="227" font-size="11" fill="#49454F" text-anchor="middle">ab 3.000 €: 4090 / 5090</text>

  <!-- Schritt 3 -->
  <circle cx="490" cy="98" r="26" fill="#6750A4"/>
  <text x="490" y="106" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="152" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">NVIDIA oder AMD?</text>
  <text x="490" y="176" font-size="11" fill="#49454F" text-anchor="middle">Standard: NVIDIA —</text>
  <text x="490" y="193" font-size="11" fill="#49454F" text-anchor="middle">CUDA läuft sofort.</text>
  <text x="490" y="210" font-size="11" fill="#49454F" text-anchor="middle">AMD nur mit Stunden</text>
  <text x="490" y="227" font-size="11" fill="#49454F" text-anchor="middle">ROCm-Einrichtung.</text>

  <!-- Schritt 4 -->
  <circle cx="675" cy="98" r="26" fill="#6750A4"/>
  <text x="675" y="106" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="675" y="152" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Netzteil-Reserve?</text>
  <text x="675" y="176" font-size="11" fill="#49454F" text-anchor="middle">Ab Mittelklasse:</text>
  <text x="675" y="193" font-size="11" fill="#49454F" text-anchor="middle">285–575 W Karten.</text>
  <text x="675" y="210" font-size="11" fill="#49454F" text-anchor="middle">RTX 5090 braucht ein</text>
  <text x="675" y="227" font-size="11" fill="#49454F" text-anchor="middle">850–1000-W-Netzteil.</text>

  <line x1="18" y1="266" x2="782" y2="266" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="296" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Im Zweifel: die kleinste Karte kaufen, die zu Ihrem Zielmodell passt.</text>
  <text x="400" y="320" font-size="11" fill="#79747E" text-anchor="middle">VRAM entscheidet, welche Modelle laufen; alles andere ist Optimierung. Preise: Momentaufnahme Mai 2026.</text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
