<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="system-ui, -apple-system, sans-serif">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="290" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Installer AnythingLLM Desktop — 4 étapes</text>
  <circle cx="160" cy="85" r="22" fill="#6750A4"/>
  <text x="160" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="240" y="93" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <circle cx="320" cy="85" r="22" fill="#6750A4"/>
  <text x="320" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="400" y="93" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <circle cx="480" cy="85" r="22" fill="#6750A4"/>
  <text x="480" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="560" y="93" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <circle cx="640" cy="85" r="22" fill="#6750A4"/>
  <text x="640" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="160" y="128" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Télécharger</text>
  <text x="160" y="147" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">anythingllm.com</text>
  <text x="160" y="162" font-size="10" fill="#49454F" text-anchor="middle">macOS · Win · Linux</text>
  <text x="320" y="128" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Installer</text>
  <text x="320" y="147" font-size="10" fill="#49454F" text-anchor="middle">lancer l'installeur</text>
  <text x="320" y="162" font-size="10" fill="#49454F" text-anchor="middle">~600 Mo · sans admin</text>
  <text x="480" y="128" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lancer</text>
  <text x="480" y="147" font-size="10" fill="#49454F" text-anchor="middle">ignorer l'invite cloud</text>
  <text x="480" y="162" font-size="10" fill="#49454F" text-anchor="middle">macOS : autoriser si demandé</text>
  <text x="640" y="128" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Choisir Local</text>
  <text x="640" y="147" font-size="10" fill="#49454F" text-anchor="middle">cliquer "Local Setup"</text>
  <text x="640" y="162" font-size="10" fill="#49454F" text-anchor="middle">données restent locales</text>
  <line x1="18" y1="195" x2="782" y2="195" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="215" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">Durée totale : ~4 minutes · Gratuit · Open source · Application bureau (macOS, Windows, Linux)</text>
  <text x="400" y="233" font-size="11" fill="#79747E" text-anchor="middle">Installation dans : ~/Applications (macOS) · %LOCALAPPDATA% (Windows) · .AppImage (Linux)</text>
  <text x="400" y="251" font-size="11" fill="#79747E" text-anchor="middle">L'étape 4 "Local Setup" garde PDF, embeddings et requêtes sur votre machine — sans compte cloud</text>
  <text x="792" y="282" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>
