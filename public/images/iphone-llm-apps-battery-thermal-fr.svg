  <circle cx="38" cy="116" r="3" fill="#EA4335"/>
  <text x="50" y="120" font-size="12" fill="#49454F">~20–30% de batterie/h (iPhone 16 Pro)</text>

  <circle cx="38" cy="142" r="3" fill="#EA4335"/>
