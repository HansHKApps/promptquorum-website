<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Main title -->
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">iPhone LLM : Batterie &amp; Thermique</text>

  <!-- Left panel (red) -->
  <rect x="20" y="46" width="365" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="20" y="46" width="365" height="4" rx="0" fill="#EA4335"/>
  <text x="202" y="70" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">Inférence active</text>

  <!-- Left bullets -->
  <circle cx="38" cy="90" r="3" fill="#EA4335"/>
