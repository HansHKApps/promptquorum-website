<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Quelle taille de modèle Whisper convient à votre matériel ?</text>

  <!-- Root node -->
  <rect x="280" y="42" width="240" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Avez-vous un GPU ou un NPU ?</text>

  <!-- Branch lines from root -->
  <line x1="360" y1="78" x2="200" y2="132" stroke="#6750A4" stroke-width="2"/>
  <line x1="440" y1="78" x2="600" y2="132" stroke="#6750A4" stroke-width="2"/>
  <text x="230" y="93" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">SANS GPU</text>
  <text x="555" y="93" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">AVEC GPU</text>

  <!-- Level 2 nodes -->
  <rect x="105" y="132" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <text x="200" y="155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Quel appareil l'exécute ?</text>

  <rect x="505" y="132" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <text x="600" y="155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Précision maximale requise ?</text>

  <!-- Left sub-branches -->
  <line x1="160" y1="168" x2="95" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="240" y1="168" x2="305" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <text x="60" y="203" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E">RASPBERRY PI</text>
  <text x="278" y="203" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E">MINI-PC</text>

  <!-- Right sub-branches -->
  <line x1="560" y1="168" x2="495" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="640" y1="168" x2="705" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <text x="462" y="203" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E">NON</text>
  <text x="640" y="203" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E">OUI, BRUIT/ACCENTS</text>

  <!-- Leaves -->
  <rect x="30" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="95" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">tiny / base</text>
  <text x="95" y="261" font-family="system-ui, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">Raspberry Pi, commandes courtes</text>

  <rect x="240" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="305" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">small</text>
  <text x="305" y="261" font-family="system-ui, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">CPU de mini-PC, usage quotidien</text>

  <rect x="430" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <text x="495" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F4B400" text-anchor="middle">medium</text>
  <text x="495" y="261" font-family="system-ui, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">GPU ou CPU puissant</text>

  <rect x="640" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="705" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">large</text>
  <text x="705" y="261" font-family="system-ui, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">GPU, accents/pièces bruyantes</text>

  <line x1="60" y1="330" x2="740" y2="330" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="355" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Sans GPU : adaptez la machine à la taille (Raspberry Pi ou mini-PC). Avec GPU/NPU, medium et large deviennent pratiques.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
