<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Flujo de novela: 4 fases</text>

  <!-- Step 1 -->
  <circle cx="110" cy="120" r="22" fill="#6750A4"/>
  <text x="110" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Esquema</text>
  <text x="110" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">10–30 capítulos</text>
  <text x="110" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">1 frase cada uno</text>

  <text x="205" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="120" r="22" fill="#6750A4"/>
  <text x="300" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Beat sheets</text>
  <text x="300" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">3–8 escenas</text>
  <text x="300" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">por capítulo</text>

  <text x="395" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="490" cy="120" r="22" fill="#6750A4"/>
  <text x="490" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Generación de escenas</text>
  <text x="490" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">una escena por sesión</text>
  <text x="490" y="200" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">200–600 palabras</text>

  <text x="585" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="680" cy="120" r="22" fill="#6750A4"/>
  <text x="680" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pasadas de revisión</text>
  <text x="680" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">prompts dirigidos</text>
  <text x="680" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">una escena por llamada</text>

  <!-- session document banner -->
  <rect x="60" y="250" width="680" height="70" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Documento de sesión (fichas de personajes + resúmenes de capítulos + planteamiento de la escena)</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">se reinserta al inicio de cada llamada de la fase 3 — menos de 4.000 tokens</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Genera una escena cada vez: nunca pidas al modelo que «continúe» un documento que crece más allá de 32K tokens.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
