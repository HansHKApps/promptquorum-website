<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Setting Up Frigate with Home Assistant</text>

  <!-- Step 1 -->
  <circle cx="110" cy="115" r="26" fill="#6750A4"/>
  <text x="110" y="123" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="165" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Run Frigate</text>
  <text x="110" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">add-on / container</text>
  <text x="110" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">point at RTSP streams</text>

  <text x="205" y="123" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="115" r="26" fill="#6750A4"/>
  <text x="300" y="123" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Configure Detector</text>
  <text x="300" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Coral TPU / GPU</text>
  <text x="300" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">+ detection zones</text>

  <text x="395" y="123" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="490" cy="115" r="26" fill="#6750A4"/>
  <text x="490" y="123" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="165" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Add HA Integration</text>
  <text x="490" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">exposes camera +</text>
  <text x="490" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">detection entities</text>

  <text x="585" y="123" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="680" cy="115" r="26" fill="#6750A4"/>
  <text x="680" y="123" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="165" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Automate</text>
  <text x="680" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">alerts, snapshots,</text>
  <text x="680" y="197" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">dashboards</text>

  <line x1="30" y1="235" x2="770" y2="235" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Four steps from an RTSP stream to a Home Assistant automation</text>
  <text x="400" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">No cloud account, no app pairing — detection entities appear directly in Home Assistant</text>
  <text x="400" y="318" font-family="system-ui, sans-serif" font-size="11.5" fill="#79747E" text-anchor="middle">A Coral TPU or GPU keeps detection real-time across multiple cameras.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
