<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beelink SER8 key specs: Ryzen 7 8845HS, Radeon 780M, 32 GB DDR5, 1 TB NVMe, 2.5GbE, 65 W, about $650"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Beelink SER8 — Key Specs at a Glance</text>

  <!-- Header row -->
  <text x="34" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Spec</text>
  <text x="230" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Value</text>
  <line x1="18" y1="76" x2="782" y2="76" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: CPU -->
  <text x="34" y="101" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">CPU</text>
  <text x="230" y="101" font-family="'SF Mono', Monaco, monospace" font-size="12.5" font-weight="600" fill="#49454F">Ryzen 7 8845HS — 8 cores / 16 threads</text>
  <line x1="18" y1="112" x2="782" y2="112" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: iGPU -->
  <text x="34" y="137" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">iGPU</text>
  <text x="230" y="137" font-family="'SF Mono', Monaco, monospace" font-size="12.5" font-weight="600" fill="#6750A4">Radeon 780M — 12 CU, RDNA 3</text>
  <line x1="18" y1="148" x2="782" y2="148" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: RAM -->
  <text x="34" y="173" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">RAM</text>
  <text x="230" y="173" font-family="'SF Mono', Monaco, monospace" font-size="12.5" font-weight="600" fill="#49454F">32 GB DDR5-5600, dual SO-DIMM (replaceable)</text>
  <line x1="18" y1="184" x2="782" y2="184" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: Storage -->
  <text x="34" y="209" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Storage</text>
  <text x="230" y="209" font-family="'SF Mono', Monaco, monospace" font-size="12.5" font-weight="600" fill="#49454F">1 TB NVMe, 2× M.2 2280 PCIe 4.0</text>
  <line x1="18" y1="220" x2="782" y2="220" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: Networking -->
  <text x="34" y="245" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Networking</text>
  <text x="230" y="245" font-family="'SF Mono', Monaco, monospace" font-size="12.5" font-weight="600" fill="#49454F">2.5GbE, Wi-Fi 6 (not 6E), Bluetooth 5.2</text>
  <line x1="18" y1="256" x2="782" y2="256" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6: TDP -->
  <text x="34" y="281" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">TDP</text>
  <circle cx="256" cy="277" r="14" fill="#34A853"/>
  <text x="256" y="281" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">65 W</text>
  <text x="285" y="281" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">sustained under load</text>
  <line x1="18" y1="292" x2="782" y2="292" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 7: Price -->
  <text x="34" y="317" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Price</text>
  <text x="230" y="317" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#6750A4">~$650 (July 2026, volatile)</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">32 GB SKU shown; no discrete GPU — inference runs on the CPU and Radeon 780M sharing system RAM.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
