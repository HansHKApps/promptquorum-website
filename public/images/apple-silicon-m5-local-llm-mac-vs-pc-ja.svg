  <text x="602" y="98" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">7B〜13Bとファインチューニングで優位</text>

  <text x="452" y="128" font-size="12" fill="#1C1B1F">✓ 7B〜13Bで90〜120 tok/s（対60〜75）</text>
  <text x="452" y="152" font-size="12" fill="#1C1B1F">✓ より広範なCUDAエコシステムと豊富なツール</text>
  <text x="452" y="176" font-size="12" fill="#1C1B1F">✓ ファインチューニングではPyTorch + CUDAが主流</text>
