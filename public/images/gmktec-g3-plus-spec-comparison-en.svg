<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">GMKtec G3 Plus vs Beelink EQ14 — Spec Comparison</text>

  <!-- Header row -->
  <text x="34" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Spec</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">G3 Plus</text>
  <text x="640" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Beelink EQ14</text>
  <line x1="18" y1="76" x2="782" y2="76" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: RAM ceiling -->
  <text x="34" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">RAM ceiling</text>
  <circle cx="400" cy="102" r="20" fill="#34A853"/>
  <text x="400" y="106" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">32 GB</text>
  <circle cx="640" cy="102" r="20" fill="#F4B400"/>
  <text x="640" y="106" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">16 GB</text>
  <line x1="18" y1="130" x2="782" y2="130" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: RAM type -->
  <text x="34" y="156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">RAM slot</text>
  <text x="400" y="156" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="middle">Replaceable SO-DIMM</text>
  <text x="640" y="156" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="middle">Replaceable SO-DIMM</text>
  <line x1="18" y1="176" x2="782" y2="176" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: Networking -->
  <text x="34" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">2.5GbE ports</text>
  <text x="400" y="206" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#EA4335" text-anchor="middle">1×</text>
  <text x="640" y="206" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">2×</text>
  <line x1="18" y1="222" x2="782" y2="222" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: USB-C -->
  <text x="34" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">USB-C port</text>
  <text x="400" y="252" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">None</text>
  <text x="640" y="252" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">None</text>
  <line x1="18" y1="268" x2="782" y2="268" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: Idle power -->
  <text x="34" y="294" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">Idle power</text>
  <text x="400" y="298" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~6 W</text>
  <text x="640" y="298" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~6 W</text>
  <line x1="18" y1="314" x2="782" y2="314" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6: Price -->
  <text x="34" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F">Price (Jul 2026)</text>
  <text x="400" y="344" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~$180–230</text>
  <text x="640" y="344" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~$170–220</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Both use the Intel N150. The G3 Plus trades a second 2.5GbE port for a 32 GB RAM ceiling — the EQ14 caps at 16 GB.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
