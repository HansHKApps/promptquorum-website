  <text x="400" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Le budget et le besoin de 14B-Q8 mènent à la GPU recommandée : RTX 4060 Ti 16 Go, RTX 3060 12 Go ou Intel Arc B580 12 Go.</text>
