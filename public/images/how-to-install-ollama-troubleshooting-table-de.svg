<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">5 häufige Ollama-Installationsfehler -- Kurzreferenz</text>

  <!-- Header -->
  <text x="40" y="65" font-size="12" font-weight="700" fill="#79747E">#</text>
  <text x="70" y="65" font-size="12" font-weight="700" fill="#79747E">Problem</text>
  <text x="270" y="65" font-size="12" font-weight="700" fill="#79747E">Symptom</text>
  <text x="530" y="65" font-size="12" font-weight="700" fill="#79747E">Lösung</text>
  <line x1="18" y1="74" x2="782" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1 -->
  <circle cx="40" cy="98" r="12" fill="#6750A4"/>
  <text x="40" y="102" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="70" y="102" font-size="12" font-weight="600" fill="#1C1B1F">Dienst läuft nicht</text>
  <text x="270" y="102" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F">"could not connect to ollama app"</text>
  <text x="530" y="102" font-size="11" fill="#6750A4">systemctl start ollama (oder App öffnen)</text>
  <line x1="18" y1="112" x2="782" y2="112" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2 -->
  <circle cx="40" cy="140" r="12" fill="#6750A4"/>
  <text x="40" y="144" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="70" y="144" font-size="12" font-weight="600" fill="#1C1B1F">Langsamer/gestoppter Download</text>
  <text x="270" y="144" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F">2-47 GB Modell-Download stockt</text>
  <text x="530" y="144" font-size="11" fill="#6750A4">Strg+C, ollama pull &lt;modell&gt; erneut ausführen</text>
  <line x1="18" y1="154" x2="782" y2="154" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3 -->
  <circle cx="40" cy="182" r="12" fill="#6750A4"/>
  <text x="40" y="186" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="70" y="186" font-size="12" font-weight="600" fill="#1C1B1F">Zu wenig Speicher</text>
  <text x="270" y="186" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F">"requires more system memory"</text>
  <text x="530" y="186" font-size="11" fill="#6750A4">llama3.2:3b oder kleinere Quant. nutzen</text>
  <line x1="18" y1="196" x2="782" y2="196" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4 -->
  <circle cx="40" cy="224" r="12" fill="#6750A4"/>
  <text x="40" y="228" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="70" y="228" font-size="12" font-weight="600" fill="#1C1B1F">GPU nicht erkannt</text>
  <text x="270" y="228" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F">ollama ps zeigt CPU statt GPU</text>
  <text x="530" y="228" font-size="11" fill="#6750A4">nvidia-smi prüfen, Treiber aktualisieren</text>
  <line x1="18" y1="238" x2="782" y2="238" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5 -->
  <circle cx="40" cy="266" r="12" fill="#6750A4"/>
  <text x="40" y="270" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="70" y="270" font-size="12" font-weight="600" fill="#1C1B1F">Prompt abgeschnitten</text>
  <text x="270" y="270" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F">Kontext auf 4096 Tokens begrenzt</text>
  <text x="530" y="270" font-size="11" fill="#6750A4">OLLAMA_CONTEXT_LENGTH oder num_ctx setzen</text>
  <line x1="18" y1="280" x2="782" y2="280" stroke="#F7F2FA" stroke-width="1"/>

  <rect x="18" y="304" width="764" height="70" rx="6" fill="#F7F2FA"/>
  <text x="40" y="326" font-size="12" font-weight="700" fill="#6750A4">GPU-Hinweis</text>
  <text x="40" y="346" font-size="11.5" fill="#49454F">Nur Docker-Installationen benötigen NVIDIA Container Toolkit + --gpus=all -- native Installationen nutzen</text>
  <text x="40" y="364" font-size="11.5" fill="#49454F">automatisch den NVIDIA-Treiber und die CUDA-Runtime des Hosts.</text>

  <text x="400" y="404" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Modell-Downloads reichen von 2-47 GB; Verbindungsprobleme betreffen macOS-, Windows- und Linux-Installationen gleichermaßen.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
