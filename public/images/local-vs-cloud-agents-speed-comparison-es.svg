<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, sans-serif">Comparaci&#xf3;n de velocidad: agentes en la nube vs. locales (abril de 2026)</text>

  <!-- Left Panel: Cloud Agents (Fast) -->
  <rect x="28" y="55" width="340" height="260" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#34A853"/>

  <text x="198" y="80" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, sans-serif">Agentes en la nube (r&#xe1;pidos)</text>
  <text x="48" y="110" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Por paso:</text>
  <text x="48" y="130" font-family="'SF Mono', Monaco, monospace" font-size="14" font-weight="700" fill="#34A853">100–300ms</text>

  <text x="48" y="160" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Bucle de razonamiento:</text>
  <text x="48" y="180" font-family="'SF Mono', Monaco, monospace" font-size="14" font-weight="700" fill="#34A853">1–2 s</text>

  <text x="48" y="210" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Escalabilidad:</text>
  <text x="48" y="230" font-size="12" fill="#49454F" font-family="system-ui, sans-serif">Ilimitada (proveedor)</text>

  <text x="48" y="260" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Coste:</text>
  <text x="48" y="280" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="600" fill="#1C1B1F">$20/1M tokens</text>

  <!-- Right Panel: Local Agents (Slower) -->
  <rect x="432" y="55" width="340" height="260" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#EA4335"/>

  <text x="602" y="80" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, sans-serif">Agentes locales (m&#xe1;s lentos)</text>
  <text x="452" y="110" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Por paso:</text>
  <text x="452" y="130" font-family="'SF Mono', Monaco, monospace" font-size="14" font-weight="700" fill="#EA4335">2–5 s</text>

  <text x="452" y="160" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Bucle de razonamiento:</text>
  <text x="452" y="180" font-family="'SF Mono', Monaco, monospace" font-size="14" font-weight="700" fill="#EA4335">6–15 s</text>

  <text x="452" y="210" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Escalabilidad:</text>
  <text x="452" y="230" font-size="12" fill="#49454F" font-family="system-ui, sans-serif">Limitada por el hardware</text>

  <text x="452" y="260" font-weight="700" fill="#1C1B1F" font-family="system-ui, sans-serif">Coste:</text>
  <text x="452" y="280" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="600" fill="#1C1B1F">$0 por token</text>

  <line x1="18" y1="320" x2="782" y2="320" stroke="#E8DEF8" stroke-width="1"/>
  <text x="400" y="340" font-size="11" fill="#79747E" text-anchor="middle" font-family="system-ui, sans-serif">La nube se siente instant&#xe1;nea para uso interactivo. Local es pr&#xe1;ctico para automatizaci&#xf3;n y procesamiento por lotes.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>