<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">実際にAMDをサポートしているローカルLLMツールは?</text>

  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">ツール</text>
  <text x="280" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">AMDサポート</text>
  <text x="620" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">状態</text>
  <line x1="18" y1="74" x2="782" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="40" y="106" font-size="13" font-weight="600" fill="#1C1B1F">llama.cpp (HIP)</text>
  <text x="280" y="106" font-size="12" fill="#49454F">ネイティブ対応、安定した性能</text>
  <circle cx="650" cy="101" r="12" fill="#34A853"/>
  <text x="650" y="105" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <line x1="18" y1="120" x2="782" y2="120" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="152" font-size="13" font-weight="600" fill="#1C1B1F">Text Generation WebUI</text>
  <text x="280" y="152" font-size="12" fill="#49454F">優れたROCm対応、AMDで最良のUX</text>
  <circle cx="650" cy="147" r="12" fill="#34A853"/>
  <text x="650" y="151" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <line x1="18" y1="166" x2="782" y2="166" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="198" font-size="13" font-weight="600" fill="#1C1B1F">vLLM</text>
  <text x="280" y="198" font-size="12" fill="#49454F">v0.6.0以降フルROCm対応、手動セットアップ必要</text>
  <circle cx="650" cy="193" r="12" fill="#F4B400"/>
  <text x="650" y="197" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">~</text>
  <line x1="18" y1="212" x2="782" y2="212" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="244" font-size="13" font-weight="600" fill="#1C1B1F">Ollama</text>
  <text x="280" y="244" font-size="12" fill="#49454F">不安定 — 一部の構成でGPU検出に失敗</text>
  <circle cx="650" cy="239" r="12" fill="#EA4335"/>
  <text x="650" y="243" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text>
  <line x1="18" y1="258" x2="782" y2="258" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="290" font-size="13" font-weight="600" fill="#1C1B1F">LM Studio</text>
  <text x="280" y="290" font-size="12" fill="#49454F">NVIDIAのみ — AMD非対応</text>
  <circle cx="650" cy="285" r="12" fill="#EA4335"/>
  <text x="650" y="289" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text>

  <text x="400" y="335" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">2026年時点でllama.cppとText Generation WebUIが信頼できるAMD経路です — OllamaのROCm対応は依然として不安定です。</text>
<text x="792" y="375" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
