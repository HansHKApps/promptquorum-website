<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    5-Step Decision Tree: Choose Your Embedder
  </text>

  <!-- Step 1 -->
  <circle cx="80" cy="80" r="22" fill="#6750A4"/>
  <text x="80" y="88" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1</text>
  <text x="80" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">GPU Available</text>
  <text x="80" y="150" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">for Indexing?</text>

  <!-- Arrow 1 -->
  <text x="130" y="88" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 2 -->
  <circle cx="200" cy="80" r="22" fill="#6750A4"/>
  <text x="200" y="88" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">2</text>
  <text x="200" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Corpus</text>
  <text x="200" y="150" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">English-Only?</text>

  <!-- Arrow 2 -->
  <text x="250" y="88" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 3 -->
  <circle cx="320" cy="80" r="22" fill="#6750A4"/>
  <text x="320" y="88" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
  <text x="320" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Very Long</text>
  <text x="320" y="150" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Docs (8k+)?</text>

  <!-- Arrow 3 -->
  <text x="370" y="88" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 4 -->
  <circle cx="440" cy="80" r="22" fill="#6750A4"/>
  <text x="440" y="88" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4</text>
  <text x="440" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Truncate</text>
  <text x="440" y="150" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Dims Later?</text>

  <!-- Arrow 4 -->
  <text x="490" y="88" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 5 -->
  <circle cx="560" cy="80" r="22" fill="#6750A4"/>
  <text x="560" y="88" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">5</text>
  <text x="560" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Commercial</text>
  <text x="560" y="150" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Product?</text>

  <!-- No GPU path -->
  <line x1="80" y1="102" x2="80" y2="160" stroke="#6750A4" stroke-width="2"/>
  <rect x="45" y="160" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="80" y="175" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">nomic-v2</text>
  <text x="80" y="192" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">(5× CPU speed)</text>

  <!-- English-only path -->
  <line x1="200" y1="102" x2="200" y2="160" stroke="#6750A4" stroke-width="2"/>
  <rect x="155" y="160" width="90" height="40" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="200" y="175" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">bge-large</text>
  <text x="200" y="192" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">(91% English)</text>

  <!-- Long docs path -->
  <line x1="320" y1="102" x2="320" y2="160" stroke="#6750A4" stroke-width="2"/>
  <rect x="265" y="160" width="110" height="40" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="320" y="175" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">snowflake</text>
  <text x="320" y="192" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">(8k token chunks)</text>

  <!-- Matryoshka path -->
  <line x1="440" y1="102" x2="440" y2="160" stroke="#6750A4" stroke-width="2"/>
  <rect x="395" y="160" width="90" height="40" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="440" y="175" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">jina-v3</text>
  <text x="440" y="192" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">(Matryoshka)</text>

  <!-- Commercial path -->
  <line x1="560" y1="102" x2="560" y2="160" stroke="#6750A4" stroke-width="2"/>
  <rect x="490" y="160" width="140" height="40" rx="4" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <text x="560" y="175" font-size="11" font-weight="700" fill="#F4B400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Apache-2.0 License</text>
  <text x="560" y="192" font-size="9" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">(verify jina licensing)</text>

  <!-- Default recommendation -->
  <line x1="50" y1="280" x2="750" y2="280" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="40" y="290" width="720" height="50" fill="#F7F2FA" rx="4"/>
  <text x="50" y="310" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">⭐ Default Pick (If Unsure):</text>
  <text x="50" y="330" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">jina-embeddings-v3 — 92% retrieval@10 overall, multilingual support (89 langs), Matryoshka dimension</text>
  <text x="50" y="345" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">truncation (reversible to 512/256 dims without re-embedding), best all-rounder. Verify CC BY-NC licensing for commercial use.</text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>