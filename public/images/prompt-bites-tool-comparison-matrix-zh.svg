<text x="30" y="278" class="feature" text-anchor="start">最佳用途：</text>
<text x="30" y="298" class="cell-text" text-anchor="start">• Ollama: 开发人员、自动化、无头服务器（CLI优先，API简洁）</text>
<text x="30" y="318" class="cell-text" text-anchor="start">• LM Studio: 想要成熟GUI的桌面用户、初学者</text>
<text x="30" y="338" class="cell-text" text-anchor="start">• Jan: 同时提供CLI的开源桌面应用，跨平台</text>
<text x="30" y="358" class="cell-text" text-anchor="start">• llama.cpp: 最大程度的控制与性能，众多工具背后的引擎</text>
<text x="30" y="378" class="cell-text" text-anchor="start">• KoboldCpp: 适合角色扮演和创意写作的单文件应用</text>
<text x="30" y="398" class="cell-text" text-anchor="start">• GPT4All: 在普通电脑上进行简单的离线聊天，文档问答</text>
<text x="30" y="420" class="cell-text" font-weight="600" text-anchor="start">推荐：从Ollama（高级用户）或LM Studio / Jan（GUI）开始。需要完全控制时选llama.cpp。</text>
<text x="30" y="440" class="cell-text" style="fill:#79747E" text-anchor="start">✓✓ 优秀 · ✓ 支持 · ~ 部分 · ✗ 不支持</text>
<text x="792" y="471" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>