<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">메모리 대역폭: LPDDR5X vs HBM (GB/s)</text>
  <text x="400" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">7B 모델 tokens/sec ≈ 대역폭 ÷ 모델 크기(바이트)</text>

  <!-- Row 1: LPDDR5X -->
  <text x="250" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">LPDDR5X(폰)</text>
  <rect x="260" y="70" width="21" height="24" fill="#EA4335" rx="4"/>
  <text x="291" y="88" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">85.6 GB/s — 8–15 tok/s(7B Q4)</text>

  <!-- Row 2: HBM2E -->
  <text x="250" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">HBM2E(2020년 이전 GPU)</text>
  <rect x="260" y="112" width="110" height="24" fill="#F4B400" rx="4"/>
  <text x="380" y="130" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">460 GB/s</text>

  <!-- Row 3: HBM3 -->
  <text x="250" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">HBM3(A100)</text>
  <rect x="260" y="154" width="197" height="24" fill="#7D5260" rx="4"/>
  <text x="467" y="172" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">819 GB/s</text>

  <!-- Row 4: HBM3E -->
  <text x="250" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">HBM3E(H100/H200/B200)</text>
  <rect x="260" y="196" width="295" height="24" fill="#6750A4" rx="4"/>
  <text x="565" y="214" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">1.229 TB/s — ~200+ tok/s(7B Q4)</text>

  <!-- Row 5: HBM4 -->
  <text x="250" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">HBM4(2026–2027)</text>
  <rect x="260" y="238" width="480" height="24" fill="#34A853" rx="4"/>
  <text x="700" y="256" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">&gt;2 TB/s</text>

  <line x1="260" y1="280" x2="740" y2="280" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="260" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">SK하이닉스가 HBM의 62%를 공급(H100/H200/B200); 삼성은 폰용 LPDDR5X를 주도.</text>
  <text x="260" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">LPDDR5X에서 HBM3E까지 14배 대역폭 차이 — 폰과 데이터센터 속도 차이의 직접적 원인.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
