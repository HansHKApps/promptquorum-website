  <rect x="30" y="415" width="1140" height="1.5" fill="#E8DEF8"/>
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="13.5" fill="#49454F" text-anchor="middle">Pixel density and usable pixel area decide readability for AI work — refresh rate above 120 Hz is a gaming spec that does not apply.</text>
  <text x="600" y="475" font-family="system-ui, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Prices are a July 2026 snapshot and move with sale cycles — confirm the current price before buying.</text>
<text x="1192" y="670" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
