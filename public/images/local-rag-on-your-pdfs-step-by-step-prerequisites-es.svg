<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lo que necesitas antes de empezar</text>

  <!-- Header row -->
  <rect x="0" y="46" width="800" height="36" fill="#6750A4"/>
  <text x="80" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Requisito</text>
  <text x="235" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">M&#xed;nimo</text>
  <text x="555" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notas</text>

  <!-- Column dividers -->
  <line x1="160" y1="46" x2="160" y2="292" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="310" y1="46" x2="310" y2="292" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1: RAM -->
  <rect x="0" y="82" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="107" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">RAM</text>
  <text x="235" y="107" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">16 GB</text>
  <text x="555" y="100" font-size="11" fill="#49454F" text-anchor="middle">8 GB funciona con Phi-4 Mini Q4 (paso 2)</text>
  <text x="555" y="115" font-size="10" fill="#79747E" text-anchor="middle">M&#xed;nimo pr&#xe1;ctico para Llama 3.3 8B Q4 + AnythingLLM</text>

  <!-- Row 2: Disk -->
  <rect x="0" y="124" width="800" height="42" fill="#F7F2FA"/>
  <text x="80" y="149" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Disco</text>
  <text x="235" y="142" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">20 GB</text>
  <text x="235" y="157" font-size="10" fill="#49454F" text-anchor="middle">libres</text>
  <text x="555" y="142" font-size="11" fill="#49454F" text-anchor="middle">Modelo ~5 GB + embedder ~280 MB + app ~600 MB</text>
  <text x="555" y="157" font-size="10" fill="#79747E" text-anchor="middle">M&#xe1;s ~10&#x2013;30 MB de margen por cada 100 p&#xe1;ginas de PDF</text>

  <!-- Row 3: Network -->
  <rect x="0" y="166" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="191" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Red</text>
  <text x="235" y="191" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">50 Mbps</text>
  <text x="555" y="184" font-size="11" fill="#49454F" text-anchor="middle">Descarga del modelo ~8 min a 50 Mbps (una sola vez)</text>
  <text x="555" y="199" font-size="10" fill="#79747E" text-anchor="middle">El resto del tutorial funciona totalmente sin conexi&#xf3;n</text>

  <!-- Row 4: OS -->
  <rect x="0" y="208" width="800" height="42" fill="#F7F2FA"/>
  <text x="80" y="233" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">SO</text>
  <text x="235" y="226" font-size="10" font-weight="700" fill="#49454F" text-anchor="middle">macOS 12+ /</text>
  <text x="235" y="241" font-size="10" font-weight="700" fill="#49454F" text-anchor="middle">Win 10/11 / Linux</text>
  <text x="555" y="226" font-size="11" fill="#49454F" text-anchor="middle">AnythingLLM no requiere permisos de administrador</text>
  <text x="555" y="241" font-size="10" fill="#79747E" text-anchor="middle">Ollama pide la contrase&#xf1;a una vez en macOS/Linux</text>

  <!-- Row 5: Documents -->
  <rect x="0" y="250" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="275" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Documentos</text>
  <text x="235" y="268" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">5&#x2013;20 PDF</text>
  <text x="235" y="283" font-size="10" fill="#79747E" text-anchor="middle">para empezar</text>
  <text x="555" y="268" font-size="11" fill="#49454F" text-anchor="middle">Empieza con pocos para verificar la calidad de recuperaci&#xf3;n</text>
  <text x="555" y="283" font-size="10" fill="#79747E" text-anchor="middle">Compatible con PDF, DOCX, TXT, MD, EPUB</text>

  <!-- Table outer border -->
  <rect x="0" y="46" width="800" height="246" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="318" font-size="11" fill="#79747E" text-anchor="middle">Internet solo se necesita para las descargas iniciales — toda la inferencia es totalmente sin conexi&#xf3;n tras la configuraci&#xf3;n</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
