<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local AI Camera Architecture — No Cloud Round-Trip</text>

  <!-- Camera box -->
  <rect x="30" y="115" width="150" height="65" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <text x="105" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">RTSP Camera(s)</text>
  <text x="105" y="163" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">wired PoE most reliable</text>

  <text x="195" y="153" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Hub: Frigate + AI Detection -->
  <rect x="215" y="95" width="290" height="105" rx="8" fill="#E8DEF8" stroke="#6750A4" stroke-width="2.5"/>
  <text x="360" y="123" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Frigate (Local NVR)</text>
  <text x="360" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">AI Detection: Coral TPU / GPU</text>
  <text x="360" y="164" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">runs entirely on your own hardware</text>
  <text x="360" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">identifies people, vehicles, objects</text>

  <!-- Branch lines to storage / Home Assistant -->
  <line x1="330" y1="200" x2="190" y2="253" stroke="#6750A4" stroke-width="2"/>
  <polygon points="190,253 202,251 197,262" fill="#6750A4"/>
  <text x="215" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">saves</text>

  <line x1="390" y1="200" x2="540" y2="253" stroke="#6750A4" stroke-width="2"/>
  <polygon points="540,253 528,251 533,262" fill="#6750A4"/>
  <text x="470" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">notifies</text>

  <!-- Local Storage box -->
  <rect x="90" y="255" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <text x="190" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local Storage</text>
  <text x="190" y="303" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Clips &amp; Snapshots</text>

  <!-- Home Assistant box -->
  <rect x="430" y="255" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="540" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Home Assistant</text>
  <text x="540" y="303" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Alerts &amp; Automations</text>

  <!-- No cloud badge -->
  <ellipse cx="705" cy="58" rx="48" ry="24" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <ellipse cx="682" cy="52" rx="20" ry="14" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <ellipse cx="726" cy="50" rx="18" ry="13" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <line x1="655" y1="35" x2="755" y2="82" stroke="#EA4335" stroke-width="3.5"/>
  <text x="705" y="102" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">No Cloud</text>

  <line x1="30" y1="345" x2="770" y2="345" stroke="#F7F2FA" stroke-width="1.5"/>
  <text x="400" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Video stays on your local network — never uploaded to a vendor cloud, no subscription required.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
