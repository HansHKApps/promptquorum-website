<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="26" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">VRAM Requirements by Quantization Level</text>
  <text x="400" y="45" font-size="11" fill="#79747E" text-anchor="middle">Rule of thumb: (params in B) × multiplier + 2–4 GB context/tooling overhead</text>
  <text x="30" y="70" font-size="12" font-weight="700" fill="#79747E">Quantization</text>
  <text x="185" y="70" font-size="12" font-weight="700" fill="#79747E">GB per B params</text>
  <text x="285" y="70" font-size="12" font-weight="700" fill="#79747E">7B model</text>
  <text x="365" y="70" font-size="12" font-weight="700" fill="#79747E">30B model</text>
  <text x="455" y="70" font-size="12" font-weight="700" fill="#79747E">Notes</text>
  <line x1="18" y1="77" x2="782" y2="77" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="78" width="764" height="36" fill="#F7F2FA"/>
  <text x="30" y="100" font-size="12" font-weight="700" fill="#6750A4" font-family="'SF Mono',Monaco,monospace">Q4_K_M</text>
  <text x="30" y="114" font-size="10" fill="#6750A4">(default)</text>
  <text x="185" y="100" font-size="12" font-weight="600" fill="#1C1B1F">~0.60 GB</text>
  <text x="285" y="100" font-size="12" font-weight="600" fill="#1C1B1F">~5 GB</text>
  <text x="365" y="100" font-size="12" font-weight="600" fill="#1C1B1F">~18 GB</text>
  <text x="455" y="100" font-size="11" fill="#1C1B1F">Best balance — use this first</text>
  <line x1="18" y1="120" x2="782" y2="120" stroke="#E8DEF8" stroke-width="1"/>
  <text x="30" y="140" font-size="12" fill="#49454F" font-family="'SF Mono',Monaco,monospace">Q5_K_M</text>
  <text x="185" y="140" font-size="12" fill="#49454F">~0.75 GB</text>
  <text x="285" y="140" font-size="12" fill="#49454F">~6 GB</text>
  <text x="365" y="140" font-size="12" fill="#49454F">~22 GB</text>
  <text x="455" y="140" font-size="11" fill="#49454F">Small quality gain; fits 32 GB card</text>
  <line x1="18" y1="152" x2="782" y2="152" stroke="#F7F2FA" stroke-width="1"/>
  <text x="30" y="172" font-size="12" fill="#49454F" font-family="'SF Mono',Monaco,monospace">Q6_K</text>
  <text x="185" y="172" font-size="12" fill="#49454F">~0.85 GB</text>
  <text x="285" y="172" font-size="12" fill="#49454F">~7 GB</text>
  <text x="365" y="172" font-size="12" fill="#49454F">~26 GB</text>
  <text x="455" y="172" font-size="11" fill="#49454F">Diminishing returns on coding quality</text>
  <line x1="18" y1="184" x2="782" y2="184" stroke="#F7F2FA" stroke-width="1"/>
  <text x="30" y="204" font-size="12" fill="#49454F" font-family="'SF Mono',Monaco,monospace">Q8_0</text>
  <text x="185" y="204" font-size="12" fill="#49454F">~1.05 GB</text>
  <text x="285" y="204" font-size="12" fill="#49454F">~8 GB</text>
  <text x="365" y="204" font-size="12" fill="#49454F">~32 GB</text>
  <text x="455" y="204" font-size="11" fill="#49454F">Near-FP16 quality at half the VRAM</text>
  <line x1="18" y1="216" x2="782" y2="216" stroke="#F7F2FA" stroke-width="1"/>
  <text x="30" y="236" font-size="12" fill="#79747E" font-family="'SF Mono',Monaco,monospace">FP16</text>
  <text x="185" y="236" font-size="12" fill="#79747E">~2.00 GB</text>
  <text x="285" y="236" font-size="12" fill="#79747E">~14 GB</text>
  <text x="365" y="236" font-size="12" fill="#79747E">~60 GB</text>
  <text x="455" y="236" font-size="11" fill="#79747E">Fine-tuning only; not for inference</text>
  <line x1="18" y1="248" x2="782" y2="248" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="272" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Context VRAM: ~1 GB per 32K active tokens · Tooling overhead: +0.5–1 GB (Ollama / llama.cpp)</text>
  <text x="400" y="290" font-size="11" fill="#79747E" text-anchor="middle">Allow 2–4 GB total headroom above model weight. Q4_K_M is the default for most local coding workloads.</text>
  <text x="400" y="320" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
