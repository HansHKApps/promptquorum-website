<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">The Local Voice Assistant Architecture</text>

  <rect x="20" y="55" width="760" height="250" rx="8" fill="#FFFFFF" stroke="#E8DEF8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">YOUR HARDWARE — RUNS FULLY OFFLINE</text>

  <!-- Row of 5 boxes -->
  <rect x="40" y="120" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <text x="100" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Wake Word</text>
  <text x="100" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">openWakeWord</text>

  <text x="175" y="163" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <rect x="190" y="120" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="250" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Whisper</text>
  <text x="250" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Speech → text</text>

  <text x="325" y="163" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <rect x="340" y="120" width="120" height="70" rx="6" fill="#E8DEF8" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Assist</text>
  <text x="400" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Routes + replies</text>

  <text x="475" y="163" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <rect x="490" y="120" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="550" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Piper</text>
  <text x="550" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Text → speech</text>

  <text x="625" y="163" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <rect x="640" y="120" width="120" height="70" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <text x="700" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Speaker</text>
  <text x="700" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Spoken reply</text>

  <!-- Wyoming bracket -->
  <line x1="190" y1="108" x2="610" y2="108" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="190" y1="108" x2="190" y2="118" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="610" y1="108" x2="610" y2="118" stroke="#6750A4" stroke-width="1.5"/>
  <text x="400" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">connected over the Wyoming protocol</text>

  <!-- Optional LLM branch -->
  <line x1="400" y1="190" x2="400" y2="235" stroke="#79747E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="415" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#79747E">optional</text>
  <rect x="310" y="235" width="180" height="55" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="258" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local LLM</text>
  <text x="400" y="276" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Conversation agent (via Ollama)</text>

  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">A wake word triggers Whisper; Assist routes to an optional local LLM, then Piper speaks the reply — nothing leaves the house.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
