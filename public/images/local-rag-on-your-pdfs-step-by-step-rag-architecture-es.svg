<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Stack de RAG local: 4 componentes en un solo port&#xe1;til</text>

  <!-- Header row -->
  <rect x="0" y="46" width="800" height="36" fill="#6750A4"/>
  <text x="100" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Componente</text>
  <text x="337" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Funci&#xf3;n</text>
  <text x="637" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Detalle clave</text>

  <!-- Column dividers -->
  <line x1="200" y1="46" x2="200" y2="292" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="475" y1="46" x2="475" y2="292" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1: Ollama -->
  <rect x="0" y="82" width="800" height="44" fill="#FFFFFF"/>
  <text x="100" y="100" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama</text>
  <text x="100" y="115" font-size="10" fill="#49454F" text-anchor="middle">v0.5+</text>
  <text x="337" y="107" font-size="12" fill="#49454F" text-anchor="middle">Entorno de ejecuci&#xf3;n de LLM local</text>
  <text x="637" y="100" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">API en localhost:11434</text>
  <text x="637" y="115" font-size="10" fill="#49454F" text-anchor="middle">Gratis · compatible con OpenAI</text>

  <!-- Row 2: Llama 3.3 8B -->
  <rect x="0" y="126" width="800" height="44" fill="#F7F2FA"/>
  <text x="100" y="144" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Llama 3.3 8B</text>
  <text x="100" y="159" font-size="10" fill="#49454F" text-anchor="middle">Q4_K_M</text>
  <text x="337" y="151" font-size="12" fill="#49454F" text-anchor="middle">Modelo de respuesta</text>
  <text x="637" y="144" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">~4.9 GB · 16 GB RAM m&#xed;n.</text>
  <text x="637" y="159" font-size="10" fill="#49454F" text-anchor="middle">Se ejecuta v&#xed;a Ollama</text>

  <!-- Row 3: AnythingLLM -->
  <rect x="0" y="170" width="800" height="44" fill="#FFFFFF"/>
  <text x="100" y="188" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">AnythingLLM</text>
  <text x="100" y="203" font-size="10" fill="#49454F" text-anchor="middle">Desktop</text>
  <text x="337" y="188" font-size="11" fill="#49454F" text-anchor="middle">Interfaz + almac&#xe9;n vectorial</text>
  <text x="337" y="203" font-size="11" fill="#49454F" text-anchor="middle">+ orquestaci&#xf3;n RAG</text>
  <text x="637" y="188" font-size="10" fill="#49454F" text-anchor="middle">LanceDB integrado · arrastra y suelta PDF</text>
  <text x="637" y="203" font-size="10" fill="#49454F" text-anchor="middle">Sin c&#xf3;digo · gratis · macOS/Win/Linux</text>

  <!-- Row 4: nomic-embed-text -->
  <rect x="0" y="214" width="800" height="44" fill="#F7F2FA"/>
  <text x="100" y="232" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">nomic-embed-text</text>
  <text x="100" y="247" font-size="10" fill="#49454F" text-anchor="middle">v1.5 (v&#xed;a Ollama)</text>
  <text x="337" y="239" font-size="12" fill="#49454F" text-anchor="middle">Modelo de embeddings</text>
  <text x="637" y="232" font-size="10" fill="#49454F" text-anchor="middle">~280 MB · 400&#x2013;800 fragmentos/s (CPU)</text>
  <text x="637" y="247" font-size="10" fill="#49454F" text-anchor="middle">Reemplaza el embedder predeterminado de AnythingLLM</text>

  <!-- Table outer border -->
  <rect x="0" y="46" width="800" height="212" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="18" y1="270" x2="782" y2="270" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="291" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Flujo de datos: PDF &#x2192; AnythingLLM analiza &#x2192; nomic-embed-text &#x2192; LanceDB &#x2192; Llama 3.3 8B &#x2192; Respuesta</text>
  <text x="400" y="312" font-size="11" fill="#79747E" text-anchor="middle">Tiempo de instalaci&#xf3;n: ~30 min · Coste: $0 · Totalmente sin conexi&#xf3;n tras la descarga inicial del modelo</text>
  <text x="400" y="330" font-size="11" fill="#79747E" text-anchor="middle">16 GB RAM m&#xed;n. · 8 GB funciona con Phi-4 Mini Q4 en lugar de Llama 3.3 8B</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
