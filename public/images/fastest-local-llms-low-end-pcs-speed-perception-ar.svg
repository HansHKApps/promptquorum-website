<svg viewBox="0 0 800 404" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="404" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">ما المقصود فعليًا بـ«السريع» في النماذج المحلية؟</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">حدود السرعة للاستخدام التفاعلي. أقل من 15 tok/s ← جرّب نموذجًا أصغر قبل شراء عتاد.</text>
  <rect x="18" y="62" width="764" height="70" rx="6" fill="#FFF3F3" stroke="#EA4335" stroke-width="1.5"/>
  <text x="762" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="end">أقل من 10 tok/s ← يبدو معطلًا</text>
  <text x="762" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">تظهر الكلمات واحدة تلو الأخرى مع توقفات ملحوظة. غير صالح للمحادثة التفاعلية. الحل: التبديل إلى</text>
  <text x="762" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">نموذج أصغر.</text>
  <rect x="18" y="142" width="764" height="70" rx="6" fill="#FFFBF0" stroke="#F4B400" stroke-width="1.5"/>
  <text x="762" y="164" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#B07D00" text-anchor="end">15–25 tok/s ← مقبول</text>
  <text x="762" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">سرعة مقروءة لمعظم المستخدمين. مناسبة للأسئلة والأجوبة وتلخيص المستندات والمساعدة في البرمجة.</text>
  <text x="762" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">تأخير طفيف لكنه عملي.</text>
  <rect x="18" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="370" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="end">30+ tok/s ← سلس</text>
  <text x="370" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">يبدو كمساعد حقيقي. مريح لجميع المهام التفاعلية</text>
  <text x="370" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">بما فيها مراجعة الشيفرة.</text>
  <rect x="412" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="764" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="end">60+ tok/s ← فوري</text>
  <text x="764" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">أسرع مما تستطيع قراءته. مثالي للإكمال التلقائي</text>
  <text x="764" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">الفوري والتكرار السريع.</text>
  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">أمثلة على العتاد (معالج فقط، سرعات تقديرية):</text>
  <text x="115" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">ذاكرة 4 GB: 25–40 t/s</text>
  <text x="295" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">ذاكرة 8 GB: 15–25 t/s</text>
  <text x="480" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">ذاكرة 16 GB: 8–15 t/s</text>
  <text x="670" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">معالج رسوميات منفصل: أسرع 5–10 مرات</text>
  <line x1="18" y1="362" x2="782" y2="362" stroke="#E8DEF8" stroke-width="2"/>
