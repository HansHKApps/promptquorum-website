<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="57.86" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1C1B1F" text-anchor="middle">NPU-Zugriff entscheidet über den Geschwindigkeitsunterschied</text>

  <rect x="33.6" y="100.29" width="408" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="33.6" y="100.29" width="408" height="7.71" rx="0" fill="#34A853"/>
  <text x="237.6" y="154.29" font-size="24" font-weight="700" fill="#34A853" text-anchor="middle">Snapdragon 8 Elite</text>
  <text x="237.6" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Galaxy S25 Ultra, OnePlus 13</text>

  <text x="57.6" y="260.36" font-size="18" font-weight="700" fill="#79747E">Hexagon NPU für Apps freigegeben</text>
  <text x="57.6" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#34A853">~22 tok/sec</text>
  <text x="57.6" y="351" font-size="17.25" fill="#49454F">MLC Chat, Phi-4 Mini, NPU-Pfad</text>
  <line x1="57.6" y1="378" x2="417.6" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="57.6" y="428.14" font-size="18" fill="#49454F">Erreicht beim kleineren Modell Qwen3</text>
  <text x="57.6" y="462.86" font-size="18" fill="#49454F">1.7B sogar ~40 Tok/Sek. — 3–4-mal</text>
  <text x="57.6" y="497.57" font-size="18" fill="#49454F">schneller als reine CPU-Apps auf</text>
  <text x="57.6" y="532.29" font-size="18" fill="#49454F">demselben Telefon.</text>

  <rect x="758.4" y="100.29" width="408" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="758.4" y="100.29" width="408" height="7.71" rx="0" fill="#EA4335"/>
  <text x="962.4" y="154.29" font-size="24" font-weight="700" fill="#EA4335" text-anchor="middle">Google Tensor G5</text>
  <text x="962.4" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Pixel 9 Pro</text>

  <text x="782.4" y="260.36" font-size="18" font-weight="700" fill="#79747E">NPU nicht für Drittanbieter-Apps freigegeben</text>
  <text x="782.4" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#EA4335">10–18 tok/sec</text>
  <text x="782.4" y="351" font-size="17.25" fill="#49454F">Alle 6 Apps, Phi-4 Mini, nur CPU</text>
  <line x1="782.4" y1="378" x2="1142.4" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="782.4" y="428.14" font-size="18" fill="#49454F">Jede getestete App weicht auf dem</text>
  <text x="782.4" y="462.86" font-size="18" fill="#49454F">Tensor G5 auf CPU-Inferenz aus —</text>
  <text x="782.4" y="497.57" font-size="18" fill="#49454F">keine App nutzt derzeit Googles</text>
  <text x="782.4" y="532.29" font-size="18" fill="#49454F">On-Device-NPU für Drittanbieter.</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">Gleiches Phi-4-Mini-Modell, gleiche Quantisierung — die NPU-Freigabe des Chips erklärt den Unterschied.</text>
<text x="1190.4" y="665.36" font-family="system-ui,sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
