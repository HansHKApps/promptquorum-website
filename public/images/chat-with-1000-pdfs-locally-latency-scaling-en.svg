<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Query Latency P50 by Architecture & Corpus Size
  </text>

  <!-- Y-axis label -->
  <text x="25" y="220" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Latency (ms)</text>

  <!-- X-axis label -->
  <text x="400" y="365" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Document Count</text>

  <!-- Grid lines and labels -->
  <line x1="50" y1="330" x2="750" y2="330" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="335" font-size="10" fill="#79747E" text-anchor="end" font-family="'SF Mono', Monaco, monospace">0ms</text>

  <line x1="50" y1="270" x2="750" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="275" font-size="10" fill="#79747E" text-anchor="end" font-family="'SF Mono', Monaco, monospace">500ms</text>

  <line x1="50" y1="210" x2="750" y2="210" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="215" font-size="10" fill="#79747E" text-anchor="end" font-family="'SF Mono', Monaco, monospace">1000ms</text>

  <line x1="50" y1="150" x2="750" y2="150" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="155" font-size="10" fill="#79747E" text-anchor="end" font-family="'SF Mono', Monaco, monospace">1500ms</text>

  <!-- X-axis markers -->
  <line x1="100" y1="330" x2="100" y2="340" stroke="#79747E" stroke-width="1"/>
  <text x="100" y="355" font-size="10" fill="#79747E" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">100</text>

  <line x1="300" y1="330" x2="300" y2="340" stroke="#79747E" stroke-width="1"/>
  <text x="300" y="355" font-size="10" fill="#79747E" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">1,000</text>

  <line x1="500" y1="330" x2="500" y2="340" stroke="#79747E" stroke-width="1"/>
  <text x="500" y="355" font-size="10" fill="#79747E" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">5,000</text>

  <line x1="700" y1="330" x2="700" y2="340" stroke="#79747E" stroke-width="1"/>
  <text x="700" y="355" font-size="10" fill="#79743 E" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">10,000</text>

  <!-- AnythingLLM curve (breaks at 2k) -->
  <polyline points="100,310 300,270 400,200 500,150" fill="none" stroke="#34A853" stroke-width="3"/>
  <circle cx="100" cy="310" r="4" fill="#34A853"/>
  <circle cx="300" cy="270" r="4" fill="#34A853"/>
  <circle cx="400" cy="200" r="4" fill="#34A853"/>
  <circle cx="500" cy="150" r="4" fill="#34A853"/>
  <text x="510" y="150" font-size="10" font-weight="600" fill="#34A853" font-family="system-ui, -apple-system, sans-serif">AnythingLLM</text>

  <!-- LlamaIndex curve -->
  <polyline points="100,305 300,265 500,210 700,260" fill="none" stroke="#6750A4" stroke-width="3"/>
  <circle cx="100" cy="305" r="4" fill="#6750A4"/>
  <circle cx="300" cy="265" r="4" fill="#6750A4"/>
  <circle cx="500" cy="210" r="4" fill="#6750A4"/>
  <circle cx="700" cy="260" r="4" fill="#6750A4"/>
  <text x="710" y="260" font-size="10" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">LlamaIndex</text>

  <!-- ChromaDB curve (hybrid+rerank) -->
  <polyline points="100,300 300,280 500,220 700,190" fill="none" stroke="#F4B400" stroke-width="3"/>
  <circle cx="100" cy="300" r="4" fill="#F4B400"/>
  <circle cx="300" cy="280" r="4" fill="#F4B400"/>
  <circle cx="500" cy="220" r="4" fill="#F4B400"/>
  <circle cx="700" cy="190" r="4" fill="#F4B400"/>
  <text x="710" y="190" font-size="10" font-weight="600" fill="#F4B400" font-family="system-ui, -apple-system, sans-serif">ChromaDB+hybrid</text>

  <!-- Qdrant curve (native hybrid+filter) -->
  <polyline points="100,295 300,285 500,240 700,180" fill="none" stroke="#EA4335" stroke-width="3"/>
  <circle cx="100" cy="295" r="4" fill="#EA4335"/>
  <circle cx="300" cy="285" r="4" fill="#EA4335"/>
  <circle cx="500" cy="240" r="4" fill="#EA4335"/>
  <circle cx="700" cy="180" r="4" fill="#EA4335"/>
  <text x="710" y="180" font-size="10" font-weight="600" fill="#EA4335" font-family="system-ui, -apple-system, sans-serif">Qdrant</text>

  <!-- Axes -->
  <line x1="50" y1="330" x2="750" y2="330" stroke="#1C1B1F" stroke-width="2"/>
  <line x1="50" y1="140" x2="50" y2="330" stroke="#1C1B1F" stroke-width="2"/>

  <!-- Key insight -->
  <rect x="50" y="140" width="300" height="50" fill="rgba(255,255,255,0.8)" stroke="#E8DEF8" stroke-width="1" rx="3"/>
  <text x="65" y="160" font-size="10" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Key:</text>
  <text x="65" y="177" font-size="9" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Hybrid search + reranking flatten the curve</text>
<text x="792" y="375" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>