<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="57.86" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1C1B1F" text-anchor="middle">NPU 접근 여부가 속도 차이를 결정합니다</text>

  <rect x="42" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="42" y="100.29" width="510" height="7.71" rx="0" fill="#34A853"/>
  <text x="297" y="154.29" font-size="24" font-weight="700" fill="#34A853" text-anchor="middle">Snapdragon 8 Elite</text>
  <text x="297" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Galaxy S25 Ultra, OnePlus 13</text>

  <text x="72" y="260.36" font-size="18" font-weight="700" fill="#79747E">Hexagon NPU가 앱에 노출됨</text>
  <text x="72" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#34A853">~22 tok/sec</text>
  <text x="72" y="351" font-size="17.25" fill="#49454F">MLC Chat, Phi-4 Mini, NPU 경로</text>
  <line x1="72" y1="378" x2="522" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="72" y="428.14" font-size="18" fill="#49454F">더 작은 Qwen3 1.7B 모델에서는</text>
  <text x="72" y="462.86" font-size="18" fill="#49454F">약 40 tok/sec에 도달합니다 — 동일</text>
  <text x="72" y="497.57" font-size="18" fill="#49454F">기기의 CPU 전용 앱보다 3~4배</text>
  <text x="72" y="532.29" font-size="18" fill="#49454F">빠릅니다.</text>

  <rect x="648" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="648" y="100.29" width="510" height="7.71" rx="0" fill="#EA4335"/>
  <text x="903" y="154.29" font-size="24" font-weight="700" fill="#EA4335" text-anchor="middle">Google Tensor G5</text>
  <text x="903" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Pixel 9 Pro</text>

  <text x="678" y="260.36" font-size="18" font-weight="700" fill="#79747E">NPU가 타사 앱에 노출되지 않음</text>
  <text x="678" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#EA4335">10–18 tok/sec</text>
  <text x="678" y="351" font-size="17.25" fill="#49454F">6개 앱 전부, Phi-4 Mini, CPU 전용</text>
  <line x1="678" y1="378" x2="1128" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="678" y="428.14" font-size="18" fill="#49454F">테스트한 모든 앱이 Tensor G5에서</text>
  <text x="678" y="462.86" font-size="18" fill="#49454F">CPU 추론으로 대체됩니다 —</text>
  <text x="678" y="497.57" font-size="18" fill="#49454F">현재 어떤 앱도 타사를 위해</text>
  <text x="678" y="532.29" font-size="18" fill="#49454F">Google의 온디바이스 NPU를 열지 않습니다.</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">동일한 Phi-4 Mini 모델, 동일한 양자화 — 칩셋의 NPU 노출 여부가 차이를 설명합니다.</text>
<text x="1188" y="665.36" font-family="system-ui,sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
