<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Arquitectura de despliegue empresarial de LLM local</text>

  <!-- Firewall / VPN boundary -->
  <rect x="280" y="100" width="480" height="190" rx="8" fill="#F7F2FA" stroke="#6750A4" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="520" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">Perímetro firewall / VPN</text>

  <!-- Users box -->
  <rect x="60" y="150" width="150" height="90" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="2"/>
  <text x="135" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Empleados y</text>
  <text x="135" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">apps internas</text>

  <!-- Arrow users -> gateway -->
  <line x1="210" y1="195" x2="292" y2="195" stroke="#6750A4" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Gateway box -->
  <rect x="300" y="150" width="170" height="90" rx="6" fill="#E8DEF8" stroke="#6750A4" stroke-width="2"/>
  <text x="385" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Puerta de enlace de API interna</text>

  <!-- Arrow gateway -> servers -->
  <line x1="470" y1="195" x2="552" y2="195" stroke="#6750A4" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Servers box -->
  <rect x="560" y="150" width="180" height="90" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="560" y="150" width="180" height="4" rx="0" fill="#34A853"/>
  <text x="650" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Servidores LLM en local</text>

  <!-- Blocked external cloud -->
  <rect x="570" y="330" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="640" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle">APIs en la nube externas</text>
  <text x="640" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#EA4335" text-anchor="middle">Sin acceso externo</text>

  <!-- X mark line from servers area down to blocked box -->
  <line x1="650" y1="240" x2="640" y2="330" stroke="#EA4335" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="646" cy="318" r="11" fill="#EA4335"/>
  <text x="646" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#6750A4"/>
    </marker>
  </defs>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>