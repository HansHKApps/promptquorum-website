  <text x="356" y="190" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end"><tspan fill="#34A853" font-weight="700">✓</tspan>  8 GB RAM كحد أدنى، دون الحاجة إلى GPU</text>
  <text x="356" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end"><tspan fill="#34A853" font-weight="700">✓</tspan>  Llama 3.2 3B / Gemma 3 4B</text>
  <text x="356" y="238" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end"><tspan fill="#34A853" font-weight="700">✓</tspan>  معاينة Artifacts مباشرة</text>
  <!-- Right panel: Phone -->
  <rect x="424" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
