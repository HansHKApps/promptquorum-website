  <text x="758" y="190" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end"><tspan fill="#34A853" font-weight="700">✓</tspan>  النموذج يعمل على الهاتف نفسه</text>
  <text x="758" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end"><tspan fill="#34A853" font-weight="700">✓</tspan>  نموذج 1B–3B على هاتف حديث</text>
