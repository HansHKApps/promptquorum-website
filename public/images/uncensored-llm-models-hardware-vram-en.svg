<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <title id="t">Approximate memory needed for quantized models</title>
  <desc id="d">Bar chart of estimated memory for Q4 quantized models: Gemma 4 E4B about 8 GB, Qwen3.5 9B about 8 GB, Gemma 4 12B 10 to 12 GB, Dolphin Mistral 24B 17 to 19 GB, Qwen3.8 27B 20 to 22 GB, Gemma 4 31B 22 to 24 GB, Hermes 4.3 36B 25 to 28 GB.</desc>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How much memory does a Q4 model need? (estimates)</text>
  <g stroke="#e2e8f0"><line x1="150" y1="70" x2="150" y2="400"/><line x1="285" y1="70" x2="285" y2="400"/><line x1="420" y1="70" x2="420" y2="400"/><line x1="555" y1="70" x2="555" y2="400"/><line x1="690" y1="70" x2="690" y2="400"/><line x1="825" y1="70" x2="825" y2="400"/></g>
  <g font-size="12" fill="#475569" text-anchor="middle"><text x="150" y="418">0</text><text x="285" y="418">8 GB</text><text x="420" y="418">16 GB</text><text x="555" y="418">24 GB</text><text x="690" y="418">32 GB</text><text x="825" y="418">40 GB</text></g>
  <g font-size="13" fill="#0f172a">
    <text x="140" y="97" text-anchor="end">Gemma 4 E4B (4.5B eff.)</text><rect x="150" y="82" width="135" height="22" rx="4" fill="#38bdf8"/><text x="292" y="98">~8 GB</text>
    <text x="140" y="140" text-anchor="end">Qwen3.5 9B</text><rect x="150" y="125" width="135" height="22" rx="4" fill="#38bdf8"/><text x="292" y="141">~8 GB</text>
    <text x="140" y="183" text-anchor="end">Gemma 4 12B</text><rect x="150" y="168" width="169" height="22" rx="4" fill="#0ea5e9"/><rect x="319" y="168" width="34" height="22" rx="4" fill="#bae6fd"/><text x="360" y="184">10-12 GB</text>
    <text x="140" y="226" text-anchor="end">Dolphin Mistral 24B</text><rect x="150" y="211" width="287" height="22" rx="4" fill="#0284c7"/><rect x="437" y="211" width="34" height="22" rx="4" fill="#bae6fd"/><text x="478" y="227">17-19 GB</text>
    <text x="140" y="269" text-anchor="end">Qwen3.8 27B</text><rect x="150" y="254" width="338" height="22" rx="4" fill="#0369a1"/><rect x="488" y="254" width="34" height="22" rx="4" fill="#bae6fd"/><text x="529" y="270">20-22 GB</text>
    <text x="140" y="312" text-anchor="end">Gemma 4 31B</text><rect x="150" y="297" width="371" height="22" rx="4" fill="#075985"/><rect x="521" y="297" width="34" height="22" rx="4" fill="#bae6fd"/><text x="562" y="313">22-24 GB</text>
    <text x="140" y="355" text-anchor="end">Hermes 4.3 36B</text><rect x="150" y="340" width="422" height="22" rx="4" fill="#0c4a6e"/><rect x="572" y="340" width="51" height="22" rx="4" fill="#bae6fd"/><text x="630" y="356">25-28 GB</text>
  </g>
  <g font-size="12" fill="#0f172a"><rect x="150" y="436" width="14" height="14" fill="#0369a1"/><text x="170" y="448">Low estimate</text><rect x="270" y="436" width="14" height="14" fill="#bae6fd"/><text x="290" y="448">Range up to high estimate</text></g>
  <text x="450" y="472" text-anchor="middle" font-size="11" fill="#475569">Estimates = Q4_K_M file size plus runtime and context cache; not measurements. Leave headroom for the OS.</text>
<text x="892" y="475" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
