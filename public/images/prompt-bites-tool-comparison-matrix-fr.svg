<text x="30" y="278" class="feature" text-anchor="start">Meilleur pour :</text>
<text x="30" y="298" class="cell-text" text-anchor="start">• Ollama : développeurs, automatisation, serveurs sans écran (priorité CLI, API simple)</text>
<text x="30" y="318" class="cell-text" text-anchor="start">• LM Studio : utilisateurs de bureau qui veulent une GUI soignée, débutants</text>
<text x="30" y="338" class="cell-text" text-anchor="start">• Jan : application de bureau open source avec aussi un CLI, multiplateforme</text>
<text x="30" y="358" class="cell-text" text-anchor="start">• llama.cpp : contrôle et performances maximaux, le moteur derrière de nombreux outils</text>
<text x="30" y="378" class="cell-text" text-anchor="start">• KoboldCpp : application à fichier unique pour le jeu de rôle et l'écriture créative</text>
<text x="30" y="398" class="cell-text" text-anchor="start">• GPT4All : chat hors ligne simple sur PC ordinaires, questions sur documents</text>
<text x="30" y="420" class="cell-text" font-weight="600" text-anchor="start">Recommandation : commencez par Ollama (utilisateur avancé) ou LM Studio / Jan (GUI). llama.cpp pour un contrôle total.</text>
<text x="30" y="440" class="cell-text" style="fill:#79747E" text-anchor="start">✓✓ excellent · ✓ oui · ~ partiel · ✗ non</text>
