<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">UM890 Pro: Local LLM Fit by RAM Tier (Radeon 780M iGPU)</text>

  <!-- Row 1: 32 GB -->
  <text x="320" y="137" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E" text-anchor="end">32 GB RAM</text>
  <rect x="340" y="115" width="227" height="32" rx="4" fill="#34A853"/>
  <text x="453" y="137" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">7B comfortable</text>

  <!-- Row 2: 64 GB -->
  <text x="320" y="217" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E" text-anchor="end">64 GB RAM</text>
  <rect x="340" y="195" width="453" height="32" rx="4" fill="#6750A4"/>
  <text x="566" y="217" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">13B–14B comfortable</text>

  <!-- Row 3: 96 GB (13B-14B comfortable + 30B low throughput) -->
  <text x="320" y="297" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E" text-anchor="end">96 GB RAM</text>
  <rect x="340" y="275" width="453" height="32" rx="4" fill="#6750A4"/>
  <text x="566" y="297" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">13B–14B comfortable</text>
  <rect x="793" y="275" width="227" height="32" rx="4" fill="#F4B400"/>
  <text x="906" y="297" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">+30B (low throughput)</text>

  <line x1="30" y1="335" x2="1170" y2="335" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 4: OCuLink eGPU (not RAM-bound) -->
  <text x="320" y="391" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E" text-anchor="end">+ OCuLink eGPU</text>
  <rect x="340" y="365" width="680" height="40" rx="4" fill="#1C1B1F"/>
  <text x="680" y="391" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fast 13B–30B+ inference — external GPU, not RAM-limited</text>

  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="12.5" fill="#49454F" text-anchor="middle">At 32 GB a 7B model runs comfortably on the Radeon 780M iGPU; 64–96 GB adds 13B–14B and a slow 30B; OCuLink removes the RAM/iGPU ceiling entirely.</text>
<text x="1180" y="653" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
