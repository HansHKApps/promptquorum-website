<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">IMAP + Python + Ollama: Local Email Draft Pipeline</text>

  <rect x="30" y="58" width="740" height="175" rx="10" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="45" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6750A4">RUNS LOCALLY — NO CLOUD API CALLS</text>

  <circle cx="110" cy="150" r="22" fill="#6750A4"/>
  <text x="110" y="157" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Fetch Unread Email</text>
  <text x="110" y="213" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">IMAP · cron / 30 min</text>

  <text x="205" y="157" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="300" cy="150" r="22" fill="#6750A4"/>
  <text x="300" y="157" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Strip Headers &amp; Truncate</text>
  <text x="300" y="213" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">HTML → text · 2–3K chars</text>

  <text x="395" y="157" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="490" cy="150" r="22" fill="#6750A4"/>
  <text x="490" y="157" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama Drafts Reply</text>
  <text x="490" y="213" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">qwen3:14b · localhost:11434</text>

  <text x="585" y="157" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="680" cy="150" r="22" fill="#6750A4"/>
  <text x="680" y="157" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Save Draft</text>
  <text x="680" y="213" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">local file or IMAP Drafts</text>

  <text x="400" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34A853" text-anchor="middle">Zero email content leaves your machine — IMAP and Ollama both run locally.</text>
  <text x="400" y="282" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">~50 lines of Python · Qwen3 14B (9 GB VRAM) or Phi-4 Mini (3 GB VRAM) via Ollama</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Review before sending is mandatory: local models make tone and factual errors — treat every draft as unreviewed.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
