  <text x="400" y="418" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">O Piper não precisa de GPU; Bark e Tortoise precisam de mais margem do que qualquer outro engine de TTS local.</text>
