<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">&#xbf;Qu&#xe9; modelo local de programaci&#xf3;n deber&#xed;as elegir?</text>
  <text x="62" y="56" font-size="12" font-weight="700" fill="#79747E">Tu situaci&#xf3;n</text>
  <text x="448" y="56" font-size="12" font-weight="700" fill="#79747E">Elecci&#xf3;n</text>
  <line x1="18" y1="63" x2="782" y2="63" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="64" width="764" height="32" fill="#F7F2FA"/>
  <text x="62" y="83" font-size="11" fill="#1C1B1F">GPU de 24 GB, mejor programaci&#xf3;n de prop&#xf3;sito general</text>
  <text x="448" y="83" font-size="11" font-weight="700" fill="#6750A4">Qwen3-Coder 30B ★</text>
  <line x1="18" y1="96" x2="782" y2="96" stroke="#E8DEF8" stroke-width="1"/>
  <text x="62" y="115" font-size="11" fill="#1C1B1F">GPU de 12&#x2013;16 GB, modelo s&#xf3;lido para el d&#xed;a a d&#xed;a</text>
  <text x="448" y="115" font-size="11" fill="#49454F">Qwen3-Coder 7B o Codestral 22B</text>
  <line x1="18" y1="128" x2="782" y2="128" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="147" font-size="11" fill="#1C1B1F">GPU de 8 GB o MacBook de 16 GB</text>
  <text x="448" y="147" font-size="11" fill="#49454F">Qwen3-Coder 7B</text>
  <line x1="18" y1="160" x2="782" y2="160" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="179" font-size="11" fill="#1C1B1F">48 GB+ de VRAM, trabajo de repositorio completo / contexto largo</text>
  <text x="448" y="179" font-size="11" fill="#49454F">DeepSeek Coder V3</text>
  <line x1="18" y1="192" x2="782" y2="192" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="211" font-size="11" fill="#1C1B1F">Producto comercial &#x2014; claridad de licencia primero</text>
  <text x="448" y="211" font-size="11" fill="#49454F">Granite Code 34B o DeepSeek V3 (Apache 2.0)</text>
  <line x1="18" y1="224" x2="782" y2="224" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="243" font-size="11" fill="#1C1B1F">Ya ejecutas modelos y herramientas Llama</text>
  <text x="448" y="243" font-size="11" fill="#49454F">Llama 3.3 Code</text>
  <line x1="18" y1="256" x2="782" y2="256" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="275" font-size="11" fill="#1C1B1F">Lenguajes de nicho (Rust, Lua, Haskell, Solidity)</text>
  <text x="448" y="275" font-size="11" fill="#49454F">StarCoder 2 15B</text>
  <line x1="18" y1="288" x2="782" y2="288" stroke="#F7F2FA" stroke-width="1"/>
  <text x="62" y="307" font-size="11" fill="#1C1B1F">Velocidad sobre calidad &#x2014; la menor latencia es lo m&#xe1;s importante</text>
  <text x="448" y="307" font-size="11" fill="#49454F">Codestral 22B</text>
  <line x1="18" y1="320" x2="782" y2="320" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="346" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">La VRAM es la primera restricci&#xf3;n vinculante &#x2014; no el puesto en el ranking &#xb7; Mayo de 2026</text>
  <text x="400" y="370" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
