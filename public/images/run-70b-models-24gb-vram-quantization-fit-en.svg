<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Llama 3.3 70B: VRAM Size by Quantization vs. 24 GB Limit</text>

  <!-- 24GB threshold line: chart 0-140GB mapped x=260 to x=740 (480px) -->
  <line x1="342" y1="60" x2="342" y2="322" stroke="#1C1B1F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="342" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">24 GB VRAM limit</text>

  <!-- FP16 baseline: 140 GB -->
  <text x="250" y="87" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">FP16 (baseline)</text>
  <rect x="260" y="68" width="480" height="24" fill="#EA4335" rx="4"/>
  <text x="270" y="85" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">140 GB — does not fit</text>

  <!-- Q8: 70 GB -->
  <text x="250" y="129" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q8 (8-bit)</text>
  <rect x="260" y="110" width="240" height="24" fill="#EA4335" rx="4"/>
  <text x="270" y="127" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">70 GB — does not fit</text>

  <!-- Q5: 43.75 GB -->
  <text x="250" y="171" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q5 (5-bit)</text>
  <rect x="260" y="152" width="150" height="24" fill="#EA4335" rx="4"/>
  <text x="270" y="169" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">43.75 GB — does not fit</text>

  <!-- Q4: 35 GB -->
  <text x="250" y="213" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q4 (4-bit)</text>
  <rect x="260" y="194" width="120" height="24" fill="#F4B400" rx="4"/>
  <text x="270" y="211" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">35 GB — 11 GB offload needed</text>

  <!-- Q3: 26 GB -->
  <text x="250" y="255" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q3 (3-bit)</text>
  <rect x="260" y="236" width="89" height="24" fill="#F4B400" rx="4"/>
  <text x="359" y="253" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">26 GB — 2 GB offload</text>

  <!-- Q2: 17.5 GB -->
  <text x="250" y="297" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q2 (2-bit)</text>
  <rect x="260" y="278" width="60" height="24" fill="#34A853" rx="4"/>
  <text x="330" y="295" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">17.5 GB — fits fully</text>

  <line x1="260" y1="325" x2="740" y2="325" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Only Q2 quantization (17.5 GB) fits fully inside 24 GB VRAM. Q3 and Q4 need 2 GB and 11 GB of system-RAM offload.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
