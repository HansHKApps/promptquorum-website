<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pick Your AI Development Monitor in Three Questions</text>

  <!-- Q1 -->
  <rect x="150" y="80" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="340" y="112" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">1. Do you compare two outputs</text>
  <text x="340" y="134" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">side by side most of the day?</text>

  <!-- Q1 YES -> right to outcome -->
  <line class="line" x1="530" y1="120" x2="700" y2="120" stroke="#6750A4" stroke-width="2"/>
  <text x="555" y="108" font-size="12" font-weight="700" fill="#79747E">YES</text>
  <rect x="700" y="80" width="350" height="80" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="700" y="80" width="350" height="4" rx="0" fill="#34A853"/>
  <text x="875" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">34-inch ultrawide</text>
  <text x="875" y="140" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F" text-anchor="middle">3440 x 1440 — comparison pick</text>

  <!-- Q1 NO -> down to Q2 -->
  <line class="line" x1="340" y1="160" x2="340" y2="240" stroke="#6750A4" stroke-width="2"/>
  <text x="352" y="205" font-size="12" font-weight="700" fill="#79747E">NO</text>

  <!-- Q2 -->
  <rect x="150" y="240" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="340" y="272" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">2. Do you run two monitors now</text>
  <text x="340" y="294" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">and want one screen instead?</text>

  <!-- Q2 YES -> right to outcome -->
  <line class="line" x1="530" y1="280" x2="700" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="555" y="268" font-size="12" font-weight="700" fill="#79747E">YES</text>
  <rect x="700" y="240" width="350" height="80" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="700" y="240" width="350" height="4" rx="0" fill="#34A853"/>
  <text x="875" y="278" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">40-inch 5K2K super-ultrawide</text>
  <text x="875" y="300" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F" text-anchor="middle">5120 x 2160 — dual-monitor replacement</text>

  <!-- Q2 NO -> down to Q3 -->
  <line class="line" x1="340" y1="320" x2="340" y2="400" stroke="#6750A4" stroke-width="2"/>
  <text x="352" y="365" font-size="12" font-weight="700" fill="#79747E">NO</text>

  <!-- Q3 -->
  <rect x="150" y="400" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="340" y="432" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">3. Is a 4K panel within</text>
  <text x="340" y="454" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">your budget?</text>

  <!-- Q3 YES -> right to outcome -->
  <line class="line" x1="530" y1="440" x2="700" y2="440" stroke="#6750A4" stroke-width="2"/>
  <text x="555" y="428" font-size="12" font-weight="700" fill="#79747E">YES</text>
  <rect x="700" y="400" width="350" height="80" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="700" y="400" width="350" height="4" rx="0" fill="#34A853"/>
  <text x="875" y="438" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">4K 27-inch IPS monitor</text>
  <text x="875" y="460" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F" text-anchor="middle">3840 x 2160 — all-round pick</text>

  <!-- Q3 NO -> down to final outcome -->
  <line class="line" x1="340" y1="480" x2="340" y2="560" stroke="#6750A4" stroke-width="2"/>
  <text x="352" y="525" font-size="12" font-weight="700" fill="#79747E">NO</text>

  <rect x="150" y="560" width="380" height="80" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="150" y="560" width="380" height="4" rx="0" fill="#F4B400"/>
  <text x="340" y="598" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F" text-anchor="middle">1440p 27-inch monitor</text>
  <text x="340" y="620" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F" text-anchor="middle">2560 x 1440 — budget entry point</text>

  <text x="875" y="560" font-family="system-ui, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Three questions, in order, route most buyers to one category.</text>
<text x="1192" y="670" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
