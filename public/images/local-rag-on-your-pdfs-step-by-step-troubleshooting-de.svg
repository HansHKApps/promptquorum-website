<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="27" font-size="15" font-weight="700" fill="#1C1B1F" text-anchor="middle">6 häufige Fehlermodi — Schnell-Fix-Referenz</text>

  <!-- Header row -->
  <rect x="0" y="40" width="800" height="34" fill="#6750A4"/>
  <text x="130" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Symptom</text>
  <text x="390" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wahrscheinliche Ursache</text>
  <text x="660" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fix</text>

  <!-- Column dividers -->
  <line x1="260" y1="40" x2="260" y2="346" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="346" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="0" y="74" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="91" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Keine Verbindung zu Ollama</text>
  <text x="130" y="107" font-size="10" fill="#49454F" text-anchor="middle">"Verbindung abgelehnt"</text>
  <text x="390" y="99" font-size="10" fill="#49454F" text-anchor="middle">Service läuft nicht / falscher Endpoint</text>
  <text x="660" y="91" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">ollama serve</text>
  <text x="660" y="107" font-size="10" fill="#49454F" text-anchor="middle">Endpoint: 127.0.0.1:11434 prüfen</text>

  <!-- Row 2 -->
  <rect x="0" y="118" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="135" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Model-Download hält an</text>
  <text x="130" y="151" font-size="10" fill="#49454F" text-anchor="middle">bei 0% oder 99%</text>
  <text x="390" y="143" font-size="10" fill="#49454F" text-anchor="middle">CDN-Problem oder Disk voll</text>
  <text x="660" y="135" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">Ctrl+C → df -h → erneut pullen</text>
  <text x="660" y="151" font-size="10" fill="#49454F" text-anchor="middle">Ollama nimmt vom letzten Byte wieder auf</text>

  <!-- Row 3 -->
  <rect x="0" y="162" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="179" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Embedding-Schritt hängt</text>
  <text x="130" y="195" font-size="10" fill="#49454F" text-anchor="middle">Fortschrittsbalken eingefroren</text>
  <text x="390" y="187" font-size="10" fill="#49454F" text-anchor="middle">Erstmaliges Model-Laden in RAM</text>
  <text x="660" y="179" font-size="10" fill="#49454F" text-anchor="middle">30–60 Sek. warten — erstes Laden</text>
  <text x="660" y="195" font-size="10" fill="#49454F" text-anchor="middle">dauert 10–40 Sek. je Disk-Geschwindigkeit</text>

  <!-- Row 4 -->
  <rect x="0" y="206" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="223" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Abruf: themenfremde Chunks</text>
  <text x="130" y="239" font-size="10" fill="#49454F" text-anchor="middle">Zitate unrelevant zur Query</text>
  <text x="390" y="231" font-size="10" fill="#49454F" text-anchor="middle">Standard 512/0 + schwacher Embedder</text>
  <text x="660" y="223" font-size="10" fill="#6750A4" text-anchor="middle">Schritt 4 (nomic-embed-text) anwenden</text>
  <text x="660" y="239" font-size="10" fill="#6750A4" text-anchor="middle">+ Schritt 7 (1000/200) · re-embedden</text>

  <!-- Row 5 -->
  <rect x="0" y="250" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="267" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Antworten generisch / kurz</text>
  <text x="130" y="283" font-size="10" fill="#49454F" text-anchor="middle">ignoriert PDF-Inhalt</text>
  <text x="390" y="275" font-size="10" fill="#49454F" text-anchor="middle">Winziges Standard-LLM noch gewählt</text>
  <text x="660" y="267" font-size="10" fill="#49454F" text-anchor="middle">LLM → llama3.3:8b-instruct-q4_K_M</text>
  <text x="660" y="283" font-size="10" fill="#49454F" text-anchor="middle">Top-K von 4 auf 6 erhöhen</text>

  <!-- Row 6 -->
  <rect x="0" y="294" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="311" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Gescannte PDFs → leere Chunks</text>
  <text x="130" y="327" font-size="10" fill="#49454F" text-anchor="middle">Text extrahiert als "[image]"</text>
  <text x="390" y="319" font-size="10" fill="#49454F" text-anchor="middle">Keine Text-Layer — reines Raster-Bild</text>
  <text x="660" y="311" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#6750A4" text-anchor="middle">ocrmypdf input.pdf output.pdf</text>
  <text x="660" y="327" font-size="10" fill="#49454F" text-anchor="middle">dann OCR-Output erneut hochladen</text>

  <!-- Table outer border -->
  <rect x="0" y="40" width="800" height="298" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <line x1="18" y1="354" x2="782" y2="354" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="374" font-size="11" fill="#79747E" text-anchor="middle">Alle Fehler beheben sich durch das vollständige 7-Schritte-Setup in der richtigen Reihenfolge</text>
  <text x="400" y="394" font-size="10" fill="#79747E" text-anchor="middle">Abruf-Probleme: immer zuerst Embedder (Schritt 4) + Chunk-Größe (Schritt 7) beheben</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
