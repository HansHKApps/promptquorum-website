<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local Agent Stacks: Task Success Rate (15 Runs)</text>

  <text x="250" y="94" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Cline + Ollama</text>
  <rect x="260" y="75" width="448" height="24" fill="#34A853" rx="4"/>
  <text x="716" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">13–15 of 15 runs</text>

  <text x="250" y="136" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Continue.dev Agent</text>
  <rect x="260" y="117" width="416" height="24" fill="#34A853" rx="4"/>
  <text x="684" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">12–14 of 15 runs</text>

  <text x="250" y="178" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">OpenInterpreter</text>
  <rect x="260" y="159" width="240" height="24" fill="#F4B400" rx="4"/>
  <text x="508" y="176" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">6–9 of 15 — unsafe unattended</text>

  <text x="250" y="220" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">LangGraph + Ollama</text>
  <rect x="260" y="201" width="176" height="24" fill="#F4B400" rx="4"/>
  <text x="444" y="218" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">4–7 of 15 — brittle past 5 steps</text>

  <text x="250" y="262" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">MetaGPT local</text>
  <rect x="260" y="243" width="144" height="24" fill="#F4B400" rx="4"/>
  <text x="412" y="260" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">3–6 of 15 — role-play drifts</text>

  <text x="250" y="304" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">AutoGPT-local</text>
  <rect x="260" y="285" width="32" height="24" fill="#EA4335" rx="4"/>
  <text x="300" y="302" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">0–2 of 15 — unusable</text>

  <line x1="260" y1="330" x2="740" y2="330" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="358" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Cline + Ollama and Continue.dev Agent land real work reliably; the other four stacks fail differently or are unusable.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
