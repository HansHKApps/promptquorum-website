<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Minisforum UM890 Pro vs Beelink SER8 — Spec Comparison (2026)</text>

  <!-- Header row -->
  <text x="50" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#79747E">Spec</text>
  <text x="560" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6750A4">Minisforum UM890 Pro</text>
  <text x="930" y="100" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1C1B1F">Beelink SER8</text>
  <line x1="30" y1="115" x2="1170" y2="115" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: CPU (tie) -->
  <text x="50" y="155" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">CPU</text>
  <text x="560" y="155" font-family="system-ui, sans-serif" font-size="14" fill="#1C1B1F">Ryzen 9 8945HS — 8C/16T</text>
  <text x="930" y="155" font-family="system-ui, sans-serif" font-size="14" fill="#1C1B1F">Ryzen 7 8845HS — 8C/16T</text>
  <line x1="30" y1="172" x2="1170" y2="172" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: iGPU (tie) -->
  <text x="50" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">iGPU</text>
  <text x="560" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#1C1B1F">Radeon 780M — 12 CU</text>
  <text x="930" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#1C1B1F">Radeon 780M — 12 CU</text>
  <line x1="30" y1="227" x2="1170" y2="227" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: RAM ceiling (UM890 wins) -->
  <text x="50" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">RAM ceiling</text>
  <text x="560" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4">Up to 96 GB DDR5</text>
  <text x="930" y="265" font-family="system-ui, sans-serif" font-size="14" fill="#49454F">Up to 64 GB DDR5</text>
  <line x1="30" y1="282" x2="1170" y2="282" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: Networking (UM890 wins) -->
  <text x="50" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">Networking</text>
  <text x="560" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4">2× 2.5GbE + Wi-Fi 6E</text>
  <text x="930" y="320" font-family="system-ui, sans-serif" font-size="14" fill="#49454F">1× 2.5GbE + Wi-Fi 6</text>
  <line x1="30" y1="337" x2="1170" y2="337" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: External GPU path (UM890 only) -->
  <text x="50" y="375" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">External GPU</text>
  <text x="560" y="375" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4">OCuLink, PCIe 4.0 ×4</text>
  <text x="930" y="375" font-family="system-ui, sans-serif" font-size="14" fill="#79747E">Not available</text>
  <line x1="30" y1="392" x2="1170" y2="392" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6: Price -->
  <text x="50" y="430" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#79747E">Price (Jul 2026)</text>
  <text x="560" y="430" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#1C1B1F">~$439 barebones – $649 / 32 GB</text>
  <text x="930" y="430" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#1C1B1F">~$650 / 32 GB</text>
  <line x1="30" y1="447" x2="1170" y2="447" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="600" y="495" font-family="system-ui, sans-serif" font-size="12.5" fill="#49454F" text-anchor="middle">Same CPU/iGPU tier — the UM890 Pro's premium buys a 96 GB RAM ceiling, dual 2.5GbE, and an OCuLink port for a fast external GPU.</text>
<text x="1180" y="608" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
