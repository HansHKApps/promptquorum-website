<svg viewBox="0 0 800 295" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="295" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Atomic Chat — Your Model Stays on Your Devices</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">One open-source app · Nothing sent to a server · Offline after the first download</text>
  <!-- Center hub -->
  <rect x="318" y="120" width="164" height="70" rx="8" fill="#6750A4"/>
  <text x="400" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your model</text>
  <text x="400" y="171" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#E8DEF8" text-anchor="middle">+ your conversations</text>
  <!-- Connector lines -->
  <line x1="318" y1="155" x2="212" y2="155" stroke="#6750A4" stroke-width="2"/>
  <line x1="482" y1="155" x2="588" y2="155" stroke="#6750A4" stroke-width="2"/>
  <!-- Left device: Desktop -->
  <rect x="60" y="122" width="152" height="66" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="136" y="147" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Desktop</text>
  <text x="136" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Windows · macOS · Linux</text>
  <text x="136" y="181" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#49454F" text-anchor="middle">8 GB RAM floor</text>
  <!-- Right device: Phone -->
  <rect x="588" y="122" width="152" height="66" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <text x="664" y="147" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#7D5260" text-anchor="middle">Phone</text>
  <text x="664" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#49454F" text-anchor="middle">iPhone &amp; Android</text>
  <text x="664" y="181" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#49454F" text-anchor="middle">1B–3B on-device model</text>
  <!-- No-cloud indicator -->
  <text x="400" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="middle"><tspan fill="#EA4335" font-weight="700">✗</tspan>  No cloud server   ·   <tspan fill="#EA4335" font-weight="700">✗</tspan>  No telemetry   ·   <tspan fill="#34A853" font-weight="700">✓</tspan>  Apache 2.0 auditable</text>
  <!-- Attribution -->
  <text x="400" y="283" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/power-local-llm/local-ai-app-non-technical-users</text>
</svg>
