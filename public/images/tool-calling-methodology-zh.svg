<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="300" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="22" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">测试方法论——如何对5个工具调用模型进行基准测试</text>
  <line x1="18" y1="30" x2="782" y2="30" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Column headers -->
  <text x="18" y="52" font-size="12" font-weight="700" fill="#79747E">配置</text>
  <text x="268" y="52" font-size="12" font-weight="700" fill="#79747E">详情</text>
  <!-- Vertical divider -->
  <line x1="255" y1="30" x2="255" y2="240" stroke="#E8DEF8" stroke-width="1"/>
  <!-- Header underline -->
  <line x1="18" y1="60" x2="782" y2="60" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1: y=80 -->
  <text x="18" y="80" font-size="12" font-weight="700" fill="#1C1B1F">MCP服务器</text>
  <text x="268" y="80" font-size="11" fill="#49454F">filesystem · sqlite · puppeteer · github</text>
  <line x1="18" y1="94" x2="782" y2="94" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2: y=112 -->
  <text x="18" y="112" font-size="12" font-weight="700" fill="#1C1B1F">提示集</text>
  <text x="268" y="112" font-size="11" fill="#49454F">50提示 × 4服务器 × 3次运行 = 每模型600次调用</text>
  <line x1="18" y1="126" x2="782" y2="126" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3: y=144 -->
  <text x="18" y="144" font-size="12" font-weight="700" fill="#1C1B1F">总调用数</text>
  <text x="268" y="144" font-size="11" fill="#49454F">5个模型共约3,000次（单步+多步+并行）</text>
  <line x1="18" y1="158" x2="782" y2="158" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 4: y=176 -->
  <text x="18" y="176" font-size="12" font-weight="700" fill="#1C1B1F">测试框架</text>
  <text x="268" y="176" font-size="11" fill="#49454F">Cline 3.x（严格XML）+ Goose+MCP（无头）</text>
  <line x1="18" y1="190" x2="782" y2="190" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 5: y=208 -->
  <text x="18" y="208" font-size="12" font-weight="700" fill="#1C1B1F">硬件</text>
  <text x="268" y="208" font-size="11" fill="#49454F">M5 Max 64 GB（≤32B）· L40S 48 GB（Llama 3.3 70B）</text>
  <!-- Footer -->
  <text x="400" y="262" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">失败归因于模型，而非框架——相同的Cline、相同的服务器，仅变更模型</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
