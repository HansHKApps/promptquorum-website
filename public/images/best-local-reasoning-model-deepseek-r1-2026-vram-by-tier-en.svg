  <text x="400" y="362" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">1.5B fits 4 GB or CPU; 7B and 8B need 8 GB; 14B needs 16 GB; 32B needs 24 GB; 70B needs 48 GB across dual GPUs.</text>
