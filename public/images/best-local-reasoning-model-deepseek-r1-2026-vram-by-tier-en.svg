  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">DeepSeek-R1 Distills: Minimum VRAM by Tier</text>
  <line x1="260" y1="332" x2="740" y2="332" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="84" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">R1-Distill-Qwen-1.5B</text>
