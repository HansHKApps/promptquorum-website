  <text x="306" y="84" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">4 GB (CPU)</text>

  <text x="250" y="124" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">R1-Distill-Qwen-7B</text>
  <rect x="260" y="108" width="77" height="22" fill="#34A853" rx="4"/>
  <text x="345" y="124" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8 GB</text>

  <text x="250" y="164" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">R1-Distill-Llama-8B</text>
  <rect x="260" y="148" width="77" height="22" fill="#7D5260" rx="4"/>
  <text x="345" y="164" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8 GB</text>

