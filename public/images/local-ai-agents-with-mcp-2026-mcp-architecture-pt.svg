<text x="400" y="351" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">O Ollama fornece o modelo; o cliente MCP encaminha chamadas de ferramentas para servidores MCP locais via stdio; cada servidor expõe ferramentas para uma capacidade — arquivos, bancos de dados, navegador ou GitHub.</text>
