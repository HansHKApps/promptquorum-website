<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="27" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">Paso 4: Conectar AnythingLLM con Ollama (3 min)</text>

  <!-- Left panel: LLM Preference -->
  <rect x="18" y="42" width="367" height="228" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="18" y="42" width="367" height="4" rx="0" fill="#6750A4"/>
  <text x="201" y="68" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">① Panel de preferencia de LLM</text>
  <text x="201" y="86" font-size="10" fill="#79747E" text-anchor="middle">Ajustes de AnythingLLM → Preferencia de LLM</text>

  <text x="36" y="110" font-size="11" font-weight="700" fill="#1C1B1F">Proveedor</text>
  <text x="115" y="110" font-size="11" fill="#49454F">Ollama</text>
  <text x="36" y="131" font-size="11" font-weight="700" fill="#1C1B1F">Endpoint</text>
  <text x="115" y="131" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F">http://127.0.0.1:11434</text>
  <text x="36" y="152" font-size="11" font-weight="700" fill="#1C1B1F">Modelo</text>
  <text x="115" y="152" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#49454F">llama3.3:8b-instruct-q4_K_M</text>

  <line x1="36" y1="166" x2="367" y2="166" stroke="#E8DEF8" stroke-width="1"/>

  <rect x="60" y="176" width="282" height="28" rx="4" fill="#6750A4"/>
  <text x="201" y="194" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">→ Haz clic en "Save Changes"</text>

  <text x="201" y="226" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">✓ Marca verde = conexi&#xf3;n confirmada</text>
  <text x="201" y="244" font-size="10" fill="#79747E" text-anchor="middle">Usa 127.0.0.1, no localhost, en Windows</text>

  <!-- Arrow between panels -->
  <text x="400" y="162" font-size="22" fill="#6750A4" text-anchor="middle">→</text>
  <text x="400" y="180" font-size="10" fill="#79747E" text-anchor="middle">luego</text>

  <!-- Right panel: Embedding Preference -->
  <rect x="415" y="42" width="367" height="228" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="415" y="42" width="367" height="4" rx="0" fill="#34A853"/>
  <text x="598" y="68" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">② Panel de preferencia de embebido</text>
  <text x="598" y="86" font-size="10" fill="#79747E" text-anchor="middle">Ajustes de AnythingLLM → Preferencia de embebido</text>

  <text x="433" y="106" font-size="11" font-weight="700" fill="#1C1B1F">Primero en la terminal:</text>
  <text x="433" y="122" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4">ollama pull nomic-embed-text</text>
  <text x="433" y="138" font-size="10" fill="#79747E">(~280 MB, descarga &#xfa;nica)</text>

  <text x="433" y="157" font-size="11" font-weight="700" fill="#1C1B1F">Proveedor</text>
  <text x="512" y="157" font-size="11" fill="#49454F">Ollama (cambiar del predeterminado)</text>
  <text x="433" y="175" font-size="11" font-weight="700" fill="#1C1B1F">Modelo</text>
  <text x="512" y="175" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F">nomic-embed-text:latest</text>

  <line x1="433" y1="188" x2="775" y2="188" stroke="#E8DEF8" stroke-width="1"/>

  <rect x="458" y="197" width="282" height="28" rx="4" fill="#34A853"/>
  <text x="599" y="215" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">→ Haz clic en "Save"</text>

  <text x="598" y="244" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">✓ Embebedor mejorado respecto al predeterminado</text>

  <!-- Footer -->
  <line x1="18" y1="284" x2="782" y2="284" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="304" font-size="11" fill="#79747E" text-anchor="middle">Base de datos vectorial: deja LanceDB por defecto — sin configuraci&#xf3;n necesaria</text>
  <text x="400" y="323" font-size="10" fill="#79747E" text-anchor="middle">nomic-embed-text-v1.5: top-5 en MTEB Retrieval (menos de 500 MB) · Apache 2.0 · 400–800 fragmentos/s en CPU</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
