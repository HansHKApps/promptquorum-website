  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">La RX 7900 XTX égale la vitesse et la VRAM de la RTX 4090 pour environ 60% du prix — le compromis est la friction de configuration ROCm.</text>
