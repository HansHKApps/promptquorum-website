<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>

  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local-Capable vs Cloud-Only Devices</text>

  <!-- Left Panel: Cloud-Only (Problem) -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="82" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">Cloud-Only (Avoid)</text>

  <text x="48" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✗ Requires a vendor cloud account</text>
  <text x="48" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✗ Stops working if the cloud is down</text>
  <text x="48" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✗ Often needs a paid subscription</text>
  <text x="48" y="214" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✗ Footage or data leaves your home</text>
  <text x="48" y="246" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✗ No documented local API</text>

  <line x1="48" y1="270" x2="348" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="48" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E">Example risk:</text>
  <text x="48" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#EA4335">App-only bulbs, cloud-DVR cameras</text>

  <!-- Right Panel: Local-Capable (Goal) -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="82" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Local-Capable (Buy)</text>

  <text x="452" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✓ Zigbee, Z-Wave, Matter, or local API</text>
  <text x="452" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✓ Works offline through a local hub</text>
  <text x="452" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✓ No subscription for core features</text>
  <text x="452" y="214" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✓ Data and footage stay on your network</text>
  <text x="452" y="246" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#49454F">✓ Works with any brand via the hub</text>

  <line x1="452" y1="270" x2="752" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="452" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E">Example pick:</text>
  <text x="452" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#34A853">Zigbee bulbs, local RTSP + Frigate</text>

  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">The selection rule: a device must work through a local hub without depending on a vendor cloud.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
