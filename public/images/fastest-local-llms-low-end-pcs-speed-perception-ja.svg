<svg viewBox="0 0 800 404" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="404" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">「速い」とは実際どれくらい？（ローカルLLM）</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">対話利用の速度の目安。15トークン/秒未満 → ハードを買う前に小さいモデルを試す。</text>
  <rect x="18" y="62" width="764" height="70" rx="6" fill="#FFF3F3" stroke="#EA4335" stroke-width="1.5"/>
  <text x="38" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335">10トークン/秒未満 → 壊れている感覚</text>
  <text x="38" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">単語が1つずつ、目立つ間を置いて表示される。対話チャットには不向き。対策：より小さいモデル</text>
  <text x="38" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">に切り替える。</text>
  <rect x="18" y="142" width="764" height="70" rx="6" fill="#FFFBF0" stroke="#F4B400" stroke-width="1.5"/>
  <text x="38" y="164" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#B07D00">15〜25トークン/秒 → 許容範囲</text>
  <text x="38" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">ほとんどの人に読める速さ。Q&amp;A、文書要約、コーディング支援に向く。わずかな遅れはあるが実用</text>
  <text x="38" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">的。</text>
  <rect x="18" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="38" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">30トークン/秒以上 → スムーズ</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">本物のアシスタントのような感覚。コー</text>
  <text x="38" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">ドレビューを含むあらゆる対話タスクに</text>
  <text x="38" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">快適。</text>
  <rect x="412" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="432" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">60トークン/秒以上 → 瞬時</text>
  <text x="432" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">読む速さより速い。リアルタイムのオー</text>
  <text x="432" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">トコンプリートや素早い反復に最適。</text>
  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">ハードウェア例（推定速度）：</text>
  <text x="115" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU・RAM 4 GB：25〜40 t/s</text>
  <text x="295" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU・RAM 8 GB：15〜25 t/s</text>
  <text x="480" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU・RAM 16 GB：8〜15 t/s</text>
  <text x="670" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">専用GPU：5〜10倍高速</text>
  <line x1="18" y1="362" x2="782" y2="362" stroke="#E8DEF8" stroke-width="2"/>
  <text x="18" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">0</text>
  <text x="140" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">10</text>
  <text x="290" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00">25</text>
  <text x="440" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">40</text>
  <text x="590" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">60</text>
  <text x="735" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">80+ t/s</text>
  <text x="400" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
