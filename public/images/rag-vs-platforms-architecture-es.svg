  <!-- Footer -->
  <text x="400" y="270" font-size="10" fill="#79747E" text-anchor="middle">Arquitectura a fecha de mayo de 2026 &#x2014; las tres manejan formatos de documento id&#xe9;nticos</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
