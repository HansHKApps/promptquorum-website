<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="300" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="22" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">Arquitectura del pipeline RAG &#x2014; c&#xf3;mo procesa documentos cada plataforma</text>
  <line x1="10" y1="30" x2="790" y2="30" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Column headers -->
  <text x="18" y="52" font-size="12" font-weight="700" fill="#79747E">Etapa del pipeline</text>
  <text x="340" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">AnythingLLM</text>
  <text x="527" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">PrivateGPT</text>
  <text x="705" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">Open WebUI</text>
  <!-- Vertical dividers -->
  <line x1="255" y1="30" x2="255" y2="290" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="435" y1="30" x2="435" y2="290" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="620" y1="30" x2="620" y2="290" stroke="#E8DEF8" stroke-width="1"/>
  <!-- Header underline -->
  <line x1="10" y1="60" x2="790" y2="60" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1: Parse & Chunk -->
  <text x="18" y="78" font-size="12" font-weight="700" fill="#1C1B1F">Analizar y dividir</text>
  <text x="340" y="78" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">LangChain.js</text>
  <text x="340" y="92" font-size="10" fill="#79747E" text-anchor="middle">1,000 car. / 20 solapamiento</text>
  <text x="527" y="78" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">LlamaIndex</text>
  <text x="527" y="92" font-size="10" fill="#79747E" text-anchor="middle">512 tok, configurable</text>
  <text x="705" y="78" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">unstructured.io</text>
  <text x="705" y="92" font-size="10" fill="#79747E" text-anchor="middle">1,500 car. / 100 solapamiento</text>
  <line x1="10" y1="100" x2="790" y2="100" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2: Vector Store -->
  <text x="18" y="121" font-size="12" font-weight="700" fill="#1C1B1F">Almac&#xe9;n vectorial</text>
  <text x="340" y="121" font-size="12" font-weight="600" fill="#6750A4" text-anchor="middle">LanceDB</text>
  <text x="527" y="121" font-size="12" font-weight="600" fill="#6750A4" text-anchor="middle">Qdrant</text>
  <text x="705" y="121" font-size="12" font-weight="600" fill="#6750A4" text-anchor="middle">ChromaDB</text>
  <line x1="10" y1="139" x2="790" y2="139" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3: Re-ranking -->
  <text x="18" y="160" font-size="12" font-weight="700" fill="#1C1B1F">Reordenamiento</text>
  <text x="340" y="160" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">Cross-encoder &#x2713;</text>
  <text x="527" y="160" font-size="11" fill="#F4B400" text-anchor="middle">Opcional</text>
  <text x="705" y="160" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle">Ninguno &#x2717;</text>
  <line x1="10" y1="178" x2="790" y2="178" stroke="#F7F2FA" stroke-width="1"/>
