<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="310" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="40" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Comment fonctionne le tool calling — Du prompt à l'exécution</text>
  <!-- Circles -->
  <circle cx="80" cy="90" r="22" fill="#6750A4"/>
  <text x="80" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="220" cy="90" r="22" fill="#6750A4"/>
  <text x="220" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="360" cy="90" r="22" fill="#6750A4"/>
  <text x="360" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="500" cy="90" r="22" fill="#6750A4"/>
  <text x="500" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="640" cy="90" r="22" fill="#6750A4"/>
  <text x="640" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <!-- Arrows -->
  <text x="118" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="258" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="398" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="538" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <!-- Step labels -->
  <text x="80" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Prompt utilisateur</text>
  <text x="220" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lire les schémas</text>
  <text x="360" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Émettre JSON</text>
  <text x="500" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Valider</text>
  <text x="640" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Exécuter l'outil</text>
  <!-- Subtexts -->
  <text x="80" y="148" font-size="10" fill="#49454F" text-anchor="middle">description de tâche</text>
  <text x="220" y="148" font-size="10" fill="#49454F" text-anchor="middle">LLM voit les</text>
  <text x="220" y="162" font-size="10" fill="#49454F" text-anchor="middle">définitions d'outils</text>
  <text x="360" y="148" font-size="10" fill="#49454F" text-anchor="middle">{outil, arguments}</text>
  <text x="360" y="162" font-size="10" fill="#49454F" text-anchor="middle">sortie structurée</text>
  <text x="500" y="148" font-size="10" fill="#49454F" text-anchor="middle">le cadre vérifie</text>
  <text x="500" y="162" font-size="10" fill="#49454F" text-anchor="middle">correspondance schéma</text>
  <text x="640" y="148" font-size="10" fill="#49454F" text-anchor="middle">système de fichiers,</text>
  <text x="640" y="162" font-size="10" fill="#49454F" text-anchor="middle">navigateur, API…</text>
  <!-- Footer -->
  <text x="400" y="240" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Même modèle gère tous les formats — le format filaire est un choix du cadre</text>
</svg>
