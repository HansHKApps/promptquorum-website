<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>

  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Dispositivos locais vs somente nuvem</text>

  <!-- Left Panel: Cloud-Only (Problem) -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="82" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">Somente nuvem (evitar)</text>

  <text x="48" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✗ Exige conta na nuvem do fabricante</text>
  <text x="48" y="150" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✗ Para de funcionar se a nuvem cair</text>
  <text x="48" y="182" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✗ Muitas vezes exige assinatura paga</text>
  <text x="48" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✗ Imagens/dados saem da sua casa</text>
  <text x="48" y="246" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✗ Sem API local documentada</text>

  <line x1="48" y1="270" x2="348" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="48" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E">Risco de exemplo:</text>
  <text x="48" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#EA4335">Lâmpadas só-por-app, câmeras com DVR na nuvem</text>

  <!-- Right Panel: Local-Capable (Goal) -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="82" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Compatível local (comprar)</text>

  <text x="452" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✓ Zigbee, Z-Wave, Matter ou API local</text>
  <text x="452" y="150" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✓ Funciona offline via um hub local</text>
  <text x="452" y="182" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✓ Sem assinatura para funções principais</text>
  <text x="452" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✓ Dados e imagens ficam na sua rede</text>
  <text x="452" y="246" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F">✓ Funciona com qualquer marca via o hub</text>

  <line x1="452" y1="270" x2="752" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="452" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E">Escolha de exemplo:</text>
  <text x="452" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#34A853">Lâmpadas Zigbee, RTSP local + Frigate</text>

  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">A regra de seleção: um dispositivo deve funcionar por um hub local sem depender da nuvem de um fabricante.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
