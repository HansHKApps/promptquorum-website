<line x1="18" y1="230" x2="982" y2="230" stroke="#E8DEF8" stroke-width="1.5"/>
<text x="30" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">Schritt 3 ist entscheidend: Ollamas Standard-num_ctx 2048 kürzt die meisten realen Aufgaben ab.</text>
<text x="30" y="276" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">Mit num_ctx auf 32768 verarbeitet Qwen 3.6 27B vollständige Dateien und lange Konversationen.</text>
<text x="30" y="304" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#79747E">Gesamte Einrichtungszeit: unter 10 Minuten auf einer GPU mit 16 GB VRAM.</text>
