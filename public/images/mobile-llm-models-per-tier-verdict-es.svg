  <text x="295" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Gemma 3 1B</text>
  <text x="595" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">~35–45</text>
