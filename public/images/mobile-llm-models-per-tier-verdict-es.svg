  <!-- Subtitle -->
  <text x="400" y="47" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F">Ajusta el modelo al hardware — la generaci&#xf3;n del chip y la RAM son lo m&#xe1;s importante</text>
  <!-- Column Headers -->
