  <text x="350" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#F4B400">3B&#x2013;7B</text>
  <text x="620" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">5&#x2013;15 tok/s</text>

