  <text x="350" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">7B&#x2013;30B</text>
  <text x="620" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">15&#x2013;40 tok/s</text>

  <!-- Divider y=140 -->
