  <text x="350" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Modelos</text>
  <text x="620" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Velocidad</text>

