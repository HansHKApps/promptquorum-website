<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" width="800" height="255">
  <rect width="800" height="255" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Requisitos de hardware para IA local (2026)</text>
  <!-- Subtitle -->
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Cualquier port&#xe1;til con 8 GB de RAM ejecuta modelos peque&#xf1;os &#xb7; Apple Silicon los ejecuta m&#xe1;s r&#xe1;pido</text>

