<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Tarjetas de personaje: el formato universal (Tavern v2)
  </text>

  <!-- Left: Card creation -->
  <text x="80" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Crea en cualquier frontend</text>
  <rect x="30" y="80" width="100" height="80" rx="4" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="80" y="110" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Tarjeta de personaje</text>
  <text x="80" y="130" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">PNG + JSON</text>
  <text x="80" y="145" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Tavern v2</text>

  <!-- Arrow 1: From ST -->
  <text x="145" y="110" font-size="18" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>
  <line x1="145" y1="130" x2="145" y2="165" stroke="#6750A4" stroke-width="2"/>

  <rect x="110" y="165" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="145" y="190" font-size="10" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SillyTavern</text>

  <!-- Arrow 2: From Agnai -->
  <text x="200" y="110" font-size="18" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>
  <line x1="200" y1="130" x2="200" y2="165" stroke="#6750A4" stroke-width="2"/>

  <rect x="165" y="165" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="200" y="190" font-size="10" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Agnai</text>

  <!-- Arrow 3: From RisuAI -->
  <text x="255" y="110" font-size="18" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>
  <line x1="255" y1="130" x2="255" y2="165" stroke="#6750A4" stroke-width="2"/>

  <rect x="220" y="165" width="70" height="40" rx="4" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="255" y="190" font-size="10" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">RisuAI</text>

  <!-- Central card spec -->
  <circle cx="400" cy="120" r="50" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="2"/>
  <text x="400" y="112" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">TAVERN V2</text>
  <text x="400" y="130" font-size="10" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Lengua franca</text>

  <!-- Card fields -->
  <text x="400" y="190" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Campos de la tarjeta en Tavern v2:</text>

  <text x="50" y="220" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Nombre, descripci&#xf3;n, personalidad</text>
  <text x="50" y="238" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Escenario, primer mensaje, di&#xe1;logo de ejemplo</text>
  <text x="50" y="256" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Prompt de sistema, etiquetas, notas del creador</text>

  <text x="420" y="220" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Opcional: libros de lore, ajustes de muestreo</text>
  <text x="420" y="238" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Spec V3: soporte multiidioma nativo</text>
  <text x="420" y="256" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Todo compatible con versiones V2 anteriores</text>

  <!-- Interoperability arrows -->
  <line x1="180" y1="210" x2="220" y2="210" stroke="#6750A4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="280" y1="210" x2="320" y2="210" stroke="#6750A4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="210" x2="520" y2="210" stroke="#6750A4" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="210" x2="620" y2="210" stroke="#6750A4" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Key insight -->
  <rect x="50" y="280" width="700" height="50" fill="#E8DEF8" rx="4"/>
  <text x="70" y="305" font-size="11" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Clave: una tarjeta de personaje creada en SillyTavern se abre en Agnai y RisuAI sin conversi&#xf3;n. Migrar entre frontends es trivial — solo se mueve el archivo de la tarjeta.</text>
  <text x="70" y="320" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">El historial de chat prolongado NO migra (por frontend); las definiciones de personaje S&#xcd;. Las tarjetas de la comunidad de chub.ai funcionan en los tres.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>