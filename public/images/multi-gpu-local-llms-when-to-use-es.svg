<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <metadata>
    <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">When to Use Multi-GPU</dc:title>
    <dc:creator>PromptQuorum</dc:creator>
    <dc:rights>© PromptQuorum 2026</dc:rights>
    <dc:source>https://www.promptquorum.com/local-llms/multi-gpu-local-llms</dc:source>
  </metadata>

  <rect width="800" height="360" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cu&#xe1;ndo usar varias GPU: matriz de decisi&#xf3;n</text>

  <!-- Row 1: Model Size (YES) -->
  <rect x="40" y="55" width="720" height="50" rx="4" fill="#E8F5E9" stroke="#34A853" stroke-width="1.5"/>
  <circle cx="65" cy="80" r="14" fill="#34A853"/>
  <text x="65" y="86" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>

  <text x="95" y="75" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Quieres ejecutar modelos de 70B o m&#xe1;s</text>
  <text x="95" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Una sola RTX 4090 (24 GB) no puede albergar Llama 3.3 70B. Dos RTX 4090 (48 GB) lo hacen con holgura en Q4.</text>

  <!-- Row 2: High Concurrency (YES) -->
  <rect x="40" y="115" width="720" height="50" rx="4" fill="#E8F5E9" stroke="#34A853" stroke-width="1.5"/>
  <circle cx="65" cy="140" r="14" fill="#34A853"/>
  <text x="65" y="146" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>

  <text x="95" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Atiendes a m&#xe1;s de 50 usuarios simult&#xe1;neos</text>
  <text x="95" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">El procesamiento por lotes entre GPU aumenta el rendimiento. Una sola GPU se satura con ~5 usuarios simult&#xe1;neos.</text>

  <!-- Row 3: Bought 2nd GPU (NO) -->
  <rect x="40" y="175" width="720" height="50" rx="4" fill="#FFEBEE" stroke="#EA4335" stroke-width="1.5"/>
  <circle cx="65" cy="200" r="14" fill="#EA4335"/>
  <text x="65" y="206" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text>

  <text x="95" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">A&#xfa;n no has comprado la segunda GPU</text>
  <text x="95" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Prueba la cuantizaci&#xf3;n Q4 o una RTX 5090 (tarjeta &#xfa;nica) antes de gastar m&#xe1;s de $1,800 en una segunda RTX 4090.</text>

  <!-- Row 4: Production Requirement (YES) -->
  <rect x="40" y="235" width="720" height="50" rx="4" fill="#E8F5E9" stroke="#34A853" stroke-width="1.5"/>
  <circle cx="65" cy="260" r="14" fill="#34A853"/>
  <text x="65" y="266" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>

  <text x="95" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Necesitas velocidad de producci&#xf3;n (m&#xe1;s de 100 tok/seg)</text>
  <text x="95" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Varias GPU son la &#xfa;nica forma de lograr 100 tok/seg en 70B. Una GPU + descarga a CPU: solo 8–10 tok/seg.</text>

  <!-- Bottom decision -->
  <rect x="40" y="305" width="720" height="40" rx="6" fill="#F3E5F5" stroke="#6750A4" stroke-width="2"/>
  <text x="60" y="328" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">Regla de decisi&#xf3;n: usa varias GPU solo si se cumplen TODAS estas condiciones:</text>
  <text x="60" y="343" font-family="system-ui, sans-serif" font-size="11" fill="#6750A4">(1) Ya tienes 2 GPU O (2) Tienes una necesidad expl&#xed;cita de 70B + velocidad de producci&#xf3;n, no experimentaci&#xf3;n</text>

  <!-- Corner attribution -->
  <text x="730" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#999999" text-anchor="end">promptquorum.com</text>
</svg>