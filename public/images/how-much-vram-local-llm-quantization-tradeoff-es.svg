<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="320" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cuantización: ahorro de VRAM vs. pérdida de calidad</text>
  <text x="40" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Nivel</text>
  <text x="280" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Bits/parámetro</text>
  <text x="470" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Ahorro de VRAM</text>
  <text x="620" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Pérdida de calidad</text>
  <line x1="18" y1="63" x2="782" y2="63" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="59" width="764" height="46" fill="#FCE8E6" rx="4"/>
  <text x="40" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">FP32 (completo)</text>
  <text x="280" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">32 bits</text>
  <text x="470" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">0% (base)</text>
  <text x="620" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">Ninguna</text>
  <text x="40" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Q8</text>
  <text x="280" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">8 bits</text>
  <text x="470" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">75%</text>
  <text x="620" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">~6%</text>
  <line x1="18" y1="141" x2="782" y2="141" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="179" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Q5</text>
  <text x="280" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">5 bits</text>
  <text x="470" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">84%</text>
  <text x="620" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">~2%</text>
  <line x1="18" y1="191" x2="782" y2="191" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="209" width="764" height="46" fill="#E6F4EA" rx="4"/>
  <text x="40" y="229" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">Q4 ★ recomendado</text>
  <text x="280" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">4 bits</text>
  <text x="470" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">87,5%</text>
  <text x="620" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">~1%</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Q4 es el punto óptimo para la mayoría — 87,5% menor que FP32 con solo ~1% de pérdida de precisión.</text>
<text x="792" y="315" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>