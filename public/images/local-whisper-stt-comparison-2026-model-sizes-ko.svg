  <text x="285" y="317" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">1&#215; (기준) · 2.5% WER</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">distil-large-v3는 medium과 같은 속도로 large-v3에 가까운 정확도를 제공합니다 — 대부분의 파이프라인에 가장 적합한 속도/품질 균형입니다.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
