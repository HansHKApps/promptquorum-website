<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Whisper 모델 크기: 속도 대 정확도</text>
  <text x="400" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">RTX 4070 기준 실시간 대비 속도 배수 — WER이 낮을수록 정확합니다</text>

  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">tiny (39M)</text>
  <rect x="260" y="75" width="480" height="24" fill="#6750A4" rx="4"/>
  <text x="730" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">32&#215; · 7.6% WER</text>

  <text x="250" y="139" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">base (74M)</text>
  <rect x="260" y="120" width="240" height="24" fill="#6750A4" rx="4"/>
  <text x="490" y="137" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">16&#215; · 5.0% WER</text>

  <text x="250" y="184" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">small (244M)</text>
  <rect x="260" y="165" width="90" height="24" fill="#34A853" rx="4"/>
  <text x="360" y="182" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">6&#215; · 3.4% WER</text>

  <text x="250" y="229" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">distil-large-v3</text>
  <rect x="260" y="210" width="90" height="24" fill="#F4B400" rx="4"/>
  <text x="360" y="227" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">6&#215; · 2.6% WER</text>

  <text x="250" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">medium (769M)</text>
  <rect x="260" y="255" width="30" height="24" fill="#7D5260" rx="4"/>
