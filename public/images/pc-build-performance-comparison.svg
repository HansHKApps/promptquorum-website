<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1C1B1F" text-anchor="middle">Tokens/sec by Model Size (Q4)</text>

  <!-- Legend -->
  <rect x="230" y="52" width="14" height="14" fill="#6750A4" rx="2"/>
  <text x="248" y="63" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">$1,000 build (single GPU)</text>
  <rect x="440" y="52" width="14" height="14" fill="#7D5260" rx="2"/>
  <text x="458" y="63" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">$2,000 build (dual GPU / tensor-split)</text>

  <line x1="70" y1="380" x2="770" y2="380" stroke="#79747E" stroke-width="1.5"/>
  <text x="60" y="384" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">0</text>
  <text x="60" y="252" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">30</text>
  <text x="60" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">60 tok/s</text>

  <!-- Group: 7B (same card, same speed both builds) -->
  <rect x="115" y="123" width="45" height="257" fill="#6750A4" rx="3"/>
  <text x="137" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">60</text>
  <rect x="165" y="123" width="45" height="257" fill="#7D5260" rx="3"/>
  <text x="187" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">60</text>
  <text x="162" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">7B</text>

  <!-- Group: 14B -->
  <rect x="305" y="245" width="45" height="135" fill="#6750A4" rx="3"/>
  <text x="327" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">31</text>
  <rect x="355" y="245" width="45" height="135" fill="#7D5260" rx="3"/>
  <text x="377" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">31</text>
  <text x="352" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">14B</text>

  <!-- Group: 32B (build2 wins via tensor-split even though it fits on one card) -->
  <rect x="495" y="322" width="45" height="58" fill="#6750A4" rx="3"/>
  <text x="517" y="312" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">13</text>
  <rect x="545" y="234" width="45" height="146" fill="#7D5260" rx="3"/>
  <text x="567" y="224" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">34</text>
  <text x="542" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">32B</text>

  <!-- Group: 70B (does not fit the $1,000 build at all) -->
  <rect x="685" y="360" width="45" height="20" fill="#E8DEF8" stroke="#79747E" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="707" y="373" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">N/A</text>
  <rect x="735" y="316" width="45" height="64" fill="#7D5260" rx="3"/>
  <text x="757" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">15</text>
  <text x="732" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">70B</text>

  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">70B does not fit the $1,000 build's 16GB VRAM at any quantization tested.</text>
<text x="792" y="445" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
