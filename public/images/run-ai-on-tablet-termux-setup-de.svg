<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Android On-Device-KI: Termux + Ollama einrichten (5 Schritte)</text>

  <circle cx="94" cy="100" r="22" fill="#6750A4"/>
  <text x="94" y="107" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="94" y="145" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Termux installieren</text>
  <text x="94" y="163" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">von F-Droid</text>
  <text x="94" y="178" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#EA4335" text-anchor="middle">(nicht Play Store)</text>

  <text x="170" y="107" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="247" cy="100" r="22" fill="#6750A4"/>
  <text x="247" y="107" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="247" y="145" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pakete aktualisieren</text>
  <text x="247" y="163" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#49454F" text-anchor="middle">pkg update &amp;&amp;</text>
  <text x="247" y="178" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#49454F" text-anchor="middle">pkg install curl</text>

  <text x="323" y="107" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="400" cy="100" r="22" fill="#6750A4"/>
  <text x="400" y="107" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="400" y="145" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama installieren</text>
  <text x="400" y="163" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#49454F" text-anchor="middle">curl -fsSL</text>
  <text x="400" y="178" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#49454F" text-anchor="middle">ollama.com/install.sh | sh</text>

  <text x="477" y="107" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="553" cy="100" r="22" fill="#6750A4"/>
  <text x="553" y="107" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="553" y="145" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Modell laden</text>
  <text x="553" y="163" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">ollama pull phi4-mini</text>
  <text x="553" y="178" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">oder qwen3:1.7b</text>

  <text x="630" y="107" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <circle cx="706" cy="100" r="22" fill="#6750A4"/>
  <text x="706" y="107" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="706" y="145" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Server starten</text>
  <text x="706" y="163" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">ollama serve</text>
  <text x="706" y="178" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">localhost:11434</text>

  <line x1="18" y1="210" x2="782" y2="210" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="238" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Geräteanforderungen für On-Device-Inferenz</text>
  <text x="400" y="262" font-size="12" fill="#49454F" text-anchor="middle">Minimum 8 GB RAM: Samsung Galaxy Tab S10+, OnePlus Pad 2, Xiaomi Pad 7 Pro</text>
  <text x="400" y="282" font-size="12" fill="#49454F" text-anchor="middle">6 GB RAM: nur Qwen3 1.7B   |   Pixel Tablet (Tensor G2): Fernverbindung nutzen</text>
  <text x="400" y="308" font-size="11" fill="#79747E" text-anchor="middle">Schnellste Chips: Snapdragon 8 Gen 3, Dimensity 9300 (~15–25 tok/Sek. bei 1,7B-Modellen)</text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
