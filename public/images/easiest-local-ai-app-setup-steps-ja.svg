<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" role="img" aria-label="LM Studio セットアップ — 0からチャットまで4ステップ">
  <rect width="800" height="285" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">LM Studio セットアップ ― 0からチャットまで4ステップ</text>
  <!-- Subtitle -->
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">ターミナル不要 · Python不要 · クラウドアカウント不要</text>

  <!-- Step 1 circle -->
  <circle cx="100" cy="115" r="22" fill="#6750A4"/>
  <text x="100" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- Arrow 1 -->
  <text x="200" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&#x2192;</text>

  <!-- Step 2 circle -->
  <circle cx="300" cy="115" r="22" fill="#6750A4"/>
  <text x="300" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Arrow 2 -->
  <text x="400" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&#x2192;</text>

  <!-- Step 3 circle -->
  <circle cx="500" cy="115" r="22" fill="#6750A4"/>
  <text x="500" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- Arrow 3 -->
  <text x="600" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&#x2192;</text>

  <!-- Step 4 circle -->
  <circle cx="700" cy="115" r="22" fill="#6750A4"/>
  <text x="700" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Step 1 label + subtext -->
  <text x="100" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">ダウンロード</text>
  <text x="100" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">lmstudio.ai</text>
  <text x="100" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">.exe / .dmg / .AppImage</text>

  <!-- Step 2 label + subtext -->
  <text x="300" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">インストール &amp; 起動</text>
  <text x="300" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">インストーラを実行</text>
  <text x="300" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">プロンプトを承認</text>

  <!-- Step 3 label + subtext -->
  <text x="500" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">モデルをDL</text>
  <text x="500" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Discoverタブ &gt; 検索</text>
  <text x="500" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Q4_K_M をDL (~3 GB)</text>

  <!-- Step 4 label + subtext -->
  <text x="700" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">チャット開始</text>
  <text x="700" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">ChatタブでモデルをSelect</text>
  <text x="700" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">最初のメッセージを入力</text>

  <!-- Bottom divider -->
  <line x1="18" y1="240" x2="782" y2="240" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="258" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">良好な回線で10分以内 · 最初のモデルはPhi-4 Miniを推奨</text>

  <!-- Attribution -->
  <text x="400" y="273" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com</text>
</svg>
