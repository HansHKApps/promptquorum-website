  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">All three 7B leaders run 15–16 tok/s; Phi 2.7B is faster at 20 tok/s but scores lower on reasoning and coding.</text>
