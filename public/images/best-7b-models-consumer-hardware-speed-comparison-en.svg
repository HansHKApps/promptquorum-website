  <text x="748" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">20 tok/s</text>

  <text x="250" y="136" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Mistral Small</text>
