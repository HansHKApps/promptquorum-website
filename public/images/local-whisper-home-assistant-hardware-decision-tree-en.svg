<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Which Whisper Model Fits Your Hardware?</text>

  <!-- Root node -->
  <rect x="290" y="42" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Do you have a GPU or NPU?</text>

  <!-- Branch lines from root -->
  <line x1="360" y1="78" x2="200" y2="132" stroke="#6750A4" stroke-width="2"/>
  <line x1="440" y1="78" x2="600" y2="132" stroke="#6750A4" stroke-width="2"/>
  <text x="235" y="93" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">NO GPU</text>
  <text x="560" y="93" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">HAS GPU</text>

  <!-- Level 2: No-GPU branch node -->
  <rect x="110" y="132" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <text x="200" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Which device runs it?</text>

  <!-- Level 2: Has-GPU branch node -->
  <rect x="510" y="132" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <text x="600" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Need max accuracy?</text>

  <!-- Left sub-branches -->
  <line x1="160" y1="168" x2="95" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="240" y1="168" x2="305" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <text x="65" y="203" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">RASPBERRY PI</text>
  <text x="278" y="203" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">MINI PC</text>

  <!-- Right sub-branches -->
  <line x1="560" y1="168" x2="495" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <line x1="640" y1="168" x2="705" y2="222" stroke="#6750A4" stroke-width="1.5"/>
  <text x="464" y="203" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">NO</text>
  <text x="685" y="203" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">YES, NOISY/ACCENTS</text>

  <!-- Leaves -->
  <rect x="30" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="95" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">tiny / base</text>
  <text x="95" y="261" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Raspberry Pi, short commands</text>

  <rect x="240" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="305" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">small</text>
  <text x="305" y="261" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Mini PC CPU, everyday use</text>

  <rect x="430" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <text x="495" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F4B400" text-anchor="middle">medium</text>
  <text x="495" y="261" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">GPU or strong CPU</text>

  <rect x="640" y="222" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="705" y="243" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">large</text>
  <text x="705" y="261" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">GPU, accents/noisy rooms</text>

  <line x1="60" y1="330" x2="740" y2="330" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="355" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">No GPU: match the box that hosts Whisper (Raspberry Pi vs. mini PC). With a GPU/NPU, medium and large become practical.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
