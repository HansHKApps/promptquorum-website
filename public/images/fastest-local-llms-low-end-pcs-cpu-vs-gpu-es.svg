<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">CPU vs iGPU vs GPU para LLMs locales</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Velocidades estimadas. Velocidad ≈ ancho de banda de memoria ÷ tamaño del modelo.</text>
  <rect x="18" y="58" width="365" height="272" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="18" y="58" width="365" height="5" fill="#6750A4"/>
  <rect x="417" y="58" width="365" height="272" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="417" y="58" width="365" height="5" fill="#34A853"/>
  <text x="200" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#6750A4" text-anchor="middle">Solo CPU / iGPU</text>
  <text x="200" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="middle">sin configuración — funciona en todas partes</text>
  <text x="38" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Modelos pequeños (3B–4B):</text>
  <text x="38" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">est. 10–25 tok/seg</text>
  <line x1="32" y1="158" x2="370" y2="158" stroke="#E8DEF8" stroke-width="1"/>
  <text x="38" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Modelos diminutos (1.7B):</text>
  <text x="38" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">est. 25–40 tok/seg</text>
  <text x="38" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">(depende del ancho de banda de la RAM + cuant.)</text>
  <line x1="32" y1="224" x2="370" y2="224" stroke="#E8DEF8" stroke-width="1"/>
  <text x="38" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6750A4">iGPU (Intel Iris, AMD Radeon):</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">Comparte la RAM del sistema: mejora modesta,</text>
  <text x="38" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">según controladores — usa ollama ps</text>
  <text x="600" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">GPU dedicada</text>
  <text x="600" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="middle">normalmente 5–10× más rápida que solo CPU</text>
  <text x="435" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Velocidad:</text>
  <text x="435" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">normalmente 5–10× la de solo CPU</text>
  <line x1="430" y1="158" x2="770" y2="158" stroke="#D4EDDA" stroke-width="1"/>
  <text x="435" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Configuración:</text>
  <text x="435" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Controlador de GPU (CUDA, ROCm o Vulkan)</text>
  <text x="435" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">(el modelo debe caber en la VRAM)</text>
  <line x1="430" y1="224" x2="770" y2="224" stroke="#D4EDDA" stroke-width="1"/>
  <text x="435" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#34A853">Ideal para:</text>
  <text x="435" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Chat interactivo</text>
  <text x="435" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Ayuda con código</text>
  <text x="435" y="305" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Modelos mayores (si caben en la VRAM)</text>
  <text x="400" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#79747E" text-anchor="middle">vs</text>
  <text x="400" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
