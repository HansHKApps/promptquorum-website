<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1000" height="350" fill="#FFFFFF"/>
  <text x="500" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">70B-Quantisierungs-Kompromisse auf M5 Max 128GB</text>

  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Quantisierung</text>
  <text x="270" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Größe</text>
  <text x="410" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">tok/s (M5 Max)</text>
  <text x="590" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Qualitätsverlust</text>
  <text x="820" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Passt 128GB?</text>
  <line x1="18" y1="72" x2="982" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="40" y="98" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Q4_K_M</text>
  <text x="270" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">42 GB</text>
  <text x="410" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">15–20</text>
  <text x="590" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">~3–5% vs FP16</text>
  <text x="820" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ Ja</text>
  <line x1="18" y1="108" x2="982" y2="108" stroke="#F7F2FA" stroke-width="1"/>

  <rect x="18" y="112" width="964" height="36" fill="#F7F2FA"/>
  <text x="40" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#6750A4">Q5_K_M ★</text>
  <text x="270" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">49 GB</text>
  <text x="410" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">12–16</text>
  <text x="590" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">~0,5–1% vs FP16</text>
  <text x="820" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ Ja</text>
  <line x1="18" y1="148" x2="982" y2="148" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="170" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Q8_0</text>
  <text x="270" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">74 GB</text>
  <text x="410" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">8–12</text>
  <text x="590" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">Verlustfrei</text>
  <text x="820" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ Ja</text>
  <line x1="18" y1="180" x2="982" y2="180" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="202" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">FP16</text>
  <text x="270" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">140 GB</text>
  <text x="410" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">14–18*</text>
  <text x="590" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">Keiner (volle Präzision)</text>
  <text x="820" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335">✗ Nein</text>
  <line x1="18" y1="212" x2="982" y2="212" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">★ Q5_K_M ist der empfohlene Kompromiss: 49 GB passen mit Puffer in 128GB, bei 12–16 tok/s und nahezu verlustfreier Qualität.</text>
  <text x="40" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">Der Q4-vs-Q8-Unterschied ist bei 70B größer als bei 8B-Modellen — relevant für komplexes Schlussfolgern und Code-Review.</text>
  <text x="40" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">* FP16 (140 GB) passt nicht in M5 Max 128GB — erfordert M5 Ultra 256GB (14–18 tok/s prognostiziert).</text>
<text x="992" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
