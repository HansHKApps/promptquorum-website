<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Choose RAG Architecture by Corpus Size
  </text>

  <!-- Start circle -->
  <circle cx="400" cy="70" r="20" fill="#6750A4"/>
  <text x="400" y="77" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Start</text>

  <!-- Arrow down -->
  <line x1="400" y1="90" x2="400" y2="120" stroke="#6750A4" stroke-width="2"/>

  <!-- First decision: Document count -->
  <rect x="320" y="120" width="160" height="50" rx="4" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="140" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Document</text>
  <text x="400" y="158" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Count?</text>

  <!-- Path 1: Under 1k docs -->
  <line x1="320" y1="165" x2="120" y2="220" stroke="#6750A4" stroke-width="2"/>
  <text x="200" y="190" font-size="11" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">&lt;1,000</text>

  <rect x="50" y="220" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="120" y="245" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">AnythingLLM</text>
  <text x="120" y="263" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Drag-and-drop</text>
  <text x="120" y="278" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">No code</text>

  <!-- Path 2: 1k-5k docs -->
  <line x1="400" y1="170" x2="400" y2="220" stroke="#6750A4" stroke-width="2"/>
  <text x="410" y="195" font-size="11" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">1k-5k</text>

  <rect x="330" y="220" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="400" y="245" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">LlamaIndex</text>
  <text x="400" y="263" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Hierarchical</text>
  <text x="400" y="278" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">~150 lines</text>

  <!-- Path 3: 5k-10k docs -->
  <line x1="480" y1="165" x2="600" y2="220" stroke="#6750A4" stroke-width="2"/>
  <text x="550" y="190" font-size="11" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">5k-10k</text>

  <rect x="530" y="220" width="140" height="70" rx="4" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <text x="600" y="245" font-size="12" font-weight="700" fill="#F4B400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">ChromaDB</text>
  <text x="600" y="263" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Hybrid +</text>
  <text x="600" y="278" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Rerank</text>

  <!-- Path 4: 10k+ docs -->
  <line x1="400" y1="170" x2="700" y2="220" stroke="#6750A4" stroke-width="2"/>
  <text x="560" y="195" font-size="11" font-weight="600" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">10k+</text>

  <rect x="650" y="220" width="120" height="70" rx="4" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <text x="710" y="245" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Qdrant</text>
  <text x="710" y="263" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Docker,</text>
  <text x="710" y="278" font-size="10" font-weight="600" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">Production</text>

  <!-- Scaling curve note -->
  <rect x="50" y="320" width="700" height="50" fill="#F7F2FA" rx="4" stroke="#E8DEF8" stroke-width="1"/>
  <text x="70" y="340" font-size="11" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Rule of thumb:</text>
  <text x="70" y="360" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Start one tier above your current size if you expect growth. If you have 800 PDFs now and expect to reach 2,000, start at the LlamaIndex tier. Re-architecting later is harder than over-engineering today.</text>
</svg>