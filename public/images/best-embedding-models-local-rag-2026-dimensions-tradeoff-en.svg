<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Dimension Tradeoff: Storage vs Retrieval Quality (50K-page corpus)
  </text>

  <!-- Storage size section -->
  <text x="50" y="65" font-size="13" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Storage on Disk</text>
  <line x1="50" y1="72" x2="250" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- 768 dims -->
  <text x="50" y="105" font-size="11" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">768 dims</text>
  <rect x="130" y="95" width="50" height="16" fill="#6750A4"/>
  <text x="190" y="105" font-size="11" font-weight="700" fill="#6750A4" font-family="'SF Mono', Monaco, monospace">0.9 GB</text>

  <!-- 1024 dims -->
  <text x="50" y="145" font-size="11" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,024 dims</text>
  <rect x="130" y="135" width="65" height="16" fill="#6750A4"/>
  <text x="210" y="145" font-size="11" font-weight="700" fill="#6750A4" font-family="'SF Mono', Monaco, monospace">1.2 GB (+33%)</text>

  <!-- 1536 dims -->
  <text x="50" y="185" font-size="11" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,536 dims</text>
  <rect x="130" y="175" width="97" height="16" fill="#6750A4"/>
  <text x="245" y="185" font-size="11" font-weight="700" fill="#6750A4" font-family="'SF Mono', Monaco, monospace">1.8 GB (+100%)</text>

  <!-- 3072 dims -->
  <text x="50" y="225" font-size="11" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">3,072 dims</text>
  <rect x="130" y="215" width="195" height="16" fill="#6750A4" opacity="0.6"/>
  <text x="345" y="225" font-size="11" font-weight="700" fill="#6750A4" font-family="'SF Mono', Monaco, monospace">3.6 GB (+300%)</text>

  <!-- Retrieval quality section -->
  <text x="420" y="65" font-size="13" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Retrieval@10 Quality</text>
  <line x1="420" y1="72" x2="750" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- 768 dims -->
  <circle cx="680" cy="99" r="12" fill="#34A853"/>
  <text x="680" y="105" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">88%</text>

  <!-- 1024 dims -->
  <circle cx="700" cy="139" r="12" fill="#34A853"/>
  <text x="700" y="145" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">92%</text>

  <!-- 1536 dims -->
  <circle cx="702" cy="179" r="12" fill="#34A853"/>
  <text x="702" y="185" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">93%</text>

  <!-- 3072 dims -->
  <circle cx="703" cy="219" r="12" fill="#34A853"/>
  <text x="703" y="225" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">93%</text>

  <!-- Insight box -->
  <rect x="50" y="270" width="700" height="70" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1" rx="4"/>
  <text x="70" y="295" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Key Insight: Dimension Plateau</text>
  <text x="70" y="315" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Gains flatten after 1,024 dims: jumping from 1,024 to 3,072 dims adds <0.5% retrieval but triples storage cost.</text>
  <text x="70" y="333" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Matryoshka trick: Embed at 1,024 dims, truncate to 512 or 256 dims for storage (~1% retrieval loss, 50% storage savings).</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>