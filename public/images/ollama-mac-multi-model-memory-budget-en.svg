<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Multi-Model Memory Budget on a 36 GB Mac</text>
  <text x="400" y="54" font-family="system-ui, sans-serif" font-size="12.5" fill="#79747E" text-anchor="middle">Whisper STT + Llama 3.3 8B + LLaVA 7B Vision, all loaded simultaneously</text>

  <!-- Stacked bar -->
  <rect x="80" y="100" width="640" height="50" rx="4" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="80" y="100" width="142" height="50" fill="#6750A4"/>
  <rect x="222" y="100" width="124" height="50" fill="#7D5260"/>
  <rect x="346" y="100" width="71" height="50" fill="#F4B400"/>

  <text x="151" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">8 GB</text>
  <text x="284" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7 GB</text>
  <text x="381" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">4 GB</text>
  <text x="568" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#49454F" text-anchor="middle">17 GB free</text>

