  <text x="442" y="246" font-family="system-ui, sans-serif" font-size="12.5" fill="#1C1B1F">Free headroom (17 GB)</text>

  <line x1="60" y1="270" x2="740" y2="270" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="300" font-family="'SF Mono', Monaco, monospace" font-size="11.5" fill="#49454F" text-anchor="middle">export OLLAMA_MAX_LOADED_MODELS=3</text>
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="12.5" fill="#1C1B1F" text-anchor="middle">Total used: 19 GB — comfortable margin on 36 GB+ unified memory Macs.</text>
