  <text x="720" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">36 GB total</text>

  <line x1="60" y1="185" x2="740" y2="185" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Legend row 1 -->
  <rect x="80" y="205" width="14" height="14" fill="#6750A4"/>
