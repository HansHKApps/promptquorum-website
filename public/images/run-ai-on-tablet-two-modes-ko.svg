<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">두 가지 방식: 온디바이스 vs 원격 연결</text>

  <!-- Left: On-Device (amber) -->
  <rect x="18" y="42" width="372" height="292" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="18" y="42" width="372" height="4" fill="#F4B400"/>
  <text x="204" y="68" font-size="15" font-weight="700" fill="#F4B400" text-anchor="middle">온디바이스</text>

  <text x="34" y="94" font-size="11" font-weight="700" fill="#79747E">모델 크기 한도</text>
  <text x="34" y="109" font-size="12" fill="#1C1B1F">최대 3B–8B (iPad Pro M5)</text>
  <line x1="18" y1="118" x2="390" y2="118" stroke="#F7F2FA" stroke-width="1"/>

  <text x="34" y="136" font-size="11" font-weight="700" fill="#79747E">오프라인 사용</text>
  <circle cx="360" cy="133" r="11" fill="#34A853"/>
  <text x="360" y="137" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <line x1="18" y1="150" x2="390" y2="150" stroke="#F7F2FA" stroke-width="1"/>

  <text x="34" y="168" font-size="11" font-weight="700" fill="#79747E">생성 속도</text>
  <text x="34" y="183" font-size="12" fill="#1C1B1F">12–30 tok/초 (iPad Pro M5)</text>
  <line x1="18" y1="192" x2="390" y2="192" stroke="#F7F2FA" stroke-width="1"/>

  <text x="34" y="210" font-size="11" font-weight="700" fill="#79747E">태블릿 저장 공간</text>
  <text x="34" y="225" font-size="12" fill="#1C1B1F">모델당 2–10 GB</text>
  <line x1="18" y1="234" x2="390" y2="234" stroke="#F7F2FA" stroke-width="1"/>

  <text x="34" y="252" font-size="11" font-weight="700" fill="#79747E">적합한 용도</text>
  <text x="34" y="267" font-size="12" fill="#1C1B1F">출장·이동, 오프라인, 3B 작업</text>
  <line x1="18" y1="276" x2="390" y2="276" stroke="#F7F2FA" stroke-width="1"/>

  <text x="34" y="294" font-size="11" font-weight="700" fill="#79747E">설정</text>
  <text x="34" y="309" font-size="12" fill="#1C1B1F">앱 + 모델 파일 다운로드</text>

  <!-- Right: Remote Connection (green) -->
  <rect x="410" y="42" width="372" height="292" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="410" y="42" width="372" height="4" fill="#34A853"/>
  <text x="596" y="68" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">원격 연결 ★ 권장</text>

  <text x="426" y="94" font-size="11" font-weight="700" fill="#79747E">모델 크기 한도</text>
  <text x="426" y="109" font-size="12" fill="#1C1B1F">제한 없음 — 홈 머신에서 모두 실행</text>
  <line x1="410" y1="118" x2="782" y2="118" stroke="#F7F2FA" stroke-width="1"/>

  <text x="426" y="136" font-size="11" font-weight="700" fill="#79747E">오프라인 사용</text>
  <circle cx="752" cy="133" r="11" fill="#EA4335"/>
  <text x="752" y="137" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text>
  <line x1="410" y1="150" x2="782" y2="150" stroke="#F7F2FA" stroke-width="1"/>

  <text x="426" y="168" font-size="11" font-weight="700" fill="#79747E">생성 속도</text>
  <text x="426" y="183" font-size="12" fill="#1C1B1F">20–40+ tok/초 (홈 머신)</text>
  <line x1="410" y1="192" x2="782" y2="192" stroke="#F7F2FA" stroke-width="1"/>

  <text x="426" y="210" font-size="11" font-weight="700" fill="#79747E">태블릿 저장 공간</text>
  <text x="426" y="225" font-size="12" fill="#34A853">없음 — 모델은 홈 머신에</text>
  <line x1="410" y1="234" x2="782" y2="234" stroke="#F7F2FA" stroke-width="1"/>

  <text x="426" y="252" font-size="11" font-weight="700" fill="#79747E">적합한 용도</text>
  <text x="426" y="267" font-size="12" fill="#1C1B1F">품질 우선, 70B 모델</text>
  <line x1="410" y1="276" x2="782" y2="276" stroke="#F7F2FA" stroke-width="1"/>

  <text x="426" y="294" font-size="11" font-weight="700" fill="#79747E">설정</text>
  <text x="426" y="309" font-size="12" fill="#1C1B1F">홈 머신: Ollama + Open WebUI</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
