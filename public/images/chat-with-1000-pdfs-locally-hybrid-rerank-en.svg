<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Hybrid Search + Reranking: The Scaling Pipeline
  </text>

  <!-- Step 1: Parallel Retrieval -->
  <circle cx="80" cy="100" r="20" fill="#6750A4"/>
  <text x="80" y="107" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1</text>
  <text x="80" y="140" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Parallel</text>
  <text x="80" y="158" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Retrieval</text>

  <!-- BM25 box -->
  <rect x="40" y="170" width="80" height="50" fill="#FFFFFF" stroke="#6750A4" stroke-width="2" rx="3"/>
  <text x="80" y="190" font-size="10" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">BM25</text>
  <text x="80" y="210" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">top-25</text>

  <!-- Vector box -->
  <rect x="120" y="170" width="80" height="50" fill="#FFFFFF" stroke="#34A853" stroke-width="2" rx="3"/>
  <text x="160" y="190" font-size="10" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Dense Vector</text>
  <text x="160" y="210" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">top-25</text>

  <!-- Arrow to Step 2 -->
  <line x1="120" y1="230" x2="200" y2="260" stroke="#6750A4" stroke-width="2"/>
  <text x="160" y="250" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 2: Merge via RRF -->
  <circle cx="280" cy="100" r="20" fill="#6750A4"/>
  <text x="280" y="107" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">2</text>
  <text x="280" y="140" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Merge via</text>
  <text x="280" y="158" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">RRF</text>

  <!-- RRF Formula -->
  <rect x="220" y="170" width="120" height="50" fill="#F7F2FA" stroke="#6750A4" stroke-width="1" rx="3"/>
  <text x="280" y="188" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">score = 1/(60+rank_bm25)</text>
  <text x="280" y="203" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">+ 1/(60+rank_dense)</text>
  <text x="280" y="218" font-size="9" font-weight="600" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">top-50 merged</text>

  <!-- Arrow to Step 3 -->
  <line x1="340" y1="225" x2="400" y2="260" stroke="#6750A4" stroke-width="2"/>
  <text x="370" y="250" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 3: Reranking -->
  <circle cx="480" cy="100" r="20" fill="#6750A4"/>
  <text x="480" y="107" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">3</text>
  <text x="480" y="140" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Reranking</text>
  <text x="480" y="158" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Pass</text>

  <!-- Reranker box -->
  <rect x="420" y="170" width="120" height="50" fill="#FFFFFF" stroke="#F4B400" stroke-width="2" rx="3"/>
  <text x="480" y="188" font-size="10" font-weight="700" fill="#F4B400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">BGE-reranker-v2-m3</text>
  <text x="480" y="208" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">top-50 → top-8</text>

  <!-- Arrow to Step 4 -->
  <line x1="540" y1="225" x2="600" y2="260" stroke="#6750A4" stroke-width="2"/>
  <text x="570" y="250" font-size="20" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→</text>

  <!-- Step 4: LLM -->
  <circle cx="680" cy="100" r="20" fill="#6750A4"/>
  <text x="680" y="107" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4</text>
  <text x="680" y="140" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">LLM +</text>
  <text x="680" y="158" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Generate</text>

  <!-- LLM box -->
  <rect x="620" y="170" width="120" height="50" fill="#FFFFFF" stroke="#34A853" stroke-width="2" rx="3"/>
  <text x="680" y="190" font-size="10" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Llama 3.3 8B</text>
  <text x="680" y="208" font-size="9" fill="#49454F" text-anchor="middle" font-family="'SF Mono', Monaco, monospace">top-8 context</text>

  <!-- Impact metrics -->
  <rect x="50" y="280" width="700" height="80" fill="#F7F2FA" rx="4" stroke="#E8DEF8" stroke-width="1"/>
  <text x="70" y="305" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Pipeline Impact at 10,000 documents:</text>
  <text x="70" y="325" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• Without hybrid: retrieval drops to 65-70% recall, query latency ~1-3s. • With hybrid only: recall jumps to 85-90%, latency ~600ms.</text>
  <text x="70" y="345" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">• With hybrid + reranking: 92-95% recall, latency ~500-700ms (reranker adds 200-500ms CPU cost, worth every ms). "Wrong chunk" failures drop from 15-25% to <5%.</text>
</svg>