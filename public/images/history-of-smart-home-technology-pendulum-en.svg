<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">The Smart Home Pendulum: Local → Cloud → Local</text>

  <line x1="60" y1="300" x2="740" y2="300" stroke="#F7F2FA" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="66" y="318" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#79747E">local-control baseline</text>

  <path d="M140,284 Q270,90 400,150" fill="none" stroke="#6750A4" stroke-width="3"/>
  <path d="M400,150 Q530,90 660,284" fill="none" stroke="#F4B400" stroke-width="3"/>

  <line x1="400" y1="150" x2="400" y2="300" stroke="#79747E" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="410" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#79747E">cloud dependency</text>

  <!-- Station 1: Local 1975-2010 -->
  <circle cx="140" cy="284" r="26" fill="#6750A4"/>
  <text x="140" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1975</text>
  <text x="140" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local</text>
  <text x="140" y="363" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">X10, Z-Wave</text>

  <!-- Station 2: Cloud 2011-2021 -->
  <circle cx="400" cy="150" r="26" fill="#F4B400"/>
  <text x="400" y="156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2011</text>
  <text x="400" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud</text>
  <text x="400" y="120" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Nest, Echo</text>

  <!-- Station 3: Local AI 2026+ -->
  <circle cx="660" cy="284" r="26" fill="#34A853"/>
  <text x="660" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2026</text>
  <text x="660" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local AI</text>
  <text x="660" y="363" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Matter + LLMs</text>

  <text x="400" y="392" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">50-year arc: local control (1975–2010), a decade of cloud lock-in (2011–2021), back to on-device AI (2026).</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
