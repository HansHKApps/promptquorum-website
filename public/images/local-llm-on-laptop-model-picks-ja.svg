  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Llama 3.2 3Bは8GBノートPCで25〜45 tok/s動作します。Llama 3.3 8Bは16GB必要ですが、このサイズで最高品質を提供します。</text>
