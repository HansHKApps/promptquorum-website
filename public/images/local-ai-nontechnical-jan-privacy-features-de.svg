  <text x="199" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">Cloud-KI — Daten verlassen das Gerät</text>
  <text x="44" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Eingaben an externe Server gesendet</text>
  <text x="44" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Analytics-SDK verfolgt Nutzung</text>
  <text x="44" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Proprietär — nicht überprüfbar</text>
  <text x="44" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Internet für die Nutzung erforderlich</text>
  <text x="44" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Abo-Kosten im Laufe der Zeit</text>
  <text x="44" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Opt-out für Training erforderlich</text>
  <!-- Right panel: Jan -->
  <rect x="424" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="424" y="62" width="354" height="4" rx="0" fill="#34A853"/>
  <text x="601" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">Jan — Alles bleibt lokal</text>
  <text x="446" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Null Telemetrie — nichts wird gesendet</text>
  <text x="446" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Kein Analytics-SDK</text>
  <text x="446" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  AGPL-Quellcode — Binary überprüfbar</text>
