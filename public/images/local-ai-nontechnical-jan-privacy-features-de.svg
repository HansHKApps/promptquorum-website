  <rect width="800" height="295" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Jan — Datenschutz-Features auf einen Blick</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">AGPL Open Source · Null Telemetrie · Überprüfbares Binary</text>
  <!-- Left panel: Cloud AI -->
  <rect x="22" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
