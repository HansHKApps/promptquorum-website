<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama GGUF Quantization: VRAM by Level (7B Model)</text>
  <line x1="260" y1="335" x2="740" y2="335" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="79" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">FP16 (full)</text>
  <rect x="260" y="60" width="480" height="24" fill="#EA4335" rx="4"/>
  <text x="748" y="77" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">16 GB</text>

  <text x="250" y="121" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q8_0 (8-bit)</text>
  <rect x="260" y="102" width="240" height="24" fill="#F4B400" rx="4"/>
  <text x="508" y="119" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8 GB</text>

  <text x="250" y="163" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q6_K (6-bit)</text>
  <rect x="260" y="144" width="180" height="24" fill="#7D5260" rx="4"/>
  <text x="448" y="161" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">6 GB</text>

  <text x="250" y="205" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q5_K_M (5-bit)</text>
  <rect x="260" y="186" width="165" height="24" fill="#1C1B1F" rx="4"/>
  <text x="433" y="203" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">5.5 GB</text>

  <text x="250" y="247" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q4_K_M (4-bit)</text>
  <rect x="260" y="228" width="150" height="24" fill="#6750A4" rx="4"/>
  <text x="418" y="245" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">5 GB — recommended default</text>

  <text x="250" y="289" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Q3_K_M (3-bit)</text>
  <rect x="260" y="270" width="120" height="24" fill="#34A853" rx="4"/>
  <text x="388" y="287" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">4 GB</text>

  <text x="400" y="368" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Q4_K_M needs 5 GB VRAM vs 16 GB for FP16 full precision on a 7B model, with only a small quality drop — the default for most consumer GPUs.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
