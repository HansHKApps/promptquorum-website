<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="340" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">RAGクエリタイプ — 正常な回答のパターン</text>
  <rect x="0" y="38" width="800" height="36" fill="#6750A4"/>
  <text x="80" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">クエリタイプ</text>
  <text x="240" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">例のクエリ</text>
  <text x="490" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">正常な回答パターン</text>
  <text x="710" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">失敗シグナル</text>
  <line x1="160" y1="38" x2="160" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="320" y1="38" x2="320" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="630" y1="38" x2="630" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <rect x="0" y="74" width="800" height="58" fill="#FFFFFF"/>
  <circle cx="30" cy="103" r="10" fill="#34A853"/>
  <text x="80" y="97" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">事実確認</text>
  <text x="80" y="113" font-size="10" fill="#49454F" text-anchor="middle">根拠テスト</text>
  <text x="240" y="97" font-size="11" fill="#49454F" text-anchor="middle">"Smith 2024は</text>
  <text x="240" y="112" font-size="11" fill="#49454F" text-anchor="middle">何名のサンプルを使用?"</text>
  <text x="490" y="97" font-size="11" fill="#34A853" text-anchor="middle">原文からの直接引用</text>
  <text x="490" y="112" font-size="11" fill="#34A853" text-anchor="middle">+ チャンクの出典</text>
  <text x="710" y="97" font-size="11" fill="#EA4335" text-anchor="middle">一般的な回答、</text>
  <text x="710" y="112" font-size="11" fill="#EA4335" text-anchor="middle">引用も出典もなし</text>
  <rect x="0" y="132" width="800" height="58" fill="#F7F2FA"/>
  <circle cx="30" cy="161" r="10" fill="#6750A4"/>
  <text x="80" y="155" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">合成</text>
  <text x="80" y="171" font-size="10" fill="#49454F" text-anchor="middle">統合テスト</text>
  <text x="240" y="155" font-size="11" fill="#49454F" text-anchor="middle">"この論文の主な</text>
  <text x="240" y="170" font-size="11" fill="#49454F" text-anchor="middle">貢献を要約して。"</text>
  <text x="490" y="155" font-size="11" fill="#34A853" text-anchor="middle">概要と結論チャンクから</text>
  <text x="490" y="170" font-size="11" fill="#34A853" text-anchor="middle">3–5文の合成</text>
  <text x="710" y="155" font-size="11" fill="#EA4335" text-anchor="middle">タイトルの言い換えや</text>
  <text x="710" y="170" font-size="11" fill="#EA4335" text-anchor="middle">一行の引用のみ</text>
  <rect x="0" y="190" width="800" height="64" fill="#FFFFFF"/>
  <circle cx="30" cy="222" r="10" fill="#F4B400"/>
  <text x="80" y="216" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">文書横断</text>
  <text x="80" y="232" font-size="10" fill="#49454F" text-anchor="middle">検索テスト</text>
  <text x="240" y="213" font-size="11" fill="#49454F" text-anchor="middle">"SmithとJonesは</text>
  <text x="240" y="228" font-size="11" fill="#49454F" text-anchor="middle">チャンクオーバーラップで</text>
  <text x="240" y="243" font-size="11" fill="#49454F" text-anchor="middle">どう異なる?"</text>
  <text x="490" y="216" font-size="11" fill="#34A853" text-anchor="middle">両論文からの引用</text>
  <text x="490" y="231" font-size="11" fill="#34A853" text-anchor="middle">+ 明示的な出典</text>
  <text x="710" y="213" font-size="11" fill="#EA4335" text-anchor="middle">一方の論文のみ引用</text>
  <text x="710" y="228" font-size="11" fill="#EA4335" text-anchor="middle">または相違点を捏造</text>
  <rect x="0" y="38" width="800" height="216" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>
  <line x1="0" y1="132" x2="800" y2="132" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="0" y1="190" x2="800" y2="190" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="18" y1="272" x2="782" y2="272" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="292" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">緑=正常 · 赤=検索障害(チャンクサイズまたはエンベダーを修正、回答モデルではない)</text>
  <text x="400" y="310" font-size="11" fill="#79747E" text-anchor="middle">設定変更後は3種すべてをテスト — 失敗パターンが調整すべきパラメータを示す</text>
  <text x="792" y="334" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>
