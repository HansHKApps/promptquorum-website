<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">自托管 DeepSeek，还是避免使用托管 API？</text>

  <rect x="230" y="48" width="340" height="46" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="400" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">该提示是否包含欧盟个人数据</text>
  <text x="400" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">或受 GDPR 监管的数据？</text>

  <line x1="290" y1="94" x2="150" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="200" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">否</text>

  <line x1="510" y1="94" x2="640" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="565" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">是</text>

  <rect x="20" y="155" width="255" height="72" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="20" y="155" width="255" height="4" fill="#34A853"/>
  <text x="147" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">托管或自托管</text>
  <text x="147" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">均可行</text>
  <text x="147" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">无跨境传输风险 —</text>
  <text x="147" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">请单独权衡模型权重方面的顾虑。</text>

  <rect x="490" y="155" width="290" height="52" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="635" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">能否在您可控的基础设施上</text>
  <text x="635" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">自托管开放权重？</text>

  <line x1="560" y1="207" x2="440" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="475" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">是</text>

  <line x1="710" y1="207" x2="690" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="705" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">否</text>

  <rect x="310" y="280" width="260" height="74" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="310" y="280" width="260" height="4" fill="#34A853"/>
  <text x="440" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">自托管开放权重</text>
  <text x="440" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">数据不会流向中国 —</text>
  <text x="440" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">可通过流量监控验证。</text>

  <rect x="590" y="280" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="590" y="280" width="200" height="4" fill="#EA4335"/>
  <text x="690" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">避免使用托管的</text>
  <text x="690" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">DeepSeek API</text>
  <text x="690" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">数据会发送至中国；</text>
  <text x="690" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">请改用其他模型。</text>

  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">自托管开放权重从设计上在数据流环节就解决了 GDPR 跨境传输问题。</text>
<text x="792" y="475" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
