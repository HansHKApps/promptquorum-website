<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Comparaci&#xf3;n de apps de LLM local para iPhone</text>

  <!-- Column headers -->
  <text x="22" y="56" font-size="12" font-weight="700" fill="#79747E">APP</text>
  <text x="195" y="56" font-size="12" font-weight="700" fill="#79747E">COSTE</text>
  <text x="320" y="56" font-size="12" font-weight="700" fill="#79747E">VELOCIDAD (16 PRO)</text>
  <text x="510" y="56" font-size="12" font-weight="700" fill="#79747E">PRIVACIDAD</text>
  <text x="660" y="56" font-size="12" font-weight="700" fill="#79747E">IDEAL PARA</text>

  <!-- Header divider -->
  <line x1="18" y1="64" x2="782" y2="64" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: PocketPal AI -->
  <text x="22" y="88" font-size="12" font-weight="600" fill="#1C1B1F">PocketPal AI</text>
  <text x="195" y="88" font-size="12" fill="#49454F">Gratis</text>
  <!-- Speed badge: amber -->
  <circle cx="390" cy="84" r="14" fill="#F4B400"/>
  <text x="390" y="88" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">~13</text>
  <text x="413" y="88" font-size="11" fill="#49454F">tok/s</text>
  <text x="510" y="88" font-size="12" fill="#49454F">Solo local</text>
  <text x="660" y="88" font-size="12" fill="#49454F">Opci&#xf3;n gratuita</text>
  <line x1="18" y1="98" x2="782" y2="98" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Private LLM -->
  <text x="22" y="122" font-size="12" font-weight="600" fill="#1C1B1F">Private LLM</text>
  <text x="195" y="122" font-size="12" fill="#49454F">~10&#x20ac; pago &#xfa;nico</text>
  <!-- Speed badge: amber -->
  <circle cx="390" cy="118" r="14" fill="#F4B400"/>
  <text x="390" y="122" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">~12</text>
  <text x="413" y="122" font-size="11" fill="#49454F">tok/s</text>
  <text x="510" y="122" font-size="12" fill="#49454F">Solo local</text>
  <text x="660" y="122" font-size="12" fill="#49454F">Atajos + Siri</text>
  <line x1="18" y1="132" x2="782" y2="132" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: MLC Chat -->
  <text x="22" y="156" font-size="12" font-weight="600" fill="#1C1B1F">MLC Chat</text>
  <text x="195" y="156" font-size="12" fill="#49454F">Gratis</text>
  <!-- Speed badge: green (fastest) -->
  <circle cx="390" cy="152" r="14" fill="#34A853"/>
  <text x="390" y="156" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">~17</text>
  <text x="413" y="156" font-size="11" fill="#49454F">tok/s</text>
  <text x="510" y="156" font-size="12" fill="#49454F">Solo local</text>
  <text x="660" y="156" font-size="12" fill="#49454F">M&#xe1;s r&#xe1;pida en el chip</text>
  <line x1="18" y1="166" x2="782" y2="166" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: LLM Farm -->
  <text x="22" y="190" font-size="12" font-weight="600" fill="#1C1B1F">LLM Farm</text>
  <text x="195" y="190" font-size="12" fill="#49454F">Gratis</text>
  <!-- Speed badge: amber -->
  <circle cx="390" cy="186" r="14" fill="#F4B400"/>
  <text x="390" y="190" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">~13</text>
  <text x="413" y="190" font-size="11" fill="#49454F">tok/s</text>
  <text x="510" y="190" font-size="12" fill="#49454F">Solo local</text>
  <text x="660" y="190" font-size="12" fill="#49454F">Usuarios avanzados</text>
  <line x1="18" y1="200" x2="782" y2="200" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: Apple Intelligence -->
  <text x="22" y="224" font-size="12" font-weight="600" fill="#1C1B1F">Apple Intelligence</text>
  <text x="195" y="224" font-size="12" fill="#49454F">Gratis (iOS 18+)</text>
  <text x="370" y="224" font-size="12" fill="#79747E">N/D (sistema)</text>
  <text x="510" y="224" font-size="12" fill="#49454F">Local + PCC</text>
  <text x="660" y="224" font-size="12" fill="#49454F">Mail/Mensajes</text>
  <line x1="18" y1="234" x2="782" y2="234" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Footer note -->
  <text x="400" y="265" font-size="11" fill="#79747E" text-anchor="middle">Velocidad medida en iPhone 16 Pro con Phi-4 Mini Q4_K_M. MLC Chat usa aceleraci&#xf3;n por GPU Metal.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
