<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">你的笔记本内存能运行哪个模型？</text>

  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">你的笔记本</text>
  <text x="260" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">最佳模型</text>
  <text x="500" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">CPU速度</text>
  <text x="640" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Apple Silicon</text>
  <line x1="18" y1="74" x2="782" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="40" y="106" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">8 GB RAM</text>
  <text x="260" y="106" font-size="12" fill="#49454F">Llama 3.2 3B / Mistral 7B Q4</text>
  <text x="500" y="106" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">10–25 tok/s</text>
  <text x="640" y="106" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">30–80 tok/s</text>
  <line x1="18" y1="120" x2="782" y2="120" stroke="#F7F2FA" stroke-width="1"/>

  <rect x="18" y="136" width="764" height="46" fill="#F7F2FA" rx="4"/>
  <text x="40" y="156" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4">16 GB RAM &#9733;</text>
  <text x="260" y="156" font-size="12" fill="#1C1B1F">Llama 3.1 8B / Qwen2.5 14B Q4</text>
  <text x="500" y="156" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8–18 tok/s</text>
  <text x="640" y="156" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">50–80 tok/s</text>

  <text x="40" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Apple M-series (8–18 GB)</text>
  <text x="260" y="200" font-size="12" fill="#49454F">统一内存下最高支持13B</text>
  <text x="500" y="200" font-size="12" fill="#79747E">—</text>
  <text x="640" y="200" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">50–80 tok/s</text>
  <line x1="18" y1="214" x2="782" y2="214" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="246" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Intel Iris Xe / AMD iGPU</text>
  <text x="260" y="246" font-size="12" fill="#49454F">3B–7B（仅CPU）</text>
  <text x="500" y="246" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">8–20 tok/s</text>
  <text x="640" y="246" font-size="12" fill="#79747E">n/a</text>

  <text x="400" y="308" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">8GB内存是实用下限 — Q4_K_M量化的7B模型可在2018年后制造的任何笔记本上运行。</text>
<text x="792" y="375" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
