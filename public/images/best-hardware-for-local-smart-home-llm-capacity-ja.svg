<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">ハードウェア構成別 ローカルLLM容量</text>
  <line x1="240" y1="330" x2="760" y2="330" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="230" y="94" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Raspberry Pi 5</text>
  <rect x="240" y="75" width="57" height="24" fill="#EA4335" rx="4"/>
  <text x="305" y="92" font-family="'SF Mono', Monaco, monospace" font-size="11.5" font-weight="700" fill="#1C1B1F">~1B, very small &amp; slow</text>

  <text x="230" y="150" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Intel N100/N150ミニPC</text>
  <rect x="240" y="131" width="99" height="24" fill="#F4B400" rx="4"/>
  <text x="347" y="148" font-family="'SF Mono', Monaco, monospace" font-size="11.5" font-weight="700" fill="#1C1B1F">小型モデル（約3B）</text>

  <text x="230" y="206" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">NAS</text>
  <rect x="240" y="187" width="130" height="24" fill="none" stroke="#79747E" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="378" y="204" font-family="'SF Mono', Monaco, monospace" font-size="11.5" font-weight="700" fill="#49454F">搭載GPUに依存</text>

  <text x="230" y="262" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Ryzenミニ PC（32GB RAM）</text>
  <rect x="240" y="243" width="162" height="24" fill="#6750A4" rx="4"/>
  <text x="410" y="260" font-family="'SF Mono', Monaco, monospace" font-size="11.5" font-weight="700" fill="#1C1B1F">7B〜8Bモデル</text>

  <text x="230" y="318" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">サーバー + RTX 3090（24GB）</text>
  <rect x="240" y="299" width="480" height="24" fill="#34A853" rx="4"/>
  <text x="608" y="316" font-family="'SF Mono', Monaco, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">Q4で最大約70B——コストパフォーマンス最良</text>

  <text x="400" y="358" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">容量はVRAMに比例します。Raspberry Pi 5は極小モデルのみ実行可能で、中古のRTX 3090</text>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">（24GB VRAM）はQ4量子化で最大約70Bのモデルまで扱えます——NASの容量は搭載GPU次第です。</text>
<text x="792" y="392" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
