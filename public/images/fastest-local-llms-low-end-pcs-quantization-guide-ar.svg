<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">دليل التكميم: الحجم والسرعة والجودة</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Q4_K_M هو الخيار القياسي. انتقل إلى Q3/Q2 فقط إذا لم يتسع النموذج في الذاكرة.</text>
  <text x="762" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="end">المستوى</text>
  <text x="670" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="end">الحجم مقابل Q4_K_M</text>
  <text x="510" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="end">السرعة</text>
  <text x="380" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="end">الجودة</text>
  <text x="230" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="end">الحكم</text>
  <line x1="18" y1="80" x2="782" y2="80" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="762" y="106" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="end">Q8</text>
  <text x="670" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">≈ ضعف الحجم</text>
  <text x="510" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">أبطأ</text>
  <text x="380" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#34A853" text-anchor="end">شبه بلا فقد</text>
  <text x="230" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="end">نادرًا ما يستحق</text>
  <line x1="18" y1="116" x2="782" y2="116" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="121" width="764" height="38" fill="#F7F2FA" rx="2"/>
  <text x="762" y="144" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#6750A4" text-anchor="end">Q4_K_M ★</text>
  <text x="670" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">الأساس</text>
  <text x="510" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">الأساس</text>
  <text x="380" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#34A853" text-anchor="end">توازن جيد</text>
  <text x="230" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6750A4" text-anchor="end">موصى به ★</text>
