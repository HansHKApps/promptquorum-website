  <text x="670" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">أصغر</text>
  <text x="510" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">أسرع</text>
  <text x="380" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#B07D00" text-anchor="end">فقد أكبر</text>
  <text x="230" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00" text-anchor="end">فقط إذا لم يتسع Q4_K_M</text>
  <line x1="18" y1="195" x2="782" y2="195" stroke="#F7F2FA" stroke-width="1"/>
  <text x="762" y="221" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="end">Q2</text>
  <text x="670" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">الأصغر</text>
  <text x="510" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F" text-anchor="end">الأسرع</text>
  <text x="380" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#EA4335" text-anchor="end">أسوأ بوضوح</text>
  <text x="230" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335" text-anchor="end">الملاذ الأخير</text>
  <line x1="18" y1="231" x2="782" y2="231" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="245" width="764" height="60" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1"/>
  <text x="762" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="end">القاعدة: اختر حجم النموذج أولًا ثم Q4_K_M.</text>
  <text x="762" y="287" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="end">النموذج الصغير بصيغة Q4_K_M يتفوق عادةً على نموذج أكبر مضغوط إلى Q2.</text>
  <text x="762" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="end">ملف أصغر = أسرع على المعالج تقريبًا بالتناسب (السرعة ≈ عرض نطاق الذاكرة ÷ حجم الملف).</text>
  <text x="400" y="338" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
