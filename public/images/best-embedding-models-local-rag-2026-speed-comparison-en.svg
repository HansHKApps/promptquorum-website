<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    CPU vs GPU Embedding Speed (Chunks/sec)
  </text>

  <!-- Legend -->
  <text x="100" y="55" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">CPU (Apple M3 Pro)</text>
  <circle cx="60" cy="49" r="5" fill="#6750A4"/>

  <text x="350" y="55" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">GPU (RTX 4070)</text>
  <circle cx="310" cy="49" r="5" fill="#34A853"/>

  <!-- Model labels and bars -->
  <!-- nomic-embed-text-v2 -->
  <text x="80" y="90" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">nomic-v2</text>
  <!-- CPU bar (580) -->
  <rect x="120" y="78" width="40" height="12" fill="#6750A4"/>
  <text x="165" y="87" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">580</text>
  <!-- GPU bar (4800) -->
  <rect x="250" y="78" width="65" height="12" fill="#34A853"/>
  <text x="320" y="87" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">4,800</text>

  <!-- jina-embeddings-v3 -->
  <text x="80" y="125" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">jina-v3</text>
  <!-- CPU bar (220) -->
  <rect x="120" y="113" width="15" height="12" fill="#6750A4"/>
  <text x="165" y="122" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">220</text>
  <!-- GPU bar (3200) -->
  <rect x="250" y="113" width="43" height="12" fill="#34A853"/>
  <text x="320" y="122" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">3,200</text>

  <!-- snowflake-arctic -->
  <text x="80" y="160" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">snowflake</text>
  <!-- CPU bar (130) -->
  <rect x="120" y="148" width="9" height="12" fill="#6750A4"/>
  <text x="165" y="157" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">130</text>
  <!-- GPU bar (1800) -->
  <rect x="250" y="148" width="24" height="12" fill="#34A853"/>
  <text x="320" y="157" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,800</text>

  <!-- gte-large -->
  <text x="80" y="195" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">gte-large</text>
  <!-- CPU bar (110) -->
  <rect x="120" y="183" width="7" height="12" fill="#6750A4"/>
  <text x="165" y="192" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">110</text>
  <!-- GPU bar (1600) -->
  <rect x="250" y="183" width="21" height="12" fill="#34A853"/>
  <text x="320" y="192" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,600</text>

  <!-- mxbai-embed-large -->
  <text x="80" y="230" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">mxbai-large</text>
  <!-- CPU bar (105) -->
  <rect x="120" y="218" width="7" height="12" fill="#6750A4"/>
  <text x="165" y="227" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">105</text>
  <!-- GPU bar (1500) -->
  <rect x="250" y="218" width="20" height="12" fill="#34A853"/>
  <text x="320" y="227" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,500</text>

  <!-- bge-large-en-v1.5 -->
  <text x="80" y="265" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">bge-large</text>
  <!-- CPU bar (95) -->
  <rect x="120" y="253" width="6" height="12" fill="#6750A4"/>
  <text x="165" y="262" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">95</text>
  <!-- GPU bar (1400) -->
  <rect x="250" y="253" width="19" height="12" fill="#34A853"/>
  <text x="320" y="262" font-size="10" font-weight="600" fill="#49454F" font-family="'SF Mono', Monaco, monospace">1,400</text>

  <!-- Note -->
  <line x1="50" y1="305" x2="750" y2="305" stroke="#E8DEF8" stroke-width="1"/>
  <text x="50" y="325" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">
    nomic-embed-text-v2 dominates CPU (5× faster than bge-large). GPU shrinks the gap; nomic still leads at 4,800 chunks/sec.
  </text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>