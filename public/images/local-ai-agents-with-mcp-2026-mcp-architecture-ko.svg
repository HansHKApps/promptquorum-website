<text x="400" y="351" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Ollama가 모델을 제공하고, MCP 클라이언트는 도구 호출을 stdio를 통해 로컬 MCP 서버로 전달한다. 각 서버는 파일, 데이터베이스, 브라우저, GitHub 중 하나의 기능에 대한 도구를 제공한다.</text>
