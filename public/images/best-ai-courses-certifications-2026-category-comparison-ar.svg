<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/>
<text x="400" y="28" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">مقارنة فئات تعلّم الذكاء الاصطناعي الأربع</text>
<text x="40" y="55" font-size="12" font-weight="700" fill="#79747E">الفئة</text>
<text x="250" y="55" font-size="12" font-weight="700" fill="#79747E">الأنسب لـ</text>
<text x="500" y="55" font-size="12" font-weight="700" fill="#79747E">النتيجة</text>
<line x1="24" y1="64" x2="776" y2="64" stroke="#E8DEF8" stroke-width="1.5"/>
<circle cx="26" cy="92" r="10" fill="#6750A4"/>
<text x="26" y="96" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="48" y="88" font-size="12.5" font-weight="700" fill="#6750A4" text-anchor="start">الدورات المجانية</text>
<text x="250" y="88" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">التوجّه، وتحديد ما إذا كان</text>
<text x="250" y="103" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">الذكاء الاصطناعي مناسبًا</text>
<text x="500" y="88" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">فهم أساسي،</text>
<text x="500" y="103" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">بدون بيانات اعتماد رسمية</text>
<line x1="24" y1="140" x2="776" y2="140" stroke="#F7F2FA" stroke-width="1"/>
<circle cx="26" cy="164" r="10" fill="#6750A4"/>
<text x="26" y="168" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="48" y="160" font-size="12.5" font-weight="700" fill="#6750A4" text-anchor="start">الدورات المدفوعة المنظَّمة</text>
<text x="250" y="160" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">بناء مهارة تطبيقية</text>
<text x="250" y="175" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">عملية</text>
<text x="500" y="160" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">مهارة قابلة للتطبيق، وغالبًا</text>
<text x="500" y="175" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">شهادة قابلة للتحقق</text>
<line x1="24" y1="212" x2="776" y2="212" stroke="#F7F2FA" stroke-width="1"/>
<circle cx="26" cy="236" r="10" fill="#6750A4"/>
<text x="26" y="240" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="48" y="232" font-size="12.5" font-weight="700" fill="#6750A4" text-anchor="start">الشهادات</text>
<text x="250" y="232" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">الحصول على بيانات اعتماد</text>
<text x="250" y="247" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">تطلبها وظيفة</text>
<text x="500" y="232" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">شهادة قابلة للتحقق للسير</text>
<text x="500" y="247" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">الذاتية والملفات المهنية</text>
<line x1="24" y1="284" x2="776" y2="284" stroke="#F7F2FA" stroke-width="1"/>
<circle cx="26" cy="308" r="10" fill="#6750A4"/>
<text x="26" y="312" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="48" y="304" font-size="12.5" font-weight="700" fill="#6750A4" text-anchor="start">دورات هندسة الأوامر</text>
<text x="250" y="304" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">الحصول على مخرجات جيدة</text>
<text x="250" y="319" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">من النماذج الموجودة</text>
<text x="500" y="304" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">مهارة عملية في كتابة</text>
<text x="500" y="319" font-size="11.5" font-weight="400" fill="#49454F" text-anchor="start">الأوامر البرمجية</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>