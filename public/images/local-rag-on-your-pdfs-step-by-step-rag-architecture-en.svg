<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local RAG Stack: 4 Components on One Laptop</text>

  <!-- Header row -->
  <rect x="0" y="46" width="800" height="36" fill="#6750A4"/>
  <text x="100" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Component</text>
  <text x="337" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Role</text>
  <text x="637" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Key Detail</text>

  <!-- Column dividers -->
  <line x1="200" y1="46" x2="200" y2="292" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="475" y1="46" x2="475" y2="292" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1: Ollama -->
  <rect x="0" y="82" width="800" height="44" fill="#FFFFFF"/>
  <text x="100" y="100" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama</text>
  <text x="100" y="115" font-size="10" fill="#49454F" text-anchor="middle">v0.5+</text>
  <text x="337" y="107" font-size="12" fill="#49454F" text-anchor="middle">Local LLM runtime</text>
  <text x="637" y="100" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">API at localhost:11434</text>
  <text x="637" y="115" font-size="10" fill="#49454F" text-anchor="middle">Free · OpenAI-compatible</text>

  <!-- Row 2: Llama 3.3 8B -->
  <rect x="0" y="126" width="800" height="44" fill="#F7F2FA"/>
  <text x="100" y="144" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Llama 3.3 8B</text>
  <text x="100" y="159" font-size="10" fill="#49454F" text-anchor="middle">Q4_K_M</text>
  <text x="337" y="151" font-size="12" fill="#49454F" text-anchor="middle">Answer model</text>
  <text x="637" y="144" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">~4.9 GB · 16 GB RAM min</text>
  <text x="637" y="159" font-size="10" fill="#49454F" text-anchor="middle">Runs via Ollama</text>

  <!-- Row 3: AnythingLLM -->
  <rect x="0" y="170" width="800" height="44" fill="#FFFFFF"/>
  <text x="100" y="188" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">AnythingLLM</text>
  <text x="100" y="203" font-size="10" fill="#49454F" text-anchor="middle">Desktop</text>
  <text x="337" y="188" font-size="11" fill="#49454F" text-anchor="middle">UI + vector store</text>
  <text x="337" y="203" font-size="11" fill="#49454F" text-anchor="middle">+ RAG orchestration</text>
  <text x="637" y="188" font-size="10" fill="#49454F" text-anchor="middle">LanceDB built-in · drag-drop PDFs</text>
  <text x="637" y="203" font-size="10" fill="#49454F" text-anchor="middle">No code · free · macOS/Win/Linux</text>

  <!-- Row 4: nomic-embed-text -->
  <rect x="0" y="214" width="800" height="44" fill="#F7F2FA"/>
  <text x="100" y="232" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">nomic-embed-text</text>
  <text x="100" y="247" font-size="10" fill="#49454F" text-anchor="middle">v1.5 (via Ollama)</text>
  <text x="337" y="239" font-size="12" fill="#49454F" text-anchor="middle">Embedding model</text>
  <text x="637" y="232" font-size="10" fill="#49454F" text-anchor="middle">~280 MB · 400–800 chunks/sec (CPU)</text>
  <text x="637" y="247" font-size="10" fill="#49454F" text-anchor="middle">Replaces AnythingLLM default embedder</text>

  <!-- Table outer border -->
  <rect x="0" y="46" width="800" height="212" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="18" y1="270" x2="782" y2="270" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="291" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Data flow: PDFs → AnythingLLM parses → nomic-embed-text → LanceDB → Llama 3.3 8B → Answer</text>
  <text x="400" y="312" font-size="11" fill="#79747E" text-anchor="middle">Install time: ~30 min · Cost: $0 · Fully offline after initial model download</text>
  <text x="400" y="330" font-size="11" fill="#79747E" text-anchor="middle">16 GB RAM min · 8 GB works with Phi-4 Mini Q4 instead of Llama 3.3 8B</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
