<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">Continue.dev vs Cline vs Aider : Différences clés</text>
  <rect x="404" y="38" width="194" height="26" fill="#E8DEF8"/>
  <text x="90" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Fonctionnalité</text>
  <text x="295" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Continue.dev</text>
  <text x="500" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Cline</text>
  <text x="690" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Aider</text>
  <line x1="10" y1="65" x2="790" y2="65" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="404" y="65" width="194" height="338" fill="#F7F2FA" rx="0"/>
  <text x="18" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Interface principale</text>
  <text x="295" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">VS Code + JetBrains</text>
  <text x="500" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">VS Code only</text>
  <text x="690" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Terminal CLI</text>
  <line x1="10" y1="96" x2="790" y2="96" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Workflow</text>
  <text x="295" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Autocomplétion + chat</text>
  <text x="500" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Boucle agent autonome</text>
  <text x="690" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Commits git-natifs</text>
  <line x1="10" y1="126" x2="790" y2="126" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Modèle d'édition</text>
  <text x="295" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">FIM + apply-to-file</text>
  <text x="500" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Tool calls (write/replace)</text>
  <text x="690" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Blocs diff recherche-remplacement</text>
  <line x1="10" y1="156" x2="790" y2="156" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Multi-fichiers</text>
  <text x="295" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Manuell par fichier</text>
  <text x="500" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Native multi-fichiers</text>
  <text x="690" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Natif via /add</text>
  <line x1="10" y1="186" x2="790" y2="186" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Annulation</text>
  <text x="295" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Pile undo VS Code</text>
  <text x="500" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Revert par étape dans UI</text>
  <text x="690" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">/undo inverse dernier commit</text>
  <line x1="10" y1="216" x2="790" y2="216" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Contexte</text>
  <text x="295" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Index + chunks @-épinglés</text>
  <text x="500" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Streaming fichiers complets</text>
  <text x="690" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Repo map + fichiers /add</text>
  <line x1="10" y1="246" x2="790" y2="246" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Contexte min.</text>
  <text x="295" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">32K</text>
  <text x="500" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">128K recommandé</text>
  <text x="690" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">32K</text>
  <line x1="10" y1="276" x2="790" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">Meilleur pour</text>
  <text x="295" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">IDE édition en temps réel</text>
  <text x="500" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Refactorisations multi-fichiers</text>
  <text x="690" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Diffs git-natifs révisables</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
