<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" width="800" height="255">
  <rect width="800" height="255" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Prérequis matériels pour l'IA locale (2026)</text>
  <!-- Subtitle -->
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">N'importe quel laptop 8 Go fait tourner de petits modèles · Apple Silicon va plus vite</text>

  <!-- Col headers -->
  <text x="32" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Matériel</text>
  <text x="230" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Plateforme</text>
  <text x="350" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Modèles</text>
  <text x="620" y="70" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Vitesse</text>

  <!-- Header divider -->
  <line x1="0" y1="78" x2="800" y2="78" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1 background -->
  <rect x="0" y="80" width="800" height="30" fill="#F7F2FA"/>
  <!-- Row 1 data -->
  <text x="32" y="99" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6750A4">Apple Silicon (M1–M5)</text>
  <text x="230" y="99" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">Mac uniquement</text>
  <text x="350" y="99" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">3B–70B models</text>
  <text x="620" y="99" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">20–50 tok/s ★</text>

  <!-- Divider y=110 -->
  <line x1="0" y1="110" x2="800" y2="110" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="32" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">NVIDIA GPU (8 Go+ VRAM)</text>
  <text x="230" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">Windows / Linux</text>
  <text x="350" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">7B–30B</text>
  <text x="620" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">15–40 tok/s</text>

  <!-- Divider y=140 -->
  <line x1="0" y1="140" x2="800" y2="140" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="32" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">AMD GPU (ROCm)</text>
  <text x="230" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">Windows / Linux</text>
  <text x="350" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">7B–14B</text>
  <text x="620" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#F4B400">Variable</text>

  <!-- Divider y=170 -->
  <line x1="0" y1="170" x2="800" y2="170" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="32" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">CPU seul (8 Go+ RAM)</text>
  <text x="230" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">Toutes plateformes</text>
  <text x="350" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="400" fill="#F4B400">3B–7B</text>
  <text x="620" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#1C1B1F">5–15 tok/s</text>

  <!-- Footer divider y=200 -->
  <line x1="0" y1="200" x2="800" y2="200" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="218" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">★ Apple Silicon = meilleur matériel grand public · Pas de GPU pour 3B–7B sur 8 Go · promptquorum.com</text>
</svg>
