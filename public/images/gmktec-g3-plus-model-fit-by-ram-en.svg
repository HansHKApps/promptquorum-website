<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local Model Fit on the G3 Plus by RAM Config</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">1B–3B (4-bit)</text>
  <rect x="260" y="75" width="150" height="24" fill="#34A853" rx="4"/>
  <text x="420" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">~4 GB — fast, comfortable</text>

  <text x="250" y="145" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">7B–8B (4-bit)</text>
  <rect x="260" y="126" width="300" height="24" fill="#6750A4" rx="4"/>
  <text x="570" y="143" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">~8 GB — usable, slow (16 GB base)</text>

  <text x="250" y="196" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">~13B (4-bit)</text>
  <rect x="260" y="177" width="480" height="24" fill="#F4B400" rx="4"/>
  <text x="266" y="193" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">~15 GB — low throughput, needs 32 GB upgrade</text>

  <text x="250" y="256" font-size="13" font-weight="700" fill="#EA4335" text-anchor="end">Vision / heavier</text>
  <rect x="260" y="237" width="620" height="24" fill="#EA4335" rx="4"/>
  <text x="266" y="253" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">Not recommended — no NPU, choose a Ryzen box instead</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Single-channel DDR4 and no NPU mean the N150 stays CPU-bound — the 32 GB upgrade extends context and model size, not speed.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
