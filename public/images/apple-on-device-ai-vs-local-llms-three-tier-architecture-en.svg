<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Apple Intelligence: Where Each Task Runs</text>

  <!-- Card 1: On-Device -->
  <rect x="28" y="55" width="236" height="300" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="28" y="55" width="236" height="4" rx="0" fill="#34A853"/>
  <text x="146" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">On-Device (AFM Core)</text>

  <text x="146" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHERE IT RUNS</text>
  <text x="146" y="131" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Apple Silicon chip in device</text>

  <text x="146" y="163" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHAT IT HANDLES</text>
  <text x="146" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Dictation, quick replies,</text>
  <text x="146" y="193" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">on-screen awareness</text>

  <text x="146" y="275" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">TOUCHES GOOGLE?</text>
  <circle cx="146" cy="308" r="24" fill="#34A853"/>
  <text x="146" y="313" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">NO</text>

  <!-- Card 2: Private Cloud Compute -->
  <rect x="282" y="55" width="236" height="300" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="282" y="55" width="236" height="4" rx="0" fill="#F4B400"/>
  <text x="400" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Private Cloud Compute</text>

  <text x="400" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHERE IT RUNS</text>
  <text x="400" y="131" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Apple-run, audited servers</text>

  <text x="400" y="163" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHAT IT HANDLES</text>
  <text x="400" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Medium tasks needing</text>
  <text x="400" y="193" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">more compute than device</text>

  <text x="400" y="275" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">TOUCHES GOOGLE?</text>
  <circle cx="400" cy="308" r="24" fill="#34A853"/>
  <text x="400" y="313" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">NO</text>

  <!-- Card 3: Cloud Pro -->
  <rect x="536" y="55" width="236" height="300" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="536" y="55" width="236" height="4" rx="0" fill="#EA4335"/>
  <text x="654" y="90" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">AFM 3 Cloud Pro</text>

  <text x="654" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHERE IT RUNS</text>
  <text x="654" y="131" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Nvidia GPUs in Google Cloud</text>

  <text x="654" y="163" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">WHAT IT HANDLES</text>
  <text x="654" y="179" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">Heaviest reasoning &amp;</text>
  <text x="654" y="193" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">world-knowledge tasks</text>

  <text x="654" y="275" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">TOUCHES GOOGLE?</text>
  <circle cx="654" cy="308" r="24" fill="#EA4335"/>
  <text x="654" y="313" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">YES</text>

  <text x="400" y="385" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Only AFM 3 Cloud Pro touches Google infrastructure — on-device AFM Core and Private Cloud Compute stay on Apple hardware.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
