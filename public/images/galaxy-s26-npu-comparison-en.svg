  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Exynos 2600 leads on AI gen-over-gen gains (+113% vs +39%) and Stable Diffusion (2.4x faster) — choose global S26/S26+ for local LLM inference.</text>
