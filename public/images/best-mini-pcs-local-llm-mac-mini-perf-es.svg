  <text x="50" y="137" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui">M5 Pro (24-64 GB)</text>
  <text x="280" y="137" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui">Sin medir a&#xfa;n</text>
