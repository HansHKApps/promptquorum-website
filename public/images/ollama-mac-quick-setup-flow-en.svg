<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama Quick Setup: Zero to Chat in 3 Commands</text>

  <!-- Step 1 -->
  <circle cx="120" cy="150" r="30" fill="#6750A4"/>
  <text x="120" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="120" y="207" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install</text>
  <text x="120" y="228" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">brew install ollama</text>

  <text x="255" y="158" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="400" cy="150" r="30" fill="#6750A4"/>
  <text x="400" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="400" y="207" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pull a Model</text>
  <text x="400" y="228" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">ollama pull llama2</text>
  <text x="400" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">Llama 3.3 7B, ~4 GB</text>

  <text x="535" y="158" font-family="system-ui, sans-serif" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="680" cy="150" r="30" fill="#6750A4"/>
  <text x="680" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="680" y="207" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Run &amp; Chat</text>
  <text x="680" y="228" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">ollama run llama2</text>

  <line x1="60" y1="270" x2="740" y2="270" stroke="#E8DEF8" stroke-width="1.5"/>

  <circle cx="90" cy="300" r="6" fill="#34A853"/>
  <text x="106" y="305" font-family="system-ui, sans-serif" font-size="12.5" fill="#1C1B1F">Metal GPU acceleration is automatic — no configuration required</text>

  <circle cx="90" cy="330" r="6" fill="#34A853"/>
  <text x="106" y="335" font-family="system-ui, sans-serif" font-size="12.5" fill="#1C1B1F">REST API auto-starts on localhost:11434 — ready for developer use</text>

  <text x="400" y="370" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Total setup time: about 2 minutes on any Apple Silicon Mac (M1 or newer).</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
