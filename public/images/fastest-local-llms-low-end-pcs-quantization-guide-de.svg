<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Quantisierungsleitfaden: Größe, Tempo und Qualität</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Q4_K_M ist die Standardwahl. Nur auf Q3/Q2 wechseln, wenn das Modell nicht in den RAM passt.</text>
  <text x="38" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Stufe</text>
  <text x="130" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Größe vs. Q4_K_M</text>
  <text x="290" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Tempo</text>
  <text x="420" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Qualität</text>
  <text x="570" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Fazit</text>
  <line x1="18" y1="80" x2="782" y2="80" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="38" y="106" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#1C1B1F">Q8</text>
  <text x="130" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">~2× größer</text>
  <text x="290" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">langsamer</text>
  <text x="420" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#34A853">fast verlustfrei</text>
  <text x="570" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">selten sinnvoll</text>
  <line x1="18" y1="116" x2="782" y2="116" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="121" width="764" height="38" fill="#F7F2FA" rx="2"/>
  <text x="38" y="144" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#6750A4">Q4_K_M ★</text>
  <text x="130" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">Referenz</text>
  <text x="290" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">Referenz</text>
  <text x="420" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#34A853">guter Kompromiss</text>
  <text x="570" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#6750A4">empfohlen ★</text>
  <line x1="18" y1="159" x2="782" y2="159" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="38" y="185" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#1C1B1F">Q3</text>
  <text x="130" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">kleiner</text>
  <text x="290" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">schneller</text>
  <text x="420" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#B07D00">mehr Verlust</text>
  <text x="570" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00">nur wenn Q4_K_M nicht passt</text>
  <line x1="18" y1="195" x2="782" y2="195" stroke="#F7F2FA" stroke-width="1"/>
  <text x="38" y="221" font-family="'SF Mono',Monaco,monospace" font-size="13" font-weight="700" fill="#1C1B1F">Q2</text>
  <text x="130" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">am kleinsten</text>
  <text x="290" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">am schnellsten</text>
  <text x="420" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#EA4335">deutlich schlechter</text>
  <text x="570" y="221" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">letzter Ausweg</text>
  <line x1="18" y1="231" x2="782" y2="231" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="245" width="764" height="60" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1"/>
  <text x="38" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6750A4">Kernregel: Erst die Modellgröße wählen, dann Q4_K_M.</text>
  <text x="38" y="287" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Ein kleines Modell mit Q4_K_M schlägt meist ein größeres, das auf Q2 gequetscht wurde.</text>
  <text x="38" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">Kleinere Datei = schneller auf der CPU, grob proportional (Tempo ≈ Speicherbandbreite ÷ Dateigröße).</text>
  <text x="400" y="338" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
