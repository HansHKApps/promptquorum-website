<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>

  <!-- Main title -->
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">iPhone LLM：电量与温度</text>

  <!-- Left panel (red) -->
  <rect x="20" y="46" width="365" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="20" y="46" width="365" height="4" rx="0" fill="#EA4335"/>
  <text x="202" y="70" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">推理运行中</text>

  <!-- Left bullets -->
  <circle cx="38" cy="90" r="3" fill="#EA4335"/>
  <text x="50" y="94" font-size="12" fill="#49454F">~3–5W 功耗</text>

  <circle cx="38" cy="116" r="3" fill="#EA4335"/>
  <text x="50" y="120" font-size="12" fill="#49454F">~20–30% 电量/小时 (iPhone 16 Pro)</text>

  <circle cx="38" cy="142" r="3" fill="#EA4335"/>
  <text x="50" y="146" font-size="12" fill="#49454F">~38°C时降频（10–15分钟后）</text>

  <circle cx="38" cy="168" r="3" fill="#EA4335"/>
  <text x="50" y="172" font-size="12" fill="#49454F">过热时速度下降30–50%</text>

  <!-- Right panel (green) -->
  <rect x="415" y="46" width="365" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="415" y="46" width="365" height="4" rx="0" fill="#34A853"/>
  <text x="597" y="70" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">降低影响</text>

  <!-- Right bullets -->
  <circle cx="433" cy="90" r="3" fill="#34A853"/>
  <text x="445" y="94" font-size="12" fill="#49454F">屏幕朝上放在硬表面</text>

  <circle cx="433" cy="116" r="3" fill="#34A853"/>
  <text x="445" y="120" font-size="12" fill="#49454F">避免直射阳光</text>

  <circle cx="433" cy="142" r="3" fill="#34A853"/>
  <text x="445" y="146" font-size="12" fill="#49454F">短会话: &lt;5分钟→不降频</text>

  <circle cx="433" cy="168" r="3" fill="#34A853"/>
  <text x="445" y="172" font-size="12" fill="#49454F">长时间使用时连接充电</text>

  <!-- Footer -->
  <text x="400" y="342" font-size="11" fill="#79747E" text-anchor="middle">iPhone 15 Pro建议避免MagSafe充电与推理同时进行，以降低热压力。</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
