<text x="30" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">ネイティブ4096×4096の入力解像度により、LLaVA 1.6（672×672）やLlama 3.2 Vision（1120×1120）が縮小して見逃す密なCJKテキストも読み取れます。</text>
<text x="30" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">すべての画像はご自身のマシンで処理されます — クラウドへのアップロードもAPIキーも不要です。</text>
