<text x="30" y="278" class="feature" text-anchor="start">最適な用途：</text>
<text x="30" y="298" class="cell-text" text-anchor="start">• Ollama: 開発者、自動化、ヘッドレスサーバー（CLI優先、シンプルなAPI）</text>
<text x="30" y="318" class="cell-text" text-anchor="start">• LM Studio: 洗練されたGUIを求めるデスクトップユーザー、初心者</text>
<text x="30" y="338" class="cell-text" text-anchor="start">• Jan: CLIも備えたオープンソースのデスクトップアプリ、クロスプラットフォーム</text>
<text x="30" y="358" class="cell-text" text-anchor="start">• llama.cpp: 最大限の制御と性能、多くのツールの基盤エンジン</text>
<text x="30" y="378" class="cell-text" text-anchor="start">• KoboldCpp: ロールプレイや創作向けの単一ファイルアプリ</text>
<text x="30" y="398" class="cell-text" text-anchor="start">• GPT4All: 一般的なPCで使えるシンプルなオフラインチャット、文書Q&amp;A</text>
<text x="30" y="420" class="cell-text" font-weight="600" text-anchor="start">推奨：Ollama（パワーユーザー）またはLM Studio / Jan（GUI）から開始。完全な制御にはllama.cpp。</text>
<text x="30" y="440" class="cell-text" style="fill:#79747E" text-anchor="start">✓✓ 優秀 · ✓ あり · ~ 一部 · ✗ なし</text>
<text x="792" y="471" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>