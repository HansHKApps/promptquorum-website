<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">6 Common Mistakes Picking a Local Coding Model</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="62" r="14" fill="#EA4335"/>
  <text x="38" y="66" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="57" font-size="12" font-weight="700" fill="#1C1B1F">Picking by leaderboard score, not VRAM headroom</text>
  <text x="62" y="73" font-size="11" fill="#49454F">A model with &lt;2–4 GB headroom at Q4_K_M spills to disk and becomes unusable for interactive coding.</text>
  <line x1="18" y1="88" x2="782" y2="88" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="109" r="14" fill="#EA4335"/>
  <text x="38" y="113" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="104" font-size="12" font-weight="700" fill="#1C1B1F">Trusting the claimed context window as the practical limit</text>
  <text x="62" y="120" font-size="11" fill="#49454F">Coding attention quality drops past ~half the headline number. Plan for the practical working window column.</text>
  <line x1="18" y1="135" x2="782" y2="135" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="156" r="14" fill="#EA4335"/>
  <text x="38" y="160" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="151" font-size="12" font-weight="700" fill="#1C1B1F">Skipping the licence read</text>
  <text x="62" y="167" font-size="11" fill="#49454F">Codestral on a commercial product without Mistral Commercial = procurement failure. Read the licence before integration.</text>
  <line x1="18" y1="182" x2="782" y2="182" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="203" r="14" fill="#EA4335"/>
  <text x="38" y="207" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="198" font-size="12" font-weight="700" fill="#1C1B1F">Ignoring tool-call reliability when picking for an agent harness</text>
  <text x="62" y="214" font-size="11" fill="#49454F">7B models often fail Cline's strict XML schemas and Continue.dev Agent mode. Use 30B+ for agent loops.</text>
  <line x1="18" y1="229" x2="782" y2="229" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="250" r="14" fill="#EA4335"/>
  <text x="38" y="254" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="62" y="245" font-size="12" font-weight="700" fill="#1C1B1F">Running one model for both chat and autocomplete</text>
  <text x="62" y="261" font-size="11" fill="#49454F">A 30B model is overkill for 200 ms autocomplete. Run a separate 1.5B–7B model for completions; keep 30B for chat.</text>
  <line x1="18" y1="276" x2="782" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="297" r="14" fill="#EA4335"/>
  <text x="38" y="301" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="62" y="292" font-size="12" font-weight="700" fill="#1C1B1F">Not re-checking model and licence after 6 months</text>
  <text x="62" y="308" font-size="11" fill="#49454F">Open-weight lines update; licences drift; VRAM math improves. Revisit picks by November 2026.</text>
  <line x1="18" y1="323" x2="782" y2="323" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="350" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">VRAM headroom + licence read + agent-loop testing = the 3 most skipped steps · May 2026</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
