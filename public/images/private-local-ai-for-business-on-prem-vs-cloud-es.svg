<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <metadata>
    <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">On-Premises vs Cloud AI Architecture</dc:title>
    <dc:creator>PromptQuorum</dc:creator>
    <dc:rights>© PromptQuorum 2026</dc:rights>
    <dc:source>https://www.promptquorum.com/local-llms/private-local-ai-for-business</dc:source>
  </metadata>

  <rect width="800" height="350" fill="#FFFFFF"/>

  <text x="400" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Arquitectura de IA on-premises vs nube</text>

  <!-- Left Panel: Cloud APIs (Problem) -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#EA4335"/>

  <text x="198" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">APIs en la nube (OpenAI, Anthropic)</text>

  <text x="48" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Flujo de datos:</text>
  <text x="48" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; La app env&#xed;a la solicitud por internet</text>
  <text x="48" y="143" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Datos expuestos a servidores del proveedor</text>
  <text x="48" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Respuesta devuelta (latencia 200-500ms)</text>

  <text x="48" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EA4335">Coste a escala:</text>
  <text x="48" y="203" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EA4335">$20,000/a&#xf1;o</text>
  <text x="48" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">(para 1B tokens/mes)</text>

  <text x="48" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Cumplimiento:</text>
  <text x="48" y="263" font-family="system-ui, sans-serif" font-size="11" fill="#EA4335">&#x274c; HIPAA arriesgado</text>
  <text x="48" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#EA4335">&#x274c; GDPR dif&#xed;cil</text>
  <text x="48" y="293" font-family="system-ui, sans-serif" font-size="11" fill="#EA4335">&#x274c; Residencia de datos</text>

  <!-- Right Panel: On-Premises (Goal) -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>

  <text x="602" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Infraestructura on-premises</text>

  <text x="452" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Flujo de datos:</text>
  <text x="452" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; La app consulta vLLM localmente</text>
  <text x="452" y="143" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Los datos nunca salen del centro de datos</text>
  <text x="452" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Respuesta instant&#xe1;nea (latencia 50-150ms)</text>

  <text x="452" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34A853">Coste a escala:</text>
  <text x="452" y="203" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">$5,000/a&#xf1;o</text>
  <text x="452" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">(hardware + electricidad)</text>

  <text x="452" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Cumplimiento:</text>
  <text x="452" y="263" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">&#x2713; Listo para HIPAA</text>
  <text x="452" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">&#x2713; Conforme con GDPR</text>
  <text x="452" y="293" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">&#x2713; Control total</text>

  <text x="830" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#999999" text-anchor="end">promptquorum.com</text>
</svg>