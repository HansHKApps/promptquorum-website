<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Claude Sonnet 5 vs Llama 3.3 70B: Quality Specs</text>

  <rect x="28" y="55" width="340" height="340" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#6750A4"/>
  <text x="198" y="82" font-size="16" font-weight="700" fill="#6750A4" text-anchor="middle">Claude Sonnet 5</text>

  <text x="48" y="114" font-size="12" font-weight="700" fill="#79747E">MMLU</text>
  <text x="358" y="114" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="end">97%</text>
  <line x1="48" y1="122" x2="358" y2="122" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="148" font-size="12" font-weight="700" fill="#79747E">HumanEval</text>
  <text x="358" y="148" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#1C1B1F" text-anchor="end">baseline</text>
  <line x1="48" y1="156" x2="358" y2="156" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="182" font-size="12" font-weight="700" fill="#79747E">Context Window</text>
  <text x="358" y="182" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="end">200K tokens</text>
  <line x1="48" y1="190" x2="358" y2="190" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="216" font-size="12" font-weight="700" fill="#79747E">Multimodal</text>
  <text x="358" y="216" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#1C1B1F" text-anchor="end">Native</text>
  <line x1="48" y1="224" x2="358" y2="224" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="250" font-size="12" font-weight="700" fill="#79747E">Fine-Tuning</text>
  <text x="358" y="250" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#EA4335" text-anchor="end">Not available</text>
  <line x1="48" y1="258" x2="358" y2="258" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="284" font-size="12" font-weight="700" fill="#79747E">Offline</text>
  <text x="358" y="284" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#EA4335" text-anchor="end">No</text>
  <line x1="48" y1="292" x2="358" y2="292" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="318" font-size="12" font-weight="700" fill="#79747E">Rate Limits</text>
  <text x="358" y="318" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#EA4335" text-anchor="end">Yes</text>

  <rect x="432" y="55" width="340" height="340" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#7D5260"/>
  <text x="602" y="82" font-size="16" font-weight="700" fill="#7D5260" text-anchor="middle">Llama 3.3 70B</text>

  <text x="452" y="114" font-size="12" font-weight="700" fill="#79747E">MMLU</text>
  <text x="762" y="114" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="end">96%</text>
  <line x1="452" y1="122" x2="762" y2="122" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="148" font-size="12" font-weight="700" fill="#79747E">HumanEval</text>
  <text x="762" y="148" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">+2% vs Claude</text>
  <line x1="452" y1="156" x2="762" y2="156" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="182" font-size="12" font-weight="700" fill="#79747E">Context Window</text>
  <text x="762" y="182" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#1C1B1F" text-anchor="end">128K tokens</text>
  <line x1="452" y1="190" x2="762" y2="190" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="216" font-size="12" font-weight="700" fill="#79747E">Multimodal</text>
  <text x="762" y="216" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#1C1B1F" text-anchor="end">Adapter only</text>
  <line x1="452" y1="224" x2="762" y2="224" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="250" font-size="12" font-weight="700" fill="#79747E">Fine-Tuning</text>
  <text x="762" y="250" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">Full (LoRA)</text>
  <line x1="452" y1="258" x2="762" y2="258" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="284" font-size="12" font-weight="700" fill="#79747E">Offline</text>
  <text x="762" y="284" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">Yes</text>
  <line x1="452" y1="292" x2="762" y2="292" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="318" font-size="12" font-weight="700" fill="#79747E">Rate Limits</text>
  <text x="762" y="318" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">None</text>

  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">On 80% of real-world tasks both models are equivalent; Llama edges ahead on HumanEval coding, Claude on nuanced reasoning.</text>
<text x="792" y="455" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
