<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="27" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">6 Common Failure Modes — Quick Fix Reference</text>

  <!-- Header row -->
  <rect x="0" y="40" width="800" height="34" fill="#6750A4"/>
  <text x="130" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Symptom</text>
  <text x="390" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Likely Cause</text>
  <text x="660" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fix</text>

  <!-- Column dividers -->
  <line x1="260" y1="40" x2="260" y2="346" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="346" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="0" y="74" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="91" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cannot connect to Ollama</text>
  <text x="130" y="107" font-size="10" fill="#49454F" text-anchor="middle">"Connection refused" error</text>
  <text x="390" y="99" font-size="10" fill="#49454F" text-anchor="middle">Service not running / wrong endpoint</text>
  <text x="660" y="91" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">ollama serve</text>
  <text x="660" y="107" font-size="10" fill="#49454F" text-anchor="middle">confirm endpoint: 127.0.0.1:11434</text>

  <!-- Row 2 -->
  <rect x="0" y="118" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="135" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Model pull stalls</text>
  <text x="130" y="151" font-size="10" fill="#49454F" text-anchor="middle">at 0% or 99%</text>
  <text x="390" y="143" font-size="10" fill="#49454F" text-anchor="middle">CDN edge issue or disk full</text>
  <text x="660" y="135" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">Ctrl+C → df -h → re-run pull</text>
  <text x="660" y="151" font-size="10" fill="#49454F" text-anchor="middle">Ollama resumes from last byte</text>

  <!-- Row 3 -->
  <rect x="0" y="162" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="179" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Embedding step hangs</text>
  <text x="130" y="195" font-size="10" fill="#49454F" text-anchor="middle">progress bar frozen</text>
  <text x="390" y="187" font-size="10" fill="#49454F" text-anchor="middle">First-time model load into RAM</text>
  <text x="660" y="179" font-size="10" fill="#49454F" text-anchor="middle">Wait 30–60 sec — first load</text>
  <text x="660" y="195" font-size="10" fill="#49454F" text-anchor="middle">takes 10–40 sec by disk speed</text>

  <!-- Row 4 -->
  <rect x="0" y="206" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="223" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Retrieval: off-topic chunks</text>
  <text x="130" y="239" font-size="10" fill="#49454F" text-anchor="middle">citations unrelated to query</text>
  <text x="390" y="231" font-size="10" fill="#49454F" text-anchor="middle">Default 512/0 chunks + weak embedder</text>
  <text x="660" y="223" font-size="10" fill="#6750A4" text-anchor="middle">Apply Step 4 (nomic-embed-text)</text>
  <text x="660" y="239" font-size="10" fill="#6750A4" text-anchor="middle">+ Step 7 (1000/200) · re-embed</text>

  <!-- Row 5 -->
  <rect x="0" y="250" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="267" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Answers generic / short</text>
  <text x="130" y="283" font-size="10" fill="#49454F" text-anchor="middle">ignores PDF content</text>
  <text x="390" y="275" font-size="10" fill="#49454F" text-anchor="middle">Tiny default LLM still selected</text>
  <text x="660" y="267" font-size="10" fill="#49454F" text-anchor="middle">Set LLM → llama3.3:8b-instruct-q4_K_M</text>
  <text x="660" y="283" font-size="10" fill="#49454F" text-anchor="middle">Bump Top-K from 4 to 6</text>

  <!-- Row 6 -->
  <rect x="0" y="294" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="311" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">Scanned PDFs → empty chunks</text>
  <text x="130" y="327" font-size="10" fill="#49454F" text-anchor="middle">text extracts as "[image]"</text>
  <text x="390" y="319" font-size="10" fill="#49454F" text-anchor="middle">No text layer — pure raster image</text>
  <text x="660" y="311" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#6750A4" text-anchor="middle">ocrmypdf input.pdf output.pdf</text>
  <text x="660" y="327" font-size="10" fill="#49454F" text-anchor="middle">then re-upload the OCR'd output</text>

  <!-- Table outer border -->
  <rect x="0" y="40" width="800" height="298" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <line x1="18" y1="354" x2="782" y2="354" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="374" font-size="11" fill="#79747E" text-anchor="middle">All failures resolve by following the 7-step setup in order — Steps 4 and 7 are the most critical</text>
  <text x="400" y="394" font-size="10" fill="#79747E" text-anchor="middle">Retrieval issues: always fix embedder (Step 4) + chunk size (Step 7) before changing the answer model</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
