<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">托管版 DeepSeek 应用 vs 自托管开放权重：数据流向对比</text>

  <rect x="28" y="52" width="340" height="304" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="52" width="340" height="4" fill="#EA4335"/>
  <text x="198" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">托管应用 / API（数据 → 中国）</text>

  <rect x="432" y="52" width="340" height="304" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="52" width="340" height="4" fill="#34A853"/>
  <text x="602" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">自托管开放权重</text>

  <text x="48" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">数据存储位置</text>
  <text x="48" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">中华人民共和国境内</text>
  <text x="452" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">数据存储位置</text>
  <text x="452" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">仅存于本机 — 从不外传</text>
  <line x1="48" y1="122" x2="348" y2="122" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="122" x2="752" y2="122" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">跨境数据传输</text>
  <text x="48" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">是 — 触发 GDPR 传输规则</text>
  <text x="452" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">跨境数据传输</text>
  <text x="452" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">无 — 不发生任何传输</text>
  <line x1="48" y1="166" x2="348" y2="166" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="166" x2="752" y2="166" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">欧盟监管调查</text>
  <text x="48" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">意大利已封禁；5 个欧盟机构在调查</text>
  <text x="452" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">欧盟监管调查</text>
  <text x="452" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">不适用 — 未使用托管服务</text>
  <line x1="48" y1="210" x2="348" y2="210" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="210" x2="752" y2="210" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">网络遥测</text>
  <text x="48" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">应用/API 会连接 DeepSeek 服务器</text>
  <text x="452" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">网络遥测</text>
  <text x="452" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">无 — 权重文件不含联网代码</text>
  <line x1="48" y1="254" x2="348" y2="254" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="254" x2="752" y2="254" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">可验证的零外传</text>
  <text x="48" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">否 — 仅依赖厂商政策</text>
  <text x="452" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">可验证的零外传</text>
  <text x="452" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">是 — 可通过流量监控验证</text>
  <line x1="48" y1="298" x2="348" y2="298" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="298" x2="752" y2="298" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">所需 GDPR 传输机制</text>
  <text x="48" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">需要 — SCC 或充分性认定</text>
  <text x="452" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">所需 GDPR 传输机制</text>
  <text x="452" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">不需要 — 数据始终留在本地</text>

  <text x="400" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">自托管开放权重可消除托管应用与 API 存在的全部 6 项中国数据流向风险。</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
