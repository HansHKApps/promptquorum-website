<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="285" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="22" font-size="15" font-weight="700" fill="#1C1B1F" text-anchor="middle">Flexibilidad del modelo de embeddings &#x2014; 3 plataformas comparadas</text>
  <line x1="10" y1="30" x2="790" y2="30" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Column headers -->
  <text x="18" y="52" font-size="12" font-weight="700" fill="#79747E">Capacidad</text>
  <text x="340" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">AnythingLLM</text>
  <text x="527" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">PrivateGPT</text>
  <text x="705" y="52" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">Open WebUI</text>
  <!-- Vertical dividers -->
  <line x1="255" y1="30" x2="255" y2="275" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="435" y1="30" x2="435" y2="275" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="620" y1="30" x2="620" y2="275" stroke="#E8DEF8" stroke-width="1"/>
  <!-- Header underline -->
  <line x1="10" y1="60" x2="790" y2="60" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1: Backends Available -->
  <text x="18" y="90" font-size="12" font-weight="700" fill="#1C1B1F">Backends disponibles</text>
  <text x="340" y="86" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">8 backends (GUI)</text>
  <text x="340" y="100" font-size="10" fill="#34A853" text-anchor="middle">Ollama, OpenAI, Cohere, +</text>
  <text x="527" y="86" font-size="11" fill="#49454F" text-anchor="middle">Cualquiera de HuggingFace</text>
  <text x="527" y="100" font-size="10" fill="#79747E" text-anchor="middle">sentence-transformers</text>
  <text x="705" y="86" font-size="11" fill="#49454F" text-anchor="middle">Ollama + compat. OpenAI</text>
  <text x="705" y="100" font-size="10" fill="#79747E" text-anchor="middle">+ SentenceTransformers</text>
  <line x1="10" y1="115" x2="790" y2="115" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2: Swap UX -->
  <text x="18" y="145" font-size="12" font-weight="700" fill="#1C1B1F">UX de cambio</text>
  <text x="340" y="145" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">1 clic en la GUI &#x2713;</text>
  <text x="527" y="145" font-size="11" fill="#F4B400" text-anchor="middle">Editar settings.yaml</text>
  <text x="705" y="145" font-size="11" fill="#49454F" text-anchor="middle">Interruptor en ajustes</text>
  <line x1="10" y1="170" x2="790" y2="170" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3: Multilingual Support -->
  <text x="18" y="200" font-size="12" font-weight="700" fill="#1C1B1F">Soporte multiling&#xfc;e</text>
  <text x="340" y="200" font-size="11" fill="#49454F" text-anchor="middle">V&#xed;a Ollama</text>
  <text x="527" y="196" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">Nativo (bge-m3) &#x2713;</text>
  <text x="527" y="210" font-size="10" fill="#34A853" text-anchor="middle">m&#xe1;s de 100 idiomas</text>
  <text x="705" y="200" font-size="11" fill="#49454F" text-anchor="middle">V&#xed;a Ollama</text>
  <!-- Footer -->
  <text x="400" y="258" font-size="10" fill="#79747E" text-anchor="middle">Reindexaci&#xf3;n necesaria al cambiar de embedder &#xb7; ~30&#x2013;90 min por cada 5,000 p&#xe1;ginas (GPU de consumo)</text>
<text x="792" y="280" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
