<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">小说写作四阶段</text>

  <!-- Step 1 -->
  <circle cx="110" cy="120" r="22" fill="#6750A4"/>
  <text x="110" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">大纲</text>
  <text x="110" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">10–30章</text>
  <text x="110" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">每章1句</text>

  <text x="205" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="120" r="22" fill="#6750A4"/>
  <text x="300" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">节拍表</text>
  <text x="300" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">3–8个场景</text>
  <text x="300" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">每章</text>

  <text x="395" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="490" cy="120" r="22" fill="#6750A4"/>
  <text x="490" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">场景生成</text>
  <text x="490" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">每次会话一个场景</text>
  <text x="490" y="200" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">200–600字</text>

  <text x="585" y="128" font-family="system-ui, sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="680" cy="120" r="22" fill="#6750A4"/>
  <text x="680" y="127" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">修改轮次</text>
  <text x="680" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">针对性提示词</text>
  <text x="680" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">每次调用一个场景</text>

  <!-- session document banner -->
  <rect x="60" y="250" width="680" height="70" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">会话文档（角色卡 + 章节摘要 + 场景设定）</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">每次第三阶段生成调用开头重新注入——不到4,000 token</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">一次只生成一个场景——不要让模型“续写”超过32K token的不断变长的文档。</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
