<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="310" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="40" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">How Tool Calling Works — From Prompt to Execution</text>
  <!-- Circles -->
  <circle cx="80" cy="90" r="22" fill="#6750A4"/>
  <text x="80" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="220" cy="90" r="22" fill="#6750A4"/>
  <text x="220" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="360" cy="90" r="22" fill="#6750A4"/>
  <text x="360" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="500" cy="90" r="22" fill="#6750A4"/>
  <text x="500" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="640" cy="90" r="22" fill="#6750A4"/>
  <text x="640" y="97" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <!-- Arrows -->
  <text x="118" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="258" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="398" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <text x="538" y="98" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <!-- Step labels -->
  <text x="80" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">User Prompt</text>
  <text x="220" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Read Schemas</text>
  <text x="360" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Emit JSON</text>
  <text x="500" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Validate</text>
  <text x="640" y="130" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Execute Tool</text>
  <!-- Subtexts -->
  <text x="80" y="148" font-size="10" fill="#49454F" text-anchor="middle">any task description</text>
  <text x="220" y="148" font-size="10" fill="#49454F" text-anchor="middle">LLM sees available</text>
  <text x="220" y="162" font-size="10" fill="#49454F" text-anchor="middle">tool definitions</text>
  <text x="360" y="148" font-size="10" fill="#49454F" text-anchor="middle">{tool, arguments}</text>
  <text x="360" y="162" font-size="10" fill="#49454F" text-anchor="middle">structured output</text>
  <text x="500" y="148" font-size="10" fill="#49454F" text-anchor="middle">harness checks</text>
  <text x="500" y="162" font-size="10" fill="#49454F" text-anchor="middle">schema match</text>
  <text x="640" y="148" font-size="10" fill="#49454F" text-anchor="middle">filesystem, DB,</text>
  <text x="640" y="162" font-size="10" fill="#49454F" text-anchor="middle">browser, API…</text>
  <!-- Footer -->
  <text x="400" y="240" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Same model handles OpenAI JSON · Cline XML · MCP JSON-RPC · Aider SEARCH/REPLACE — wire format is a harness choice</text>
</svg>
