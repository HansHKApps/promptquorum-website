<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">ローカルLLM vs クラウドAPI：リクエストの流れ</text><rect x="28" y="50" width="340" height="310" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/><rect x="28" y="50" width="340" height="4" rx="0" fill="#6750A4"/><text x="198" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6750A4" text-anchor="middle">ローカルLLM（自分のデバイス上）</text><circle cx="70" cy="118" r="14" fill="#6750A4"/><text x="70" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="95" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="start">プロンプト</text><circle cx="70" cy="178" r="14" fill="#6750A4"/><text x="70" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="95" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="start">自社ハードウェアで実行（ディスク＋CPU/GPU）</text><circle cx="70" cy="238" r="14" fill="#6750A4"/><text x="70" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="95" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="start">応答はデバイス上に留まる</text><text x="70" y="1