<text x="400" y="355" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">La memoria de Apple Silicon est&#225; soldada &#8212; compra el m&#225;ximo nivel que puedas pagar;</text>
<text x="400" y="373" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">no se puede actualizar despu&#233;s de la compra.</text>
