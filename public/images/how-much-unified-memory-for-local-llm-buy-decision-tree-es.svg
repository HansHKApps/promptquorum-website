<rect width="800" height="400" fill="#FFFFFF"/>
<text x="400" y="20" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">&#191;Cu&#225;nta memoria unificada deber&#237;as comprar?</text>

<rect x="290" y="35" width="220" height="46" rx="8" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
<text x="400" y="54" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">&#191;Tama&#241;o de modelo m&#225;s grande</text>
<text x="400" y="70" font-size="12" fill="#49454F" text-anchor="middle">que usar&#225;s con regularidad?</text>

<line x1="330" y1="81" x2="190" y2="140" stroke="#6750A4" stroke-width="2"/>
<line x1="470" y1="81" x2="610" y2="140" stroke="#6750A4" stroke-width="2"/>
