<text x="520" y="300" font-size="11" fill="#49454F" text-anchor="middle">70B Q5 con comodidad</text>

<rect x="645" y="250" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
