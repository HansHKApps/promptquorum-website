<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Open WebUI vs SillyTavern: Which Fits Your Workflow?</text>

  <!-- Root box -->
  <rect x="280" y="50" width="240" height="50" rx="8" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">What's Your Primary</text>
  <text x="400" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Use Case?</text>

  <!-- Branch lines -->
  <line x1="400" y1="100" x2="170" y2="158" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="100" x2="630" y2="158" stroke="#6750A4" stroke-width="2"/>

  <!-- Second-level boxes -->
  <rect x="50" y="158" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="170" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Team / Professional</text>
  <text x="170" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Work</text>

  <rect x="510" y="158" width="240" height="52" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <text x="630" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Creative Writing /</text>
  <text x="630" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Character Roleplay</text>

  <!-- Vertical connectors -->
  <line x1="170" y1="210" x2="170" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="630" y1="210" x2="630" y2="248" stroke="#6750A4" stroke-width="2"/>

  <!-- Left final box: Open WebUI -->
  <rect x="50" y="248" width="240" height="170" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="50" y="248" width="240" height="4" rx="0" fill="#34A853"/>
  <text x="170" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Open WebUI</text>

  <circle cx="70" cy="300" r="7" fill="#34A853"/>
  <text x="70" y="304" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="85" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">Multi-user (built-in)</text>

  <circle cx="70" cy="326" r="7" fill="#34A853"/>
  <text x="70" y="330" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="85" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">Docker deploy (5 min)</text>

  <circle cx="70" cy="352" r="7" fill="#34A853"/>
  <text x="70" y="356" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="85" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">API keys, admin panel</text>

  <circle cx="70" cy="378" r="7" fill="#34A853"/>
  <text x="70" y="382" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="85" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">RAG plugins, doc upload</text>

  <!-- Right final box: SillyTavern -->
  <rect x="510" y="248" width="240" height="170" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="510" y="248" width="240" height="4" rx="0" fill="#7D5260"/>
  <text x="630" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7D5260" text-anchor="middle">SillyTavern</text>

  <circle cx="530" cy="300" r="7" fill="#7D5260"/>
  <text x="530" y="304" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="545" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">Character cards (JSON)</text>

  <circle cx="530" cy="326" r="7" fill="#7D5260"/>
  <text x="530" y="330" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="545" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">Lorebooks / world info</text>

  <circle cx="530" cy="352" r="7" fill="#7D5260"/>
  <text x="530" y="356" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="545" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">Group chat, TTS/STT</text>

  <circle cx="530" cy="378" r="7" fill="#EA4335"/>
  <text x="530" y="382" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">✗</text>
  <text x="545" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">No multi-user support</text>

  <text x="400" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Both frontends run identical backends (Ollama, vLLM, llama.cpp) — the choice depends on workflow, not inference speed.</text>
<text x="792" y="445" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
