<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; }
      .axis { stroke: #1C1B1F; stroke-width: 2; fill: none; }
      .grid { stroke: #E0E0E0; stroke-width: 1; fill: none; stroke-dasharray: 2,2; }
      .bar-bg { fill: #EAE1FF; }
      .bar-q4 { fill: #6750A4; }
      .bar-q5 { fill: #9575CD; }
      .bar-q8 { fill: #CE93D8; }
      .text-label { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 12px; }
      .text-value { fill: #FFFFFF; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .text-legend { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 11px; }
      .legend-box { stroke: #6750A4; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400"/>

  <!-- Title -->
  <text x="400" y="28" class="title" text-anchor="middle">モデルサイズ対VRAM要件</text>

  <!-- Y-axis label -->
  <text x="15" y="180" class="text-label" text-anchor="middle" transform="rotate(-90 15 180)">VRAM (GB)</text>

  <!-- Y-axis -->
  <line class="axis" x1="40" y1="30" x2="40" y2="280"/>
  <!-- X-axis -->
  <line class="axis" x1="40" y1="280" x2="750" y2="280"/>

  <!-- Grid lines and Y-axis labels -->
  <line class="grid" x1="40" y1="255" x2="750" y2="255"/>
  <text x="35" y="260" class="text-label" text-anchor="end">10</text>

  <line class="grid" x1="40" y1="205" x2="750" y2="205"/>
  <text x="35" y="210" class="text-label" text-anchor="end">20</text>

  <line class="grid" x1="40" y1="155" x2="750" y2="155"/>
  <text x="35" y="160" class="text-label" text-anchor="end">30</text>

  <line class="grid" x1="40" y1="105" x2="750" y2="105"/>
  <text x="35" y="110" class="text-label" text-anchor="end">40</text>

  <line class="grid" x1="40" y1="55" x2="750" y2="55"/>
  <text x="35" y="60" class="text-label" text-anchor="end">50</text>

  <!-- Y-axis tick marks -->
  <line class="axis" x1="35" y1="280" x2="40" y2="280"/>
  <line class="axis" x1="35" y1="255" x2="40" y2="255"/>
  <line class="axis" x1="35" y1="205" x2="40" y2="205"/>
  <line class="axis" x1="35" y1="155" x2="40" y2="155"/>
  <line class="axis" x1="35" y1="105" x2="40" y2="105"/>
  <line class="axis" x1="35" y1="55" x2="40" y2="55"/>

  <!-- 7B Model Group -->
  <!-- Background bar area -->
  <rect x="90" y="80" width="160" height="200" class="bar-bg" rx="4"/>

  <!-- Q4_K_M bar (6 GB) -->
  <rect x="100" y="230" width="50" height="50" class="bar-q4" rx="3"/>
  <text x="125" y="260" class="text-value" text-anchor="middle">6GB</text>

  <!-- Q5_K_M bar (8 GB) -->
  <rect x="155" y="210" width="50" height="70" class="bar-q5" rx="3"/>
  <text x="180" y="250" class="text-value" text-anchor="middle">8GB</text>

  <!-- Q8_0 bar (14 GB) -->
  <rect x="210" y="110" width="50" height="170" class="bar-q8" rx="3"/>
  <text x="235" y="190" class="text-value" text-anchor="middle">14GB</text>

  <!-- X label for 7B -->
  <text x="160" y="305" class="text-label" text-anchor="middle" style="font-weight: 600;">7Bパラメータ</text>
  <text x="160" y="320" class="text-label" text-anchor="middle" style="font-size: 10px; fill: #79747E;">Llama 3, Mistral</text>

  <!-- 14B Model Group -->
  <!-- Background bar area -->
  <rect x="330" y="80" width="160" height="200" class="bar-bg" rx="4"/>

  <!-- Q4_K_M bar (9 GB) -->
  <rect x="340" y="205" width="50" height="75" class="bar-q4" rx="3"/>
  <text x="365" y="245" class="text-value" text-anchor="middle">9GB</text>

  <!-- Q5_K_M bar (13 GB) -->
  <rect x="395" y="125" width="50" height="155" class="bar-q5" rx="3"/>
  <text x="420" y="205" class="text-value" text-anchor="middle">13GB</text>

  <!-- Q8_0 bar (28 GB) -->
  <rect x="450" y="55" width="50" height="225" class="bar-q8" rx="3"/>
  <text x="475" y="150" class="text-value" text-anchor="middle">28GB</text>

  <!-- X label for 14B -->
  <text x="410" y="305" class="text-label" text-anchor="middle" style="font-weight: 600;">14Bパラメータ</text>
  <text x="410" y="320" class="text-label" text-anchor="middle" style="font-size: 10px; fill: #79747E;">Qwen, Qwen Coder</text>

  <!-- 70B Model Group -->
  <!-- Background bar area -->
  <rect x="570" y="80" width="160" height="200" class="bar-bg" rx="4"/>

  <!-- Q4_K_M bar (43 GB) -->
  <rect x="580" y="30" width="50" height="250" class="bar-q4" rx="3"/>
  <text x="605" y="140" class="text-value" text-anchor="middle">43GB</text>

  <!-- Q5_K_M bar (53 GB) -->
  <rect x="635" y="30" width="50" height="250" class="bar-q5" rx="3"/>
  <text x="660" y="140" class="text-value" text-anchor="middle">53GB+</text>

  <!-- Q8_0 bar (140 GB) -->
  <rect x="690" y="30" width="50" height="250" class="bar-q8" rx="3"/>
  <text x="715" y="140" class="text-value" text-anchor="middle">140GB</text>

  <!-- X label for 70B -->
  <text x="660" y="305" class="text-label" text-anchor="middle" style="font-weight: 600;">70Bパラメータ</text>
  <text x="660" y="320" class="text-label" text-anchor="middle" style="font-size: 10px; fill: #79747E;">Llama 3, Command R</text>

  <!-- Legend -->
  <rect x="50" y="345" width="700" height="45" style="fill: #F7F2FA; stroke: #E8DEF8; stroke-width: 1;" rx="4"/>

  <rect x="60" y="355" width="12" height="12" class="bar-q4"/>
  <text x="77" y="363" class="text-legend">Q4_K_M (推奨デフォルト)</text>

  <rect x="330" y="355" width="12" height="12" class="bar-q5"/>
  <text x="347" y="363" class="text-legend">Q5_K_M (品質向上)</text>

  <rect x="590" y="355" width="12" height="12" class="bar-q8"/>
  <text x="607" y="363" class="text-legend">Q8_0 (最高品質、24GB+ VRAM必要)</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>