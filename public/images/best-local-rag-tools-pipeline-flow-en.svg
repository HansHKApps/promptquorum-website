<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">How Local RAG Turns Documents Into Answers</text>
  <line x1="100" y1="46" x2="700" y2="46" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Step 1 -->
  <circle cx="75" cy="110" r="20" fill="#6750A4"/>
  <text x="75" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="75" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Upload</text>
  <text x="75" y="168" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">PDFs, text files</text>

  <text x="156" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="237" cy="110" r="20" fill="#6750A4"/>
  <text x="237" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="237" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Chunk</text>
  <text x="237" y="168" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">split into pieces</text>

  <text x="318" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="399" cy="110" r="20" fill="#6750A4"/>
  <text x="399" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="399" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Embed</text>
  <text x="399" y="168" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">chunks to vectors</text>

  <text x="480" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="561" cy="110" r="20" fill="#6750A4"/>
  <text x="561" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="561" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Store</text>
  <text x="561" y="168" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">vector database</text>

  <text x="642" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 5 -->
  <circle cx="723" cy="110" r="20" fill="#34A853"/>
  <text x="723" y="116" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="723" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Retrieve</text>
  <text x="723" y="168" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">&amp; answer</text>

  <line x1="60" y1="200" x2="740" y2="200" stroke="#F7F2FA" stroke-width="1"/>

  <text x="400" y="230" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Documents are chunked, converted to embeddings, and stored in a vector database.</text>
  <text x="400" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">A question retrieves matching chunks, which the LLM uses to generate a sourced answer.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
