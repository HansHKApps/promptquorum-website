<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Mac Mini M5: Memory Tier vs Max Model Capacity</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">16 GB</text>
  <rect x="260" y="75" width="70" height="24" fill="#EA4335" rx="4"/>
  <text x="338" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">7B Q4 only</text>

  <text x="250" y="136" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">32 GB</text>
  <rect x="260" y="117" width="140" height="24" fill="#F4B400" rx="4"/>
  <text x="408" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Up to 13B Q4</text>

  <text x="250" y="178" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">36 GB</text>
  <rect x="260" y="159" width="158" height="24" fill="#7D5260" rx="4"/>
  <text x="426" y="176" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8B + Whisper + TTS</text>

  <text x="250" y="220" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">64 GB ★</text>
  <rect x="260" y="201" width="280" height="24" fill="#34A853" rx="4"/>
  <text x="548" y="218" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">34B — recommended</text>

  <text x="250" y="262" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">64 GB + 1TB</text>
  <rect x="260" y="243" width="280" height="24" fill="#6750A4" rx="4"/>
  <text x="548" y="260" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">50+ models on disk</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">64 GB Pro is the value sweet spot — comfortably runs 34B models; the 16 GB base is limited to 7B Q4.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
