<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud Smart Home vs. Local Smart Home</text>

  <!-- Left panel: Cloud -->
  <rect x="28" y="52" width="340" height="308" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="52" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="80" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, sans-serif">Cloud Smart Home</text>

  <!-- Right panel: Local -->
  <rect x="432" y="52" width="340" height="308" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="52" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="80" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, sans-serif">Local Smart Home</text>

  <!-- Row 1: Privacy -->
  <text x="48" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Privacy</text>
  <text x="48" y="126" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Usage &amp; voice data on vendor servers</text>
  <text x="452" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Privacy</text>
  <text x="452" y="126" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Data stays on your own hardware</text>
  <line x1="44" y1="138" x2="352" y2="138" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="448" y1="138" x2="756" y2="138" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Works offline -->
  <text x="48" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Works offline</text>
  <text x="48" y="178" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">No — most features need internet</text>
  <text x="452" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Works offline</text>
  <text x="452" y="178" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Yes — runs entirely on your LAN</text>
  <line x1="44" y1="190" x2="352" y2="190" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="448" y1="190" x2="756" y2="190" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: Subscriptions -->
  <text x="48" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Subscriptions</text>
  <text x="48" y="230" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Common (camera storage, premium tiers)</text>
  <text x="452" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Subscriptions</text>
  <text x="452" y="230" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">None — one-time hardware cost</text>
  <line x1="44" y1="242" x2="352" y2="242" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="448" y1="242" x2="756" y2="242" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: Data location -->
  <text x="48" y="264" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Data location</text>
  <text x="48" y="282" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Vendor data centre, often abroad</text>
  <text x="452" y="264" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Data location</text>
  <text x="452" y="282" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Your home</text>
  <line x1="44" y1="294" x2="352" y2="294" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="448" y1="294" x2="756" y2="294" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: AI capability -->
  <text x="48" y="316" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">AI capability</text>
  <text x="48" y="334" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Cloud assistant (Alexa, Google)</text>
  <text x="452" y="316" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">AI capability</text>
  <text x="452" y="334" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Local voice + optional local LLM</text>

  <text x="400" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">The dividing line is where the decision is made — not which brand you buy.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
