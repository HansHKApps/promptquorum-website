<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="27" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">Chunk Settings: Default vs Recommended (Step 7)</text>

  <!-- Left panel: Default (red) -->
  <rect x="18" y="42" width="367" height="240" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="18" y="42" width="367" height="4" rx="0" fill="#EA4335"/>
  <text x="201" y="68" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">Default — Poor Retrieval</text>
  <text x="201" y="86" font-size="10" fill="#79747E" text-anchor="middle">AnythingLLM out-of-the-box settings</text>

  <text x="36" y="115" font-size="12" font-weight="700" fill="#1C1B1F">Chunk Size</text>
  <text x="260" y="115" font-size="22" font-weight="700" fill="#EA4335" text-anchor="middle">512</text>
  <text x="320" y="115" font-size="11" fill="#49454F">tokens</text>

  <text x="36" y="147" font-size="12" font-weight="700" fill="#1C1B1F">Overlap</text>
  <text x="260" y="147" font-size="22" font-weight="700" fill="#EA4335" text-anchor="middle">0</text>
  <text x="320" y="147" font-size="11" fill="#49454F">tokens</text>

  <text x="36" y="179" font-size="12" font-weight="700" fill="#1C1B1F">Top-K</text>
  <text x="260" y="179" font-size="22" font-weight="700" fill="#EA4335" text-anchor="middle">4</text>
  <text x="320" y="179" font-size="11" fill="#49454F">chunks</text>

  <line x1="36" y1="195" x2="367" y2="195" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="201" y="218" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle">Problem: Sentences split at chunk</text>
  <text x="201" y="234" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle">boundaries are silently dropped</text>
  <text x="201" y="256" font-size="10" fill="#79747E" text-anchor="middle">Result: Retrieval misses relevant context</text>
  <text x="201" y="272" font-size="10" fill="#79747E" text-anchor="middle">PDFs rarely fit cleanly in 512-token windows</text>

  <!-- Right panel: Recommended (green) -->
  <rect x="415" y="42" width="367" height="240" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="415" y="42" width="367" height="4" rx="0" fill="#34A853"/>
  <text x="598" y="68" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">Recommended — Better Retrieval</text>
  <text x="598" y="86" font-size="10" fill="#79747E" text-anchor="middle">Workspace Settings → Vector Database</text>

  <text x="433" y="115" font-size="12" font-weight="700" fill="#1C1B1F">Chunk Size</text>
  <text x="657" y="115" font-size="22" font-weight="700" fill="#34A853" text-anchor="middle">1000</text>
  <text x="717" y="115" font-size="11" fill="#49454F">tokens</text>

  <text x="433" y="147" font-size="12" font-weight="700" fill="#1C1B1F">Overlap</text>
  <text x="657" y="147" font-size="22" font-weight="700" fill="#34A853" text-anchor="middle">200</text>
  <text x="717" y="147" font-size="11" fill="#49454F">tokens</text>

  <text x="433" y="179" font-size="12" font-weight="700" fill="#1C1B1F">Top-K</text>
  <text x="657" y="179" font-size="22" font-weight="700" fill="#34A853" text-anchor="middle">4–6</text>
  <text x="717" y="179" font-size="11" fill="#49454F">chunks</text>

  <line x1="433" y1="195" x2="775" y2="195" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="598" y="218" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">Result: Sentences crossing chunk</text>
  <text x="598" y="234" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">boundaries appear in the overlap window</text>
  <text x="598" y="256" font-size="10" fill="#79747E" text-anchor="middle">Re-embed time: ~5 sec for 20 PDFs / 3000 chunks</text>
  <text x="598" y="272" font-size="10" fill="#79747E" text-anchor="middle">Biggest single retrieval-quality lever in AnythingLLM</text>

  <!-- Footer -->
  <line x1="18" y1="295" x2="782" y2="295" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="314" font-size="11" fill="#79747E" text-anchor="middle">Where to change: Workspace Settings → Vector Database → save → re-embed when prompted</text>
  <text x="400" y="332" font-size="10" fill="#79747E" text-anchor="middle">Short docs (1-page memos, code): try 256/64 instead if 1000/200 makes retrieval worse</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
