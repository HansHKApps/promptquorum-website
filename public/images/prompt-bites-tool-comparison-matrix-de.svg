<text x="30" y="278" class="feature" text-anchor="start">Am besten geeignet für:</text>
<text x="30" y="298" class="cell-text" text-anchor="start">• Ollama: Entwickler, Automatisierung, Headless-Server (CLI-first, einfache API)</text>
<text x="30" y="318" class="cell-text" text-anchor="start">• LM Studio: Desktop-Nutzer mit Wunsch nach ausgereifter GUI, Einsteiger</text>
<text x="30" y="338" class="cell-text" text-anchor="start">• Jan: Open-Source-Desktop-App mit zusätzlichem CLI, plattformübergreifend</text>
<text x="30" y="358" class="cell-text" text-anchor="start">• llama.cpp: Maximale Kontrolle und Leistung, die Engine hinter vielen Tools</text>
<text x="30" y="378" class="cell-text" text-anchor="start">• KoboldCpp: Einzeldatei-App für Rollenspiel und kreatives Schreiben</text>
<text x="30" y="398" class="cell-text" text-anchor="start">• GPT4All: Einfacher Offline-Chat auf normalen PCs, Fragen zu Dokumenten</text>
<text x="30" y="420" class="cell-text" font-weight="600" text-anchor="start">Empfehlung: Starten Sie mit Ollama (Power-User) oder LM Studio / Jan (GUI). llama.cpp für volle Kontrolle.</text>
<text x="30" y="440" class="cell-text" style="fill:#79747E" text-anchor="start">✓✓ ausgezeichnet · ✓ ja · ~ teilweise · ✗ nein</text>
