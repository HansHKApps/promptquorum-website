<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="360" fill="#FFFFFF"/>

  <text x="400" y="30" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install to First Response: 4 Steps, Under 10 Minutes</text>

  <!-- Arrows between steps -->
  <text x="205" y="108" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>
  <text x="395" y="108" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>
  <text x="585" y="108" font-size="22" fill="#6750A4" text-anchor="middle">&#8594;</text>

  <!-- Step 1 -->
  <circle cx="110" cy="100" r="26" fill="#6750A4"/>
  <text x="110" y="108" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install Ollama</text>
  <text x="110" y="176" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">brew install ollama</text>
  <text x="110" y="192" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">or curl install.sh</text>
  <text x="110" y="210" font-size="10" font-weight="600" fill="#79747E" text-anchor="middle">~2 min</text>

  <!-- Step 2 -->
  <circle cx="300" cy="100" r="26" fill="#6750A4"/>
  <text x="300" y="108" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pull the Model</text>
  <text x="300" y="176" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">ollama pull llama3.2:3b</text>
  <text x="300" y="192" font-size="10" fill="#49454F" text-anchor="middle">~2 GB download</text>
  <text x="300" y="210" font-size="10" font-weight="600" fill="#79747E" text-anchor="middle">2-5 min</text>

  <!-- Step 3 -->
  <circle cx="490" cy="100" r="26" fill="#6750A4"/>
  <text x="490" y="108" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="490" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Run and Chat</text>
  <text x="490" y="176" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">ollama run llama3.2</text>
  <text x="490" y="192" font-size="10" fill="#49454F" text-anchor="middle">opens &gt;&gt;&gt; prompt</text>
  <text x="490" y="210" font-size="10" font-weight="600" fill="#79747E" text-anchor="middle">instant</text>

  <!-- Step 4 -->
  <circle cx="680" cy="100" r="26" fill="#34A853"/>
  <text x="680" y="108" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="680" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">First Response</text>
  <text x="680" y="176" font-size="10" fill="#49454F" text-anchor="middle">5-30s model load</text>
  <text x="680" y="192" font-size="10" fill="#49454F" text-anchor="middle">then streams live</text>
  <text x="680" y="210" font-size="10" font-weight="600" fill="#34A853" text-anchor="middle">total: &lt;10 min</text>

  <line x1="50" y1="255" x2="750" y2="255" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="40" y="270" width="720" height="66" fill="#F7F2FA" rx="4"/>
  <text x="400" y="295" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">No API key, no account, no cloud dependency</text>
  <text x="400" y="316" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">After the one-time model download, every step runs fully offline -- terminal chat only, no internet needed.</text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
