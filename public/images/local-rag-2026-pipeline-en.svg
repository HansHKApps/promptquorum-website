<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <marker id="rag2026-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6750A4"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local RAG Architecture: Indexing vs. Query Pipeline</text>
  <line x1="80" y1="46" x2="720" y2="46" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Indexing lane label -->
  <text x="70" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="start">INDEXING (runs once per document)</text>

  <!-- Indexing lane nodes -->
  <circle cx="70" cy="112" r="20" fill="#6750A4"/>
  <text x="70" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="70" y="148" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Documents</text>
  <text x="70" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">PDF, text, web</text>

  <line x1="94" y1="112" x2="171" y2="112" stroke="#6750A4" stroke-width="2" marker-end="url(#rag2026-arrow)"/>

  <circle cx="195" cy="112" r="20" fill="#6750A4"/>
  <text x="195" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="195" y="148" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Chunk</text>
  <text x="195" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">500-1000 tok, 20% overlap</text>

  <line x1="219" y1="112" x2="296" y2="112" stroke="#6750A4" stroke-width="2" marker-end="url(#rag2026-arrow)"/>

  <circle cx="320" cy="112" r="20" fill="#6750A4"/>
  <text x="320" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="320" y="148" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Embed</text>
  <text x="320" y="163" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">768-1536 dim vector</text>

  <line x1="339" y1="127" x2="404" y2="158" stroke="#6750A4" stroke-width="2" marker-end="url(#rag2026-arrow)"/>

  <!-- Vector DB cylinder -->
  <line x1="405" y1="165" x2="405" y2="225" stroke="#6750A4" stroke-width="2"/>
  <line x1="515" y1="165" x2="515" y2="225" stroke="#6750A4" stroke-width="2"/>
  <rect x="405" y="165" width="110" height="60" fill="#FFFFFF" stroke="none"/>
  <ellipse cx="460" cy="225" rx="55" ry="13" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <ellipse cx="460" cy="165" rx="55" ry="13" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
  <text x="460" y="199" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Vector DB</text>
  <text x="460" y="215" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Chroma / Qdrant / Milvus</text>

  <!-- Query lane label -->
  <text x="70" y="252" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34A853" text-anchor="start">QUERY TIME (runs on every question)</text>

  <circle cx="70" cy="292" r="20" fill="#34A853"/>
  <text x="70" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q</text>
  <text x="70" y="328" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Question</text>
  <text x="70" y="343" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">user query</text>

  <line x1="94" y1="292" x2="171" y2="292" stroke="#34A853" stroke-width="2" marker-end="url(#rag2026-arrow)"/>

  <circle cx="195" cy="292" r="20" fill="#34A853"/>
  <text x="195" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
  <text x="195" y="328" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Embed query</text>
  <text x="195" y="343" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">same embedding model</text>

  <line x1="216" y1="278" x2="404" y2="220" stroke="#34A853" stroke-width="2" marker-end="url(#rag2026-arrow)"/>

  <!-- Output box -->
  <line x1="516" y1="195" x2="558" y2="195" stroke="#6750A4" stroke-width="2" marker-end="url(#rag2026-arrow)"/>
  <rect x="560" y="130" width="200" height="130" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="560" y="130" width="200" height="4" rx="0" fill="#34A853"/>
  <text x="660" y="157" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">Retrieve to Generate</text>
  <text x="580" y="183" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="start">Top-K chunks retrieved</text>
  <text x="580" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="start">(k = 5-10)</text>
  <text x="580" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="start">Local LLM generates the</text>
  <text x="580" y="239" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="start">answer with sources attributed</text>

  <line x1="60" y1="360" x2="740" y2="360" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Indexing runs once per document; query time runs on every question against the same vector store.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
