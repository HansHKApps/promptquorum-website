  <text x="666" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">±</text>
  <line x1="18" y1="227" x2="782" y2="227" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 5: GPU Auto-Detect -->
