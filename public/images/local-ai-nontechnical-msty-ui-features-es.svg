  <circle cx="666" cy="245" r="10" fill="#F4B400"/>
  <text x="666" y="250" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">±</text>
  <line x1="18" y1="263" x2="782" y2="263" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Footer -->
  <text x="400" y="281" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">✓ Exclusivo de Msty  ·  ± Tambi&#xe9;n en otras apps  ·  promptquorum.com</text>
