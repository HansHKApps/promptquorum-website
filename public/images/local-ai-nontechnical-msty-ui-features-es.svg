  <text x="310" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">Arrastra PDF/DOCX a la barra lateral y pregunta al instante</text>
  <circle cx="666" cy="137" r="10" fill="#F4B400"/>
  <text x="666" y="142" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">±</text>
