<svg viewBox="0 0 800 295" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="295" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Msty — Funciones clave para usuarios no t&#xe9;cnicos</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Gratis para uso personal · Windows, macOS, Linux</text>
  <!-- Column headers -->
  <text x="75" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Funci&#xf3;n</text>
  <text x="310" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Qu&#xe9; significa para ti</text>
  <text x="648" y="74" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">&#xbf;&#xda;nica?</text>
  <line x1="18" y1="81" x2="782" y2="81" stroke="#E8DEF8" stroke-width="1.5"/>
