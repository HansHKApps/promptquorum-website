<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="450" fill="#FFFFFF"/>

  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1C1B1F" text-anchor="middle">VRAM Required by Model Size (Q4)</text>

  <!-- Chart area: baseline y=380, top y=80, scale 45GB max -->
  <line x1="70" y1="380" x2="770" y2="380" stroke="#79747E" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="60" y="384" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">0GB</text>
  <text x="60" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">15GB</text>
  <text x="60" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">30GB</text>
  <text x="60" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">45GB</text>

  <!-- Reference line: $1,000 build = 16GB VRAM ceiling -->
  <line x1="70" y1="273" x2="770" y2="273" stroke="#6750A4" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="775" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">$1,000 build: 16GB</text>

  <!-- Reference line: $2,000 build = 32GB VRAM ceiling -->
  <line x1="70" y1="167" x2="770" y2="167" stroke="#7D5260" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="775" y="164" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7D5260">$2,000 build: 32GB</text>

  <!-- Bar: 7B ~5GB -->
  <rect x="110" y="347" width="100" height="33" fill="#34A853" rx="4"/>
  <text x="160" y="335" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~5GB</text>
  <text x="160" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">7B</text>

  <!-- Bar: 14B ~9GB -->
  <rect x="260" y="320" width="100" height="60" fill="#34A853" rx="4"/>
  <text x="310" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~9GB</text>
  <text x="310" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">14B</text>

  <!-- Bar: 32B ~15GB (fits 16GB build tightly) -->
  <rect x="410" y="280" width="100" height="100" fill="#F4B400" rx="4"/>
  <text x="460" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~15GB</text>
  <text x="460" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">32B</text>

  <!-- Bar: 70B ~40GB (needs the $2,000 dual-GPU build) -->
  <rect x="560" y="113" width="100" height="267" fill="#7D5260" rx="4"/>
  <text x="610" y="101" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">~40GB</text>
  <text x="610" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F" text-anchor="middle">70B</text>

  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">32B fits the $1,000 build at a tight Q4 quantization; 70B needs the $2,000 dual-GPU build's 32GB combined VRAM.</text>
<text x="792" y="445" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
