<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pick Your Local-AI PC Build by Model Size</text>

  <!-- Root question -->
  <rect x="230" y="40" width="340" height="48" rx="8" fill="#6750A4"/>
  <text x="400" y="61" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">What's the largest model you</text>
  <text x="400" y="78" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">want to run?</text>

  <!-- Branch lines -->
  <line x1="400" y1="88" x2="130" y2="182" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="88" x2="400" y2="182" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="88" x2="670" y2="182" stroke="#6750A4" stroke-width="2"/>

  <!-- Branch labels, offset off the line per style-guide rule -->
  <text x="188" y="128" font-size="11" font-weight="700" fill="#79747E" text-anchor="end">7B-13B</text>
  <text x="420" y="128" font-size="11" font-weight="700" fill="#79747E" text-anchor="start">14B-33B</text>
  <text x="612" y="128" font-size="11" font-weight="700" fill="#79747E" text-anchor="start">70B</text>

  <!-- Leaf 1: Budget -->
  <rect x="20" y="182" width="220" height="152" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="1.5"/>
  <text x="130" y="206" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">7B-13B models</text>
  <line x1="36" y1="216" x2="224" y2="216" stroke="#F7F2FA" stroke-width="1"/>
  <text x="130" y="238" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">Budget Build</text>
  <text x="130" y="260" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">RTX 4060 Ti 16GB</text>
  <text x="130" y="296" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">~$1,100</text>
  <text x="130" y="318" font-size="11" fill="#79747E" text-anchor="middle">650W PSU</text>

  <!-- Leaf 2: Mid (Editor's Choice) -->
  <rect x="290" y="182" width="220" height="152" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="2.5"/>
  <text x="400" y="202" font-size="9.5" font-weight="700" fill="#6750A4" text-anchor="middle">EDITOR'S CHOICE</text>
  <text x="400" y="222" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">14B-33B models</text>
  <line x1="306" y1="230" x2="494" y2="230" stroke="#E8DEF8" stroke-width="1"/>
  <text x="400" y="252" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">Mid Build</text>
  <text x="400" y="274" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#1C1B1F" text-anchor="middle">RTX 4070 Ti Super 16GB</text>
  <text x="400" y="308" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">~$2,400</text>
  <text x="400" y="326" font-size="11" fill="#79747E" text-anchor="middle">850W PSU</text>

  <!-- Leaf 3: Enthusiast -->
  <rect x="560" y="182" width="220" height="152" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="1.5"/>
  <text x="670" y="206" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">70B models</text>
  <line x1="576" y1="216" x2="764" y2="216" stroke="#F7F2FA" stroke-width="1"/>
  <text x="670" y="238" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">Enthusiast Build</text>
  <text x="670" y="260" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">RTX 5090 32GB</text>
  <text x="670" y="296" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">~$5,000</text>
  <text x="670" y="318" font-size="11" fill="#79747E" text-anchor="middle">1000W PSU</text>

  <text x="400" y="362" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">A verified-working used GPU lowers any tier's total — confirm the power supply and case fit before ordering.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
