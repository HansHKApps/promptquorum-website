<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">8 GB RAM Budget: Safe Model vs. 7B Model (Swap Risk)</text>

  <!-- Legend -->
  <rect x="140" y="46" width="14" height="14" fill="#79747E" rx="2"/>
  <text x="160" y="57" font-size="11" fill="#49454F">OS (2.5–3.5 GB)</text>
  <rect x="300" y="46" width="14" height="14" fill="#6750A4" rx="2"/>
  <text x="320" y="57" font-size="11" fill="#49454F">Model + KV cache</text>
  <rect x="480" y="46" width="14" height="14" fill="#34A853" rx="2"/>
  <text x="500" y="57" font-size="11" fill="#49454F">Free headroom</text>
  <rect x="620" y="46" width="14" height="14" fill="#EA4335" rx="2"/>
  <text x="640" y="57" font-size="11" fill="#49454F">Over budget</text>

  <!-- 8 GB ceiling line -->
  <line x1="700" y1="72" x2="700" y2="256" stroke="#1C1B1F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="266" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">8 GB ceiling</text>

  <!-- Row 1: Phi-4 Mini (safe) -->
  <text x="140" y="88" font-size="13" font-weight="700" fill="#1C1B1F">Phi-4 Mini 3.8B Q4 — fits safely</text>
  <rect x="140" y="94" width="210" height="28" fill="#79747E"/>
  <rect x="350" y="94" width="245" height="28" fill="#6750A4"/>
  <rect x="595" y="94" width="105" height="28" fill="#34A853"/>
  <text x="245" y="112" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">~3 GB</text>
  <text x="472" y="112" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">~3.5 GB</text>
  <text x="647" y="112" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">~1.5 GB free</text>

  <!-- Row 2: 7B model (unsafe) -->
  <text x="140" y="208" font-size="13" font-weight="700" fill="#1C1B1F">7B Q4 model — exceeds budget, triggers swap</text>
  <rect x="140" y="214" width="210" height="28" fill="#79747E"/>
  <rect x="350" y="214" width="420" height="28" fill="#EA4335"/>
  <rect x="700" y="214" width="70" height="28" fill="#EA4335" opacity="0.55"/>
  <text x="245" y="232" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">~3 GB</text>
  <text x="525" y="232" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">~6 GB (model + KV cache)</text>

  <line x1="140" y1="280" x2="770" y2="280" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="300" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">7B Q4 needs ≈ 9 GB total (OS + model + KV cache), 1 GB past the 8 GB ceiling — that overflow forces swap and cuts tokens/sec by 5–10×.</text>
  <text x="400" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Phi-4 Mini 3.8B Q4_K_M stays under budget with ≈ 1.5 GB of headroom left for the OS and background apps.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
