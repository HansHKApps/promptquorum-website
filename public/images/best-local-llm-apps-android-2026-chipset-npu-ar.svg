  <text x="297" y="154.29" font-size="24" font-weight="700" fill="#34A853" text-anchor="middle">Snapdragon 8 Elite</text>
  <text x="297" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Galaxy S25 Ultra, OnePlus 13</text>

  <text x="72" y="260.36" font-size="18" font-weight="700" fill="#79747E">Hexagon NPU مكشوف للتطبيقات</text>
  <text x="72" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#34A853">~22 tok/sec</text>
  <text x="72" y="351" font-size="17.25" fill="#49454F">MLC Chat، Phi-4 Mini، مسار NPU</text>
  <line x1="72" y1="378" x2="522" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="72" y="428.14" font-size="18" fill="#49454F">يصل أيضًا إلى نحو 40 tok/sec على</text>
  <text x="72" y="462.86" font-size="18" fill="#49454F">نموذج Qwen3 1.7B الأصغر — أسرع بمقدار</text>
  <text x="72" y="497.57" font-size="18" fill="#49454F">3 إلى 4 مرات من التطبيقات التي</text>
  <text x="72" y="532.29" font-size="18" fill="#49454F">تعتمد على المعالج فقط في نفس الهاتف.</text>

  <rect x="648" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
