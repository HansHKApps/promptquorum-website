  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">نفس نموذج Phi-4 Mini، نفس التكميم — التفاوت في كشف NPU للشريحة هو ما يفسر الفرق.</text>
