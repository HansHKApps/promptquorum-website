<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="360" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">CPU vs iGPU vs GPU for Local LLMs</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Estimated speeds. Speed ≈ memory bandwidth ÷ model file size.</text>
  <rect x="18" y="58" width="365" height="272" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="18" y="58" width="365" height="5" fill="#6750A4"/>
  <rect x="417" y="58" width="365" height="272" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="417" y="58" width="365" height="5" fill="#34A853"/>
  <text x="200" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#6750A4" text-anchor="middle">CPU only / iGPU</text>
  <text x="200" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="middle">no setup — runs everywhere</text>
  <text x="38" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Small models (3B–4B):</text>
  <text x="38" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">est. 10–25 tok/sec</text>
  <line x1="32" y1="158" x2="370" y2="158" stroke="#E8DEF8" stroke-width="1"/>
  <text x="38" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Tiny models (1.7B):</text>
  <text x="38" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">est. 25–40 tok/sec</text>
  <text x="38" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">(depends on RAM bandwidth + quant)</text>
  <line x1="32" y1="224" x2="370" y2="224" stroke="#E8DEF8" stroke-width="1"/>
  <text x="38" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6750A4">iGPU (Intel Iris, AMD Radeon):</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">Shares system RAM: modest gain,</text>
  <text x="38" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">depends on drivers — check ollama ps</text>
  <text x="600" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Discrete GPU</text>
  <text x="600" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F" text-anchor="middle">typically 5–10× faster than CPU-only</text>
  <text x="435" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Speed:</text>
  <text x="435" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853">typically 5–10× CPU-only</text>
  <line x1="430" y1="158" x2="770" y2="158" stroke="#D4EDDA" stroke-width="1"/>
  <text x="435" y="178" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Setup:</text>
  <text x="435" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">GPU driver (CUDA, ROCm or Vulkan)</text>
  <text x="435" y="214" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">(the model must fit in VRAM)</text>
  <line x1="430" y1="224" x2="770" y2="224" stroke="#D4EDDA" stroke-width="1"/>
  <text x="435" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#34A853">Best for:</text>
  <text x="435" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Interactive chat</text>
  <text x="435" y="285" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Coding assistance</text>
  <text x="435" y="305" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓ Larger models (if they fit in VRAM)</text>
  <text x="400" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#79747E" text-anchor="middle">vs</text>
  <text x="400" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
