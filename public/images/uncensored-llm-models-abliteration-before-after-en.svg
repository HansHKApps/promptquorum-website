<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <title id="t">Abliteration: original model versus abliterated model</title>
  <desc id="d">In the original model, weight matrices can add the refusal direction to the residual stream. In the abliterated model, the weights are edited so they cannot write along that direction. No retraining is used.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Abliteration: what changes in the weights</text>
  <rect x="40" y="62" width="380" height="290" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#991b1b">Original model</text>
  <rect x="70" y="120" width="140" height="54" rx="8" fill="#ffffff" stroke="#475569"/><text x="140" y="152" text-anchor="middle" font-size="13" fill="#0f172a">Weight matrix W</text>
  <rect x="250" y="120" width="140" height="54" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="320" y="152" text-anchor="middle" font-size="13" fill="#0c4a6e">Residual stream</text>
  <defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs>
  <line x1="210" y1="147" x2="248" y2="147" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="230" y="215" text-anchor="middle" font-size="14" fill="#7f1d1d">W can write along the refusal direction</text>
  <text x="230" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Harmful request: refusal signal is added</text>
  <text x="230" y="295" text-anchor="middle" font-size="22" fill="#991b1b">"I can't help with that."</text>
  <rect x="480" y="62" width="380" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="670" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Abliterated model</text>
  <rect x="510" y="120" width="140" height="54" rx="8" fill="#ffffff" stroke="#475569"/><text x="580" y="152" text-anchor="middle" font-size="13" fill="#0f172a">Edited matrix W'</text>
  <rect x="690" y="120" width="140" height="54" rx="8" fill="#e0f2fe" stroke="#0369a1"/><text x="760" y="152" text-anchor="middle" font-size="13" fill="#0c4a6e">Residual stream</text>
  <line x1="650" y1="147" x2="688" y2="147" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="670" y="215" text-anchor="middle" font-size="14" fill="#14532d">W' is orthogonal to the refusal direction</text>
  <text x="670" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Same request: no refusal signal is added</text>
  <text x="670" y="295" text-anchor="middle" font-size="22" fill="#166534">The model answers.</text>
  <text x="450" y="215" text-anchor="middle" font-size="26" fill="#334155">&#8594;</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#334155">edit</text>
  <text x="450" y="392" text-anchor="middle" font-size="14" fill="#0f172a">No retraining: the weights are projected so they can no longer write along the direction.</text>
  <text x="450" y="414" text-anchor="middle" font-size="12" fill="#475569">Possible costs: small capability loss, notably on truthfulness benchmarks (Arditi et al., 2024). Simplified.</text>
<text x="892" y="425" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
