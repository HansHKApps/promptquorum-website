<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">どちらを選ぶべきか：ローカルLLM vs クラウドAPI</text><rect x="28" y="50" width="340" height="310" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/><rect x="28" y="50" width="340" height="4" rx="0" fill="#6750A4"/><text x="198" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#6750A4" text-anchor="middle">ローカルLLMを選ぶ場合：</text><circle cx="58" cy="125" r="11" fill="#6750A4"/><text x="58" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">機密・規制対象データ</text><circle cx="58" cy="180" r="11" fill="#6750A4"/><text x="58" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">高頻度・大量の利用</text><circle cx="58" cy="235" r="11" fill="#6750A4"/><text x="58" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">オフラインアクセスが必要</text><circle cx="58" cy="290" r="11" fill="#6750A4"/><text x="58" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">LLMの仕組みを学びたい</text><rect x="432" y="50" width="340" height="310" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/><rect x="432" y="50" width="340" height="4" rx="0" fill="#7D5260"/><text x="602" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#7D5260" text-anchor="middle">クラウドAPIを選ぶ場合：</text><circle cx="462" cy="125" r="11" fill="#7D5260"/><text x="462" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">最高品質が必要</text><circle cx="462" cy="180" r="11" fill="#7D5260"/><text x="462" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">セットアップの手間を避けたい</text><circle cx="462" cy="235" r="11" fill="#7D5260"/><text x="462" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">インフラ管理なしでプロトタイピング</text><circle cx="462" cy="290" r="11" fill="#7D5260"/><text x="462" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="