<text x="44" y="608" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Las velocidades varían en torno a ±15 % según el prompt y la ventana de contexto.</text>
<text x="1156" y="661" font-size="13" fill="#8A8591" text-anchor="end">promptquorum.com</text>
