  <text x="220" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">مُعطّل صراحةً</text>
  <text x="420" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">مفتوح المصدر — تدقيق github.com/janhq/jan</text>
  <rect x="18" y="209" width="764" height="46" fill="#FEF7E0" rx="4"/>
  <text x="40" y="229" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">GPT4All</text>
