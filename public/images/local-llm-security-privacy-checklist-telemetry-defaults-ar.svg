  <text x="420" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">كيفية التأكيد/التعطيل</text>
  <line x1="18" y1="63" x2="782" y2="63" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="59" width="764" height="46" fill="#E6F4EA" rx="4"/>
  <text x="40" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">Ollama ★</text>
  <text x="220" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">لا يُجمع شيء</text>
  <text x="420" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">مفتوح المصدر — لا يوجد كود تحليلات</text>
  <rect x="18" y="109" width="764" height="46" fill="#FEF7E0" rx="4"/>
  <text x="40" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">LM Studio</text>
  <text x="220" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">تحليلات مجهولة مُفعّلة</text>
  <text x="420" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">الإعدادات ← الخصوصية ← إلغاء تحديد بيانات الاستخدام</text>
  <rect x="18" y="159" width="764" height="46" fill="#E6F4EA" rx="4"/>
