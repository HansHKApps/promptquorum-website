  <text x="420" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">الإعدادات ← الخصوصية ← تعطيل التحليلات</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">لا يجمع Ollama وJan AI أي شيء افتراضيًا؛ يأتي LM Studio وGPT4All بتحليلات مفعّلة — تحقق من الإعدادات.</text>
<text x="792" y="315" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>