<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Apple Silicon Unified Memory vs NVIDIA Discrete GPU Architektur für lokale LLMs"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <title>Apple MLX vs NVIDIA CUDA Architektur: Unified Memory vs Dediziertes VRAM</title>
  <rect width="800" height="350" fill="#F6F5FA"/>
  <rect x="20" y="20" width="360" height="310" rx="12" fill="#EAE6F8" stroke="#6750A4" stroke-width="2"/>
  <rect x="420" y="20" width="360" height="310" rx="12" fill="#E8F5E9" stroke="#34A853" stroke-width="2"/>
  <text x="200" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">Apple Silicon (MLX)</text>
  <text x="600" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">NVIDIA CUDA</text>
  <rect x="40" y="60" width="320" height="220" rx="8" fill="#6750A4" opacity="0.12" stroke="#6750A4" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="200" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4A3F99">UNIFIED MEMORY POOL — 128 GB</text>
  <text x="200" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4A3F99">614 GB/s Bandbreite</text>
  <rect x="55" y="110" width="90" height="50" rx="6" fill="#6750A4"/>
  <text x="100" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">CPU</text>
  <text x="100" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ddd">10-Kerne</text>
  <rect x="155" y="110" width="90" height="50" rx="6" fill="#6750A4"/>
  <text x="200" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">GPU</text>
  <text x="200" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ddd">40-Kerne</text>
  <rect x="255" y="110" width="90" height="50" rx="6" fill="#6750A4"/>
  <text x="300" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">Neural</text>
  <text x="300" y="147" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ddd">38 TOPS</text>
  <text x="200" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4A3F99">⟷ Zero-Copy-Zugriff — keine Bus-Transfers</text>
  <text x="200" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#4A3F99">Llama 3 70B Q4 (~38 GB) ✓ passt rein</text>
  <rect x="55" y="255" width="310" height="30" rx="6" fill="#6750A4" opacity="0.2"/>
  <text x="210" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#4A3F99">18 Tok/s @ 70B — Einzelgerät 5.999 €</text>
  <rect x="440" y="65" width="140" height="70" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="510" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#333">System-RAM</text>
  <text x="510" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">64–128 GB DDR5</text>
  <text x="510" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#888">~60 GB/s</text>
  <rect x="600" y="65" width="160" height="70" rx="6" fill="#1C1B1F" opacity="0.85"/>
  <text x="680" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">CPU</text>
  <text x="680" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ccc">Ryzen/Core</text>
  <text x="680" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ccc">via PCIe verbunden</text>
  <line x1="510" y1="135" x2="510" y2="165" stroke="#EA4335" stroke-width="2.5" marker-end="url(#arrowde)"/>
  <text x="535" y="157" font-family="system-ui,sans-serif" font-size="9" fill="#EA4335">PCIe 4.0 ×16</text>
  <text x="535" y="169" font-family="system-ui,sans-serif" font-size="9" fill="#EA4335">~32 GB/s Flaschenhals</text>
  <rect x="440" y="175" width="320" height="75" rx="6" fill="#34A853" opacity="0.15" stroke="#34A853" stroke-width="1.5"/>
  <text x="600" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#1A6B33">GPU VRAM — 24 GB GDDR6X</text>
  <text x="600" y="213" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#1A6B33">1.008 GB/s Bandbreite</text>
  <text x="600" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#EA4335">✗ 70B (~38 GB) überschreitet VRAM um 14 GB</text>
  <rect x="440" y="265" width="320" height="30" rx="6" fill="#EA4335" opacity="0.15"/>
  <text x="600" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#B71C1C">150 Tok/s @ 8B — 70B braucht 2 Karten</text>
  <defs>
    <marker id="arrowde" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#EA4335"/>
    </marker>
  </defs>
  <circle cx="400" cy="175" r="18" fill="#1C1B1F"/>
  <text x="400" y="181" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">VS</text>
