<svg viewBox="0 0 800 590" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="590" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Entscheidungsdiagramm: Vier Fragen zum Speicher</text>
  <line x1="50" y1="125" x2="50" y2="208" stroke="#6750A4" stroke-width="2"/>
  <polygon points="45,208 55,208 50,216" fill="#6750A4"/>
  <circle cx="50" cy="105" r="20" fill="#6750A4"/>
  <text x="50" y="111" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="95" y="57" width="685" height="96" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="115" y="85" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1C1B1F">1. Teilen mehrere Rechner die Bibliothek?</text>
  <text x="115" y="111" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#EA4335">Nein: schnelle SSD + externe Sicherung genügt</text>
  <text x="115" y="135" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34A853">Ja: NAS nötig — weiter</text>
  <line x1="50" y1="250" x2="50" y2="333" stroke="#6750A4" stroke-width="2"/>
  <polygon points="45,333 55,333 50,341" fill="#6750A4"/>
  <circle cx="50" cy="230" r="20" fill="#6750A4"/>
  <text x="50" y="236" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="95" y="182" width="685" height="96" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="115" y="210" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1C1B1F">2. Synology oder QNAP?</text>
  <text x="115" y="236" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6750A4">Synology: einfachste Software</text>
  <text x="115" y="260" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6750A4">QNAP: mehr CPU &amp; Anschlüsse pro Euro</text>
  <line x1="50" y1="375" x2="50" y2="458" stroke="#6750A4" stroke-width="2"/>
  <polygon points="45,458 55,458 50,466" fill="#6750A4"/>
  <circle cx="50" cy="355" r="20" fill="#6750A4"/>
  <text x="50" y="361" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="95" y="307" width="685" height="96" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="115" y="335" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1C1B1F">3. Welche SSD für den Inferenzrechner?</text>
  <text x="115" y="361" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6750A4">Samsung 990 Pro: schnellstes Laden</text>
  <text x="115" y="385" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6750A4">WD Black SN850X: günstiger bei Rabatt</text>
  <circle cx="50" cy="480" r="20" fill="#6750A4"/>
  <text x="50" y="486" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <rect x="95" y="432" width="685" height="96" rx="8" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="115" y="460" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1C1B1F">4. Ist das NAS außer Haus gesichert?</text>
  <text x="115" y="486" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#F4B400">Nein: 3-2-1-Regel vor Produktivstart ergänzen</text>
  <text x="115" y="510" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34A853">Ja: bereit — RAID 6 + externes Backup</text>
  <text x="400" y="565" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Ein einzelner Entwickler endet bei SSD plus externer Platte; eine geteilte Bibliothek endet bei einem RAID-6-NAS mit externem Backup.</text>
<text x="792" y="585" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>