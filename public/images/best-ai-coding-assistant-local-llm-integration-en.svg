<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1C1B1F; }
      .axis-label { font-size: 12px; font-weight: 600; fill: #79747E; }
      .tool-name { font-size: 13px; font-weight: 700; fill: #1C1B1F; }
      .feature { font-size: 10px; font-weight: 500; fill: #49454F; }
      .check { fill: #34A853; }
      .partial { fill: #F4B400; }
      .cross { fill: #EA4335; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="400" y="35" class="title" text-anchor="middle">Local LLM Integration Depth Comparison</text>

  <!-- Axes -->
  <line x1="80" y1="400" x2="720" y2="400" stroke="#49454F" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="80" stroke="#49454F" stroke-width="2"/>

  <!-- Axis Labels -->
  <text x="400" y="430" class="axis-label" text-anchor="middle">Setup Ease →</text>
  <text x="35" y="240" class="axis-label" text-anchor="middle">Feature</text>
  <text x="35" y="255" class="axis-label" text-anchor="middle">Complete</text>
  <text x="35" y="270" class="axis-label" text-anchor="middle">↑</text>

  <!-- Grid lines -->
  <line x1="80" y1="300" x2="720" y2="300" stroke="#E8DEF8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="400" y1="80" x2="400" y2="400" stroke="#E8DEF8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Quadrant labels -->
  <text x="240" y="100" class="axis-label" opacity="0.5">Fiddly +</text>
  <text x="240" y="115" class="axis-label" opacity="0.5">Limited</text>

  <text x="560" y="100" class="axis-label" opacity="0.5">Easy +</text>
  <text x="560" y="115" class="axis-label" opacity="0.5">Complete</text>

  <text x="240" y="385" class="axis-label" opacity="0.5">Fiddly +</text>
  <text x="240" y="400" class="axis-label" opacity="0.5">Limited</text>

  <text x="560" y="385" class="axis-label" opacity="0.5">Easy +</text>
  <text x="560" y="400" class="axis-label" opacity="0.5">Limited</text>

  <!-- Continue.dev - Top Right (Easy + Complete) -->
  <circle cx="620" cy="120" r="35" fill="#6750A4" opacity="0.2" stroke="#6750A4" stroke-width="2"/>
  <circle cx="620" cy="120" r="30" fill="#6750A4" opacity="0.15"/>
  <text x="620" y="125" class="tool-name" text-anchor="middle">Continue.dev</text>

  <!-- Cursor - Right Center (Moderate) -->
  <circle cx="550" cy="240" r="30" fill="#7D5260" opacity="0.2" stroke="#7D5260" stroke-width="2"/>
  <circle cx="550" cy="240" r="25" fill="#7D5260" opacity="0.15"/>
  <text x="550" y="245" class="tool-name" text-anchor="middle" font-size="12">Cursor</text>

  <!-- Cody - Center (Balanced) -->
  <circle cx="400" cy="200" r="28" fill="#34A853" opacity="0.2" stroke="#34A853" stroke-width="2"/>
  <circle cx="400" cy="200" r="23" fill="#34A853" opacity="0.15"/>
  <text x="400" y="205" class="tool-name" text-anchor="middle">Cody</text>

  <!-- Tabnine - Bottom Left (Complex) -->
  <circle cx="200" cy="330" r="32" fill="#EA4335" opacity="0.2" stroke="#EA4335" stroke-width="2"/>
  <circle cx="200" cy="330" r="27" fill="#EA4335" opacity="0.15"/>
  <text x="200" y="335" class="tool-name" text-anchor="middle">Tabnine</text>

  <!-- Windsurf - Center-Right (Rising) -->
  <circle cx="480" cy="180" r="26" fill="#3C4BF0" opacity="0.2" stroke="#3C4BF0" stroke-width="2"/>
  <circle cx="480" cy="180" r="21" fill="#3C4BF0" opacity="0.15"/>
  <text x="480" y="185" class="tool-name" text-anchor="middle" font-size="11">Windsurf</text>

  <!-- Feature Matrix Below -->
  <line x1="40" y1="420" x2="760" y2="420" stroke="#E8DEF8" stroke-width="1"/>

  <text x="60" y="440" class="title" font-size="14">Feature Support (All Local):</text>

  <!-- Row 1: Chat -->
  <text x="70" y="460" class="feature">Chat with local:</text>
  <text x="250" y="460" class="check">✅</text>
  <text x="280" y="460" class="feature">Continue.dev</text>
  <text x="420" y="460" class="check">✅</text>
  <text x="450" y="460" class="feature">Cursor</text>
  <text x="590" y="460" class="check">✅</text>
  <text x="620" y="460" class="feature">Cody</text>

  <!-- Watermark -->
  <text x="750" y="445" class="axis-label" text-anchor="end">© 2026 PromptQuorum</text>
</svg>