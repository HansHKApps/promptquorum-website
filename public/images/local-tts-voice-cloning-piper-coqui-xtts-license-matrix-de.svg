  <text x="782.4" y="428.14" font-size="17.25" fill="#49454F">Schnelleres Zero-Shot-Klonen (~3 Sek.</text>
  <text x="782.4" y="459" font-size="17.25" fill="#49454F">Referenzaudio), gleiche Einschränkung.</text>

  <text x="782.4" y="559.29" font-size="16.5" fill="#79747E">Beide benötigen vor dem produktiven</text>
  <text x="782.4" y="590.14" font-size="16.5" fill="#79747E">Einsatz eine separate Kommerzvereinbarung.</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">Sachliche Referenz, keine Rechtsberatung — prüfen Sie jede Lizenz selbst vor kommerziellem Einsatz.</text>
