<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F" text-anchor="middle">RAG local : Applications clés en main vs frameworks</text>
  <line x1="40" y1="38" x2="760" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Left panel -->
  <rect x="44" y="48" width="345" height="278" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="44" y="48" width="345" height="44" rx="6" fill="#34A853"/>
  <rect x="44" y="76" width="345" height="16" fill="#34A853"/>
  <text x="216" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Applications clés en main</text>
  <text x="216" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E8F5E9" text-anchor="middle">Sans code</text>

  <text x="60" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">AnythingLLM</text>
  <text x="60" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— solution tout-en-un la plus simple</text>
  <text x="60" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">PrivateGPT</text>
  <text x="60" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— entièrement hors ligne</text>
  <text x="60" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Quivr</text>
  <text x="60" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— base de connaissances perso</text>
  <text x="60" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">RAGFlow</text>
  <text x="60" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— recherche niveau citation</text>
  <text x="60" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Khoj</text>
  <text x="60" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— syncs Obsidian/Notion</text>

  <!-- Right panel -->
  <rect x="411" y="48" width="345" height="278" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="411" y="48" width="345" height="44" rx="6" fill="#6750A4"/>
  <rect x="411" y="76" width="345" height="16" fill="#6750A4"/>
  <text x="583" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bibliothèques framework</text>
  <text x="583" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E8DEF8" text-anchor="middle">À personnaliser</text>

  <text x="427" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">LlamaIndex</text>
  <text x="427" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— framework RAG Python</text>
  <text x="427" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Haystack</text>
  <text x="427" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— recherche + RAG par deepset</text>
  <text x="427" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Dify</text>
  <text x="427" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— constructeur de workflow visuel</text>
  <text x="427" y="229" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Flowise</text>
  <text x="427" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— visual LangChain</text>
  <text x="427" y="266" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">txtai</text>
  <text x="427" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">— base vectorielle + LLM intégrée</text>

  <text x="400" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com</text>
</svg>
