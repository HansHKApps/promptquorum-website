<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local AI PC Build 2026: 3 Budget Tiers Compared</text>

  <!-- Header row -->
  <text x="30" y="66" font-size="12" font-weight="700" fill="#79747E">Tier</text>
  <text x="140" y="66" font-size="12" font-weight="700" fill="#79747E">GPU</text>
  <text x="340" y="66" font-size="12" font-weight="700" fill="#79747E">VRAM</text>
  <text x="410" y="66" font-size="12" font-weight="700" fill="#79747E">Runs</text>
  <text x="590" y="66" font-size="12" font-weight="700" fill="#79747E">PSU</text>
  <text x="670" y="66" font-size="12" font-weight="700" fill="#79747E">Total</text>
  <line x1="20" y1="74" x2="780" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: Budget -->
  <text x="30" y="106" font-size="13" font-weight="700" fill="#1C1B1F">Budget</text>
  <text x="140" y="106" font-size="12" fill="#49454F">RTX 4060 Ti</text>
  <circle cx="355" cy="102" r="16" fill="#34A853"/>
  <text x="355" y="106" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">16GB</text>
  <text x="410" y="106" font-size="12" fill="#49454F">7B-13B models</text>
  <text x="590" y="106" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">650W</text>
  <text x="670" y="106" font-size="13" font-weight="700" fill="#1C1B1F">~$1,100</text>
  <line x1="20" y1="122" x2="780" y2="122" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Mid (Editor's Choice highlight) -->
  <rect x="20" y="130" width="760" height="46" fill="#F7F2FA"/>
  <text x="30" y="150" font-size="13" font-weight="700" fill="#6750A4">Mid</text>
  <text x="30" y="167" font-size="9.5" font-weight="700" fill="#6750A4">EDITOR'S CHOICE</text>
  <text x="140" y="158" font-size="12" fill="#1C1B1F">RTX 4070 Ti Super</text>
  <circle cx="355" cy="154" r="16" fill="#34A853"/>
  <text x="355" y="158" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">16GB</text>
  <text x="410" y="158" font-size="12" fill="#1C1B1F">14B-33B models</text>
  <text x="590" y="158" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#1C1B1F">850W</text>
  <text x="670" y="158" font-size="13" font-weight="700" fill="#1C1B1F">~$2,400</text>
  <line x1="20" y1="176" x2="780" y2="176" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: Enthusiast -->
  <text x="30" y="208" font-size="13" font-weight="700" fill="#1C1B1F">Enthusiast</text>
  <text x="140" y="208" font-size="12" fill="#49454F">RTX 5090</text>
  <circle cx="355" cy="204" r="16" fill="#F4B400"/>
  <text x="355" y="208" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">32GB</text>
  <text x="410" y="208" font-size="12" fill="#49454F">33B-70B models</text>
  <text x="590" y="208" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">1000W</text>
  <text x="670" y="208" font-size="13" font-weight="700" fill="#1C1B1F">~$5,000</text>
  <line x1="20" y1="224" x2="780" y2="224" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">GPU VRAM sets the tier — CPU, RAM, and the power supply are sized to support it, from 650 W up to 1000 W.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
