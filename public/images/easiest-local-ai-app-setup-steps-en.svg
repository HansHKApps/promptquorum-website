  <text x="300" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install &amp; Open</text>
  <text x="300" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Run installer</text>
  <text x="300" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Accept any prompts</text>

