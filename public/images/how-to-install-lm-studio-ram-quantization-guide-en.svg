<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Which Quantization Fits Your RAM?</text>

  <!-- Left panel: 8 GB Minimum -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#F4B400"/>
  <text x="198" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F4B400" text-anchor="middle">8 GB RAM (Minimum)</text>

  <text x="48" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Quantization:</text>
  <text x="348" y="115" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">Q4_K_M</text>
  <line x1="48" y1="127" x2="348" y2="127" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">File size (7B model):</text>
  <text x="348" y="155" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">~4.5 GB</text>
  <line x1="48" y1="167" x2="348" y2="167" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Quality vs full precision:</text>
  <text x="348" y="195" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">~1% loss</text>
  <line x1="48" y1="207" x2="348" y2="207" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Free RAM needed:</text>
  <text x="348" y="235" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">~5.4 GB</text>

  <text x="198" y="300" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">File size × 1.2 = RAM headroom needed</text>

  <!-- Right panel: 16 GB Recommended -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">16 GB RAM (Recommended)</text>

  <text x="452" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Quantization:</text>
  <text x="752" y="115" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">Q5_K_M / Q6_K</text>
  <line x1="452" y1="127" x2="752" y2="127" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">File size (7B model):</text>
  <text x="752" y="155" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">~5.7–6.5 GB</text>
  <line x1="452" y1="167" x2="752" y2="167" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Quality vs full precision:</text>
  <text x="752" y="195" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">near-lossless</text>
  <line x1="452" y1="207" x2="752" y2="207" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Extra headroom for:</text>
  <text x="752" y="235" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="600" fill="#49454F" text-anchor="end">8K+ context</text>

  <text x="602" y="300" font-family="system-ui, sans-serif" font-size="10.5" fill="#79747E" text-anchor="middle">Better for long conversations and RAG context</text>

  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Rule of thumb in LM Studio: multiply the model file size by 1.2 to estimate required RAM --</text>
  <text x="400" y="382" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">a 4.5 GB Q4_K_M file needs about 5.4 GB of free RAM to load.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
