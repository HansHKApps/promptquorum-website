<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="300" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">API hospedada vs. DeepSeek auto-hospedado offline</text>

  <rect x="28" y="52" width="340" height="180" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="52" width="340" height="4" fill="#EA4335"/>
  <text x="198" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#EA4335" text-anchor="middle">API hospedada (Nuvem)</text>

  <rect x="432" y="52" width="340" height="180" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="52" width="340" height="4" fill="#34A853"/>
  <text x="602" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">Auto-hospedado offline (Local)</text>

  <text x="48" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Onde os dados ficam</text>
  <text x="48" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">Enviados a um servidor remoto</text>
  <text x="452" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Onde os dados ficam</text>
  <text x="452" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">Permanecem na sua própria máquina</text>
  <line x1="48" y1="120" x2="348" y2="120" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="120" x2="752" y2="120" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Endpoint estrangeiro</text>
  <text x="48" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">Alcançável / necessário</text>
  <text x="452" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Endpoint estrangeiro</text>
  <text x="452" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">Nenhum a alcançar</text>
  <line x1="48" y1="164" x2="348" y2="164" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="452" y1="164" x2="752" y2="164" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Dependência</text>
  <text x="48" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EA4335">Depende da rede / disponibilidade da API</text>
  <text x="452" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#79747E">Dependência</text>
  <text x="452" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34A853">Roda inteiramente em local</text>

  <text x="400" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">A auto-hospedagem offline remove o endpoint estrangeiro e a dependência de rede da API hospedada.</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
