<text x="30" y="278" class="feature" text-anchor="start">추천 용도:</text>
<text x="30" y="298" class="cell-text" text-anchor="start">• Ollama: 개발자, 자동화, 헤드리스 서버 (CLI 우선, 간단한 API)</text>
<text x="30" y="318" class="cell-text" text-anchor="start">• LM Studio: 완성도 높은 GUI를 원하는 데스크톱 사용자, 초보자</text>
<text x="30" y="338" class="cell-text" text-anchor="start">• Jan: CLI도 제공하는 오픈소스 데스크톱 앱, 크로스 플랫폼</text>
<text x="30" y="358" class="cell-text" text-anchor="start">• llama.cpp: 최대한의 제어와 성능, 많은 도구의 기반 엔진</text>
<text x="30" y="378" class="cell-text" text-anchor="start">• KoboldCpp: 롤플레이와 창작 글쓰기용 단일 파일 앱</text>
<text x="30" y="398" class="cell-text" text-anchor="start">• GPT4All: 일반 PC에서 쓰는 간단한 오프라인 채팅, 문서 Q&amp;A</text>
<text x="30" y="420" class="cell-text" font-weight="600" text-anchor="start">추천: Ollama(파워 유저) 또는 LM Studio / Jan(GUI)으로 시작하세요. 완전한 제어가 필요하면 llama.cpp.</text>
<text x="30" y="440" class="cell-text" style="fill:#79747E" text-anchor="start">✓✓ 우수 · ✓ 지원 · ~ 부분 · ✗ 미지원</text>
