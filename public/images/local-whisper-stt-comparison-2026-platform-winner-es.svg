<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="57.86" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1C1B1F" text-anchor="middle">Whisper en Local: Cada Herramienta Gana en su Plataforma</text>

  <!-- Left panel: Apple Silicon / whisper.cpp -->
  <rect x="42" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="42" y="100.29" width="510" height="7.71" rx="0" fill="#6750A4"/>
  <text x="297" y="154.29" font-size="24" font-weight="700" fill="#6750A4" text-anchor="middle">Apple Silicon — whisper.cpp</text>

  <text x="72" y="216" font-size="18" font-weight="700" fill="#79747E">large-v3, M5 Pro, Metal</text>
  <text x="72" y="270" font-family="'SF Mono', Monaco, monospace" font-size="33" font-weight="700" fill="#6750A4">~10&#215; tiempo real</text>
  <line x1="72" y1="298.93" x2="522" y2="298.93" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="72" y="351" font-size="18" font-weight="700" fill="#79747E">faster-whisper en el mismo Mac (solo CPU)</text>
  <text x="72" y="397.29" font-family="'SF Mono', Monaco, monospace" font-size="24" font-weight="700" fill="#79747E">~3&#215; tiempo real</text>

  <text x="72" y="482.14" font-size="18" fill="#49454F">Sin dependencia de Python —</text>
  <text x="72" y="516.86" font-size="18" fill="#49454F">la exportación a Core ML usa</text>
  <text x="72" y="551.57" font-size="18" fill="#49454F">el Apple Neural Engine directamente.</text>

  <!-- Right panel: NVIDIA GPU / faster-whisper -->
  <rect x="648" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="648" y="100.29" width="510" height="7.71" rx="0" fill="#7D5260"/>
  <text x="903" y="154.29" font-size="24" font-weight="700" fill="#7D5260" text-anchor="middle">NVIDIA GPU — faster-whisper</text>

  <text x="678" y="216" font-size="18" font-weight="700" fill="#79747E">large-v3, RTX 4070, int8</text>
  <text x="678" y="270" font-family="'SF Mono', Monaco, monospace" font-size="33" font-weight="700" fill="#7D5260">~12&#215; tiempo real</text>
  <line x1="678" y1="298.93" x2="1128" y2="298.93" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="678" y="351" font-size="18" font-weight="700" fill="#79747E">whisper.cpp en la misma GPU (CUDA)</text>
  <text x="678" y="397.29" font-family="'SF Mono', Monaco, monospace" font-size="24" font-weight="700" fill="#79747E">~8&#215; tiempo real</text>

  <text x="678" y="482.14" font-size="18" fill="#49454F">Usa solo ~2.5 GB de VRAM vía</text>
  <text x="678" y="516.86" font-size="18" fill="#49454F">cuantización int8 — un 40% menos</text>
  <text x="678" y="551.57" font-size="18" fill="#49454F">que los ~3 GB de whisper.cpp en la misma GPU.</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">Ambos runtimes transcriben con el mismo 2.5% WER — la diferencia está solo en la velocidad, no en la precisión.</text>
<text x="1188" y="665.36" font-family="system-ui,sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
