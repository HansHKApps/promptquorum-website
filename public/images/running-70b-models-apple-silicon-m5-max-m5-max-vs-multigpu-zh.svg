  <text x="48" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">价格：</text>
  <text x="150" y="108" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">$4,000（Mac Studio）</text>

  <text x="48" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">内存：</text>
  <text x="150" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">128 GB统一内存</text>

  <text x="48" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">带宽：</text>
  <text x="150" y="160" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">460–614 GB/s</text>

