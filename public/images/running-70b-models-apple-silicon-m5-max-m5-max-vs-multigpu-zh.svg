  <text x="554" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">48 GB显存（2×24GB）</text>

  <text x="452" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">带宽：</text>
  <text x="554" y="160" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">每卡约1,000 GB/s</text>

