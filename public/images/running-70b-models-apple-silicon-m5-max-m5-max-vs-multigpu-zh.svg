  <text x="452" y="204" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#1C1B1F">18–25 tokens/秒</text>

  <text x="452" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">需要GPU编排管理，</text>
  <text x="452" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">额外电源功率和散热需求。</text>
