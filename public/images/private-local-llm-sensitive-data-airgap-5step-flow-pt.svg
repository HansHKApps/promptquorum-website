<rect width="800" height="360" fill="#FFFFFF"/>
<text x="400" y="34" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Implantação air-gapped: fluxo de dados em 5 etapas</text>
<circle cx="80" cy="110" r="22" fill="#6750A4"/>
<text x="80" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="80" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Isolamento físico</text>
<text x="80" y="180" font-size="10" fill="#49454F" text-anchor="middle">Sala trancada,</text>
<text x="80" y="195" font-size="10" fill="#49454F" text-anchor="middle">sem rede</text>
<text x="160" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="240" cy="110" r="22" fill="#6750A4"/>
<text x="240" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="240" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Carga do modelo</text>
<text x="240" y="180" font-size="10" fill="#49454F" text-anchor="middle">Download prévio, USB</text>
<text x="320" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="400" cy="110" r="22" fill="#6750A4"/>
<text x="400" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="400" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Entrada de dados</text>
<text x="400" y="180" font-size="10" fill="#49454F" text-anchor="middle">USB</text>
<text x="400" y="195" font-size="10" fill="#49454F" text-anchor="middle">criptografado (GPG)</text>
<text x="480" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="560" cy="110" r="22" fill="#6750A4"/>
<text x="560" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="560" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Inferência offline</text>
<text x="560" y="180" font-size="10" fill="#49454F" text-anchor="middle">Ollama / vLLM,</text>
<text x="560" y="195" font-size="10" fill="#49454F" text-anchor="middle">sem rede</text>
<text x="640" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
