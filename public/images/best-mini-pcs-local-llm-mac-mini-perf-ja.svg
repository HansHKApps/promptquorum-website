  <rect width="800" height="260" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui">Mac Mini M6 / M5 Pro：性能 vs 価格</text>
  <text x="50" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui">Mac mini構成</text>
  <text x="290" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui">7B Q4 tok/s</text>
  <text x="490" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui">70B Q4 tok/s</text>
  <text x="680" y="65" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui">価格</text>
  <line x1="18" y1="72" x2="782" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="50" y="99" font-size="12" fill="#1C1B1F" font-family="system-ui">M6（16-32 GB）</text>
  <text x="290" y="99" font-size="12" fill="#49454F" font-family="system-ui">未検証</text>
  <text x="490" y="99" font-size="12" fill="#EA4335" font-family="system-ui">不可</text>
  <text x="680" y="99" font-size="12" fill="#49454F" font-family="system-ui">$899</text>
  <line x1="18" y1="108" x2="782" y2="108" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="18" y="118" width="764" height="28" fill="#E8DEF8" rx="2"/>
  <text x="50" y="137" font-size="12" font-weight="700" fill="#1C1B1F" font-family="system-ui">M5 Pro（24-64 GB）</text>
  <text x="290" y="137" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui">未検証</text>
  <text x="490" y="137" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui">未検証</text>
  <text x="680" y="137" font-size="12" font-weight="700" fill="#6750A4" font-family="system-ui">$1,699</text>
  <text x="400" y="230" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle" font-family="system-ui">70Bモデルには64 GB統合メモリ（M5 Pro）推奨 — 独立したtok/sベンチマークはまだなし</text>
