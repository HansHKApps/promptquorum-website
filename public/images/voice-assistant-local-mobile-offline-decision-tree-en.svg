<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Which Voice Assistant Path Should You Build?</text>

  <!-- Root node -->
  <rect x="270" y="38" width="260" height="34" rx="6" fill="#6750A4"/>
  <text x="400" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">What matters most to you?</text>

  <!-- Branch lines: root to level 1 -->
  <line x1="400" y1="72" x2="190" y2="112" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="72" x2="610" y2="112" stroke="#6750A4" stroke-width="2"/>
  <text x="250" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E" text-anchor="end">PRIVACY</text>
  <text x="550" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E" text-anchor="start">MORE POWER</text>

  <!-- Level 1 nodes -->
  <rect x="60" y="112" width="260" height="34" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <text x="190" y="134" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#34A853" text-anchor="middle">Fully On-Device</text>

  <rect x="480" y="112" width="260" height="34" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <text x="610" y="134" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#7D5260" text-anchor="middle">Hybrid / Cloud-Assisted</text>

  <!-- Branch lines: level 1 to leaves -->
  <line x1="190" y1="146" x2="105" y2="182" stroke="#34A853" stroke-width="1.5"/>
  <line x1="190" y1="146" x2="285" y2="182" stroke="#34A853" stroke-width="1.5"/>
  <text x="120" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="end">SIMPLEST</text>
  <text x="262" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="start">FLEXIBLE</text>

  <line x1="610" y1="146" x2="515" y2="182" stroke="#7D5260" stroke-width="1.5"/>
  <line x1="610" y1="146" x2="695" y2="182" stroke="#7D5260" stroke-width="1.5"/>
  <text x="530" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="end">70B QUALITY</text>
  <text x="678" y="166" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="start">LIVE DATA</text>

  <!-- Leaf boxes -->
  <rect x="18" y="182" width="174" height="86" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="182" width="174" height="4" fill="#34A853"/>
  <text x="105" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">iPhone</text>
  <text x="105" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">WhisperKit + LLM Farm</text>
  <text x="105" y="233" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#34A853" text-anchor="middle">~0.9–1.4 sec · ~25–35%</text>
  <text x="105" y="253" font-family="system-ui, sans-serif" font-size="9.5" fill="#79747E" text-anchor="middle">Fully private, offline</text>

  <rect x="198" y="182" width="174" height="86" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="198" y="182" width="174" height="4" fill="#34A853"/>
  <text x="285" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Android</text>
  <text x="285" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Layla or Termux stack</text>
  <text x="285" y="233" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#34A853" text-anchor="middle">~1.0–2.0 sec · ~25–40%</text>
  <text x="285" y="253" font-family="system-ui, sans-serif" font-size="9.5" fill="#79747E" text-anchor="middle">Fully private, offline</text>

  <rect x="428" y="182" width="174" height="86" rx="6" fill="#FEF7E0" stroke="#F4B400" stroke-width="1.5"/>
  <rect x="428" y="182" width="174" height="4" fill="#F4B400"/>
  <text x="515" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Hybrid</text>
  <text x="515" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Phone STT + home Ollama 70B</text>
  <text x="515" y="233" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#8A6D00" text-anchor="middle">~1.5–2.5 sec · ~10–15%</text>
  <text x="515" y="253" font-family="system-ui, sans-serif" font-size="9.5" fill="#79747E" text-anchor="middle">70B quality, needs home Wi-Fi</text>

  <rect x="608" y="182" width="174" height="86" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="608" y="182" width="174" height="4" fill="#79747E"/>
  <text x="695" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud Assistant</text>
  <text x="695" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">Siri / Google Assistant</text>
  <text x="695" y="233" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#79747E" text-anchor="middle">Web search, smart home</text>
  <text x="695" y="253" font-family="system-ui, sans-serif" font-size="9.5" fill="#EA4335" text-anchor="middle">Not offline</text>

  <text x="400" y="292" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Start fully on-device (iPhone or Android); add the hybrid path only if you need 70B-class quality over home Wi-Fi.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
