<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="LM Studio vs Jan vs GPT4All — 무엇을 설치해야 합니까?">
  <rect width="800" height="350" fill="#FFFFFF" rx="12"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">LM Studio vs Jan vs GPT4All — 무엇을 설치해야 합니까?</text>

  <!-- Subtitle -->
  <text x="400" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">상황에 맞는 앱을 고르십시오 — 세 앱 모두 무료이며 오프라인 작동</text>

  <!-- Top separator -->
  <line x1="20" y1="54" x2="780" y2="54" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Column headers -->
  <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="start">상황</text>
  <text x="680" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">선택</text>

  <!-- Header underline -->
  <line x1="20" y1="78" x2="780" y2="78" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1 — y=100 -->
  <text x="20" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">RTX 3060 이상 또는 M3 이상 Mac, 최대 속도</text>
  <rect x="590" y="82" width="180" height="26" rx="13" fill="#6750A4"/>
  <text x="680" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LM Studio</text>
  <line x1="20" y1="120" x2="780" y2="120" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2 — y=136 -->
  <text x="20" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">완전 오픈소스 코드, 텔레메트리 없음</text>
  <rect x="590" y="118" width="180" height="26" rx="13" fill="#34A853"/>
  <text x="680" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jan</text>
  <line x1="20" y1="156" x2="780" y2="156" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3 — y=172 -->
  <text x="20" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">4년 된 노트북, RAM 8 GB, GPU 없음</text>
  <rect x="590" y="154" width="180" height="26" rx="13" fill="#7D5260"/>
  <text x="680" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPT4All</text>
  <line x1="20" y1="192" x2="780" y2="192" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4 — y=208 -->
  <text x="20" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">설정 없이 PDF를 채팅에 첨부</text>
  <rect x="590" y="190" width="180" height="26" rx="13" fill="#6750A4"/>
  <text x="680" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LM Studio / Jan</text>
  <line x1="20" y1="228" x2="780" y2="228" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5 — y=244 -->
  <text x="20" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">개인정보 검토: 감사 가능한 소스 코드</text>
  <rect x="590" y="226" width="180" height="26" rx="13" fill="#34A853"/>
  <text x="680" y="243" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jan</text>
  <line x1="20" y1="264" x2="780" y2="264" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6 — y=280 -->
  <text x="20" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="start">비기술 사용자, 가장 간단한 설치</text>
  <rect x="590" y="262" width="180" height="26" rx="13" fill="#7D5260"/>
  <text x="680" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPT4All</text>
  <line x1="20" y1="300" x2="780" y2="300" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Footer -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">LM Studio로 시작하십시오 — 대부분의 사용자에게 기본 추천 · 세 앱은 GGUF 모델 파일을 공유 · promptquorum.com</text>
</svg>
