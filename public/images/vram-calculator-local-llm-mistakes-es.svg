<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata><rect width="800" height="350" fill="#FFFFFF"/><text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">4 errores comunes de VRAM</text><rect x="40" y="55" width="720" height="30" fill="#EA4335" stroke="#E8DEF8" stroke-width="1"/><text x="400" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#x274c; Error n.&#xba; 1: olvidar la sobrecarga del contexto</text><text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">Un modelo 7B en Q4 parece de 3.5 GB, pero con un contexto de 4k necesita 5&#x2013;6 GB en total.</text><rect x="40" y="118" width="720" height="30" fill="#EA4335" stroke="#E8DEF8" stroke-width="1"/><text x="400" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#x274c; Error n.&#xba; 2: confundir 70B con 70 GB de VRAM</text><text x="60" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">70B significa 70 mil millones de par&#xe1;metros. La VRAM necesaria es (70 &#xd7; bits) &#xf7; 8, no 70 GB fijos.</text><rect x="40" y="181" width="720" height="30" fill="#EA4335" stroke="#E8DEF8" stroke-width="1"/><text x="400" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#x274c; Error n.&#xba; 3: ignorar la sobrecarga del sistema</text><text x="60" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">El SO + el framework de inferencia reservan 1&#x2013;2 GB. Tu GPU nunca dispone de toda la capacidad.</text><rect x="40" y="244" width="720" height="30" fill="#EA4335" stroke="#E8DEF8" stroke-width="1"/><text x="400" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#x274c; Error n.&#xba; 4: comprar una GPU justo del tama&#xf1;o calculado</text><text x="60" y="289" font-family="system-ui, -apache-system, sans-serif" font-size="11" fill="#49454F">&#xbf;Necesitas 18 GB? Compra 24 GB. &#xbf;Necesitas 35 GB? Compra 40 GB. A&#xf1;ade siempre un margen del 25%.</text><text x="400" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">&#x2190; Volver al art&#xed;culo</text><text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>