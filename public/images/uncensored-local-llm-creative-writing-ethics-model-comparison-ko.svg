  <text x="400" y="348" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Hermes 3는 지시 품질과 무검열 범위의 균형이 가장 좋음 — 완전 절제 모델은 더 빨리 벗어나고 문장 품질도 낮음.</text>
<text x="792" y="365" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>