  <text x="470" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">광범위</text>
  <text x="570" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">16–24 GB 시스템, 더 넓은 범위</text>
