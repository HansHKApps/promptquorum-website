  <text x="330" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">~5 GB</text>
  <text x="470" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">선택적</text>
  <text x="570" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">리소스 제약, 대화문</text>
