  <text x="40" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4">Hermes 3 Llama 3.3 70B ★</text>
  <text x="330" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">~42 GB</text>
  <text x="470" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">선택적</text>
  <text x="570" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">기본 선택 — 지시 이행이 가장 우수함</text>
  <text x="40" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Dolphin 3.0 Mistral 24B</text>
