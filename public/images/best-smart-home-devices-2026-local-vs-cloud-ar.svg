<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>

  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle" direction="rtl">الأجهزة المحلية مقابل السحابية فقط</text>

  <!-- Right-to-left: primary panel on the right (Cloud-Only) -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="602" y="82" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle" direction="rtl">سحابية فقط (تجنّب)</text>

  <text x="752" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✗ يتطلب حساب سحابي من الشركة المصنّعة</text>
  <text x="752" y="150" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✗ يتوقف عن العمل عند تعطل السحابة</text>
  <text x="752" y="182" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✗ غالبًا يتطلب اشتراكًا مدفوعًا</text>
  <text x="752" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✗ تغادر اللقطات أو البيانات منزلك</text>
  <text x="752" y="246" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✗ لا توجد واجهة برمجية محلية موثقة</text>

  <line x1="452" y1="270" x2="752" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="752" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E" text-anchor="end" direction="rtl">مثال على المخاطر:</text>
  <text x="752" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#EA4335" text-anchor="end" direction="rtl">مصابيح تعمل بالتطبيق فقط، كاميرات DVR سحابية</text>

  <!-- Left panel (Local-Capable / Goal) -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="198" y="82" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle" direction="rtl">قادرة محليًا (اشترِ)</text>

  <text x="348" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✓ Zigbee أو Z-Wave أو Matter أو واجهة محلية</text>
  <text x="348" y="150" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✓ يعمل دون إنترنت عبر مركز محلي</text>
  <text x="348" y="182" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✓ لا اشتراك للميزات الأساسية</text>
  <text x="348" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✓ تبقى البيانات واللقطات على شبكتك</text>
  <text x="348" y="246" font-family="system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#49454F" text-anchor="end" direction="rtl">✓ يعمل مع أي علامة تجارية عبر المركز</text>

  <line x1="48" y1="270" x2="348" y2="270" stroke="#F7F2FA" stroke-width="1"/>
  <text x="348" y="300" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E" text-anchor="end" direction="rtl">مثال على الاختيار:</text>
  <text x="348" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#34A853" text-anchor="end" direction="rtl">مصابيح Zigbee، بث RTSP محلي + Frigate</text>

  <text x="400" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle" direction="rtl">قاعدة الاختيار: يجب أن يعمل الجهاز عبر مركز محلي دون الاعتماد على سحابة من الشركة المصنّعة.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
