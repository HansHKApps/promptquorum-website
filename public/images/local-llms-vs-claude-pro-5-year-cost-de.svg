  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Lokales Setup mit gebrauchter GPU erreicht die Gewinnschwelle bei Claude Pro nach etwa 50 Monaten; eine neue GPU bleibt über 5 Jahre teurer.</text>
