  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">M5 Max 128GBにおける70B量子化のトレードオフ</text>

  <text x="40" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">量子化</text>
  <text x="230" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">サイズ</text>
  <text x="370" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">tok/s（M5 Max）</text>
  <text x="530" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">品質低下</text>
  <text x="670" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">128GBに収まる？</text>
  <line x1="18" y1="72" x2="782" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="40" y="98" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Q4_K_M</text>
  <text x="230" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">42 GB</text>
  <text x="370" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">15–20</text>
  <text x="530" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">FP16比 約3–5%</text>
  <text x="670" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ はい</text>
  <line x1="18" y1="108" x2="782" y2="108" stroke="#F7F2FA" stroke-width="1"/>

  <rect x="18" y="112" width="764" height="36" fill="#F7F2FA"/>
  <text x="40" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#6750A4">Q5_K_M ★</text>
  <text x="230" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">49 GB</text>
  <text x="370" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">12–16</text>
  <text x="530" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">FP16比 約0.5–1%</text>
  <text x="670" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ はい</text>
  <line x1="18" y1="148" x2="782" y2="148" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="170" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Q8_0</text>
  <text x="230" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">74 GB</text>
  <text x="370" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">8–12</text>
  <text x="530" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">ロスレス</text>
  <text x="670" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34A853">✓ はい</text>
