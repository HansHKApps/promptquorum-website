  <text x="40" y="202" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">FP16</text>
  <text x="230" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">140 GB</text>
  <text x="370" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">14–18*</text>
  <text x="530" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">なし（フル精度）</text>
  <text x="670" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335">✗ いいえ</text>
  <line x1="18" y1="212" x2="782" y2="212" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">★ Q5_K_Mが推奨バランス：49GBは128GBに余裕を持って収まり、12–16 tok/sでほぼロスレスの品質。</text>
  <text x="40" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">Q4対Q8の差は8Bモデルより70Bで大きく、複雑な推論やコードレビューで顕著になる。</text>
  <text x="40" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">* FP16（140GB）はM5 Max 128GBに収まらず、M5 Ultra 256GBが必要（予測14–18 tok/s）。</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
