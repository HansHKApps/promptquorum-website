<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="360" fill="#FFFFFF"/>
<text x="400" y="34" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">에어갭 배포: 5단계 데이터 흐름</text>
<circle cx="80" cy="110" r="22" fill="#6750A4"/>
<text x="80" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="80" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">물리적 격리</text>
<text x="80" y="180" font-size="10" fill="#49454F" text-anchor="middle">잠긴 방, 네트워크 없음</text>
<text x="160" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="240" cy="110" r="22" fill="#6750A4"/>
<text x="240" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="240" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">모델 로딩</text>
<text x="240" y="180" font-size="10" fill="#49454F" text-anchor="middle">사전 다운로드, USB 전송</text>
<text x="320" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="400" cy="110" r="22" fill="#6750A4"/>
<text x="400" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="400" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">데이터 입력</text>
<text x="400" y="180" font-size="10" fill="#49454F" text-anchor="middle">암호화 USB(GPG)</text>
<text x="480" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="560" cy="110" r="22" fill="#6750A4"/>
<text x="560" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="560" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">오프라인 추론</text>
<text x="560" y="180" font-size="10" fill="#49454F" text-anchor="middle">Ollama / vLLM,</text>
<text x="560" y="195" font-size="10" fill="#49454F" text-anchor="middle">네트워크 호출 없음</text>
<text x="640" y="117" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
<circle cx="720" cy="110" r="22" fill="#6750A4"/>
<text x="720" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="720" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">데이터 출력</text>
<text x="720" y="180" font-size="10" fill="#49454F" text-anchor="middle">암호화 USB, 별도 복호화</text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>