<svg viewBox="0 0 800 404" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="404" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">O que é realmente "rápido" para LLMs locais?</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Limites de velocidade para uso interativo. Abaixo de 15 tok/s → teste um modelo menor antes de comprar hardware.</text>
  <rect x="18" y="62" width="764" height="70" rx="6" fill="#FFF3F3" stroke="#EA4335" stroke-width="1.5"/>
  <text x="38" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335">Abaixo de 10 tok/s → Parece quebrado</text>
  <text x="38" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">As palavras aparecem uma a uma, com pausas perceptíveis. Inutilizável para chat interativo.</text>
  <text x="38" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Solução: trocar por um modelo menor.</text>
  <rect x="18" y="142" width="764" height="70" rx="6" fill="#FFFBF0" stroke="#F4B400" stroke-width="1.5"/>
  <text x="38" y="164" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#B07D00">15–25 tok/s → Aceitável</text>
  <text x="38" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Velocidade legível para a maioria. Boa para perguntas e respostas, resumos de documentos e ajuda</text>
  <text x="38" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">com código. Pequeno atraso, mas utilizável.</text>
  <rect x="18" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="38" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">30+ tok/s → Fluido</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Parece um assistente de verdade. Confortável</text>
  <text x="38" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">para todas as tarefas interativas, inclusive</text>
  <text x="38" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">revisão de código.</text>
  <rect x="412" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="432" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">60+ tok/s → Instantâneo</text>
  <text x="432" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Mais rápido do que você consegue ler. Ideal</text>
  <text x="432" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">para autocompletar em tempo real e iteração</text>
  <text x="432" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">rápida.</text>
  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Exemplos de hardware (velocidades estimadas):</text>
  <text x="115" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, 4 GB RAM: 25–40 t/s</text>
  <text x="295" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, 8 GB RAM: 15–25 t/s</text>
  <text x="480" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, 16 GB RAM: 8–15 t/s</text>
  <text x="670" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">GPU dedicada: 5–10× mais rápida</text>
  <line x1="18" y1="362" x2="782" y2="362" stroke="#E8DEF8" stroke-width="2"/>
  <text x="18" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">0</text>
  <text x="140" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">10</text>
  <text x="290" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00">25</text>
  <text x="440" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">40</text>
  <text x="590" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">60</text>
  <text x="735" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">80+ t/s</text>
  <text x="400" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
