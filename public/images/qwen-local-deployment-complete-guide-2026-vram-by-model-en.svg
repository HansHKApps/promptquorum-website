  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Qwen2.5-72B needs 43.5 GB VRAM — 8x more than Qwen3 8B's 5.2 GB; only dual RTX 4090s or cloud GPUs fit it.</text>
