  <!-- Footer note -->
  <text x="20" y="380" class="text-primary" style="font-size: 11px; fill: #79747E;">注記：Q4_K_Mが速度と品質の最適なバランス。Q5_K_M/Q8_0は品質重視、Q3_K_Mは超低VRAM向け。</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>