<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Why Data Movement Dominates AI Inference Energy</text>
  <text x="400" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Energy cost per 32-bit operation (log scale) — the memory bottleneck MRAM in-memory computing targets</text>

  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- DRAM access: most expensive -->
  <text x="250" y="104" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">DRAM access</text>
  <rect x="260" y="80" width="447" height="28" fill="#EA4335" rx="4"/>
  <text x="717" y="99" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#EA4335" text-anchor="start">500+ pJ</text>
  <text x="270" y="99" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">&gt;130x more than one FP multiply</text>

  <!-- SRAM access: moderate -->
  <text x="250" y="184" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">SRAM access</text>
  <rect x="260" y="160" width="205" height="28" fill="#F4B400" rx="4"/>
  <text x="475" y="179" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#F4B400" text-anchor="start">5 pJ</text>
  <text x="270" y="179" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1C1B1F">~1.4x one FP multiply</text>

  <!-- MAC op: baseline compute -->
  <text x="250" y="264" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">FP multiply</text>
  <rect x="260" y="240" width="189" height="28" fill="#34A853" rx="4"/>
  <text x="459" y="259" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="start">3.7 pJ</text>
  <text x="270" y="259" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">baseline — the actual math</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Moving 32 bits from DRAM costs 500+ pJ vs ~3.7 pJ for a 32-bit floating-point multiply (approx. 45 nm figures, Horowitz, ISSCC 2014) — data movement dominates inference energy.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
