<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="360" fill="#FFFFFF"/>
<text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama 设置：运行 Qwen2-VL 的 5 个步骤</text>
<circle cx="80" cy="110" r="22" fill="#6750A4"/>
<text x="80" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="80" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">安装</text>
<text x="80" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Ollama</text>
<text x="80" y="192" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">brew install ollama</text>
<text x="145" y="117" font-size="20" fill="#6750A4">→</text>
<circle cx="222" cy="110" r="22" fill="#6750A4"/>
<text x="222" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="222" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">拉取</text>
<text x="222" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Qwen2-VL 7B</text>
<text x="222" y="192" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">ollama pull qwen2-vl:7b</text>
<text x="287" y="117" font-size="20" fill="#6750A4">→</text>
<circle cx="364" cy="110" r="22" fill="#6750A4"/>
<text x="364" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="364" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">运行并</text>
<text x="364" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">附加图像</text>
<text x="364" y="192" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">ollama run qwen2-vl:7b</text>
<text x="429" y="117" font-size="20" fill="#6750A4">→</text>
<circle cx="506" cy="110" r="22" fill="#6750A4"/>
<text x="506" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="506" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">通过 API</text>
<text x="506" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">发送</text>
<text x="506" y="192" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">POST /api/generate</text>
<text x="571" y="117" font-size="20" fill="#6750A4">→</text>
<circle cx="648" cy="110" r="22" fill="#6750A4"/>
<text x="648" y="117" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="648" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">验证</text>
<text x="648" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">CJK OCR</text>
<text x="648" y="192" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">./contract-zh.png</text>
<line x1="18" y1="230" x2="782" y2="230" stroke="#E8DEF8" stroke-width="1.5"/>
<text x="30" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">第 2 步至关重要：使用明确的标签 qwen2-vl:7b——单独的 qwen2-vl 标签可能解析为其他尺寸。</text>
<text x="30" y="276" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#79747E">总设置时间：在 8 GB VRAM 的 GPU 上不到 10 分钟。</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>