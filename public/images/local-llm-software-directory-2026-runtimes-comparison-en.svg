<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local LLM Runtimes: Ollama vs llama.cpp vs vLLM</text>
  <line x1="40" y1="44" x2="760" y2="44" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Column headers row -->
  <rect x="40" y="50" width="180" height="40" fill="#FFFFFF"/>
  <!-- Ollama header (purple highlight) -->
  <rect x="220" y="50" width="180" height="40" fill="#6750A4" rx="4"/>
  <rect x="400" y="50" width="180" height="40" fill="#F7F2FA" rx="4"/>
  <rect x="580" y="50" width="180" height="40" fill="#F7F2FA" rx="4"/>

  <text x="400" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E"/>
  <text x="310" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ollama</text>
  <text x="310" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E8DEF8" text-anchor="middle">Recommended</text>
  <text x="490" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">llama.cpp</text>
  <text x="670" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">vLLM</text>

  <line x1="40" y1="92" x2="760" y2="92" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: Best for -->
  <rect x="40" y="92" width="180" height="56" fill="#FFFFFF"/>
  <rect x="220" y="92" width="180" height="56" fill="#F0EBFB"/>
  <rect x="400" y="92" width="180" height="56" fill="#FFFFFF"/>
  <rect x="580" y="92" width="180" height="56" fill="#FFFFFF"/>
  <text x="52" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Best for</text>
  <text x="310" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="middle">Easiest start</text>
  <text x="490" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Foundational engine</text>
  <text x="670" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Multi-user serving</text>
  <line x1="40" y1="148" x2="760" y2="148" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Install -->
  <rect x="40" y="148" width="180" height="50" fill="#F7F2FA"/>
  <rect x="220" y="148" width="180" height="50" fill="#EDE8F9"/>
  <rect x="400" y="148" width="180" height="50" fill="#F7F2FA"/>
  <rect x="580" y="148" width="180" height="50" fill="#F7F2FA"/>
  <text x="52" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Install</text>
  <text x="310" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="middle">One command</text>
  <text x="490" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Build from source</text>
  <text x="670" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">pip install vllm</text>
  <line x1="40" y1="198" x2="760" y2="198" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: API -->
  <rect x="40" y="198" width="180" height="50" fill="#FFFFFF"/>
  <rect x="220" y="198" width="180" height="50" fill="#F0EBFB"/>
  <rect x="400" y="198" width="180" height="50" fill="#FFFFFF"/>
  <rect x="580" y="198" width="180" height="50" fill="#FFFFFF"/>
  <text x="52" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">API</text>
  <text x="310" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1C1B1F" text-anchor="middle">OpenAI-compatible</text>
  <text x="490" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Custom REST</text>
  <text x="670" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">OpenAI-compatible</text>
  <line x1="40" y1="248" x2="760" y2="248" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: License -->
  <rect x="40" y="248" width="180" height="50" fill="#F7F2FA"/>
  <rect x="220" y="248" width="180" height="50" fill="#EDE8F9"/>
  <rect x="400" y="248" width="180" height="50" fill="#F7F2FA"/>
  <rect x="580" y="248" width="180" height="50" fill="#F7F2FA"/>
  <text x="52" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">License</text>
  <text x="310" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="middle">MIT</text>
  <text x="490" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">MIT</text>
  <text x="670" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">Apache 2.0</text>
  <line x1="40" y1="298" x2="760" y2="298" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Vertical dividers -->
  <line x1="220" y1="50" x2="220" y2="298" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="400" y1="50" x2="400" y2="298" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="580" y1="50" x2="580" y2="298" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="760" y1="50" x2="760" y2="298" stroke="#E8DEF8" stroke-width="1"/>

  <text x="400" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com</text>
</svg>
