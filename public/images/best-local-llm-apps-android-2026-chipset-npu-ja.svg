  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="57.86" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1C1B1F" text-anchor="middle">NPUアクセスが速度差を決める</text>

  <rect x="42" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="42" y="100.29" width="510" height="7.71" rx="0" fill="#34A853"/>
  <text x="297" y="154.29" font-size="24" font-weight="700" fill="#34A853" text-anchor="middle">Snapdragon 8 Elite</text>
  <text x="297" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Galaxy S25 Ultra, OnePlus 13</text>

  <text x="72" y="260.36" font-size="18" font-weight="700" fill="#79747E">HexagonNPUがアプリに公開されている</text>
  <text x="72" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#34A853">~22 tok/sec</text>
  <text x="72" y="351" font-size="17.25" fill="#49454F">MLC Chat、Phi-4 Mini、NPU経路</text>
  <line x1="72" y1="378" x2="522" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="72" y="428.14" font-size="18" fill="#49454F">より小さいQwen3 1.7Bモデルでは</text>
  <text x="72" y="462.86" font-size="18" fill="#49454F">約40 tok/secに達し、同じ端末の</text>
  <text x="72" y="497.57" font-size="18" fill="#49454F">CPUのみのアプリより3〜4倍</text>
  <text x="72" y="532.29" font-size="18" fill="#49454F">高速です。</text>

  <rect x="648" y="100.29" width="510" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="648" y="100.29" width="510" height="7.71" rx="0" fill="#EA4335"/>
  <text x="903" y="154.29" font-size="24" font-weight="700" fill="#EA4335" text-anchor="middle">Google Tensor G5</text>
  <text x="903" y="192.86" font-size="18" font-weight="600" fill="#49454F" text-anchor="middle">Pixel 9 Pro</text>

  <text x="678" y="260.36" font-size="18" font-weight="700" fill="#79747E">サードパーティアプリにNPUが非公開</text>
  <text x="678" y="314.36" font-family="'SF Mono', Monaco, monospace" font-size="36" font-weight="700" fill="#EA4335">10–18 tok/sec</text>
  <text x="678" y="351" font-size="17.25" fill="#49454F">全6アプリ、Phi-4 Mini、CPUのみ</text>
  <line x1="678" y1="378" x2="1128" y2="378" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="678" y="428.14" font-size="18" fill="#49454F">テストした全アプリがTensor G5上で</text>
  <text x="678" y="462.86" font-size="18" fill="#49454F">CPU推論にフォールバックします —</text>
  <text x="678" y="497.57" font-size="18" fill="#49454F">現時点でGoogleのオンデバイスNPUを</text>
  <text x="678" y="532.29" font-size="18" fill="#49454F">サードパーティに開放するアプリはありません。</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">同じPhi-4 Miniモデル、同じ量子化 — 違いはチップのNPU公開の有無です。</text>
<text x="1188" y="665.36" font-family="system-ui,sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
