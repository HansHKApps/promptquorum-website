<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Decision Matrix: When to Use Which Framework</text>
  <text x="40" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Your situation</text>
  <text x="380" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Framework</text>
  <line x1="18" y1="63" x2="782" y2="63" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="59" width="764" height="46" fill="#F7F2FA" rx="4"/>
  <text x="40" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7D5260">Just getting started</text>
  <text x="380" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">Ollama — 2-minute setup</text>
  <text x="40" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Building a Python app</text>
  <text x="380" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">MLX — native Python, fastest</text>
  <line x1="18" y1="141" x2="782" y2="141" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="179" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Need a REST API</text>
  <text x="380" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">Ollama — built-in API server</text>
  <line x1="18" y1="191" x2="782" y2="191" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="229" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Fine-tuning on Mac</text>
  <text x="380" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">MLX — only option with LoRA</text>
  <line x1="18" y1="241" x2="782" y2="241" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="279" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Cross-platform project</text>
  <text x="380" y="279" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">llama.cpp — same code everywhere</text>
  <line x1="18" y1="291" x2="782" y2="291" stroke="#F7F2FA" stroke-width="1"/>
  <text x="40" y="329" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Maximum speed needed</text>
  <text x="380" y="329" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">MLX — 15–25% faster</text>
  <text x="400" y="398" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">All three coexist without conflict — install Ollama, MLX, and llama.cpp side by side.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>