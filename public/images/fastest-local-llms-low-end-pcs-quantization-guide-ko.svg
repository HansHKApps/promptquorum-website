  <text x="38" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#6750A4">핵심 규칙: 먼저 모델 크기를 고르고, 그다음 Q4_K_M을 쓰세요.</text>
  <text x="38" y="287" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Q4_K_M의 작은 모델은 Q2로 억지로 줄인 큰 모델보다 대체로 낫습니다.</text>
  <text x="38" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E">파일이 작을수록 CPU에서 빠릅니다(대략 비례: 속도 ≈ 메모리 대역폭 ÷ 파일 크기).</text>
