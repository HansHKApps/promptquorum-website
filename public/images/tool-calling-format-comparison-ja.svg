<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 285" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="285" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="22" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">ツールコールのワイヤーフォーマット — 同じスキル、異なるプロトコル</text>
  <line x1="18" y1="30" x2="782" y2="30" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Column headers -->
  <text x="18" y="52" font-size="12" font-weight="700" fill="#79747E">フォーマット</text>
  <text x="248" y="52" font-size="12" font-weight="700" fill="#79747E">使用場所</text>
  <text x="556" y="52" font-size="12" font-weight="700" fill="#79747E">厳密さ</text>
  <!-- Vertical dividers -->
  <line x1="235" y1="30" x2="235" y2="210" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="545" y1="30" x2="545" y2="210" stroke="#E8DEF8" stroke-width="1"/>
  <!-- Header underline -->
  <line x1="18" y1="60" x2="782" y2="60" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1: y=82 -->
  <text x="18" y="82" font-size="12" font-weight="600" fill="#1C1B1F">OpenAI tools (JSON)</text>
  <text x="248" y="82" font-size="11" fill="#49454F">Continue.dev Agent, OpenAI API</text>
  <text x="556" y="82" font-size="11" fill="#34A853" font-weight="700">スキーマ検証済み</text>
  <line x1="18" y1="97" x2="782" y2="97" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2: y=116 -->
  <text x="18" y="116" font-size="12" font-weight="600" fill="#1C1B1F">Cline XML</text>
  <text x="248" y="116" font-size="11" fill="#49454F">Cline VS Code拡張</text>
  <text x="556" y="116" font-size="11" fill="#F4B400" font-weight="700">非常に厳格 ⚠</text>
  <line x1="18" y1="131" x2="782" y2="131" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3: y=150 -->
  <text x="18" y="150" font-size="12" font-weight="600" fill="#1C1B1F">MCP JSON-RPC 2.0</text>
  <text x="248" y="150" font-size="11" fill="#49454F">Goose, Cline, LM Studio</text>
  <text x="556" y="150" font-size="11" fill="#34A853" font-weight="700">スキーマ検証済み</text>
  <line x1="18" y1="165" x2="782" y2="165" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 4: y=184 -->
  <text x="18" y="184" font-size="12" font-weight="600" fill="#1C1B1F">Aider SEARCH/REPLACE</text>
  <text x="248" y="184" font-size="11" fill="#49454F">Aider CLI</text>
  <text x="556" y="184" font-size="11" fill="#EA4335" font-weight="700">逐語一致マッチング</text>
  <!-- Footer -->
  <text x="400" y="250" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">5つのベンチマークモデルが全フォーマットに対応 — フォーマットはハーネスの選択</text>
</svg>
