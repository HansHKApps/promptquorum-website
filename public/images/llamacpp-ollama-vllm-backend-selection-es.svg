  <text x="110" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(10+ concurrentes)</text>

  <text x="295" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA4335" text-anchor="middle">✗ No</text>
  <text x="295" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA4335" text-anchor="middle">Sin batching.</text>

  <text x="485" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA4335" text-anchor="middle">✗ No</text>
  <text x="485" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA4335" text-anchor="middle">Lote &#xfa;nico.</text>

  <text x="680" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" font-weight="700" text-anchor="middle">✓ &#xda;nica opci&#xf3;n</text>
  <text x="680" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" text-anchor="middle">250+ tok/s.</text>

  <!-- Row 4: Custom Inference -->
  <rect x="20" y="240" width="180" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="200" y="240" width="190" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="390" y="240" width="190" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="580" y="240" width="200" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>

  <text x="110" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Motor personalizado</text>
  <text x="110" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(Bajo nivel)</text>

  <text x="295" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" font-weight="700" text-anchor="middle">✓ Ideal</text>
  <text x="295" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" text-anchor="middle">Control total.</text>

  <text x="485" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Limitado.</text>
  <text x="485" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Alto nivel.</text>

  <text x="680" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Limitado.</text>
  <text x="680" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Centrado en API.</text>

  <!-- Footer note -->
  <text x="400" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">
    Los tres producen salidas de modelo id&#xe9;nticas. Elige seg&#xfa;n el caso de uso, la tolerancia a la complejidad de configuraci&#xf3;n y las necesidades de rendimiento.
  </text>
<text x="792" y="355" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
