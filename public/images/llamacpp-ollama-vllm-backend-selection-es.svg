  <text x="110" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(Experimentos)</text>

  <text x="295" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Bueno. Inferencia</text>
  <text x="295" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">personalizada.</text>

  <text x="485" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" font-weight="700" text-anchor="middle">✓ Ideal</text>
  <text x="485" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" text-anchor="middle">Config. r&#xe1;pida.</text>

  <text x="680" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Bueno. Orientado</text>
  <text x="680" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">a API.</text>

