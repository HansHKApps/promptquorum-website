  <rect x="200" y="90" width="190" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="390" y="90" width="190" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>
  <rect x="580" y="90" width="200" height="50" fill="#FFFFFF" stroke="#F7F2FA" stroke-width="1"/>

  <text x="110" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Chat personal</text>
  <text x="110" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(1 usuario)</text>

  <text x="295" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Bueno. Config.</text>
  <text x="295" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">r&#xe1;pida.</text>

  <text x="485" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" font-weight="700" text-anchor="middle">✓ Ideal</text>
  <text x="485" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34A853" text-anchor="middle">Lo m&#xe1;s simple.</text>

  <text x="680" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Excesivo</text>
