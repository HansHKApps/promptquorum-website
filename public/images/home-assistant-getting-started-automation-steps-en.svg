<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Your First Home Assistant Automation — 4 Steps</text>

  <!-- Step 1 -->
  <circle cx="105" cy="150" r="28" fill="#6750A4"/>
  <text x="105" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="105" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Create Automation</text>
  <text x="105" y="225" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Settings → Automations</text>
  <text x="105" y="240" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">& Scenes → Create</text>

  <text x="200" y="158" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="298" cy="150" r="28" fill="#6750A4"/>
  <text x="298" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="298" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Choose a Trigger</text>
  <text x="298" y="225" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Time, sunset, or</text>
  <text x="298" y="240" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">sensor state</text>

  <text x="393" y="158" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="491" cy="150" r="28" fill="#6750A4"/>
  <text x="491" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="491" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Choose an Action</text>
  <text x="491" y="225" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Turn on light, send</text>
  <text x="491" y="240" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">notification</text>

  <text x="586" y="158" font-size="22" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="684" cy="150" r="28" fill="#34A853"/>
  <text x="684" y="158" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="684" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Save &amp; Test</text>
  <text x="684" y="225" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Then refine as</text>
  <text x="684" y="240" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">needed</text>

  <line x1="60" y1="285" x2="740" y2="285" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="320" font-family="system-ui, sans-serif" font-size="12.5" fill="#49454F" text-anchor="middle">No coding required — all 4 steps use the visual automation editor in</text>
  <text x="400" y="340" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">Settings → Automations &amp; Scenes</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
