<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="400" fill="#FFFFFF"/>
<text x="400" y="20" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">How Much Unified Memory Should You Buy?</text>

<!-- Root -->
<rect x="290" y="35" width="220" height="46" rx="8" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
<text x="400" y="54" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Largest model size</text>
<text x="400" y="70" font-size="12" fill="#49454F" text-anchor="middle">you&#8217;ll run regularly?</text>

<line x1="330" y1="81" x2="190" y2="140" stroke="#6750A4" stroke-width="2"/>
<line x1="470" y1="81" x2="610" y2="140" stroke="#6750A4" stroke-width="2"/>
<text x="225" y="98" font-size="11" fill="#79747E">&#8804;13B</text>
<text x="554" y="98" font-size="11" fill="#79747E">34B+</text>

<!-- Level 1: left -->
<rect x="90" y="140" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
<text x="190" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Also need vision/STT/TTS</text>
<text x="190" y="178" font-size="11" fill="#49454F" text-anchor="middle">running alongside it?</text>

<!-- Level 1: right -->
<rect x="510" y="140" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
<text x="610" y="160" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Need to run 70B models</text>
<text x="610" y="178" font-size="11" fill="#49454F" text-anchor="middle">specifically (not just 34B)?</text>

<line x1="130" y1="190" x2="90" y2="250" stroke="#6750A4" stroke-width="2"/>
<line x1="250" y1="190" x2="290" y2="250" stroke="#6750A4" stroke-width="2"/>
<text x="62" y="208" font-size="11" fill="#79747E">YES</text>
<text x="280" y="208" font-size="11" fill="#79747E">NO</text>

<line x1="550" y1="190" x2="520" y2="250" stroke="#6750A4" stroke-width="2"/>
<line x1="670" y1="190" x2="720" y2="250" stroke="#6750A4" stroke-width="2"/>
<text x="500" y="208" font-size="11" fill="#79747E">YES</text>
<text x="700" y="208" font-size="11" fill="#79747E">NO</text>

<!-- Leaves -->
<rect x="15" y="250" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
<rect x="15" y="250" width="150" height="4" fill="#34A853"/>
<text x="90" y="280" font-size="20" font-weight="700" fill="#34A853" text-anchor="middle">64 GB</text>
<text x="90" y="300" font-size="11" fill="#49454F" text-anchor="middle">13B + multimodal stack</text>

<rect x="215" y="250" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
<rect x="215" y="250" width="150" height="4" fill="#34A853"/>
<text x="290" y="280" font-size="20" font-weight="700" fill="#34A853" text-anchor="middle">36 GB</text>
<text x="290" y="300" font-size="11" fill="#49454F" text-anchor="middle">13B only, single model</text>

<rect x="445" y="250" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
<rect x="445" y="250" width="150" height="4" fill="#34A853"/>
<text x="520" y="280" font-size="20" font-weight="700" fill="#34A853" text-anchor="middle">128 GB</text>
<text x="520" y="300" font-size="11" fill="#49454F" text-anchor="middle">70B Q5 comfortably</text>

<rect x="645" y="250" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
<rect x="645" y="250" width="150" height="4" fill="#34A853"/>
<text x="720" y="280" font-size="20" font-weight="700" fill="#34A853" text-anchor="middle">64 GB</text>
<text x="720" y="300" font-size="11" fill="#49454F" text-anchor="middle">34B Q5, skip 70B</text>

<text x="400" y="355" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Apple Silicon memory is soldered — buy the maximum tier you can afford;</text>
<text x="400" y="373" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">upgrades are impossible after purchase.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
