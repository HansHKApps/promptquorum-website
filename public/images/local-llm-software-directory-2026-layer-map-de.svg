<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <style>
      .tier { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
      .tier-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .tier-desc { font-family: Arial, sans-serif; font-size: 12px; fill: #666; }
      .tier-new { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
      .split { stroke-dasharray: 5,5; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">10 Layers of Local LLM Software (160+ Tools)</text>
  
  <!-- Tier 1: Runtimes -->
  <rect x="50" y="60" width="900" height="40" class="tier"/>
  <text x="60" y="85" class="tier-title">1. Runtimes (11 tools)</text>
  <text x="550" y="85" class="tier-desc">Ollama, llama.cpp, vLLM, TensorRT-LLM, MLX-LM...</text>
  
  <!-- Tier 2: Desktop Apps -->
  <rect x="50" y="110" width="900" height="40" class="tier"/>
  <text x="60" y="135" class="tier-title">2. Desktop Apps (14 tools)</text>
  <text x="550" y="135" class="tier-desc">LM Studio, Jan, GPT4All, Locally Uncensored, Draw Things...</text>
  
  <!-- Tier 3: Web UIs -->
  <rect x="50" y="160" width="900" height="40" class="tier"/>
  <text x="60" y="185" class="tier-title">3. Web UIs (9 tools)</text>
  <text x="550" y="185" class="tier-desc">Open WebUI, LibreChat, Gradio...</text>
  
  <!-- Tier 4a & 4b: Coding (split) -->
  <rect x="50" y="210" width="430" height="40" class="tier"/>
  <text x="60" y="235" class="tier-title">4a. IDE Assistants (11)</text>
  <rect x="490" y="210" width="460" height="40" class="tier"/>
  <text x="500" y="235" class="tier-title">4b. Terminal Tools (6)</text>
  
  <!-- Tier 5: RAG -->
  <rect x="50" y="260" width="900" height="40" class="tier"/>
  <text x="60" y="285" class="tier-title">5. RAG Systems (11 tools)</text>
  <text x="550" y="285" class="tier-desc">AnythingLLM, PrivateGPT, Quivr...</text>
  
  <!-- Tier 6: Agents -->
  <rect x="50" y="310" width="900" height="40" class="tier"/>
  <text x="60" y="335" class="tier-title">6. Agent Frameworks (16 tools)</text>
  <text x="550" y="335" class="tier-desc">LangChain, CrewAI, SuperAGI, Letta...</text>
  
  <!-- Tier 7a, 7b, 7c: Voice/Audio/Multimodal (split) -->
  <rect x="50" y="360" width="280" height="40" class="tier"/>
  <text x="60" y="385" class="tier-title">7a. Speech (2)</text>
  <rect x="340" y="360" width="310" height="40" class="tier"/>
  <text x="350" y="385" class="tier-title">7b. TTS (5)</text>
  <rect x="660" y="360" width="290" height="40" class="tier"/>
