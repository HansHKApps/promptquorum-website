<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local LLM Speed Optimization Techniques by Difficulty</text>

  <!-- Easy panel -->
  <rect x="20" y="50" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="20" y="50" width="240" height="4" rx="0" fill="#34A853"/>
  <text x="140" y="76" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">EASY</text>

  <text x="38" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">Disable Debug Logging</text>
  <circle cx="48" cy="130" r="15" fill="#34A853"/>
  <text x="48" y="134" font-family="'SF Mono', Monaco, monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">+10%</text>
  <text x="72" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">speed gain</text>

  <line x1="38" y1="160" x2="242" y2="160" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="38" y="184" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">Q4 Quantization</text>
  <rect x="38" y="198" width="204" height="24" rx="4" fill="#F7F2FA"/>
  <text x="140" y="214" font-family="'SF Mono', Monaco, monospace" font-size="10.5" font-weight="700" fill="#79747E" text-anchor="middle">VRAM only — no speed gain</text>

  <!-- Medium panel -->
  <rect x="280" y="50" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="280" y="50" width="240" height="4" rx="0" fill="#F4B400"/>
  <text x="400" y="76" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4B400" text-anchor="middle">MEDIUM</text>

  <text x="298" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">GPU Memory → 90–95%</text>
  <circle cx="308" cy="130" r="15" fill="#F4B400"/>
  <text x="308" y="134" font-family="'SF Mono', Monaco, monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">+15–20%</text>
  <text x="332" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">speed gain</text>

  <line x1="298" y1="160" x2="502" y2="160" stroke="#F7F2FA" stroke-width="1.5"/>

  <text x="298" y="184" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">Batch Size 1 → 32</text>
  <circle cx="308" cy="208" r="15" fill="#F4B400"/>
  <text x="308" y="212" font-family="'SF Mono', Monaco, monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2–4×</text>
  <text x="332" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">throughput</text>

  <!-- Hard panel -->
  <rect x="540" y="50" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="540" y="50" width="240" height="4" rx="0" fill="#EA4335"/>
  <text x="660" y="76" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#EA4335" text-anchor="middle">HARD</text>

  <text x="558" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">Switch Ollama → vLLM</text>
  <circle cx="568" cy="130" r="15" fill="#EA4335"/>
  <text x="568" y="134" font-family="'SF Mono', Monaco, monospace" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5–10×</text>
  <text x="592" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">concurrent</text>

  <text x="558" y="164" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Best for production APIs</text>
  <text x="558" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">serving multiple users</text>

  <line x1="20" y1="368" x2="780" y2="368" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="388" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Combining all easy and medium techniques yields ~2–3× total speedup on a 7B model with no quality loss.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
