<svg viewBox="0 0 800 295" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="295" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Jan — Privacy Features at a Glance</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">AGPL open source · Zero telemetry · Auditable binary</text>
  <!-- Left panel: Cloud AI -->
  <rect x="22" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="22" y="62" width="354" height="4" rx="0" fill="#EA4335"/>
  <text x="199" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">Cloud AI — Data Leaves Device</text>
  <text x="44" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Prompts sent to remote servers</text>
  <text x="44" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Analytics SDK tracks your usage</text>
  <text x="44" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Closed source — cannot verify</text>
  <text x="44" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Internet required to work</text>
  <text x="44" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Subscription cost over time</text>
  <text x="44" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Training opt-out required</text>
  <!-- Right panel: Jan -->
  <rect x="424" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="424" y="62" width="354" height="4" rx="0" fill="#34A853"/>
  <text x="601" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">Jan — Everything Stays Local</text>
  <text x="446" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Zero telemetry — nothing sent out</text>
  <text x="446" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  No analytics SDK of any kind</text>
  <text x="446" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  AGPL source — binary auditable</text>
  <text x="446" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Works fully offline after install</text>
  <text x="446" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Free forever, no subscription</text>
  <text x="446" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  No model training on your data</text>
  <!-- Footer -->
  <text x="400" y="277" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/power-local-llm/local-ai-app-non-technical-users</text>
</svg>
