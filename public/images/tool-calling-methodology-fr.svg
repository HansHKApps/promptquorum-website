<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="300" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="22" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Méthodologie de test — Comment nous avons évalué 5 modèles</text>
  <line x1="18" y1="30" x2="782" y2="30" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Column headers -->
  <text x="18" y="52" font-size="12" font-weight="700" fill="#79747E">Configuration</text>
  <text x="268" y="52" font-size="12" font-weight="700" fill="#79747E">Détails</text>
  <!-- Vertical divider -->
  <line x1="255" y1="30" x2="255" y2="240" stroke="#E8DEF8" stroke-width="1"/>
  <!-- Header underline -->
  <line x1="18" y1="60" x2="782" y2="60" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1: y=80 -->
  <text x="18" y="80" font-size="12" font-weight="700" fill="#1C1B1F">Serveurs MCP</text>
  <text x="268" y="80" font-size="11" fill="#49454F">filesystem · sqlite · puppeteer · github</text>
  <line x1="18" y1="94" x2="782" y2="94" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2: y=112 -->
  <text x="18" y="112" font-size="12" font-weight="700" fill="#1C1B1F">Ensemble de prompts</text>
  <text x="268" y="112" font-size="11" fill="#49454F">50 prompts × 4 serveurs × 3 exécutions = 600 appels par modèle</text>
  <line x1="18" y1="126" x2="782" y2="126" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3: y=144 -->
  <text x="18" y="144" font-size="12" font-weight="700" fill="#1C1B1F">Appels totaux</text>
  <text x="268" y="144" font-size="11" fill="#49454F">~3 000 sur 5 modèles (étape unique + multi-étapes + parallèle)</text>
  <line x1="18" y1="158" x2="782" y2="158" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 4: y=176 -->
  <text x="18" y="176" font-size="12" font-weight="700" fill="#1C1B1F">Cadre de test</text>
  <text x="268" y="176" font-size="11" fill="#49454F">Cline 3.x (XML strict) + Goose+MCP (headless)</text>
  <line x1="18" y1="190" x2="782" y2="190" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 5: y=208 -->
  <text x="18" y="208" font-size="12" font-weight="700" fill="#1C1B1F">Matériel</text>
  <text x="268" y="208" font-size="11" fill="#49454F">M5 Max 64 Go (≤32B) · L40S 48 Go (Llama 3.3 70B)</text>
  <!-- Footer -->
  <text x="400" y="262" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Les échecs sont imputables au modèle, pas au cadre — même Cline, même serveurs</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
