<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290">
  <!-- Background -->
  <rect width="800" height="290" fill="#FFFFFF"/>

  <!-- Title -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="400" y="28">Quel LLM mobile ? — Décision en 4 étapes</text>
  <!-- Subtitle -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle" x="400" y="47">Faites correspondre votre RAM au bon modèle avant d'installer</text>

  <!-- Step 1 -->
  <circle cx="100" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="100" y="128">1</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="100" y="163">Vérifier RAM</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="100" y="180">Réglages &gt; À propos</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="100" y="193">min. 4 Go</text>

  <!-- Arrow 1 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="200" y="128">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="300" y="128">2</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="300" y="163">Choisir gamme</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="300" y="180">4 Go → Gemma 3 1B</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="300" y="193">8 Go+ → Phi-4 Mini</text>

  <!-- Arrow 2 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="400" y="128">→</text>

  <!-- Step 3 -->
  <circle cx="500" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="500" y="128">3</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="500" y="163">Choisir usage</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="500" y="180">Vitesse → SmolLM 2</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="500" y="193">Multilingue → Qwen 2.5</text>

  <!-- Arrow 3 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="600" y="128">→</text>

  <!-- Step 4 -->
  <circle cx="700" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="700" y="128">4</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="700" y="163">Installer</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="700" y="180">Q4_K_M GGUF</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="700" y="193">PocketPal AI · LM Studio</text>

  <!-- Divider -->
  <line x1="18" y1="245" x2="782" y2="245" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle" x="400" y="265">Les six modèles disponibles en Q4_K_M GGUF · Phi-4 Mini pour la plupart des téléphones haut de gamme · promptquorum.com</text>
  <!-- Attribution -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle" x="400" y="281">promptquorum.com</text>
</svg>
