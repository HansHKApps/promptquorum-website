<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="420" fill="#FFFFFF"/>
<text x="400" y="34" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud-API vs. lokales LLM: Wohin Ihre Daten gehen</text>
<rect x="24" y="60" width="352" height="330" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
<rect x="24" y="60" width="352" height="4" rx="0" fill="#EA4335"/>
<text x="200" y="92" font-size="15" font-weight="700" fill="#EA4335" text-anchor="middle">Cloud-API (Risiko)</text>
<circle cx="46" cy="125" r="4" fill="#EA4335"/>
<text x="60" y="130" font-size="13" fill="#49454F">Daten verlassen Ihr Gerät</text>
<circle cx="46" cy="169" r="4" fill="#EA4335"/>
<text x="60" y="174" font-size="13" fill="#49454F">Übertragung an Anbieter-Server</text>
<circle cx="46" cy="213" r="4" fill="#EA4335"/>
<text x="60" y="218" font-size="13" fill="#49454F">Anbieter kann mit Daten trainieren</text>
<circle cx="46" cy="257" r="4" fill="#EA4335"/>
<text x="60" y="262" font-size="13" fill="#49454F">Haftung bei Verstoß: 50.000-5.000.000 €+</text>
<rect x="424" y="60" width="352" height="330" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
<rect x="424" y="60" width="352" height="4" rx="0" fill="#34A853"/>
<text x="600" y="92" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">Lokales LLM (Null Datenfluss)</text>
<circle cx="446" cy="125" r="4" fill="#34A853"/>
<text x="460" y="130" font-size="13" fill="#49454F">Daten verlassen das Gerät nie</text>
<circle cx="446" cy="169" r="4" fill="#34A853"/>
<text x="460" y="174" font-size="13" fill="#49454F">Null Netzwerkübertragung</text>
<circle cx="446" cy="213" r="4" fill="#34A853"/>
<text x="460" y="218" font-size="13" fill="#49454F">Sie besitzen die Verschlüsselungsschlüssel</text>
<circle cx="446" cy="257" r="4" fill="#34A853"/>
<text x="460" y="262" font-size="13" fill="#49454F">Haftung bei Verstoß: 0 €</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>