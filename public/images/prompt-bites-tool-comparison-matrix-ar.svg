<text x="788" y="278" class="feature" text-anchor="start" direction="rtl">الأنسب لـ:</text>
<text x="788" y="298" class="cell-text" text-anchor="start" direction="rtl">• Ollama: المطورون والأتمتة والخوادم بلا شاشة (CLI أولاً، API بسيطة)</text>
<text x="788" y="318" class="cell-text" text-anchor="start" direction="rtl">• LM Studio: مستخدمو سطح المكتب الباحثون عن واجهة GUI متقنة، والمبتدئون</text>
<text x="788" y="338" class="cell-text" text-anchor="start" direction="rtl">• Jan: تطبيق سطح مكتب مفتوح المصدر يوفر CLI أيضاً، متعدد المنصات</text>
<text x="788" y="358" class="cell-text" text-anchor="start" direction="rtl">• llama.cpp: أقصى تحكم وأداء، المحرك الذي تعتمد عليه أدوات كثيرة</text>
<text x="788" y="378" class="cell-text" text-anchor="start" direction="rtl">• KoboldCpp: تطبيق بملف واحد للعب الأدوار والكتابة الإبداعية</text>
<text x="788" y="398" class="cell-text" text-anchor="start" direction="rtl">• GPT4All: دردشة بسيطة دون اتصال على أجهزة عادية، وأسئلة عن المستندات</text>
<text x="788" y="420" class="cell-text" font-weight="600" text-anchor="start" direction="rtl">التوصية: ابدأ بـ Ollama (مستخدم متقدم) أو LM Studio / Jan (واجهة GUI). وllama.cpp للتحكم الكامل.</text>
<text x="788" y="440" class="cell-text" style="fill:#79747E" text-anchor="start" direction="rtl">✓✓ ممتاز · ✓ نعم · ~ جزئي · ✗ لا</text>
