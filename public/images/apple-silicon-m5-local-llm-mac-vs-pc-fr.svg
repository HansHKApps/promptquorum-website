<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Mac Studio M5 Max vs PC RTX 5090</text>

  <!-- Left: Mac Studio M5 Max 128GB -->
  <rect x="28" y="52" width="340" height="270" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="28" y="52" width="340" height="4" rx="0" fill="#6750A4"/>
  <text x="198" y="80" font-size="15" font-weight="700" fill="#6750A4" text-anchor="middle">Mac Studio M5 Max 128GB</text>
  <text x="198" y="98" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">gagne pour l'inférence locale 30B–70B</text>

  <text x="48" y="128" font-size="12" fill="#1C1B1F">✓ 128 Go de mémoire unifiée, aucune limite de VRAM</text>
  <text x="48" y="152" font-size="12" fill="#1C1B1F">✓ 100 W contre 600 W+ pour un PC équivalent</text>
  <text x="48" y="176" font-size="12" fill="#1C1B1F">✓ Silencieux : 40 dB en pleine charge</text>
  <text x="48" y="200" font-size="12" fill="#1C1B1F">✓ Intégration MLX, Metal, Core ML</text>
  <text x="48" y="224" font-size="12" fill="#1C1B1F">✓ Coût électrique sur 3 ans plus faible</text>
  <line x1="48" y1="240" x2="348" y2="240" stroke="#F7F2FA" stroke-width="1"/>
  <text x="48" y="264" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#6750A4">$3,499</text>
  <text x="48" y="284" font-size="11" fill="#49454F">70B Q4/Q5 — rivalise avec des PC à partir de 4 500 $</text>

  <!-- Right: PC Workstation RTX 5090 -->
  <rect x="432" y="52" width="340" height="270" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="432" y="52" width="340" height="4" rx="0" fill="#7D5260"/>
  <text x="602" y="80" font-size="15" font-weight="700" fill="#7D5260" text-anchor="middle">PC Workstation (RTX 5090)</text>
  <text x="602" y="98" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">gagne pour 7B–13B et le fine-tuning</text>

  <text x="452" y="128" font-size="12" fill="#1C1B1F">✓ 90–120 tok/s sur 7B–13B contre 60–75</text>
  <text x="452" y="152" font-size="12" fill="#1C1B1F">✓ Écosystème CUDA plus large, plus d'outils</text>
  <text x="452" y="176" font-size="12" fill="#1C1B1F">✓ PyTorch + CUDA domine le fine-tuning</text>
  <text x="452" y="200" font-size="12" fill="#1C1B1F">✓ Flexibilité de mise à niveau : GPU interchangeables</text>
  <text x="452" y="224" font-size="12" fill="#1C1B1F">✓ Plus rapide pour l'IA non-LLM (Stable Diffusion)</text>
  <line x1="452" y1="240" x2="752" y2="240" stroke="#F7F2FA" stroke-width="1"/>
  <text x="452" y="264" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#7D5260">$800–1,200</text>
  <text x="452" y="284" font-size="11" fill="#49454F">La RTX 4070 Ti surpasse le M5 Pro à ce niveau de budget</text>

  <text x="400" y="335" font-family="system-ui, sans-serif" font-size="11.5" fill="#79747E" text-anchor="middle">L'avantage d'Apple grandit avec la taille du modèle ; celui de NVIDIA grandit avec la vitesse brute et l'étendue de l'écosystème.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
