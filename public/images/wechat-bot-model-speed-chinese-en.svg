  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Best Local Models for Chinese WeChat Replies (CPU Speed)</text>
  <line x1="230" y1="300" x2="740" y2="300" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="220" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Qwen3:3b</text>
  <rect x="230" y="60" width="400" height="24" fill="#34A853" rx="4"/>
  <text x="638" y="77" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8–12 tok/s — fastest</text>

  <text x="220" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Qwen3:8b</text>
  <rect x="230" y="110" width="160" height="24" fill="#6750A4" rx="4"/>
  <text x="398" y="127" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">3–5 tok/s — recommended</text>

  <text x="220" y="179" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Llama3.1:8b</text>
  <rect x="230" y="160" width="160" height="24" fill="#7D5260" rx="4"/>
  <text x="398" y="177" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">3–5 tok/s — moderate Chinese</text>

