  <text x="400" y="333" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Qwen3:8b balances Chinese comprehension and CPU speed best for a WeChat bot; Qwen3:3b is faster but less</text>
