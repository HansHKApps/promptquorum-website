<svg viewBox="0 0 800 295" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="295" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Jan — Confidentialité en un coup d'œil</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">AGPL open source · Zéro télémétrie · Binaire auditable</text>
  <!-- Left panel -->
  <rect x="22" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="22" y="62" width="354" height="4" rx="0" fill="#EA4335"/>
  <text x="199" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335" text-anchor="middle">IA Cloud — Données quittent l'appareil</text>
  <text x="44" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Requêtes envoyées à des serveurs distants</text>
