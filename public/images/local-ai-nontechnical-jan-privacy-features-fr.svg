  <text x="44" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Source fermée — non vérifiable</text>
  <text x="44" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Internet requis pour fonctionner</text>
  <text x="44" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Abonnement payant à terme</text>
  <text x="44" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✗  Opt-out d'entraînement requis</text>
  <!-- Right panel -->
  <rect x="424" y="62" width="354" height="198" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="424" y="62" width="354" height="4" rx="0" fill="#34A853"/>
  <text x="601" y="87" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853" text-anchor="middle">Jan — Tout reste local</text>
  <text x="446" y="114" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Zéro télémétrie — rien n'est envoyé</text>
  <text x="446" y="136" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Aucun SDK analytics</text>
  <text x="446" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  AGPL — binaire auditable</text>
  <text x="446" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#1C1B1F">✓  Fonctionne offline après installation</text>
