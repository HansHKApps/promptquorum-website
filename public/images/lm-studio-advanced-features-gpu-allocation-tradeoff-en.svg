<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">LM Studio GPU Allocation: Speed vs. VRAM Tradeoff</text>

  <!-- Header row -->
  <text x="40" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">GPU Allocation</text>
  <text x="260" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Relative Speed</text>
  <text x="470" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">VRAM Freed</text>
  <text x="600" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Recommended For</text>
  <line x1="24" y1="76" x2="776" y2="76" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: 100% -->
  <circle cx="55" cy="104" r="16" fill="#34A853"/>
  <text x="55" y="109" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">100%</text>
  <text x="260" y="109" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">Baseline (1×)</text>
  <text x="470" y="109" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">0%</text>
  <text x="600" y="109" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Dedicated inference only</text>
  <line x1="24" y1="126" x2="776" y2="126" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: 80% -->
  <circle cx="55" cy="154" r="16" fill="#34A853"/>
  <text x="55" y="159" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">80%</text>
  <text x="260" y="159" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">~1× (near baseline)</text>
  <text x="470" y="159" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">20%</text>
  <text x="600" y="159" font-family="system-ui, sans-serif" font-size="11.5" fill="#6750A4" font-weight="700">Recommended starting point</text>
  <line x1="24" y1="176" x2="776" y2="176" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: 50% -->
  <circle cx="55" cy="204" r="16" fill="#F4B400"/>
  <text x="55" y="209" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">50%</text>
  <text x="260" y="209" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">2–5× slower</text>
  <text x="470" y="209" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">50%</text>
  <text x="600" y="209" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Light multitasking</text>
  <line x1="24" y1="226" x2="776" y2="226" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: 10% -->
  <circle cx="55" cy="254" r="16" fill="#EA4335"/>
  <text x="55" y="259" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">10%</text>
  <text x="260" y="259" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">5–10× slower</text>
  <text x="470" y="259" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">90%</text>
  <text x="600" y="259" font-family="system-ui, sans-serif" font-size="11.5" fill="#EA4335" font-weight="700">Not recommended</text>
  <line x1="24" y1="276" x2="776" y2="276" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="310" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Start at 80% GPU allocation and only lower it if you need VRAM for other apps — below 50% cuts inference speed sharply.</text>
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Changes apply after clicking Restart in Settings.</text>
  <text x="792" y="388" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>
