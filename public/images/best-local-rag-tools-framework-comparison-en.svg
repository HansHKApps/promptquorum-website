<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Open WebUI vs LlamaIndex vs LangChain</text>
  <line x1="100" y1="46" x2="700" y2="46" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Panel 1: Open WebUI -->
  <rect x="20" y="60" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="20" y="60" width="240" height="4" rx="0" fill="#34A853"/>
  <text x="140" y="90" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">Open WebUI</text>
  <text x="140" y="107" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Easiest</text>

  <text x="36" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">TYPE</text>
  <text x="36" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Web app (Docker)</text>

  <text x="36" y="176" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">BEST FOR</text>
  <text x="36" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Beginners, easiest setup</text>

  <text x="36" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">VECTOR DB</text>
  <text x="36" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Built-in</text>

  <text x="36" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">LEARNING CURVE</text>
  <circle cx="52" cy="292" r="16" fill="#34A853"/>
  <text x="52" y="296" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Zero</text>
  <text x="76" y="297" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">No setup required</text>

  <!-- Panel 2: LlamaIndex -->
  <rect x="280" y="60" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="280" y="60" width="240" height="4" rx="0" fill="#6750A4"/>
  <text x="400" y="90" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#6750A4" text-anchor="middle">LlamaIndex</text>
  <text x="400" y="107" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Flexible</text>

  <text x="296" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">TYPE</text>
  <text x="296" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Python framework</text>

  <text x="296" y="176" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">BEST FOR</text>
  <text x="296" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Flexible pipelines</text>

  <text x="296" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">VECTOR DB</text>
  <text x="296" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Any vector DB</text>

  <text x="296" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">LEARNING CURVE</text>
  <circle cx="312" cy="292" r="16" fill="#F4B400"/>
  <text x="312" y="296" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Med</text>
  <text x="336" y="297" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Python required</text>

  <!-- Panel 3: LangChain -->
  <rect x="540" y="60" width="240" height="300" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="540" y="60" width="240" height="4" rx="0" fill="#7D5260"/>
  <text x="660" y="90" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7D5260" text-anchor="middle">LangChain</text>
  <text x="660" y="107" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Professional</text>

  <text x="556" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">TYPE</text>
  <text x="556" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Python framework</text>

  <text x="556" y="176" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">BEST FOR</text>
  <text x="556" y="192" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Production systems</text>

  <text x="556" y="220" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">VECTOR DB</text>
  <text x="556" y="236" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Any vector DB</text>

  <text x="556" y="264" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">LEARNING CURVE</text>
  <circle cx="572" cy="292" r="16" fill="#F4B400"/>
  <text x="572" y="296" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Med</text>
  <text x="596" y="297" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Largest ecosystem</text>

  <text x="400" y="385" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">All three connect to a vector database such as Chroma or Qdrant before generating an answer.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
