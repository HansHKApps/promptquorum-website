<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">Continue.dev vs Cline vs Aider：主要区别</text>
  <rect x="404" y="38" width="194" height="26" fill="#E8DEF8"/>
  <text x="90" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">功能</text>
  <text x="295" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Continue.dev</text>
  <text x="500" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Cline</text>
  <text x="690" y="56" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Aider</text>
  <line x1="10" y1="65" x2="790" y2="65" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="404" y="65" width="194" height="338" fill="#F7F2FA" rx="0"/>
  <text x="18" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">主界面</text>
  <text x="295" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">VS Code + JetBrains</text>
  <text x="500" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">VS Code only</text>
  <text x="690" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Terminal CLI</text>
  <line x1="10" y1="96" x2="790" y2="96" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">工作流</text>
  <text x="295" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">自动补全 + 聊天</text>
  <text x="500" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">自主智能体循环</text>
  <text x="690" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Git原生提交</text>
  <line x1="10" y1="126" x2="790" y2="126" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">编辑模式</text>
  <text x="295" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">FIM + apply-to-file</text>
  <text x="500" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">工具调用（写入/替换）</text>
  <text x="690" y="146" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">搜索替换diff块</text>
