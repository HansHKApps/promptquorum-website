  <text x="500" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">推荐128K</text>
  <text x="690" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">32K</text>
  <line x1="10" y1="276" x2="790" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">最适合</text>
  <text x="295" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">边输入边编辑IDE</text>
  <text x="500" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">多文件重构</text>
  <text x="690" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">可审查的git diff</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
