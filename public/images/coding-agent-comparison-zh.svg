  <text x="690" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">通过/add原生支持</text>
  <line x1="10" y1="186" x2="790" y2="186" stroke="#F7F2FA" stroke-width="1"/>
