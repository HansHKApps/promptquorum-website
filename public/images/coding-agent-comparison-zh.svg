  <text x="690" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">/undo撤销最后提交</text>
  <line x1="10" y1="216" x2="790" y2="216" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">上下文</text>
  <text x="295" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">索引+@固定块</text>
  <text x="500" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">完整文件流式传输</text>
  <text x="690" y="236" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Repo地图+/add文件</text>
  <line x1="10" y1="246" x2="790" y2="246" stroke="#F7F2FA" stroke-width="1"/>
  <text x="18" y="266" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#1C1B1F">最小上下文</text>
