<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Welcher Sprachassistent passt zu Ihnen?</text>

  <text x="400" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Datenschutz, Kosten oder Offline am wichtigsten?</text>

  <line x1="400" y1="65" x2="220" y2="138" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="65" x2="580" y2="138" stroke="#6750A4" stroke-width="2"/>
  <text x="292" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">JA</text>
  <text x="518" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NEIN</text>

  <text x="220" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Auch schnellste Antwort gewünscht?</text>
  <text x="580" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Null Einrichtung, breiteste Skills?</text>

  <line x1="220" y1="163" x2="120" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="220" y1="163" x2="320" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="580" y1="163" x2="480" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="580" y1="163" x2="680" y2="248" stroke="#6750A4" stroke-width="2"/>

  <text x="150" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">JA</text>
  <text x="290" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NEIN</text>
  <text x="510" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">JA</text>
  <text x="650" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NEIN</text>

  <!-- Box 1: Local on GPU mini PC -->
  <rect x="50" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <rect x="50" y="248" width="140" height="4" rx="0" fill="#6750A4"/>
  <text x="120" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lokal auf GPU-</text>
  <text x="120" y="286" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Mini-PC</text>
  <text x="120" y="304" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">verringert Latenzlücke</text>

  <!-- Box 2: Local stack -->
  <rect x="250" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <rect x="250" y="248" width="140" height="4" rx="0" fill="#34A853"/>
