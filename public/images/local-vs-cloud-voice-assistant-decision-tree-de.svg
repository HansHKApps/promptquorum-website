  <text x="480" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Alexa oder Google</text>
  <text x="480" y="308" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Plug-and-Play</text>

  <!-- Box 4: Start local by default -->
  <rect x="610" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="1.5"/>
  <rect x="610" y="248" width="140" height="4" rx="0" fill="#F4B400"/>
  <text x="680" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Unsicher?</text>
  <text x="680" y="286" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">lokal starten auf</text>
  <text x="680" y="300" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">GPU-Mini-PC</text>

  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Zwei Fragen entscheiden den Weg: Datenschutz/Kosten/Offline-Priorität, dann Einrichtungsaufwand vs Skill-Breite.</text>
  <text x="400" y="362" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Datenschutzorientiert, aber unsicher? Standard ist ein lokaler Stack auf einem Mini-PC mit GPU.</text>
<text x="792" y="392" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
