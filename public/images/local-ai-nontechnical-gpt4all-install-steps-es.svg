<svg viewBox="0 0 800 275" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="275" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">GPT4All: 4 pasos hasta tu primer chat</text>
  <text x="400" y="50" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Funciona en cualquier port&#xe1;til de 8 GB · Sin GPU · C&#xf3;digo abierto MIT</text>
  <!-- Step 1 -->
  <circle cx="110" cy="118" r="28" fill="#6750A4"/>
  <text x="110" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="110" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Descargar</text>
  <text x="110" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">gpt4all.io</text>
  <text x="110" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Instalador de ~290 MB</text>
  <!-- Arrow -->
  <text x="185" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6750A4">→</text>
  <!-- Step 2 -->
  <circle cx="280" cy="118" r="28" fill="#6750A4"/>
  <text x="280" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="280" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Instalar</text>
  <text x="280" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Ejecuta el instalador</text>
  <text x="280" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Acepta los valores predeterminados</text>
  <!-- Arrow -->
  <text x="355" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6750A4">→</text>
  <!-- Step 3 -->
  <circle cx="450" cy="118" r="28" fill="#6750A4"/>
  <text x="450" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="450" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Elegir modelo</text>
  <text x="450" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Llama 3.2 3B</text>
  <text x="450" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Descarga de ~2 GB</text>
  <!-- Arrow -->
  <text x="525" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6750A4">→</text>
  <!-- Step 4 -->
  <circle cx="620" cy="118" r="28" fill="#34A853"/>
  <text x="620" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="620" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">Chatear ✓</text>
  <text x="620" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Totalmente sin conexi&#xf3;n</text>
  <text x="620" y="196" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Privado de forma predeterminada</text>
  <!-- Footer -->
