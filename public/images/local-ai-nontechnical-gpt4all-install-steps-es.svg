  <text x="400" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Tiempo total: ~10 min con una conexi&#xf3;n de 50 Mbps · Hardware m&#xed;nimo: 8 GB de RAM</text>
  <text x="400" y="254" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/power-local-llm/local-ai-app-non-technical-users</text>
