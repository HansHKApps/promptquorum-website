<svg viewBox="0 0 800 404" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="404" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">本地LLM怎样才算真正“快”？</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">交互使用的速度门槛。低于15 tok/s → 购买硬件前先试试更小的模型。</text>
  <rect x="18" y="62" width="764" height="70" rx="6" fill="#FFF3F3" stroke="#EA4335" stroke-width="1.5"/>
  <text x="38" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335">低于10 tok/s → 感觉像坏了</text>
  <text x="38" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">单词一个个出现，有明显停顿。无法用于交互聊天。对策：换用更小的模型。</text>
  <rect x="18" y="142" width="764" height="70" rx="6" fill="#FFFBF0" stroke="#F4B400" stroke-width="1.5"/>
  <text x="38" y="164" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#B07D00">15–25 tok/s → 可接受</text>
  <text x="38" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">对大多数用户来说速度可读。适合问答、文档摘要和编程帮助。略有延迟，但可用。</text>
  <rect x="18" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="38" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">30+ tok/s → 流畅</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">像真正的助手。所有交互任务（含代码审</text>
  <text x="38" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">查）都很舒适。</text>
  <rect x="412" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="432" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">60+ tok/s → 即时</text>
  <text x="432" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">比阅读速度还快。适合实时自动补全和快</text>
  <text x="432" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">速迭代。</text>
  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">硬件示例（估算速度）：</text>
  <text x="115" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU，4GB内存：25–40 t/s</text>
  <text x="295" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU，8GB内存：15–25 t/s</text>
  <text x="480" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU，16GB内存：8–15 t/s</text>
  <text x="670" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">独立GPU：快5–10倍</text>
  <line x1="18" y1="362" x2="782" y2="362" stroke="#E8DEF8" stroke-width="2"/>
  <text x="18" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">0</text>
  <text x="140" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">10</text>
  <text x="290" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00">25</text>
  <text x="440" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">40</text>
  <text x="590" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">60</text>
  <text x="735" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">80+ t/s</text>
  <text x="400" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
