<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-label="Which App Should You Pick?">
  <rect width="800" height="350" fill="#FFFFFF"/>
  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Which App Should You Pick?</text>
  <!-- Column headers -->
  <text x="18" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E">Your Situation</text>
  <text x="650" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#79747E" text-anchor="middle">Pick</text>
  <!-- Header divider -->
  <line x1="0" y1="68" x2="800" y2="68" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Row 1 -->
  <rect x="0" y="68" width="800" height="44" fill="#FFFFFF"/>
  <text x="18" y="94" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">RTX 3060+ or M3+ Mac, want max speed</text>
  <text x="650" y="94" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">LM Studio</text>
  <line x1="0" y1="112" x2="800" y2="112" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 2 -->
  <rect x="0" y="112" width="800" height="44" fill="#F7F2FA"/>
  <text x="18" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Need open-source + zero telemetry</text>
  <text x="650" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#F4B400" text-anchor="middle">Jan</text>
  <line x1="0" y1="156" x2="800" y2="156" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 3 -->
  <rect x="0" y="156" width="800" height="44" fill="#FFFFFF"/>
  <text x="18" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Older laptop, 8 GB RAM, no GPU</text>
  <text x="650" y="182" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle">GPT4All</text>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 4 -->
  <rect x="0" y="200" width="800" height="44" fill="#F7F2FA"/>
  <text x="18" y="226" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Want PDF chat out of the box</text>
  <text x="650" y="226" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">LM Studio</text>
  <line x1="0" y1="244" x2="800" y2="244" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 5 -->
  <rect x="0" y="244" width="800" height="44" fill="#FFFFFF"/>
  <text x="18" y="270" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">EU, worried about telemetry compliance</text>
  <text x="650" y="270" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#F4B400" text-anchor="middle">Jan</text>
  <line x1="0" y1="288" x2="800" y2="288" stroke="#F7F2FA" stroke-width="1"/>
  <!-- Row 6 -->
  <rect x="0" y="288" width="800" height="44" fill="#F7F2FA"/>
  <text x="18" y="314" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">Parents need simple chatbot</text>
  <text x="650" y="314" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle">GPT4All</text>
</svg>
