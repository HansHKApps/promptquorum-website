  <text x="264" y="93" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <circle cx="358" cy="85" r="22" fill="#6750A4"/>
  <text x="358" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="408" y="93" font-size="20" fill="#6750A4" text-anchor="middle">→</text>
  <circle cx="502" cy="85" r="22" fill="#6750A4"/>
  <text x="502" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
