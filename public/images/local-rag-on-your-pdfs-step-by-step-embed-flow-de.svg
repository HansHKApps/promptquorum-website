  <circle cx="646" cy="85" r="22" fill="#6750A4"/>
  <text x="646" y="93" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="70" y="128" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">PDFs hochladen</text>
  <text x="70" y="147" font-size="10" fill="#49454F" text-anchor="middle">Drag &amp; Drop</text>
  <text x="70" y="162" font-size="10" fill="#49454F" text-anchor="middle">5–20 zum Start</text>
  <text x="214" y="128" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Text extrahieren</text>
  <text x="214" y="147" font-size="10" fill="#49454F" text-anchor="middle">textbasierte PDFs</text>
  <text x="214" y="162" font-size="10" fill="#49454F" text-anchor="middle">DOCX · TXT · MD</text>
  <text x="358" y="128" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Chunks 1000/200</text>
