  <text x="646" y="162" font-size="10" fill="#49454F" text-anchor="middle">Fragen stellen</text>
  <line x1="18" y1="195" x2="782" y2="195" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="215" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">Embedding-Geschwindigkeit: 400–800 Chunks/Sek. (CPU) · 2000+ Chunks/Sek. (Apple Silicon)</text>
  <text x="400" y="233" font-size="11" fill="#79747E" text-anchor="middle">Nach dem Upload: "In Workspace verschieben" → "Speichern und Embedden" klicken</text>
  <text x="400" y="251" font-size="11" fill="#79747E" text-anchor="middle">20 PDFs (~3000 Chunks) eingebettet in ~5–8 Sek. (CPU) · Jederzeit nach Chunk-Anpassung neu einbetten</text>
  <text x="792" y="282" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
