  <text x="358" y="162" font-size="10" fill="#49454F" text-anchor="middle">200 Überlappung</text>
  <text x="502" y="128" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Einbetten</text>
  <text x="502" y="147" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">nomic-embed-text</text>
  <text x="502" y="162" font-size="10" fill="#49454F" text-anchor="middle">über Ollama</text>
