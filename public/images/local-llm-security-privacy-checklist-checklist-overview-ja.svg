  <text x="400" y="530" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">機密または規制対象データを扱う前に各項目を確認する。</text>
<text x="792" y="543" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>