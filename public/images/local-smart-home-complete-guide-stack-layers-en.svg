<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="500" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">The Local-First Smart Home Stack</text>

  <!-- Layer 1: Hub -->
  <rect x="40" y="52" width="720" height="78" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="40" y="52" width="6" height="78" fill="#6750A4"/>
  <circle cx="86" cy="91" r="22" fill="#6750A4"/>
  <text x="86" y="98" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="126" y="83" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">Hub — Home Assistant</text>
  <text x="126" y="104" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Runs on a Raspberry Pi, mini PC, or NAS — talks directly to devices, no cloud login</text>
  <rect x="672" y="65" width="72" height="20" rx="10" fill="#E8DEF8"/>
  <text x="708" y="79" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6750A4" text-anchor="middle">REQUIRED</text>

  <text x="400" y="146" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">↓</text>

  <!-- Layer 2: Protocols -->
  <rect x="40" y="157" width="720" height="78" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="40" y="157" width="6" height="78" fill="#6750A4"/>
  <circle cx="86" cy="196" r="22" fill="#6750A4"/>
  <text x="86" y="203" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="126" y="188" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">Protocols — Matter/Thread, Zigbee, Z-Wave</text>
  <text x="126" y="209" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Local device-to-hub communication — works without a manufacturer bridge</text>
  <rect x="672" y="170" width="72" height="20" rx="10" fill="#E8DEF8"/>
  <text x="708" y="184" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6750A4" text-anchor="middle">REQUIRED</text>

  <text x="400" y="251" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">↓</text>

  <!-- Layer 3: Local voice -->
  <rect x="40" y="262" width="720" height="78" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="40" y="262" width="6" height="78" fill="#6750A4"/>
  <circle cx="86" cy="301" r="22" fill="#6750A4"/>
  <text x="86" y="308" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="126" y="293" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">Local voice — Assist + Whisper + Piper</text>
  <text x="126" y="314" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Replaces Alexa/Google — speech-to-text and text-to-speech, fully offline</text>
  <rect x="672" y="275" width="72" height="20" rx="10" fill="#E8DEF8"/>
  <text x="708" y="289" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6750A4" text-anchor="middle">REQUIRED</text>

  <text x="400" y="356" font-family="system-ui, sans-serif" font-size="18" fill="#6750A4" text-anchor="middle">↓</text>

  <!-- Layer 4: AI brain -->
  <rect x="40" y="367" width="720" height="78" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="40" y="367" width="6" height="78" fill="#79747E"/>
  <circle cx="86" cy="406" r="22" fill="#79747E"/>
  <text x="86" y="413" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="126" y="398" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F">AI brain — local LLM via Ollama</text>
  <text x="126" y="419" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">Natural-language control and context-aware automations, same hardware</text>
  <rect x="672" y="380" width="72" height="20" rx="10" fill="#F7F2FA"/>
  <text x="708" y="394" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#79747E" text-anchor="middle">OPTIONAL</text>

  <text x="400" y="470" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Build bottom-up: hub first, protocols second, local voice third, the AI brain last.</text>
<text x="792" y="495" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
