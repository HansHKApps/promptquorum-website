<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="Cloud Writing Tools vs. Local LLM: Cost and Privacy"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="410" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud Writing Tools vs. Local LLM: Cost &amp; Privacy</text>
  <!-- Subtitle -->
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Grammarly + Notion AI (cloud) vs. Ollama + Obsidian (local)</text>

  <!-- Left panel: Cloud tools (problem) -->
  <rect x="28" y="65" width="340" height="290" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="65" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">Grammarly + Notion AI</text>
  <text x="198" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Cloud Subscriptions</text>

  <text x="48" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; 2 separate paid subscriptions</text>
  <text x="48" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Text sent to cloud servers to process</text>
  <text x="48" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Notion AI routes documents to OpenAI's API</text>
  <text x="48" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Grammarly licenses submitted text for</text>
  <text x="58" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">product improvement</text>
  <text x="48" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Recurring monthly fee, indefinitely</text>

  <!-- Right panel: Local LLM (goal) -->
  <rect x="432" y="65" width="340" height="290" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="65" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Ollama + Obsidian</text>
  <text x="602" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Local LLM Setup</text>

  <text x="452" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; One local LLM covers both tools</text>
  <text x="452" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Zero data leaves your device</text>
  <text x="452" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; No outbound connection during inference</text>
  <text x="452" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Notes stored as portable markdown</text>
  <text x="462" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">files, not a proprietary database</text>
  <text x="452" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">&#8226; Free after one-time hardware cost</text>

  <!-- Footer divider -->
  <line x1="18" y1="372" x2="782" y2="372" stroke="#E8DEF8" stroke-width="1.5"/>
  <!-- Footer -->
  <text x="400" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Local setup replaces both subscriptions with a one-time hardware cost only, then runs free indefinitely.</text>
<text x="792" y="405" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
