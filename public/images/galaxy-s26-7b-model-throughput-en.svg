<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Galaxy S26: 7B Model Decode Speed by Quantization</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">FP16 (~14 GB) theoretical</text>
  <rect x="260" y="75" width="114" height="24" fill="#EA4335" rx="4"/>
  <text x="384" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">6 tok/s — too slow to use</text>

  <text x="250" y="136" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Q4 4-bit (~3.5 GB) theoretical max</text>
  <rect x="260" y="117" width="456" height="24" fill="#6750A4" rx="4"/>
  <text x="726" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">24 tok/s ceiling</text>

  <text x="250" y="178" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Q4 4-bit (~3.5 GB) real-world</text>
  <rect x="260" y="159" width="285" height="24" fill="#34A853" rx="4"/>
  <text x="553" y="176" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8–15 tok/s — realistic target</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Decode speed ≈ 85.6 GB/s ÷ model size in bytes — Q4 shrinks a 7B model from 14 GB to 3.5 GB, moving throughput from 6 to 8–15 tok/s.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
