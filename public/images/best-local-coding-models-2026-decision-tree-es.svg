<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">&#xc1;rbol de decisi&#xf3;n: 6 preguntas para elegir tu modelo</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="65" r="16" fill="#6750A4"/>
  <text x="38" y="70" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="66" y="59" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Cu&#xe1;nta VRAM tienes?</text>
  <text x="66" y="76" font-size="11" fill="#49454F">&lt;12 GB &#x2192; Qwen3-Coder 7B &#xb7; 12&#x2013;16 GB &#x2192; 7B o Codestral 22B &#xb7; 24 GB &#x2192; 30B &#xb7; 48 GB+ &#x2192; DeepSeek V3 (completo)</text>
  <line x1="18" y1="92" x2="782" y2="92" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="116" r="16" fill="#6750A4"/>
  <text x="38" y="121" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="66" y="110" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Vas a lanzar un producto comercial?</text>
  <text x="66" y="127" font-size="11" fill="#49454F">S&#xed; &#x2192; prefiere Apache 2.0 (Qwen3-Coder, DeepSeek, Granite). Evita Codestral sin la licencia comercial de Mistral.</text>
  <line x1="18" y1="143" x2="782" y2="143" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="167" r="16" fill="#6750A4"/>
  <text x="38" y="172" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="66" y="161" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Necesitas una ventana de contexto superior a 32K?</text>
  <text x="66" y="178" font-size="11" fill="#49454F">S&#xed; &#x2192; descarta Codestral (l&#xed;mite de 32K) y StarCoder 2 (l&#xed;mite de 16K). Elige Qwen3-Coder, DeepSeek, Llama o Granite.</text>
  <line x1="18" y1="194" x2="782" y2="194" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="218" r="16" fill="#6750A4"/>
  <text x="38" y="223" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="66" y="212" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Escribes en lenguajes de nicho (Rust, Lua, Haskell, Solidity)?</text>
  <text x="66" y="229" font-size="11" fill="#49454F">S&#xed; &#x2192; StarCoder 2 15B, a pesar del l&#xed;mite de contexto de 16K. La mejor cobertura open-weight de lenguajes de nicho.</text>
  <line x1="18" y1="245" x2="782" y2="245" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="269" r="16" fill="#6750A4"/>
  <text x="38" y="274" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="66" y="263" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Sector regulado &#x2014; se requiere auditor&#xed;a de adquisiciones?</text>
  <text x="66" y="280" font-size="11" fill="#49454F">S&#xed; &#x2192; Granite Code 34B: Apache 2.0 + documentaci&#xf3;n de procedencia de datos de entrenamiento de IBM incluida.</text>
  <line x1="18" y1="296" x2="782" y2="296" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="320" r="16" fill="#6750A4"/>
  <text x="38" y="325" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="66" y="314" font-size="13" font-weight="700" fill="#1C1B1F">&#xbf;Todav&#xed;a no lo tienes claro?</text>
  <text x="66" y="331" font-size="11" fill="#49454F">Opta por Qwen3-Coder &#x2014; 30B en una GPU de 24 GB, 7B en un port&#xe1;til o GPU de 8 GB. Reeval&#xfa;a cuando se te quede corto.</text>
  <line x1="18" y1="347" x2="782" y2="347" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="375" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">Responde las preguntas en orden &#xb7; Gana la primera restricci&#xf3;n vinculante &#xb7; Mayo de 2026</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
