<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Same Backend, Same Speed</text>

  <!-- LM Studio app box -->
  <rect x="60" y="60" width="300" height="120" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="60" y="60" width="300" height="4" rx="0" fill="#7D5260"/>
  <text x="210" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#7D5260" text-anchor="middle">LM Studio 0.4.16</text>
  <text x="80" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">Minimal Electron UI</text>
  <text x="80" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">One active model at a time</text>
  <text x="80" y="144" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#1C1B1F">Base RAM: 500MB–1GB</text>
  <text x="80" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">API: localhost:1234</text>

  <!-- Jan AI app box -->
  <rect x="440" y="60" width="300" height="120" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="440" y="60" width="300" height="4" rx="0" fill="#6750A4"/>
  <text x="590" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6750A4" text-anchor="middle">Jan AI 0.8.2</text>
  <text x="460" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">Electron UI + plugin runtime</text>
  <text x="460" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">Multiple models, multiple ports</text>
  <text x="460" y="144" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#1C1B1F">Base RAM: ~1GB+ (heavier)</text>
  <text x="460" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F">API: localhost:1337</text>

  <!-- Arrows down -->
  <line x1="210" y1="180" x2="210" y2="228" stroke="#6750A4" stroke-width="2"/>
  <text x="223" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6750A4">↓</text>
  <line x1="590" y1="180" x2="590" y2="228" stroke="#6750A4" stroke-width="2"/>
  <text x="603" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6750A4">↓</text>

  <!-- Shared backend -->
  <rect x="140" y="230" width="520" height="70" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="2"/>
  <text x="400" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1C1B1F" text-anchor="middle">llama.cpp inference engine</text>
  <text x="400" y="278" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">Same GGUF model files, same quantization, same GPU offload</text>

  <!-- Result badge -->
  <circle cx="400" cy="340" r="24" fill="#34A853"/>
  <text x="400" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">TIE</text>

  <text x="400" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#49454F" text-anchor="middle">Inference speed is backend-bound, not app-bound — need 50+ tok/s? Use vLLM or Ollama instead</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
