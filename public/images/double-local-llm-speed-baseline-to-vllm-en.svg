<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">7B Model Speed Optimization: Baseline to vLLM (RTX 4090)</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">Baseline (Ollama)</text>
  <rect x="260" y="75" width="192" height="24" fill="#79747E" rx="4"/>
  <text x="462" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">120 tok/s</text>

  <text x="250" y="146" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">– Debug Logging</text>
  <rect x="260" y="127" width="211" height="24" fill="#6750A4" rx="4"/>
  <text x="481" y="144" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">132 tok/s (+10%)</text>

  <text x="250" y="198" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">+ GPU Memory 95%</text>
  <rect x="260" y="179" width="240" height="24" fill="#6750A4" rx="4"/>
  <text x="510" y="196" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">150 tok/s (+25% total)</text>

  <text x="250" y="250" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="end">+ Switch to vLLM (batch)</text>
  <rect x="260" y="231" width="480" height="24" fill="#34A853" rx="4"/>
  <text x="558" y="248" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF">300 tok/s (+2.5× total)</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Stacking logging, GPU memory tuning, and vLLM lifts a 7B model from 120 to 300 tok/sec — a 2.5× cumulative gain.</text>
