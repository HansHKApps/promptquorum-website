<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Qwen Deployment: Self-Hosted or Cloud?</text>

  <rect x="265" y="38" width="270" height="34" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="400" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Using Qwen 4+ hours per day?</text>

  <line x1="330" y1="72" x2="175" y2="148" stroke="#6750A4" stroke-width="2"/>
  <text x="222" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E" text-anchor="start">YES — 4+ HRS/DAY</text>

  <line x1="470" y1="72" x2="625" y2="148" stroke="#6750A4" stroke-width="2"/>
  <text x="500" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E" text-anchor="start">NO — UNDER 4 HRS/DAY</text>

  <!-- Left panel: Self-Hosted -->
  <rect x="40" y="150" width="340" height="245" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="40" y="150" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="210" y="178" font-size="15" font-weight="700" fill="#34A853" text-anchor="middle">Self-Hosted</text>

  <text x="58" y="204" font-size="12" fill="#1C1B1F">4+ hrs/day of Qwen3 8B/14B: cheaper than cloud</text>
  <line x1="58" y1="214" x2="362" y2="214" stroke="#F7F2FA" stroke-width="1"/>
  <text x="58" y="234" font-size="12" fill="#1C1B1F">Need &lt;80 ms latency for coding or docs</text>
  <line x1="58" y1="244" x2="362" y2="244" stroke="#F7F2FA" stroke-width="1"/>
  <text x="58" y="264" font-size="12" fill="#1C1B1F">Private data that can't leave your network</text>
  <line x1="58" y1="274" x2="362" y2="274" stroke="#F7F2FA" stroke-width="1"/>
  <text x="58" y="294" font-size="12" fill="#1C1B1F">Already own a 12+ GB VRAM GPU, unused</text>

  <line x1="58" y1="312" x2="362" y2="312" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="58" y="332" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4">Qwen3 8B: Minisforum UM890 Pro — $429</text>
  <text x="58" y="354" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4">Qwen3 32B: RTX 4090 build — ~$2,800</text>
  <text x="58" y="378" font-size="11" fill="#79747E">Electricity only: $0.03–0.08 per day</text>

  <!-- Right panel: Cloud -->
  <rect x="420" y="150" width="340" height="245" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="420" y="150" width="340" height="4" rx="0" fill="#6750A4"/>
  <text x="590" y="178" font-size="15" font-weight="700" fill="#6750A4" text-anchor="middle">Cloud</text>

  <text x="438" y="204" font-size="12" fill="#1C1B1F">Qwen2.5-72B occasional (&lt;4 hrs/day) use</text>
  <line x1="438" y1="214" x2="742" y2="214" stroke="#F7F2FA" stroke-width="1"/>
  <text x="438" y="234" font-size="12" fill="#1C1B1F">Testing 72B before buying hardware</text>
  <line x1="438" y1="244" x2="742" y2="244" stroke="#F7F2FA" stroke-width="1"/>
  <text x="438" y="264" font-size="12" fill="#1C1B1F">Bursty, unpredictable usage patterns</text>
  <line x1="438" y1="274" x2="742" y2="274" stroke="#F7F2FA" stroke-width="1"/>
  <text x="438" y="294" font-size="12" fill="#1C1B1F">Outside US/EU — import duties add cost</text>

  <line x1="438" y1="312" x2="742" y2="312" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="438" y="332" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4">RunPod A40 48GB: $0.44/hr for 72B bursts</text>
  <text x="438" y="354" font-size="11" fill="#79747E">No upfront cost — scales to zero when idle</text>

  <text x="400" y="416" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Self-hosting Qwen3 8B–32B costs $0.03–0.08/day in electricity; cloud rental for occasional 72B use costs $0.44/hr on RunPod.</text>
<text x="792" y="425" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
