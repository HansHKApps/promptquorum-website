<svg viewBox="0 0 800 404" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="404" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">로컬 LLM에서 "빠르다"는 어느 정도일까?</text>
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">대화형 사용을 위한 속도 기준. 15 tok/s 미만 → 하드웨어를 사기 전에 더 작은 모델을 먼저 써 보세요.</text>
  <rect x="18" y="62" width="764" height="70" rx="6" fill="#FFF3F3" stroke="#EA4335" stroke-width="1.5"/>
  <text x="38" y="84" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#EA4335">10 tok/s 미만 → 고장 난 것처럼 느껴짐</text>
  <text x="38" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">단어가 하나씩 눈에 띄는 멈춤과 함께 나타납니다. 대화형 채팅에는 부적합합니다. 해결: 더 작</text>
  <text x="38" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">은 모델로 바꾸세요.</text>
  <rect x="18" y="142" width="764" height="70" rx="6" fill="#FFFBF0" stroke="#F4B400" stroke-width="1.5"/>
  <text x="38" y="164" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#B07D00">15–25 tok/s → 무난함</text>
  <text x="38" y="185" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">대부분의 사용자에게 읽기 좋은 속도입니다. Q&amp;A, 문서 요약, 코딩 도움에 적합합니다. 약간 느</text>
  <text x="38" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">리지만 쓸 만합니다.</text>
  <rect x="18" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="38" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">30+ tok/s → 매끄러움</text>
  <text x="38" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">진짜 어시스턴트 같은 느낌입니다. 코</text>
  <text x="38" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">드 리뷰를 포함한 모든 대화형 작업에 </text>
  <text x="38" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">쾌적합니다.</text>
  <rect x="412" y="222" width="370" height="82" rx="6" fill="#F0FFF4" stroke="#34A853" stroke-width="1.5"/>
  <text x="432" y="244" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#34A853">60+ tok/s → 즉각적</text>
  <text x="432" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">읽는 속도보다 빠릅니다. 실시간 자동 </text>
  <text x="432" y="282" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">완성과 빠른 반복 작업에 이상적입니다</text>
  <text x="432" y="299" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#49454F">.</text>
  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">하드웨어 예시(추정 속도):</text>
  <text x="115" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, RAM 4GB: 25–40 t/s</text>
  <text x="295" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, RAM 8GB: 15–25 t/s</text>
  <text x="480" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">CPU, RAM 16GB: 8–15 t/s</text>
  <text x="670" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">외장 GPU: 5–10배 빠름</text>
  <line x1="18" y1="362" x2="782" y2="362" stroke="#E8DEF8" stroke-width="2"/>
  <text x="18" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">0</text>
  <text x="140" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#EA4335">10</text>
  <text x="290" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#B07D00">25</text>
  <text x="440" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">40</text>
  <text x="590" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">60</text>
  <text x="735" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#34A853">80+ t/s</text>
  <text x="400" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">promptquorum.com/local-llms/fastest-local-llms-low-end-pcs</text>
</svg>
