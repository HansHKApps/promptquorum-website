<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <style>
      .title { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; }
      .tier { fill: #FFFFFF; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .card-bg { fill: #F7F2FA; stroke: #6750A4; stroke-width: 1.5; }
      .name { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; }
      .desc { fill: #49454F; font-family: system-ui, sans-serif; font-size: 11.5px; }
      .badge { fill: #EAE1FF; stroke: #6750A4; stroke-width: 1; }
      .badge-text { fill: #4F378B; font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 700; }
      .cmd-bg { fill: #FFFFFF; stroke: #CAC4D0; stroke-width: 1; }
      .cmd { fill: #1C1B1F; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
      .tip { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 600; }
      .foot { fill: #79747E; font-family: system-ui, sans-serif; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" class="title" text-anchor="middle">Ollama トップモデル（ティア別）</text>

  <rect x="20" y="46" width="240" height="26" rx="4" fill="#5B3A9B"/>
  <text x="140" y="64" class="tier" text-anchor="middle">小 (2-4 GB)</text>
  <rect x="20" y="82" width="240" height="100" rx="6" class="card-bg"/>
  <text x="34" y="108" class="name">Gemma 2B</text>
  <rect x="196" y="93" width="50" height="20" rx="4" class="badge"/>
  <text x="221.0" y="107" class="badge-text" text-anchor="middle">2 GB</text>
  <text x="34" y="130" class="desc">軽量、高速推論</text>
  <text x="34" y="145" class="desc">チャットボット、要約</text>
  <rect x="34" y="154" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="42" y="168" class="cmd">ollama run gemma2:2b</text>
  <rect x="20" y="192" width="240" height="100" rx="6" class="card-bg"/>
  <text x="34" y="218" class="name">Phi-4 Mini</text>
  <rect x="196" y="203" width="50" height="20" rx="4" class="badge"/>
  <text x="221.0" y="217" class="badge-text" text-anchor="middle">3 GB</text>
  <text x="34" y="240" class="desc">CPU向け、推論タスク</text>
  <text x="34" y="255" class="desc">プロンプトエンジニアリング</text>
  <rect x="34" y="264" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="42" y="278" class="cmd">ollama run phi4-mini</text>

  <rect x="280" y="46" width="240" height="26" rx="4" fill="#5B3A9B"/>
  <text x="400" y="64" class="tier" text-anchor="middle">中 (4-8 GB)</text>
  <rect x="280" y="82" width="240" height="100" rx="6" class="card-bg"/>
  <text x="294" y="108" class="name">Llama 3 8B</text>
  <rect x="456" y="93" width="50" height="20" rx="4" class="badge"/>
  <text x="481.0" y="107" class="badge-text" text-anchor="middle">6 GB</text>
  <text x="294" y="130" class="desc">汎用モデル、全用途向け</text>
  <text x="294" y="145" class="desc">コード＋言語理解</text>
  <rect x="294" y="154" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="302" y="168" class="cmd">ollama run llama3</text>
  <rect x="280" y="192" width="240" height="100" rx="6" class="card-bg"/>
  <text x="294" y="218" class="name">Mistral 7B</text>
  <rect x="456" y="203" width="50" height="20" rx="4" class="badge"/>
  <text x="481.0" y="217" class="badge-text" text-anchor="middle">5 GB</text>
  <text x="294" y="240" class="desc">高速、高品質出力</text>
  <text x="294" y="255" class="desc">RAG、文書処理</text>
  <rect x="294" y="264" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="302" y="278" class="cmd">ollama run mistral</text>

  <rect x="540" y="46" width="240" height="26" rx="4" fill="#5B3A9B"/>
  <text x="660" y="64" class="tier" text-anchor="middle">大 (12+ GB)</text>
  <rect x="540" y="82" width="240" height="100" rx="6" class="card-bg"/>
  <text x="554" y="108" class="name">Llama 3 70B</text>
  <rect x="702" y="93" width="64" height="20" rx="4" class="badge"/>
  <text x="734.0" y="107" class="badge-text" text-anchor="middle">Q4: 43 GB</text>
  <text x="554" y="130" class="desc">エキスパート推論＆分析</text>
  <text x="554" y="145" class="desc">複雑な問題解決</text>
  <rect x="554" y="154" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="562" y="168" class="cmd">ollama run llama3:70b</text>
  <rect x="540" y="192" width="240" height="100" rx="6" class="card-bg"/>
  <text x="554" y="218" class="name">Qwen2.5 72B</text>
  <rect x="702" y="203" width="64" height="20" rx="4" class="badge"/>
  <text x="734.0" y="217" class="badge-text" text-anchor="middle">Q4: 45 GB</text>
  <text x="554" y="240" class="desc">多言語、コード＋数学</text>
  <text x="554" y="255" class="desc">エンタープライズ向け</text>
  <rect x="554" y="264" width="212" height="20" rx="4" class="cmd-bg"/>
  <text x="562" y="278" class="cmd">ollama run qwen2.5:72b</text>

  <text x="20" y="328" class="tip">ヒント：Mistral 7BまたはLlama 3 8Bから開始 — ほとんどの用途に最適</text>
  <text x="20" y="348" class="foot">モデル取得：ollama pull gemma2:2b | ライブラリ表示：ollama list</text>
  <text x="792" y="392" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>
