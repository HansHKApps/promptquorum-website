<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="300" fill="#FFFFFF"/>
<text x="400.0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">NAS vs 로컬 SSD vs 클라우드 vs 외장 USB</text>
<text x="26" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">옵션</text>
<text x="178.0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">용량</text>
<text x="284.4" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">속도</text>
<text x="390.79999999999995" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">이중화</text>
<text x="512.4" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">최적 용도</text>
<line x1="20" y1="80" x2="780" y2="80" stroke="#E8DEF8" stroke-width="1.5"/>
<text x="26" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">로컬 SSD</text>
<text x="178.0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">2TB</text>
<text x="284.4" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">빠름</text>
<text x="390.79999999999995" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">없음</text>
<text x="512.4" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">단일 머신, 빠른 접근</text>
<line x1="20" y1="126" x2="780" y2="126" stroke="#F7F2FA" stroke-width="1"/>
<rect x="14" y="130" width="772" height="38" rx="4" fill="#F7F2FA"/>
<text x="26" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="start">NAS (RAID 6)</text>
<text x="178.0" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">8TB</text>
<text x="284.4" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">보통</text>
<text x="390.79999999999995" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">양호</text>
<text x="512.4" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">팀, 공유 접근</text>
<line x1="20" y1="170" x2="780" y2="170" stroke="#F7F2FA" stroke-width="1"/>
<text x="26" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">클라우드 (AWS S3)</text>
<text x="178.0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">무제한</text>
<text x="284.4" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">느림</text>
<text x="390.79999999999995" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">우수</text>
<text x="512.4" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">원격 접근, 보관용 모델</text>
<line x1="20" y1="214" x2="780" y2="214" stroke="#F7F2FA" stroke-width="1"/>
<text x="26" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">외장 USB</text>
<text x="178.0" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">4TB</text>
<text x="284.4" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">느림</text>
<text x="390.79999999999995" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">없음</text>
<text x="512.4" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">오프라인 백업, 휴대용</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>