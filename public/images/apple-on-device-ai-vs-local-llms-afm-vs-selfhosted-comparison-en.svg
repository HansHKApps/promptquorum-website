<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Apple AFM 3 Core Advanced vs. Self-Hosted Local LLM</text>

  <rect x="508" y="50" width="274" height="256" rx="4" fill="#E8DEF8"/>

  <text x="32" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">Category</text>
  <text x="250" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Apple AFM 3 Core Advanced</text>
  <text x="520" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">Self-Hosted Local LLM</text>
  <line x1="18" y1="72" x2="782" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="32" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Model size</text>
  <text x="250" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">20B sparse, 1–4B active params</text>
  <text x="520" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">3B–70B+, your choice</text>
  <line x1="18" y1="108" x2="782" y2="108" stroke="#F7F2FA" stroke-width="1"/>

  <text x="32" y="134" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Control</text>
  <text x="250" y="134" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Locked to Apple OS</text>
  <text x="520" y="134" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Full: any model, quant, tool</text>
  <line x1="18" y1="144" x2="782" y2="144" stroke="#F7F2FA" stroke-width="1"/>

  <text x="32" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Offline</text>
  <text x="250" y="170" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">On-device only; heavy → cloud</text>
  <text x="520" y="170" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Fully offline if you choose</text>
  <line x1="18" y1="180" x2="782" y2="180" stroke="#F7F2FA" stroke-width="1"/>

  <text x="32" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Privacy</text>
  <text x="250" y="206" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Cloud tiers see your request</text>
  <text x="520" y="206" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Absolute — nothing leaves</text>
  <line x1="18" y1="216" x2="782" y2="216" stroke="#F7F2FA" stroke-width="1"/>

  <text x="32" y="242" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Openness</text>
  <text x="250" y="242" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Closed weights, Apple-only</text>
  <text x="520" y="242" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Open weights, fine-tunable</text>
  <line x1="18" y1="252" x2="782" y2="252" stroke="#F7F2FA" stroke-width="1"/>

  <text x="32" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Updates</text>
  <text x="250" y="278" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">Apple controls schedule</text>
  <text x="520" y="278" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F">You choose when to update</text>

  <text x="400" y="350" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Self-hosted models (Qwen, Llama, Gemma) match the on-device tier for offline use, plus open weights and full model control.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
