  <text x="48" y="172" font-size="13" font-weight="600" fill="#1C1B1F">StyleTTS 2</text>
  <text x="348" y="172" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">MIT</text>
