  <text x="602" y="80" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">비상업적 전용</text>

  <text x="452" y="118" font-size="14" font-weight="700" fill="#1C1B1F">XTTS v2</text>
  <text x="752" y="118" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#EA4335" text-anchor="end">CPML</text>
  <text x="452" y="140" font-size="11.5" fill="#49454F">최고의 클로닝 품질이지만, Coqui Inc.가</text>
  <text x="452" y="156" font-size="11.5" fill="#49454F">2024년 1월 문을 닫은 이후 판매처가 없습니다.</text>
  <line x1="452" y1="172" x2="752" y2="172" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="200" font-size="14" font-weight="700" fill="#1C1B1F">F5-TTS</text>
  <text x="752" y="200" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#EA4335" text-anchor="end">CC-BY-NC-4.0</text>
  <text x="452" y="222" font-size="11.5" fill="#49454F">더 빠른 제로샷 클로닝(참조 오디오 약 3초),</text>
  <text x="452" y="238" font-size="11.5" fill="#49454F">동일한 제한 사항.</text>

  <text x="452" y="290" font-size="11" fill="#79747E">두 모델 모두 프로덕션 사용 전</text>
  <text x="452" y="306" font-size="11" fill="#79747E">별도의 상업용 계약이 필요합니다.</text>

  <text x="400" y="335" font-family="system-ui, sans-serif" font-size="11.5" fill="#79747E" text-anchor="middle">사실에 기반한 참고 자료이며 법률 자문이 아닙니다 — 상업적 배포 전 각 라이선스를 직접 확인하십시오.</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
