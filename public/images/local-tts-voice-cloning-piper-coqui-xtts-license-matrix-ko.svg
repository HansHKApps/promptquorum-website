  <text x="348" y="204" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">Apache 2.0</text>
  <line x1="48" y1="212" x2="348" y2="212" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="236" font-size="13" font-weight="600" fill="#1C1B1F">Tortoise</text>
  <text x="348" y="236" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#34A853" text-anchor="end">Apache 2.0</text>
