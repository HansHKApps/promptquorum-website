  <text x="48" y="268" font-size="13" font-weight="600" fill="#1C1B1F">Coqui TTS</text>
  <text x="348" y="268" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#F4B400" text-anchor="end">MPL 2.0*</text>
  <text x="48" y="290" font-size="10.5" fill="#79747E">*툴킷 소스 변경 사항을 공개하면 상업적 사용 가능</text>

  <rect x="432" y="52" width="340" height="270" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
