  <rect width="800" height="450" fill="#FFFFFF"/>
  <text x="400" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#1C1B1F" text-anchor="middle">Balcony Solar, in Brief</text>
  <rect x="50" y="100" width="157" height="230" fill="#F7F6F3" stroke="#79747E" stroke-width="1" rx="6"/>
  <text x="128.5" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#49454F" text-anchor="middle">GERMANY 2017</text>
