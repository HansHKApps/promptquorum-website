  <text x="128.5" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">registered systems</text>
  <rect x="231" y="100" width="157" height="230" fill="#F7F6F3" stroke="#79747E" stroke-width="1" rx="6"/>
  <text x="309.5" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#49454F" text-anchor="middle">GERMANY 2025</text>
  <text x="309.5" y="200" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#6750A4" text-anchor="middle">~4,000,000</text>
  <text x="309.5" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">installations (est.)</text>
  <rect x="412" y="100" width="157" height="230" fill="#F7F6F3" stroke="#79747E" stroke-width="1" rx="6"/>
