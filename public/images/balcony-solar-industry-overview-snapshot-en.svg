  <text x="490.5" y="200" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F4B400" text-anchor="middle">800W</text>
  <text x="490.5" y="300" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">since May 2024</text>
  <rect x="593" y="100" width="157" height="230" fill="#F7F6F3" stroke="#79747E" stroke-width="1" rx="6"/>
