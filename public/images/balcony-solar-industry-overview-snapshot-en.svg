  <text x="400" y="425" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Germany scaled from roughly 40,000 registered balcony-solar systems in 2017 to an estimated 4 million installations by 2025 — the market’s clearest verified growth signal.</text>
