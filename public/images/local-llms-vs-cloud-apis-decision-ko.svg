<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata><rect width="800" height="400" fill="#FFFFFF"/><text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">무엇을 선택해야 할까요? 로컬 LLM vs 클라우드 API</text><rect x="28" y="50" width="340" height="310" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/><rect x="28" y="50" width="340" height="4" rx="0" fill="#6750A4"/><text x="198" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#6750A4" text-anchor="middle">로컬 LLM을 선택하세요, 다음의 경우:</text><circle cx="58" cy="125" r="11" fill="#6750A4"/><text x="58" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">민감하거나 규제된 데이터</text><circle cx="58" cy="180" r="11" fill="#6750A4"/><text x="58" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">높은 사용량, 빈번한 워크로드</text><circle cx="58" cy="235" r="11" fill="#6750A4"/><text x="58" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">오프라인 접근이 필요한 경우</text><circle cx="58" cy="290" r="11" fill="#6750A4"/><text x="58" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="80" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">LLM 작동 원리를 배우고 싶은 경우</text><rect x="432" y="50" width="340" height="310" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/><rect x="432" y="50" width="340" height="4" rx="0" fill="#7D5260"/><text x="602" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#7D5260" text-anchor="middle">클라우드 API를 선택하세요, 다음의 경우:</text><circle cx="462" cy="125" r="11" fill="#7D5260"/><text x="462" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">최고 품질이 필요한 경우</text><circle cx="462" cy="180" r="11" fill="#7D5260"/><text x="462" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">설정 마찰 없이 시작하고 싶은 경우</text><circle cx="462" cy="235" r="11" fill="#7D5260"/><text x="462" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">인프라 관리 없이 프로토타이핑</text><circle cx="462" cy="290" r="11" fill="#7D5260"/><text x="462" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#10003;</text><text x="484" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F" text-anchor="start">낮은 사용량, 간헐적 사용</text><text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>