  <line x1="260" y1="272" x2="740" y2="272" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="300" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Qwen3-Coder 32B (green) is the practical minimum for pre-merge review. Llama 3.3 70B (purple) trades a few</text>
  <text x="400" y="318" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">points of raw bug detection for deeper multi-file security pattern recognition.</text>
