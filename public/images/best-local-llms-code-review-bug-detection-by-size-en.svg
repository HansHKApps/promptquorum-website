  <text x="515" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">45% of bugs -- too weak</text>

  <text x="250" y="146" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">13B-14B models</text>
