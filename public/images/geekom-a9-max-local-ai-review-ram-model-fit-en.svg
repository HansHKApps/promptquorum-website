<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">GEEKOM A9 Max — Local LLM Model Fit by RAM</text>
  <text x="400" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#79747E" text-anchor="middle">Estimated from verified hardware — Ollama / llama.cpp, 4-bit (Q4) quantization</text>

  <text x="50" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">RAM</text>
  <text x="180" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#79747E">Model Fit</text>
  <line x1="18" y1="74" x2="782" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: 32 GB (as tested) -->
  <circle cx="40" cy="102" r="15" fill="#34A853"/>
  <text x="40" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">32</text>
  <text x="70" y="98" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">32 GB (as tested)</text>
  <text x="180" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">7B–8B comfortable</text>
  <text x="180" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F">13B–14B (Q4) fits with room for context</text>
  <line x1="18" y1="130" x2="782" y2="130" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: 64 GB -->
  <circle cx="40" cy="158" r="15" fill="#F4B400"/>
  <text x="40" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">64</text>
  <text x="70" y="154" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">64 GB (upgrade)</text>
  <text x="180" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">30B-class opens</text>
  <text x="180" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F">Still limited by dual-channel memory bandwidth</text>
  <line x1="18" y1="186" x2="782" y2="186" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: 128 GB (max) -->
  <circle cx="40" cy="214" r="15" fill="#EA4335"/>
  <text x="40" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">128</text>
  <text x="70" y="210" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">128 GB (max)</text>
  <text x="180" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1C1B1F">70B loads at Q4 — slow</text>
  <text x="180" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F">Usable for experimentation, not fast serving</text>

  <text x="400" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">The 50-TOPS NPU accelerates Frigate vision, not local LLMs — the CPU, Radeon 890M iGPU, and RAM bandwidth set inference speed.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
