<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="600" y="57.86" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#1C1B1F" text-anchor="middle">Whisper-Laufzeiten: Jedes Tool gewinnt auf seiner Plattform</text>

  <!-- Left panel: Apple Silicon / whisper.cpp -->
  <rect x="33.6" y="100.29" width="408" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="33.6" y="100.29" width="408" height="7.71" rx="0" fill="#6750A4"/>
  <text x="237.6" y="154.29" font-size="24" font-weight="700" fill="#6750A4" text-anchor="middle">Apple Silicon — whisper.cpp</text>

  <text x="57.6" y="216" font-size="18" font-weight="700" fill="#79747E">large-v3, M5 Pro, Metal</text>
  <text x="57.6" y="270" font-family="'SF Mono', Monaco, monospace" font-size="33" font-weight="700" fill="#6750A4">~10&#215; Echtzeit</text>
  <line x1="57.6" y1="298.93" x2="417.6" y2="298.93" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="57.6" y="351" font-size="18" font-weight="700" fill="#79747E">faster-whisper auf demselben Mac (nur CPU)</text>
  <text x="57.6" y="397.29" font-family="'SF Mono', Monaco, monospace" font-size="24" font-weight="700" fill="#79747E">~3&#215; Echtzeit</text>

  <text x="57.6" y="482.14" font-size="18" fill="#49454F">Keine Python-Abhängigkeit nötig —</text>
  <text x="57.6" y="516.86" font-size="18" fill="#49454F">der Core-ML-Export nutzt direkt</text>
  <text x="57.6" y="551.57" font-size="18" fill="#49454F">die Apple Neural Engine.</text>

  <!-- Right panel: NVIDIA GPU / faster-whisper -->
  <rect x="758.4" y="100.29" width="408" height="520.71" rx="11.57" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="758.4" y="100.29" width="408" height="7.71" rx="0" fill="#7D5260"/>
  <text x="962.4" y="154.29" font-size="24" font-weight="700" fill="#7D5260" text-anchor="middle">NVIDIA GPU — faster-whisper</text>

  <text x="782.4" y="216" font-size="18" font-weight="700" fill="#79747E">large-v3, RTX 4070, int8</text>
  <text x="782.4" y="270" font-family="'SF Mono', Monaco, monospace" font-size="33" font-weight="700" fill="#7D5260">~12&#215; Echtzeit</text>
  <line x1="782.4" y1="298.93" x2="1142.4" y2="298.93" stroke="#F7F2FA" stroke-width="1.4"/>

  <text x="782.4" y="351" font-size="18" font-weight="700" fill="#79747E">whisper.cpp auf derselben GPU (CUDA)</text>
  <text x="782.4" y="397.29" font-family="'SF Mono', Monaco, monospace" font-size="24" font-weight="700" fill="#79747E">~8&#215; Echtzeit</text>

  <text x="782.4" y="482.14" font-size="18" fill="#49454F">Nutzt via int8-Quantisierung nur</text>
  <text x="782.4" y="516.86" font-size="18" fill="#49454F">~2,5 GB VRAM — etwa 40% weniger</text>
  <text x="782.4" y="551.57" font-size="18" fill="#49454F">als whisper.cpps ~3 GB auf derselben GPU.</text>

  <text x="600" y="646.07" font-family="system-ui, sans-serif" font-size="17.25" fill="#79747E" text-anchor="middle">Beide Laufzeiten transkribieren mit identischen 2,5% WER — der Unterschied liegt allein in der Geschwindigkeit, nicht in der Genauigkeit.</text>
<text x="1190.4" y="665.36" font-family="system-ui,sans-serif" font-size="13.5" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
