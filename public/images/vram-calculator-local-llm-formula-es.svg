<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>

  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">F&#xf3;rmula de VRAM</text>

  <rect x="40" y="55" width="720" height="50" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1"/>
  <text x="400" y="77" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1C1B1F" text-anchor="middle" font-weight="600">VRAM (GB) = (Tama&#xf1;o del modelo en miles de millones &#xd7; Bits de cuantizaci&#xf3;n) &#xf7; 8</text>
  <text x="400" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">+ 25&#x2013;40% para contexto, batching y sobrecarga del sistema</text>

  <rect x="40" y="120" width="220" height="60" fill="#FFFFFF" stroke="#E8DEF8" stroke-width="1"/>
  <text x="150" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1C1B1F" text-anchor="middle">7B en Q4 (4 bits)</text>
  <text x="150" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">3.5 GB</text>
  <text x="150" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(7 &#xd7; 4) &#xf7; 8</text>

  <rect x="290" y="120" width="220" height="60" fill="#FFFFFF" stroke="#E8DEF8" stroke-width="1"/>
  <text x="400" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1C1B1F" text-anchor="middle">13B en Q5 (5 bits)</text>
  <text x="400" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">8.1 GB</text>
  <text x="400" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(13 &#xd7; 5) &#xf7; 8</text>

  <rect x="540" y="120" width="220" height="60" fill="#FFFFFF" stroke="#E8DEF8" stroke-width="1"/>
  <text x="650" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1C1B1F" text-anchor="middle">70B en Q8 (8 bits)</text>
  <text x="650" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">70 GB</text>
  <text x="650" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">(70 &#xd7; 8) &#xf7; 8</text>

  <text x="40" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">&#x1f4a1; Punto clave: a&#xf1;ade siempre un margen del 25&#x2013;40% para la ventana de contexto, el procesamiento por lotes y la sobrecarga del sistema.</text>
  <text x="40" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">Ejemplo: 13B en Q5 calcula 8.1 GB, pero necesitas ~10&#x2013;11 GB de memoria de GPU real.</text>

  <text x="400" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">
    &#x2190; Volver al art&#xed;culo
  </text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>