<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Android Local LLM Speed: 6 Apps on Galaxy S25 Ultra</text>
  <text x="400" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Phi-4 Mini, Q4_K_M quantization, Snapdragon 8 Elite</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- MLC Chat: 22 tok/sec, NPU -->
  <text x="250" y="94" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">MLC Chat</text>
  <rect x="260" y="75" width="440" height="24" fill="#6750A4" rx="4"/>
  <text x="690" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">22 tok/s (NPU)</text>

  <!-- Maid: 18 tok/sec, Vulkan -->
  <text x="250" y="139" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Maid</text>
  <rect x="260" y="120" width="360" height="24" fill="#34A853" rx="4"/>
  <text x="610" y="137" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">18 tok/s (Vulkan)</text>

  <!-- PocketPal AI: 16 tok/sec, CPU/Vulkan -->
  <text x="250" y="184" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">PocketPal AI</text>
  <rect x="260" y="165" width="320" height="24" fill="#34A853" rx="4"/>
  <text x="570" y="182" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">16 tok/s (CPU/Vulkan)</text>

  <!-- Layla: 14 tok/sec, CPU -->
  <text x="250" y="229" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Layla</text>
  <rect x="260" y="210" width="280" height="24" fill="#79747E" rx="4"/>
  <text x="530" y="227" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">14 tok/s (CPU)</text>

  <!-- Private AI: 13 tok/sec, CPU -->
  <text x="250" y="274" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Private AI</text>
  <rect x="260" y="255" width="260" height="24" fill="#79747E" rx="4"/>
  <text x="510" y="272" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">13 tok/s (CPU)</text>

  <!-- Ollama via Termux: 10 tok/sec, CPU -->
