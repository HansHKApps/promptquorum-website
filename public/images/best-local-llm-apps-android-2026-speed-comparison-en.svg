  <rect x="260" y="300" width="200" height="24" fill="#79747E" rx="4"/>
  <text x="450" y="317" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">10 tok/s (CPU)</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">MLC Chat's Hexagon NPU path is 2.2&#215; faster than the CPU-only Termux path on identical hardware.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
