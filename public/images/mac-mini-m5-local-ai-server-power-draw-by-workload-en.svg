<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Mac Mini M5 Pro: Power Draw by Workload</text>
  <line x1="260" y1="345" x2="740" y2="345" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="250" y="94" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Idle</text>
  <rect x="260" y="75" width="16" height="24" fill="#34A853" rx="4"/>
  <text x="284" y="92" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">8W</text>

  <text x="250" y="136" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Llama 8B inference</text>
  <rect x="260" y="117" width="70" height="24" fill="#6750A4" rx="4"/>
  <text x="338" y="134" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">25–35W</text>

  <text x="250" y="178" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Llama 34B inference</text>
  <rect x="260" y="159" width="110" height="24" fill="#7D5260" rx="4"/>
  <text x="378" y="176" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">40–55W</text>

  <text x="250" y="220" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Mixed typical</text>
  <rect x="260" y="201" width="50" height="24" fill="#F4B400" rx="4"/>
  <text x="318" y="218" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">15–25W</text>

  <text x="250" y="262" font-size="13" font-weight="700" fill="#79747E" text-anchor="end">Desktop + RTX 4070</text>
  <rect x="260" y="243" width="440" height="24" fill="#EA4335" rx="4"/>
  <text x="708" y="260" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">200–300W</text>

  <text x="400" y="378" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Mac Mini M5 Pro draws 8–55W across all workloads vs 200–300W for a desktop RTX 4070 — under 55W even at full 34B load.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
