<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">هل يُنشئ هذا الاستخدام للذكاء الاصطناعي نقلاً عابراً للحدود بموجب المادة 29؟</text>

  <rect x="220" y="48" width="360" height="46" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="400" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">هل يحتوي الطلب على بيانات شخصية</text>
  <text x="400" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">لمقيم في المملكة العربية السعودية؟</text>

  <line x1="290" y1="94" x2="150" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="185" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">لا</text>

  <line x1="510" y1="94" x2="640" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="565" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">نعم</text>

  <rect x="20" y="155" width="255" height="72" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="20" y="155" width="255" height="4" fill="#34A853"/>
  <text x="147" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#34A853" text-anchor="middle">من المرجح ألا تنطبق</text>
  <text x="147" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#34A853" text-anchor="middle">المادة 29</text>
  <text x="147" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">لا بيانات شخصية متضمنة —</text>
  <text x="147" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">أعد التقييم إذا تغيّر النطاق.</text>

  <rect x="470" y="155" width="310" height="52" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="625" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">هل يعمل الاستدلال على بنية تحتية</text>
  <text x="625" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">سعودية (محلياً أو سحابة داخل المملكة)؟</text>

  <line x1="550" y1="207" x2="440" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="475" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">نعم</text>

  <line x1="700" y1="207" x2="690" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="700" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">لا</text>

  <rect x="310" y="280" width="260" height="74" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="310" y="280" width="260" height="4" fill="#34A853"/>
  <text x="440" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#34A853" text-anchor="middle">لا يوجد نقل عابر للحدود</text>
  <text x="440" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">لا حاجة لتقييم ملاءمة SDAIA</text>
  <text x="440" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">أو بنود تعاقدية أو فحص أمني.</text>

  <rect x="590" y="280" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="590" y="280" width="200" height="4" fill="#EA4335"/>
  <text x="690" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">نقل عابر للحدود</text>
  <text x="690" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">محقَّق</text>
  <text x="690" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">ملاءمة SDAIA غير محسومة، وبنود</text>
  <text x="690" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">تعاقدية مطلوبة؛ خطر CLOUD Act.</text>

  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">الذكاء الاصطناعي المحلي يُزيل مسألة النقل بموجب المادة 29 عند الاستدلال من الأساس.</text>
<text x="792" y="475" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
