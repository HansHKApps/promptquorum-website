<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">6 erreurs fréquentes dans le choix d'un modèle local</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="62" r="14" fill="#EA4335"/>
  <text x="38" y="66" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="57" font-size="12" font-weight="700" fill="#1C1B1F">Choisir par leaderboard plutôt que par marge VRAM</text>
  <text x="62" y="73" font-size="11" fill="#49454F">Un modèle avec &lt;2–4 Go de marge à Q4_K_M déborde sur le disque et devient inutilisable.</text>
  <line x1="18" y1="88" x2="782" y2="88" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="109" r="14" fill="#EA4335"/>
  <text x="38" y="113" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="104" font-size="12" font-weight="700" fill="#1C1B1F">Faire confiance à la fenêtre de contexte déclarée</text>
  <text x="62" y="120" font-size="11" fill="#49454F">La qualité d'attention chute après ~la moitié. Planifier pour la fenêtre pratique, pas le chiffre marketing.</text>
  <line x1="18" y1="135" x2="782" y2="135" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="156" r="14" fill="#EA4335"/>
  <text x="38" y="160" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="151" font-size="12" font-weight="700" fill="#1C1B1F">Ne pas lire la licence</text>
  <text x="62" y="167" font-size="11" fill="#49454F">Codestral sur un produit commercial sans Mistral Commercial = échec procurement. Lire la licence avant.</text>
  <line x1="18" y1="182" x2="782" y2="182" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="203" r="14" fill="#EA4335"/>
  <text x="38" y="207" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="198" font-size="12" font-weight="700" fill="#1C1B1F">Ignorer la fiabilité des appels d'outils pour un agent</text>
  <text x="62" y="214" font-size="11" fill="#49454F">Les modèles 7B échouent souvent dans les boucles d'agent (Cline, Continue.dev). Utiliser 30B+ pour les agents.</text>
  <line x1="18" y1="229" x2="782" y2="229" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="250" r="14" fill="#EA4335"/>
  <text x="38" y="254" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="62" y="245" font-size="12" font-weight="700" fill="#1C1B1F">Un seul modèle pour chat et autocomplétion</text>
  <text x="62" y="261" font-size="11" fill="#49454F">30B est disproportionné pour 200 ms d'autocomplétion. Lancer un modèle 1,5B–7B séparé pour les complétions.</text>
  <line x1="18" y1="276" x2="782" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="297" r="14" fill="#EA4335"/>
  <text x="38" y="301" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="62" y="292" font-size="12" font-weight="700" fill="#1C1B1F">Ne pas réévaluer le modèle après 6 mois</text>
  <text x="62" y="308" font-size="11" fill="#49454F">Les lignes open-weight évoluent ; les licences changent. Revoir ses choix avant novembre 2026.</text>
  <line x1="18" y1="323" x2="782" y2="323" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="350" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">Marge VRAM + lecture licence + tests boucle agent = les 3 étapes les plus souvent ignorées</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
