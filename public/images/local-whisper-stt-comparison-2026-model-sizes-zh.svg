  <text x="600" y="637.88" font-family="system-ui, sans-serif" font-size="17.25" fill="#49454F" text-anchor="middle">distil-large-v3的速度与medium相当,准确率接近large-v3——对大多数流程而言是最佳的速度/质量平衡。</text>
