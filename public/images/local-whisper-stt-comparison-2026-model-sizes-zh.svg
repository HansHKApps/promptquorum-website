  <rect x="390" y="126.56" width="720" height="40.5" fill="#6750A4" rx="6.75"/>
  <text x="1095" y="155.25" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="end">32&#215; · 7.6% WER</text>

  <text x="375" y="234.56" font-family="system-ui, sans-serif" font-size="19.5" font-weight="700" fill="#79747E" text-anchor="end">base (74M)</text>
