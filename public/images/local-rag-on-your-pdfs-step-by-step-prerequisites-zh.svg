<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="350" fill="#FFFFFF"/>
  <text x="400" y="30" font-size="16" font-weight="700" fill="#1C1B1F" text-anchor="middle">开始前的准备</text>

  <!-- Header row -->
  <rect x="0" y="46" width="800" height="36" fill="#6750A4"/>
  <text x="80" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">要求</text>
  <text x="235" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">最低标准</text>
  <text x="555" y="69" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">说明</text>

  <!-- Column dividers -->
  <line x1="160" y1="46" x2="160" y2="292" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="310" y1="46" x2="310" y2="292" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1: 内存 -->
  <rect x="0" y="82" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="107" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">内存</text>
  <text x="235" y="107" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">16 GB</text>
  <text x="555" y="100" font-size="11" fill="#49454F" text-anchor="middle">8 GB: 使用 Phi-4 Mini Q4（第2步）</text>
  <text x="555" y="115" font-size="10" fill="#79747E" text-anchor="middle">Llama 3.3 8B Q4 + AnythingLLM 的实际最低门槛</text>

  <!-- Row 2: 磁盘 -->
  <rect x="0" y="124" width="800" height="42" fill="#F7F2FA"/>
  <text x="80" y="149" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">磁盘</text>
  <text x="235" y="142" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">20 GB</text>
  <text x="235" y="157" font-size="10" fill="#49454F" text-anchor="middle">可用空间</text>
  <text x="555" y="142" font-size="11" fill="#49454F" text-anchor="middle">模型 ~5 GB + 嵌入器 ~280 MB + 应用 ~600 MB</text>
  <text x="555" y="157" font-size="10" fill="#79747E" text-anchor="middle">每100页PDF约 10–30 MB 额外空间</text>

  <!-- Row 3: 网络 -->
  <rect x="0" y="166" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="191" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">网络</text>
  <text x="235" y="191" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle">50 Mbps</text>
  <text x="555" y="184" font-size="11" fill="#49454F" text-anchor="middle">模型下载约 8 分钟（50 Mbps）</text>
  <text x="555" y="199" font-size="10" fill="#79747E" text-anchor="middle">教程其余步骤支持离线运行</text>

  <!-- Row 4: 操作系统 -->
  <rect x="0" y="208" width="800" height="42" fill="#F7F2FA"/>
  <text x="80" y="233" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">操作系统</text>
  <text x="235" y="226" font-size="10" font-weight="700" fill="#49454F" text-anchor="middle">macOS 12+ /</text>
  <text x="235" y="241" font-size="10" font-weight="700" fill="#49454F" text-anchor="middle">Win 10/11 / Linux</text>
  <text x="555" y="226" font-size="11" fill="#49454F" text-anchor="middle">AnythingLLM 无需管理员权限</text>
  <text x="555" y="241" font-size="10" fill="#79747E" text-anchor="middle">Ollama 在 macOS/Linux 上仅需一次密码</text>

  <!-- Row 5: 文档 -->
  <rect x="0" y="250" width="800" height="42" fill="#FFFFFF"/>
  <text x="80" y="275" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">文档</text>
  <text x="235" y="268" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">5–20 个 PDF</text>
  <text x="235" y="283" font-size="10" fill="#79747E" text-anchor="middle">作为起点</text>
  <text x="555" y="268" font-size="11" fill="#49454F" text-anchor="middle">从少量开始以验证检索质量</text>
  <text x="555" y="283" font-size="10" fill="#79747E" text-anchor="middle">支持 PDF, DOCX, TXT, MD, EPUB</text>

  <!-- Table outer border -->
  <rect x="0" y="46" width="800" height="246" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text x="400" y="318" font-size="11" fill="#79747E" text-anchor="middle">仅初始下载需要网络 — 所有推理均离线完成</text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
