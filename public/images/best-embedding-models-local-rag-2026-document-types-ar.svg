  <text x="50" y="352" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">&#x2022; jina-v3 &#x647;&#x648; &#x627;&#x644;&#x646;&#x645;&#x648;&#x630;&#x62c; &#x627;&#x644;&#x648;&#x62d;&#x64a;&#x62f; &#x641;&#x648;&#x642; 87% &#x641;&#x64a; &#x62c;&#x645;&#x64a;&#x639; &#x623;&#x646;&#x648;&#x627;&#x639; &#x627;&#x644;&#x648;&#x62b;&#x627;&#x626;&#x642; &#x2014; &#x642;&#x627;&#x646;&#x648;&#x646;&#x64a; 93%&#x60c; &#x628;&#x62d;&#x62b;&#x64a; 92%&#x60c; &#x643;&#x648;&#x62f; 87%&#x60c; &#x645;&#x62a;&#x639;&#x62f;&#x62f; &#x627;&#x644;&#x644;&#x63a;&#x627;&#x62a; 89%.</text>
  <text x="50" y="372" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">&#x2022; &#x627;&#x644;&#x646;&#x645;&#x627;&#x630;&#x62c; &#x627;&#x644;&#x625;&#x646;&#x62c;&#x644;&#x64a;&#x632;&#x64a;&#x629; &#x641;&#x642;&#x637; (bge-large&#x60c; gte-large) &#x62a;&#x647;&#x628;&#x637; 10&#x2013;15% &#x639;&#x644;&#x649; &#x627;&#x644;&#x645;&#x62d;&#x62a;&#x648;&#x649; &#x645;&#x62a;&#x639;&#x62f;&#x62f; &#x627;&#x644;&#x644;&#x63a;&#x627;&#x62a;. &#x627;&#x633;&#x62a;&#x631;&#x62c;&#x627;&#x639; &#x627;&#x644;&#x643;&#x648;&#x62f; &#x647;&#x648; &#x627;&#x644;&#x623;&#x635;&#x639;&#x628; &#x644;&#x644;&#x62c;&#x645;&#x64a;&#x639; (82&#x2013;87%).</text>
