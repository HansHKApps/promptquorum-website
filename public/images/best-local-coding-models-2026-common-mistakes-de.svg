<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">6 Häufige Fehler bei der lokalen Coding-Modellauswahl</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="62" r="14" fill="#EA4335"/>
  <text x="38" y="66" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="57" font-size="12" font-weight="700" fill="#1C1B1F">Nach Leaderboard statt VRAM-Headroom auswählen</text>
  <text x="62" y="73" font-size="11" fill="#49454F">Modell mit &lt;2–4 GB Headroom bei Q4_K_M läuft auf Disk aus und wird für interaktives Coding unbrauchbar.</text>
  <line x1="18" y1="88" x2="782" y2="88" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="109" r="14" fill="#EA4335"/>
  <text x="38" y="113" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="104" font-size="12" font-weight="700" fill="#1C1B1F">Angegebenem Kontext als praktischem Limit vertrauen</text>
  <text x="62" y="120" font-size="11" fill="#49454F">Coding-Qualität fällt nach ~der Hälfte des Titels. Das praktische Fenster planen, nicht die Marketing-Zahl.</text>
  <line x1="18" y1="135" x2="782" y2="135" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="156" r="14" fill="#EA4335"/>
  <text x="38" y="160" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="151" font-size="12" font-weight="700" fill="#1C1B1F">Lizenz überspringen</text>
  <text x="62" y="167" font-size="11" fill="#49454F">Codestral für kommerzielles Produkt ohne Mistral-Commercial = Beschaffungsversagen. Lizenz vorher lesen.</text>
  <line x1="18" y1="182" x2="782" y2="182" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="203" r="14" fill="#EA4335"/>
  <text x="38" y="207" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="198" font-size="12" font-weight="700" fill="#1C1B1F">Tool-Call-Zuverlässigkeit für Agent-Harness ignorieren</text>
  <text x="62" y="214" font-size="11" fill="#49454F">7B-Modelle scheitern oft an Clines strikten XML-Schemas und Continue.dev Agent-Modus. 30B+ für Agent-Loops.</text>
  <line x1="18" y1="229" x2="782" y2="229" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="250" r="14" fill="#EA4335"/>
  <text x="38" y="254" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="62" y="245" font-size="12" font-weight="700" fill="#1C1B1F">Ein Modell für Chat und Auto-Completion</text>
  <text x="62" y="261" font-size="11" fill="#49454F">30B ist überdimensioniert für 200-ms-Completion. Separates 1,5B–7B-Modell für Completions betreiben.</text>
  <line x1="18" y1="276" x2="782" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="297" r="14" fill="#EA4335"/>
  <text x="38" y="301" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="62" y="292" font-size="12" font-weight="700" fill="#1C1B1F">Modell und Lizenz nach 6 Monaten nicht neu prüfen</text>
  <text x="62" y="308" font-size="11" fill="#49454F">Open-Weight-Zeilen aktualisieren; Lizenzen ändern sich. Auswahl bis November 2026 neu prüfen.</text>
  <line x1="18" y1="323" x2="782" y2="323" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="350" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">VRAM-Headroom + Lizenz-Lesen + Agent-Schleife-Tests = die 3 am häufigsten übersprungenen Schritte</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
