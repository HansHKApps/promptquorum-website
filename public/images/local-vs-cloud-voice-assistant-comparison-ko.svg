<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">로컬 vs 클라우드 음성 어시스턴트 — 정면 비교</text>

  <text x="40" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">기준</text>
  <text x="220" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">로컬 (Assist + Whisper + LLM)</text>
  <text x="530" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">클라우드 (Alexa / Google)</text>
  <text x="756" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E" text-anchor="middle">우세</text>
  <line x1="24" y1="72" x2="776" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Row 1: Privacy -->
  <rect x="24" y="80" width="752" height="42" fill="#F7F2FA"/>
  <text x="40" y="106" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">프라이버시</text>
  <text x="220" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">기기 내, 비공개</text>
  <text x="530" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">클라우드에서 처리된 음성</text>
  <circle cx="756" cy="101" r="11" fill="#34A853"/>
  <text x="756" y="105" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
  <line x1="24" y1="122" x2="776" y2="122" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 2: Cost -->
  <text x="40" y="148" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">비용</text>
  <text x="220" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">하드웨어 일회 비용</text>
  <text x="530" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">저렴한 하드웨어, 구독 가능</text>
  <circle cx="756" cy="143" r="11" fill="#34A853"/>
  <text x="756" y="147" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
  <line x1="24" y1="164" x2="776" y2="164" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 3: Accuracy -->
  <rect x="24" y="172" width="752" height="42" fill="#F7F2FA"/>
  <text x="40" y="198" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">정확도</text>
  <text x="220" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">모델/하드웨어에 따라 달라짐</text>
  <text x="530" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">완성도 높음, 일관됨</text>
  <circle cx="756" cy="193" r="11" fill="#F4B400"/>
  <text x="756" y="197" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  <line x1="24" y1="214" x2="776" y2="214" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 4: Skills -->
  <text x="40" y="240" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">스킬</text>
  <text x="220" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">홈 제어에 집중</text>
  <text x="530" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">광범위한 타사 스킬</text>
  <circle cx="756" cy="235" r="11" fill="#F4B400"/>
  <text x="756" y="239" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  <line x1="24" y1="256" x2="776" y2="256" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 5: Offline -->
  <rect x="24" y="264" width="752" height="42" fill="#F7F2FA"/>
  <text x="40" y="290" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">오프라인</text>
  <text x="220" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">오프라인으로 동작</text>
  <text x="530" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">인터넷 필요</text>
  <circle cx="756" cy="285" r="11" fill="#34A853"/>
  <text x="756" y="289" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
  <line x1="24" y1="306" x2="776" y2="306" stroke="#F7F2FA" stroke-width="1"/>

  <!-- Row 6: Effort -->
  <text x="40" y="332" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F">노력</text>
  <text x="220" y="332" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">더 많은 설정</text>
  <text x="530" y="332" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">플러그앤플레이</text>
  <circle cx="756" cy="327" r="11" fill="#F4B400"/>
  <text x="756" y="331" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  <line x1="24" y1="344" x2="776" y2="344" stroke="#E8DEF8" stroke-width="1.5"/>

  <circle cx="230" cy="374" r="6" fill="#34A853"/>
  <text x="244" y="378" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">L = 로컬 우세</text>
  <circle cx="380" cy="374" r="6" fill="#F4B400"/>
  <text x="394" y="378" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">C = 클라우드 우세</text>

  <text x="400" y="404" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">로컬은 프라이버시, 비용, 오프라인 동작에서 우세하고, 클라우드는 정확도의 일관성, 스킬, 노력에서 우세합니다.</text>
<text x="792" y="422" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
