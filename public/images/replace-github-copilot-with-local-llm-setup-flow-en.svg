<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="380" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">5-Step Setup: Continue.dev + Ollama + Qwen3-Coder</text>

  <!-- Step 1 -->
  <circle cx="90" cy="120" r="24" fill="#6750A4"/>
  <text x="90" y="128" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="90" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install Ollama</text>
  <text x="90" y="186" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#49454F" text-anchor="middle">ollama.com</text>
  <text x="90" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">macOS / Linux / Windows</text>

  <text x="148" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="230" cy="120" r="24" fill="#6750A4"/>
  <text x="230" y="128" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="230" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pull Qwen3-Coder</text>
  <text x="230" y="186" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">ollama pull qwen3-coder:30b</text>
  <text x="230" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">~18 GB download</text>

  <text x="288" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="400" cy="120" r="24" fill="#6750A4"/>
  <text x="400" y="128" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="400" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install Continue.dev</text>
  <text x="400" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">VS Code / JetBrains extension</text>
  <text x="400" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">free, open-source</text>

  <text x="458" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="570" cy="120" r="24" fill="#6750A4"/>
  <text x="570" y="128" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="570" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Connect Model</text>
  <text x="570" y="186" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">Add model → Ollama</text>
  <text x="570" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">localhost:11434</text>

  <text x="628" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 5 -->
  <circle cx="710" cy="120" r="24" fill="#34A853"/>
  <text x="710" y="128" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="710" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Test &amp; Code</text>
  <text x="710" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#49454F" text-anchor="middle">autocomplete + chat</text>
  <text x="710" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#79747E" text-anchor="middle">1-2 sec first suggestion</text>

  <line x1="40" y1="250" x2="760" y2="250" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Total setup time: 20-30 minutes the first time, including the ~18 GB model download.</text>
  <text x="400" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Optional step 6: enable agent mode in Continue.dev settings for multi-file edits.</text>
<text x="792" y="375" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
