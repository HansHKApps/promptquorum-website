<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">5 Eras of Smart Home Technology (1975–2026)</text>

  <line x1="60" y1="200" x2="740" y2="200" stroke="#E8DEF8" stroke-width="3"/>

  <!-- Point 1: Wired / 1975 — label above -->
  <line x1="100" y1="184" x2="100" y2="155" stroke="#79747E" stroke-width="1"/>
  <circle cx="100" cy="200" r="16" fill="#6750A4"/>
  <text x="100" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Wired</text>
  <text x="100" y="130" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">1975</text>
  <text x="100" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">X10</text>

  <!-- Point 2: Wireless Mesh / 2001 — label below -->
  <line x1="250" y1="216" x2="250" y2="236" stroke="#79747E" stroke-width="1"/>
  <circle cx="250" cy="200" r="16" fill="#6750A4"/>
  <text x="250" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Wireless Mesh</text>
  <text x="250" y="273" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">2001–2000s</text>
  <text x="250" y="291" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Z-Wave, Zigbee</text>

  <!-- Point 3: Cloud / 2011 — label above -->
  <line x1="400" y1="184" x2="400" y2="155" stroke="#79747E" stroke-width="1"/>
  <circle cx="400" cy="200" r="16" fill="#F4B400"/>
  <text x="400" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cloud</text>
  <text x="400" y="130" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#F4B400" text-anchor="middle">2011–2014</text>
  <text x="400" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Nest, Echo, HomeKit</text>

  <!-- Point 4: Interoperability / 2022 — label below -->
  <line x1="550" y1="216" x2="550" y2="236" stroke="#79747E" stroke-width="1"/>
  <circle cx="550" cy="200" r="16" fill="#E8DEF8" stroke="#6750A4" stroke-width="2"/>
  <text x="550" y="255" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Interoperability</text>
  <text x="550" y="273" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">2022</text>
  <text x="550" y="291" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Matter</text>

  <!-- Point 5: Local AI / 2026 — label above -->
  <line x1="700" y1="184" x2="700" y2="155" stroke="#79747E" stroke-width="1"/>
  <circle cx="700" cy="200" r="16" fill="#34A853"/>
  <text x="700" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local AI</text>
  <text x="700" y="130" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#34A853" text-anchor="middle">2026+</text>
  <text x="700" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Local LLMs</text>

  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">A 50-year arc: X10 (1975) to wireless mesh (2001) to cloud (2011) to Matter (2022) to local AI (2026).</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
