<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">モデル選択の6つのよくある間違い</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="62" r="14" fill="#EA4335"/>
  <text x="38" y="66" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="57" font-size="12" font-weight="700" fill="#1C1B1F">VRAMマージンを無視してリーダーボードで選ぶ</text>
  <text x="62" y="73" font-size="11" fill="#49454F">Q4_K_Mで2～4GBのマージンがないとディスクスワップが発生し使用不能になる。</text>
  <line x1="18" y1="88" x2="782" y2="88" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="109" r="14" fill="#EA4335"/>
  <text x="38" y="113" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="104" font-size="12" font-weight="700" fill="#1C1B1F">公称コンテキストウィンドウを信頼する</text>
  <text x="62" y="120" font-size="11" fill="#49454F">注意品質は半分を超えると低下する。マーケティング数値ではなく実用的ウィンドウで計画すること。</text>
  <line x1="18" y1="135" x2="782" y2="135" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="156" r="14" fill="#EA4335"/>
  <text x="38" y="160" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="151" font-size="12" font-weight="700" fill="#1C1B1F">ライセンスを確認しない</text>
  <text x="62" y="167" font-size="11" fill="#49454F">Mistral商用ライセンスなしで商用製品にCodestralを使うと調達リスクが発生する。</text>
  <line x1="18" y1="182" x2="782" y2="182" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="203" r="14" fill="#EA4335"/>
  <text x="38" y="207" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="198" font-size="12" font-weight="700" fill="#1C1B1F">エージェントのツール呼び出し信頼性を無視する</text>
  <text x="62" y="214" font-size="11" fill="#49454F">7Bモデルはエージェントループ（Cline、Continue.dev）で頻繁に失敗する。エージェントには30B以上を使用。</text>
  <line x1="18" y1="229" x2="782" y2="229" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="250" r="14" fill="#EA4335"/>
  <text x="38" y="254" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="62" y="245" font-size="12" font-weight="700" fill="#1C1B1F">チャットと自動補完に同じモデルを使う</text>
  <text x="62" y="261" font-size="11" fill="#49454F">200msの補完に30Bは過剰。1.5B～7Bの別モデルを補完専用に動かすこと。</text>
  <line x1="18" y1="276" x2="782" y2="276" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="297" r="14" fill="#EA4335"/>
  <text x="38" y="301" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="62" y="292" font-size="12" font-weight="700" fill="#1C1B1F">6ヶ月後にモデルを見直さない</text>
  <text x="62" y="308" font-size="11" fill="#49454F">オープンウェイトの進化は速い。ライセンスも変わる。2026年11月以前に選択を再評価すること。</text>
  <line x1="18" y1="323" x2="782" y2="323" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="350" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">VRAMマージン + ライセンス確認 + エージェントループテスト = 最も見落とされる3ステップ</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
