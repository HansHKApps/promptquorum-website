<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="27" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">出现问题时：六种常见故障模式及解决方法</text>

  <!-- Header row -->
  <rect x="0" y="40" width="800" height="34" fill="#6750A4"/>
  <text x="130" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">症状</text>
  <text x="390" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">可能原因</text>
  <text x="660" y="62" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">修复方法</text>

  <!-- Column dividers -->
  <line x1="260" y1="40" x2="260" y2="346" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="346" stroke="#E8DEF8" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="0" y="74" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="91" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">AnythingLLM 显示</text>
  <text x="130" y="107" font-size="10" fill="#49454F" text-anchor="middle">"无法连接到 Ollama"</text>
  <text x="390" y="99" font-size="10" fill="#49454F" text-anchor="middle">服务未运行 / 端点设置错误</text>
  <text x="660" y="91" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">ollama serve</text>
  <text x="660" y="107" font-size="10" fill="#49454F" text-anchor="middle">确认: 127.0.0.1:11434</text>

  <!-- Row 2 -->
  <rect x="0" y="118" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="135" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">模型拉取卡在</text>
  <text x="130" y="151" font-size="10" fill="#49454F" text-anchor="middle">0% 或 99%</text>
  <text x="390" y="143" font-size="10" fill="#49454F" text-anchor="middle">CDN 问题或磁盘已满</text>
  <text x="660" y="135" font-family="'SF Mono', Monaco, monospace" font-size="10" fill="#6750A4" text-anchor="middle">Ctrl+C → df -h → 重新 pull</text>
  <text x="660" y="151" font-size="10" fill="#49454F" text-anchor="middle">Ollama 从上次中断处续传</text>

  <!-- Row 3 -->
  <rect x="0" y="162" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="179" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">向量化步骤</text>
  <text x="130" y="195" font-size="10" fill="#49454F" text-anchor="middle">看起来卡住了</text>
  <text x="390" y="187" font-size="10" fill="#49454F" text-anchor="middle">Ollama 首次加载嵌入模型</text>
  <text x="660" y="179" font-size="10" fill="#49454F" text-anchor="middle">等待 30–60 秒 — 首次</text>
  <text x="660" y="195" font-size="10" fill="#49454F" text-anchor="middle">加载 = 10–40 秒</text>

  <!-- Row 4 -->
  <rect x="0" y="206" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="223" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">检索返回无关分块</text>
  <text x="130" y="239" font-size="10" fill="#49454F" text-anchor="middle">引用文不对题</text>
  <text x="390" y="231" font-size="10" fill="#49454F" text-anchor="middle">默认 512/0 分块 + 弱嵌入器</text>
  <text x="660" y="223" font-size="10" fill="#6750A4" text-anchor="middle">第4步 (nomic-embed-text)</text>
  <text x="660" y="239" font-size="10" fill="#6750A4" text-anchor="middle">+ 第7步 (1000/200) · 重新向量化</text>

  <!-- Row 5 -->
  <rect x="0" y="250" width="800" height="44" fill="#FFFFFF"/>
  <text x="130" y="267" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">回答简短、泛泛</text>
  <text x="130" y="283" font-size="10" fill="#49454F" text-anchor="middle">或拒绝引用来源</text>
  <text x="390" y="275" font-size="10" fill="#49454F" text-anchor="middle">仍使用默认极小 LLM</text>
  <text x="660" y="267" font-size="10" fill="#49454F" text-anchor="middle">LLM → llama3.3:8b-instruct-q4_K_M</text>
  <text x="660" y="283" font-size="10" fill="#49454F" text-anchor="middle">将 Top-K 从 4 调高至 6</text>

  <!-- Row 6 -->
  <rect x="0" y="294" width="800" height="44" fill="#F7F2FA"/>
  <text x="130" y="311" font-size="11" font-weight="700" fill="#1C1B1F" text-anchor="middle">扫描图片 PDF 产生</text>
  <text x="130" y="327" font-size="10" fill="#49454F" text-anchor="middle">空分块</text>
  <text x="390" y="319" font-size="10" fill="#49454F" text-anchor="middle">无文本层 — 纯光栅图像</text>
  <text x="660" y="311" font-family="'SF Mono', Monaco, monospace" font-size="9" fill="#6750A4" text-anchor="middle">ocrmypdf input.pdf output.pdf</text>
  <text x="660" y="327" font-size="10" fill="#49454F" text-anchor="middle">重新上传 OCR 后的文件</text>

  <!-- Table outer border -->
  <rect x="0" y="40" width="800" height="298" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <line x1="18" y1="354" x2="782" y2="354" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="374" font-size="11" fill="#79747E" text-anchor="middle">所有故障按7步设置顺序执行均可解决</text>
  <text x="400" y="394" font-size="10" fill="#79747E" text-anchor="middle">检索问题：先修复嵌入器（第4步）和分块大小（第7步），再考虑更换回答模型</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
