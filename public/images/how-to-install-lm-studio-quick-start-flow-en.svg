<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">LM Studio Quick Start: 5 Steps From Download to Chat</text>

  <line x1="27" y1="44" x2="773" y2="44" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Step 1 -->
  <circle cx="95" cy="110" r="20" fill="#6750A4"/>
  <text x="95" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="95" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Download</text>
  <text x="95" y="168" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">lmstudio.ai</text>

  <text x="172" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="250" cy="110" r="20" fill="#6750A4"/>
  <text x="250" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="250" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Install</text>
  <text x="250" y="168" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">macOS / Win / Linux</text>

  <text x="327" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="405" cy="110" r="20" fill="#6750A4"/>
  <text x="405" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="405" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Search Model</text>
  <text x="405" y="168" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">GGUF · Hugging Face</text>

  <text x="482" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="560" cy="110" r="20" fill="#6750A4"/>
  <text x="560" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="560" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Pick Quantization</text>
  <text x="560" y="168" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">Q4_K_M ~4.5 GB</text>

  <text x="637" y="116" font-size="18" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 5 -->
  <circle cx="715" cy="110" r="20" fill="#34A853"/>
  <text x="715" y="116" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="715" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Start Chatting</text>
  <text x="715" y="168" font-family="'SF Mono', Monaco, monospace" font-size="10.5" fill="#49454F" text-anchor="middle">loads in 5–30 sec</text>

  <line x1="90" y1="220" x2="710" y2="220" stroke="#F7F2FA" stroke-width="1"/>

  <text x="400" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">No terminal required: LM Studio replaces 5 typical CLI setup steps with GUI clicks --</text>
  <text x="400" y="273" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">from the lmstudio.ai download to your first streamed chat response.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
