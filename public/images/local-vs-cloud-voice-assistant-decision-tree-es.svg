<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">¿Qué asistente de voz te conviene?</text>

  <text x="400" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">¿Privacidad, coste u offline importan más?</text>

  <line x1="400" y1="65" x2="220" y2="138" stroke="#6750A4" stroke-width="2"/>
  <line x1="400" y1="65" x2="580" y2="138" stroke="#6750A4" stroke-width="2"/>
  <text x="292" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">SÍ</text>
  <text x="518" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NO</text>

  <text x="220" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">¿También quieres la respuesta más rápida?</text>
  <text x="580" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">¿Cero configuración, skills más amplias?</text>

  <line x1="220" y1="163" x2="120" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="220" y1="163" x2="320" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="580" y1="163" x2="480" y2="248" stroke="#6750A4" stroke-width="2"/>
  <line x1="580" y1="163" x2="680" y2="248" stroke="#6750A4" stroke-width="2"/>

  <text x="150" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">SÍ</text>
  <text x="290" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NO</text>
  <text x="510" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="end">SÍ</text>
  <text x="650" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#79747E" text-anchor="start">NO</text>

  <!-- Box 1: Local on GPU mini PC -->
  <rect x="50" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="1.5"/>
  <rect x="50" y="248" width="140" height="4" rx="0" fill="#6750A4"/>
  <text x="120" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local en mini PC</text>
  <text x="120" y="286" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">con GPU</text>
  <text x="120" y="304" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">reduce la brecha de latencia</text>

  <!-- Box 2: Local stack -->
  <rect x="250" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="1.5"/>
  <rect x="250" y="248" width="140" height="4" rx="0" fill="#34A853"/>
  <text x="320" y="276" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Stack local</text>
  <text x="320" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Assist + Whisper</text>
  <text x="320" y="308" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">+ Piper + LLM local</text>

  <!-- Box 3: Cloud assistant -->
  <rect x="410" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#79747E" stroke-width="1.5"/>
  <rect x="410" y="248" width="140" height="4" rx="0" fill="#79747E"/>
  <text x="480" y="276" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Asistente en la nube</text>
  <text x="480" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">Alexa o Google</text>
  <text x="480" y="308" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">plug-and-play</text>

  <!-- Box 4: Start local by default -->
  <rect x="610" y="248" width="140" height="68" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="1.5"/>
  <rect x="610" y="248" width="140" height="4" rx="0" fill="#F4B400"/>
  <text x="680" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">¿Indeciso?</text>
  <text x="680" y="286" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">empieza local en un</text>
  <text x="680" y="300" font-family="system-ui, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">mini PC con GPU</text>

  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Dos preguntas deciden el camino: prioridad de privacidad/coste/offline, luego esfuerzo de configuración vs amplitud de skills.</text>
  <text x="400" y="362" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">¿Tendencia a la privacidad pero indeciso? Por defecto, stack local en un mini PC con GPU.</text>
<text x="792" y="392" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
