  <text x="566" y="290" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Coste:</text>
  <text x="566" y="305" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4">$50,000+</text>

  <text x="566" y="330" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Tiempo de configuraci&#xf3;n:</text>
  <text x="566" y="345" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">1 &#x2013; 3 meses</text>

  <text x="566" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#6750A4" font-weight="600">&#x2713; Arquitectura personalizada</text>

