  <text x="307" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">CPU y RAM:</text>
  <text x="307" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">64 GB de RAM del sistema</text>

  <text x="307" y="250" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Usuarios:</text>
  <text x="307" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">50 &#x2013; 200 concurrentes</text>

  <text x="307" y="290" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Coste:</text>
  <text x="307" y="305" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">$12,000 &#x2013; $20,000</text>

  <text x="307" y="330" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Tiempo de configuraci&#xf3;n:</text>
  <text x="307" y="345" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">1 &#x2013; 2 semanas</text>

  <text x="307" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#34A853" font-weight="600">&#x2713; Listo para producci&#xf3;n</text>

  <!-- Tier 3: Enterprise -->
  <rect x="546" y="55" width="226" height="345" rx="6" fill="#F3E5F5" stroke="#6750A4" stroke-width="2"/>
  <text x="659" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">Empresa (gran escala)</text>

  <text x="566" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Tama&#xf1;o del modelo:</text>
  <text x="566" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">70B &#x2013; 405B (MoE)</text>

  <text x="566" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">GPU:</text>
  <text x="566" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">4&#x2013;8&#xd7; A100 80GB</text>
  <text x="566" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">(o cl&#xfa;steres H100)</text>

  <text x="566" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">CPU y RAM:</text>
  <text x="566" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">256 GB+ de RAM del sistema</text>

  <text x="566" y="250" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Usuarios:</text>
