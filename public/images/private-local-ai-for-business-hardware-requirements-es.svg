  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Requisitos de hardware por escala de despliegue</text>

  <!-- Tier 1: Workstation -->
  <rect x="28" y="55" width="225" height="345" rx="6" fill="#FFF8E1" stroke="#F4B400" stroke-width="2"/>
  <text x="140" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F57F17" text-anchor="middle">Equipo peque&#xf1;o (prueba de concepto)</text>

  <text x="48" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Tama&#xf1;o del modelo:</text>
  <text x="48" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">7B &#x2013; 13B par&#xe1;metros</text>

  <text x="48" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">GPU:</text>
  <text x="48" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">1&#xd7; RTX 4090 (24 GB)</text>

  <text x="48" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">CPU y RAM:</text>
  <text x="48" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">32 GB de RAM del sistema</text>

  <text x="48" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Usuarios:</text>
  <text x="48" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">5 &#x2013; 20 concurrentes</text>

  <text x="48" y="275" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Coste:</text>
  <text x="48" y="290" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F57F17">$3,000 &#x2013; $4,500</text>

  <text x="48" y="315" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1C1B1F">Tiempo de configuraci&#xf3;n:</text>
  <text x="48" y="330" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">1 &#x2013; 2 d&#xed;as</text>

  <text x="48" y="355" font-family="system-ui, sans-serif" font-size="10" fill="#F4B400" font-weight="600">&#x2713; Ideal para pruebas</text>
  <text x="48" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#F4B400" font-weight="600">&#x2713; Configuraci&#xf3;n de un solo puesto</text>

