<svg viewBox="0 0 800 455" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="455" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">سير عمل عملي لكتّاب الروايات</text>
  <line x1="46" y1="78" x2="46" y2="350" stroke="#E8DEF8" stroke-width="2"/>
  <circle cx="46" cy="78" r="16" fill="#6750A4"/>
  <text x="46" y="83" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="78" y="74" font-size="14" font-weight="700" fill="#1C1B1F">المسودة الأولى بنموذج قياسي</text>
  <text x="78" y="93" font-size="12" fill="#49454F">يتعامل Llama 3.3 70B أو Qwen3 32B مع المواضيع القاتمة والتعقيد الأخلاقي.</text>
  <circle cx="46" cy="146" r="16" fill="#6750A4"/>
  <text x="46" y="151" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="78" y="142" font-size="14" font-weight="700" fill="#1C1B1F">التبديل لغير الخاضع للرقابة لمشاهد محددة</text>
  <text x="78" y="161" font-size="12" fill="#49454F">شغّل Hermes 3 لهذا المشهد فقط — لا بيانات تنتقل بين الجلسات.</text>
  <circle cx="46" cy="214" r="16" fill="#6750A4"/>
  <text x="46" y="219" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="78" y="210" font-size="14" font-weight="700" fill="#1C1B1F">إعادة استخدام نفس قوالب التوجيه</text>
  <text x="78" y="229" font-size="12" fill="#49454F">توجيهات المشهد والمعنى الضمني وتناقض الشخصية تعمل بنفس الطريقة.</text>
  <circle cx="46" cy="282" r="16" fill="#6750A4"/>
  <text x="46" y="287" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="78" y="278" font-size="14" font-weight="700" fill="#1C1B1F">لا تعليمات لا تُعطى لإنسان</text>
  <text x="78" y="297" font-size="12" fill="#49454F">النموذج أداة، وليس بنية إذن.</text>
  <circle cx="46" cy="350" r="16" fill="#6750A4"/>
  <text x="46" y="355" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="78" y="346" font-size="14" font-weight="700" fill="#1C1B1F">المراجعة قبل النشر</text>
  <text x="78" y="365" font-size="12" fill="#49454F">طبّق المراجعة التحريرية المعتادة على المحتوى المدعوم بالذكاء الاصطناعي.</text>
  <text x="400" y="433" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">معظم الكتّاب يستخدمون النموذج غير الخاضع للرقابة لمشاهد محددة فقط — وليس كبديل افتراضي.</text>
<text x="792" y="450" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>