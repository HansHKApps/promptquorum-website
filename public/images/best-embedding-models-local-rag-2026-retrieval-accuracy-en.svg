  <!-- Caption -->
  <text x="50" y="320" font-size="11" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">
    jina-embeddings-v3 leads overall at 92% avg. bge-large dominates English (94% legal, 93% research) but drops to 79% multilingual.
  </text>
<text x="792" y="345" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>