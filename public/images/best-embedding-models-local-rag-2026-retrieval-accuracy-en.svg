  <text x="395" y="55" font-size="12" font-weight="700" fill="#79747E" font-family="system-ui, -apple-system, sans-serif">Multilingual</text>
  <circle cx="545" cy="49" r="5" fill="#EA4335"/>

  <!-- Y-axis label -->
