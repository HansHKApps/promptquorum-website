  <line x1="18" y1="195" x2="782" y2="195" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="215" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">合計時間: ~4分 · 無料 · オープンソース · デスクトップアプリ (macOS · Windows · Linux)</text>
