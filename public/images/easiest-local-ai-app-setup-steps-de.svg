  <!-- Subtitle -->
  <text x="400" y="47" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle">Kein Terminal · Kein Python · Kein Cloud-Konto erforderlich</text>

  <!-- Step 1 circle -->
  <circle cx="100" cy="115" r="22" fill="#6750A4"/>
  <text x="100" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- Arrow 1 -->
  <text x="200" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&rarr;</text>

  <!-- Step 2 circle -->
  <circle cx="300" cy="115" r="22" fill="#6750A4"/>
  <text x="300" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Arrow 2 -->
  <text x="400" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&rarr;</text>

  <!-- Step 3 circle -->
  <circle cx="500" cy="115" r="22" fill="#6750A4"/>
  <text x="500" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- Arrow 3 -->
  <text x="600" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle">&rarr;</text>

  <!-- Step 4 circle -->
  <circle cx="700" cy="115" r="22" fill="#6750A4"/>
  <text x="700" y="123" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Step 1 label + subtext -->
  <text x="100" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Herunterladen</text>
  <text x="100" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">lmstudio.ai</text>
  <text x="100" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">.exe / .dmg / .AppImage</text>

  <!-- Step 2 label + subtext -->
  <text x="300" y="158" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Installieren</text>
  <text x="300" y="175" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Installer ausf&#252;hren</text>
  <text x="300" y="188" font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle">Berechtigungen akzeptieren</text>

