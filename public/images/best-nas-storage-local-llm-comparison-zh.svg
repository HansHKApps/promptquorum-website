<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
<rect width="800" height="300" fill="#FFFFFF"/>
<text x="400.0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">NAS vs 本地SSD vs 云端 vs USB外置硬盘</text>
<text x="26" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">选项</text>
<text x="178.0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">容量</text>
<text x="284.4" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">速度</text>
<text x="390.79999999999995" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">冗余性</text>
<text x="512.4" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#79747E" text-anchor="start">适用场景</text>
<line x1="20" y1="80" x2="780" y2="80" stroke="#E8DEF8" stroke-width="1.5"/>
<text x="26" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">本地SSD</text>
<text x="178.0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">2TB</text>
<text x="284.4" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">高速</text>
<text x="390.79999999999995" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">无</text>
<text x="512.4" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">单机、高速访问</text>
<line x1="20" y1="126" x2="780" y2="126" stroke="#F7F2FA" stroke-width="1"/>
<rect x="14" y="130" width="772" height="38" rx="4" fill="#F7F2FA"/>
<text x="26" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6750A4" text-anchor="start">NAS（RAID 6）</text>
<text x="178.0" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">8TB</text>
<text x="284.4" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">中等</text>
<text x="390.79999999999995" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">良好</text>
<text x="512.4" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">团队、共享访问</text>
<line x1="20" y1="170" x2="780" y2="170" stroke="#F7F2FA" stroke-width="1"/>
<text x="26" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">云端（AWS S3）</text>
<text x="178.0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">无限</text>
<text x="284.4" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">慢</text>
<text x="390.79999999999995" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">优秀</text>
<text x="512.4" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">远程访问、模型归档</text>
<line x1="20" y1="214" x2="780" y2="214" stroke="#F7F2FA" stroke-width="1"/>
<text x="26" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">USB外置硬盘</text>
<text x="178.0" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">4TB</text>
<text x="284.4" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">慢</text>
<text x="390.79999999999995" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#1C1B1F" text-anchor="start">无</text>
<text x="512.4" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#1C1B1F" text-anchor="start">离线备份、便携</text>
<text x="792" y="295" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>