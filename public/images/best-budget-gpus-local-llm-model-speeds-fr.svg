<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="1200" height="675" viewBox="0 0 1200 675" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata><title>RTX 3060 12GB : vitesses estimées des modèles</title>
<rect width="1200" height="675" fill="#FFFFFF"/>
<rect width="1200" height="128" fill="#6750A4"/>
<text x="44" y="62" font-size="34" font-weight="700" fill="#FFFFFF" direction="ltr" text-anchor="start">RTX 3060 12GB : vitesses estimées des modèles</text>
<text x="44" y="100" font-size="19" font-weight="400" fill="#EADDFF" direction="ltr" text-anchor="start">Estimations pour Ollama en Q4_K_M avec 16 Go de RAM. Ce ne sont pas nos propres benchmarks.</text>
<text x="44" y="170" font-size="16" font-weight="700" fill="#6B6574" direction="ltr" text-anchor="start">Modèle</text>
<text x="360" y="170" font-size="16" font-weight="700" fill="#6B6574" direction="ltr" text-anchor="start">VRAM utilisée</text>
<text x="510" y="170" font-size="16" font-weight="700" fill="#6B6574" direction="ltr" text-anchor="start">Vitesse (estimation)</text>
<text x="800" y="170" font-size="16" font-weight="700" fill="#6B6574" direction="ltr" text-anchor="start">Idéal pour</text>
<line x1="32" y1="186" x2="1168" y2="186" stroke="#E8DEF8" stroke-width="2"/>
<rect x="32" y="192" width="1136" height="58" rx="8" fill="#F7F2FA"/>
<text x="44" y="230" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">Qwen3 14B</text>
<text x="360" y="230" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~9 GB</text>
<text x="510" y="230" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">9–12 tok/sec</text>
<text x="800" y="230" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Meilleure qualité globale qui tient</text>
<text x="44" y="292" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">Qwen3 8B</text>
<text x="360" y="292" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~7 GB</text>
<text x="510" y="292" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">16–20 tok/sec</text>
<text x="800" y="292" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Code, polyvalence</text>
<line x1="32" y1="252" x2="1168" y2="252" stroke="#EFEAF4" stroke-width="1"/>
<text x="44" y="354" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">Gemma 4 12B</text>
<text x="360" y="354" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~8 GB</text>
<text x="510" y="354" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">11–14 tok/sec</text>
<text x="800" y="354" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Vision, multimodal</text>
<line x1="32" y1="314" x2="1168" y2="314" stroke="#EFEAF4" stroke-width="1"/>
<text x="44" y="416" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">Mistral 7B</text>
<text x="360" y="416" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~7 GB</text>
<text x="510" y="416" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">18 tok/sec</text>
<text x="800" y="416" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Suivi des instructions</text>
<line x1="32" y1="376" x2="1168" y2="376" stroke="#EFEAF4" stroke-width="1"/>
<text x="44" y="478" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">DeepSeek-R1 7B</text>
<text x="360" y="478" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~7 GB</text>
<text x="510" y="478" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">10–12 tok/sec</text>
<text x="800" y="478" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Raisonnement, maths</text>
<line x1="32" y1="438" x2="1168" y2="438" stroke="#EFEAF4" stroke-width="1"/>
<text x="44" y="540" font-size="20" font-weight="700" fill="#1C1B1F" direction="ltr" text-anchor="start">Gemma 4 E4B</text>
<text x="360" y="540" font-size="19" font-weight="400" fill="#1C1B1F" direction="ltr" text-anchor="start">~6.6 GB</text>
<text x="510" y="540" font-size="20" font-weight="600" fill="#4F378B" direction="ltr" text-anchor="start">18–22 tok/sec</text>
<text x="800" y="540" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Vision légère, chat rapide</text>
<line x1="32" y1="500" x2="1168" y2="500" stroke="#EFEAF4" stroke-width="1"/>
<text x="44" y="608" font-size="17" font-weight="400" fill="#49454F" direction="ltr" text-anchor="start">Les vitesses varient d’environ ±15 % selon la longueur du prompt et la fenêtre de contexte.</text>
<text x="1156" y="661" font-size="13" fill="#8A8591" text-anchor="end">promptquorum.com</text>
</svg>
