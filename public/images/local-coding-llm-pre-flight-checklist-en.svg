<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-label="Offline Coding Pre-Flight Checklist — 5-step flow diagram">
  <title>Offline Coding Pre-Flight Checklist</title>
  <desc>A 5-step numbered flow diagram: Pull LLM, Warm Cache, Sync Docs, Clone Repos, Lights-Off Test</desc>

  <!-- Background -->
  <rect width="800" height="290" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Offline Coding Pre-Flight Checklist</text>

  <!-- Subtitle -->
  <text x="400" y="47" font-size="13" fill="#49454F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Run the day before you lose connectivity · ~1 hour total</text>

  <!-- ── Step 1: Pull LLM ── -->
  <circle cx="75" cy="115" r="22" fill="#6750A4"/>
  <text x="75" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">1</text>

  <text x="75" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Pull LLM</text>
  <text x="75" y="172" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">ollama pull</text>
  <text x="75" y="185" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">qwen3-coder:30b</text>
  <text x="75" y="198" font-size="10" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">~18 GB download</text>

  <!-- Arrow 1→2 -->
  <text x="140" y="123" font-size="20" fill="#6750A4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">→</text>

  <!-- ── Step 2: Warm Cache ── -->
  <circle cx="210" cy="115" r="22" fill="#6750A4"/>
  <text x="210" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">2</text>

  <text x="210" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Warm Cache</text>
  <text x="210" y="172" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">npm install /</text>
  <text x="210" y="185" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">pip / cargo build</text>
  <text x="210" y="198" font-size="10" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">per-project</text>

  <!-- Arrow 2→3 -->
  <text x="275" y="123" font-size="20" fill="#6750A4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">→</text>

  <!-- ── Step 3: Sync Docs ── -->
  <circle cx="345" cy="115" r="22" fill="#6750A4"/>
  <text x="345" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">3</text>

  <text x="345" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Sync Docs</text>
  <text x="345" y="172" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">Devdocs Settings</text>
  <text x="345" y="185" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">→ Download All</text>
  <text x="345" y="198" font-size="10" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">~3–5 GB</text>

  <!-- Arrow 3→4 -->
  <text x="410" y="123" font-size="20" fill="#6750A4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">→</text>

  <!-- ── Step 4: Clone Repos ── -->
  <circle cx="480" cy="115" r="22" fill="#6750A4"/>
  <text x="480" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">4</text>

  <text x="480" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Clone Repos</text>
  <text x="480" y="172" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">git clone</text>
  <text x="480" y="185" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">--mirror</text>
  <text x="480" y="198" font-size="10" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">full history offline</text>

  <!-- Arrow 4→5 -->
  <text x="545" y="123" font-size="20" fill="#6750A4" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">→</text>

  <!-- ── Step 5: Lights-Off Test ── -->
  <circle cx="615" cy="115" r="22" fill="#6750A4"/>
  <text x="615" y="122" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">5</text>

  <text x="615" y="155" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Lights-Off Test</text>
  <text x="615" y="172" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">disable Wi-Fi</text>
  <text x="615" y="185" font-size="10" fill="#49454F" text-anchor="middle" font-family="'SF Mono',Monaco,monospace">30 min real work</text>
  <text x="615" y="198" font-size="10" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">find gaps now</text>

  <!-- Divider line -->
  <line x1="18" y1="215" x2="782" y2="215" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer note -->
  <text x="400" y="233" font-size="11" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">Complete all 5 steps in order before going offline — each step depends on internet access.</text>

  <!-- Attribution -->
  <text x="400" y="251" font-size="11" fill="#79747E" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif">promptquorum.com/power-local-llm/local-coding-llm-without-internet</text>
</svg>
