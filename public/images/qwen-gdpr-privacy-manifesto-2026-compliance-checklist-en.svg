<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">GDPR Article Compliance Checklist: Local LLM vs Cloud API</text>

  <text x="40" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">GDPR Article</text>
  <text x="330" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6750A4">Local LLM</text>
  <text x="565" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Cloud API</text>
  <line x1="18" y1="68" x2="782" y2="68" stroke="#E8DEF8" stroke-width="1.5"/>

  <rect x="18" y="70" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 5 — Data Minimisation</text>
  <text x="330" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Never leaves infrastructure</text>
  <text x="565" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Transferred to provider</text>
  <rect x="18" y="122" width="764" height="48" fill="#FFFFFF" rx="4"/>
  <text x="40" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 25 — Data Protection by Design</text>
  <text x="330" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Prevented by design</text>
  <text x="565" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Needs contractual controls</text>
  <rect x="18" y="174" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 32 — Technical Measures</text>
  <text x="330" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ Org-controlled encryption</text>
  <text x="565" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ Provider-implemented</text>
  <rect x="18" y="226" width="764" height="48" fill="#FFFFFF" rx="4"/>
  <text x="40" y="256" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 44 — Cross-Border Transfers</text>
  <text x="330" y="256" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ No transfer</text>
  <text x="565" y="256" font-family="system-ui, sans-serif" font-size="11" fill="#EA4335">❌ Transfer occurs</text>
  <rect x="18" y="278" width="764" height="48" fill="#F7F2FA" rx="4"/>
  <text x="40" y="308" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Art. 28 — Processor Obligations</text>
  <text x="330" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#34A853">✅ No processor in scope</text>
  <text x="565" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#F4B400">⚠️ DPA required</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>