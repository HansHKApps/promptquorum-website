<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Logseq + logseq-copilot vs Joplin + Jarvis</text>

  <!-- Left Panel: Logseq -->
  <rect x="24" y="52" width="360" height="315" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="24" y="52" width="360" height="4" rx="0" fill="#6750A4"/>
  <text x="204" y="80" font-size="16" font-weight="700" fill="#6750A4" text-anchor="middle">Logseq + logseq-copilot</text>

  <text x="44" y="110" font-size="12" font-weight="700" fill="#79747E">AI plugin</text>
  <text x="44" y="128" font-size="12" fill="#1C1B1F">Chat blocks, slash commands</text>

  <text x="44" y="155" font-size="12" font-weight="700" fill="#79747E">RAG / embeddings</text>
  <circle cx="56" cy="176" r="10" fill="#EA4335"/>
  <text x="56" y="180" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
  <text x="74" y="180" font-size="12" fill="#1C1B1F">No vault-wide index</text>

  <text x="44" y="207" font-size="12" font-weight="700" fill="#79747E">Sync (no cloud)</text>
  <text x="44" y="225" font-size="12" fill="#1C1B1F">Git, Syncthing, iCloud Drive</text>

  <text x="44" y="252" font-size="12" font-weight="700" fill="#79747E">Mobile AI plugins</text>
  <circle cx="56" cy="273" r="10" fill="#EA4335"/>
  <text x="56" y="277" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
  <text x="74" y="277" font-size="12" fill="#1C1B1F">Not supported (2026)</text>

  <text x="44" y="304" font-size="12" font-weight="700" fill="#79747E">Best for</text>
  <text x="44" y="322" font-size="12" fill="#1C1B1F">Daily-journal + outliner workflow</text>

  <line x1="44" y1="340" x2="364" y2="340" stroke="#F7F2FA" stroke-width="1"/>
  <text x="44" y="360" font-size="11" font-family="'SF Mono', Monaco, monospace" fill="#49454F">llama3.2:3b via localhost:11434/v1</text>

  <!-- Right Panel: Joplin -->
  <rect x="416" y="52" width="360" height="315" rx="6" fill="#FFFFFF" stroke="#7D5260" stroke-width="2"/>
  <rect x="416" y="52" width="360" height="4" rx="0" fill="#7D5260"/>
  <text x="596" y="80" font-size="16" font-weight="700" fill="#7D5260" text-anchor="middle">Joplin + Jarvis</text>

  <text x="436" y="110" font-size="12" font-weight="700" fill="#79747E">AI plugin</text>
  <text x="436" y="128" font-size="12" fill="#1C1B1F">Chat sidebar, "Ask Jarvis"</text>

  <text x="436" y="155" font-size="12" font-weight="700" fill="#79747E">RAG / embeddings</text>
  <circle cx="448" cy="176" r="10" fill="#34A853"/>
  <text x="448" y="180" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="466" y="180" font-size="12" fill="#1C1B1F">nomic-embed-text / mxbai</text>

  <text x="436" y="207" font-size="12" font-weight="700" fill="#79747E">Sync (no cloud)</text>
  <text x="436" y="225" font-size="12" fill="#1C1B1F">Joplin Server, WebDAV, Nextcloud</text>

  <text x="436" y="252" font-size="12" font-weight="700" fill="#79747E">Mobile AI plugins</text>
  <circle cx="448" cy="273" r="10" fill="#EA4335"/>
  <text x="448" y="277" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text>
  <text x="466" y="277" font-size="12" fill="#1C1B1F">Not supported (2026)</text>

  <text x="436" y="304" font-size="12" font-weight="700" fill="#79747E">Best for</text>
  <text x="436" y="322" font-size="12" fill="#1C1B1F">Markdown notebook + E2EE sync</text>

  <line x1="436" y1="340" x2="756" y2="340" stroke="#F7F2FA" stroke-width="1"/>
  <text x="436" y="360" font-size="11" font-family="'SF Mono', Monaco, monospace" fill="#49454F">nomic-embed-text: 1K notes ~3 min</text>

  <text x="400" y="390" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Joplin + Jarvis is the only RAG-backed local knowledge base of the two — Logseq has no vault-wide embedding index in 2026.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
