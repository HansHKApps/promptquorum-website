<text x="500" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Modelo de linguagem</text>
<text x="500" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="middle">7B · ~6 GB VRAM</text>
<text x="600" y="117" font-size="20" fill="#6750A4">→</text>
