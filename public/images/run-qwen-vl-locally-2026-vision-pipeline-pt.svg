<text x="700" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Saída de texto</text>
<text x="700" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="middle">OCR · Q&amp;A · JSON</text>
<line x1="18" y1="190" x2="782" y2="190" stroke="#E8DEF8" stroke-width="1.5"/>
<text x="30" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">A resolução nativa de 4096×4096 lê texto CJK denso que o LLaVA 1.6 (672×672) e o Llama 3.2 Vision (1120×1120) reduzem e perdem.</text>
<text x="30" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">Cada imagem é processada na sua máquina — sem upload para a nuvem, sem chave de API necessária.</text>
<text x="792" y="305" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
