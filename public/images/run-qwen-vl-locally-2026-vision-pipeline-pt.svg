<text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Como o Qwen2-VL lê uma imagem: pipeline de visão</text>
<rect x="20" y="60" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
<rect x="20" y="60" width="160" height="4" rx="0" fill="#6750A4"/>
<text x="100" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Imagem de entrada</text>
<text x="100" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="middle">até 4096×4096</text>
<text x="200" y="117" font-size="20" fill="#6750A4">→</text>
<rect x="220" y="60" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
<rect x="220" y="60" width="160" height="4" rx="0" fill="#6750A4"/>
<text x="300" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1C1B1F" text-anchor="middle">Encoder de visão</text>
<text x="300" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="middle">resolução nativa</text>
<text x="400" y="117" font-size="20" fill="#6750A4">→</text>
<rect x="420" y="60" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
