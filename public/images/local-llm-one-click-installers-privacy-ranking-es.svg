<text x="400" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="middle">Las cuatro herramientas ejecutan la inferencia en el dispositivo. Ranking basado en recopilaci&#xf3;n de telemetr&#xed;a y auditabilidad del c&#xf3;digo.</text>
