<text x="80" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#49454F" text-anchor="start">Sin telemetr&#xed;a. Todo el chat se guarda localmente en JSON simple. C&#xf3;digo abierto MIT, totalmente auditable.</text>
