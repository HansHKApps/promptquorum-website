<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Errores comunes: qu&#xe9; NO hacer frente a qu&#xe9; S&#xcd; hacer</text>

  <!-- LEFT: Bad Mistakes -->
  <rect x="28" y="55" width="340" height="340" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="85" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">❌ Errores comunes</text>

  <text x="48" y="115" font-size="12" font-weight="700" fill="#1C1B1F">1. Modelos peque&#xf1;os (3B)</text>
  <text x="48" y="135" font-family="'SF Mono'" font-size="11" fill="#EA4335">Llama 3.1 8B obtiene 55%</text>

  <text x="48" y="160" font-size="12" font-weight="700" fill="#1C1B1F">2. Sin contexto en el prompt</text>
  <text x="48" y="180" font-family="'SF Mono'" font-size="11" fill="#EA4335">"Genera c&#xf3;digo para X"</text>

  <text x="48" y="205" font-size="12" font-weight="700" fill="#1C1B1F">3. Bucles infinitos</text>
  <text x="48" y="225" font-family="'SF Mono'" font-size="11" fill="#EA4335">Sin l&#xed;mite max_iterations</text>

  <text x="48" y="250" font-size="12" font-weight="700" fill="#1C1B1F">4. Confiar a ciegas en la salida</text>
  <text x="48" y="270" font-family="'SF Mono'" font-size="11" fill="#EA4335">Sin paso de revisi&#xf3;n de c&#xf3;digo</text>

  <text x="48" y="295" font-size="12" font-weight="700" fill="#1C1B1F">5. Modelos de prop&#xf3;sito general</text>
  <text x="48" y="315" font-family="'SF Mono'" font-size="11" fill="#EA4335">Usar Mistral, no Qwen-code</text>

  <text x="48" y="340" font-size="11" fill="#EA4335" font-weight="600">Resultado: c&#xf3;digo deficiente, errores, fallos</text>

  <!-- RIGHT: Good Practices -->
  <rect x="432" y="55" width="340" height="340" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="85" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">✅ Buenas pr&#xe1;cticas</text>

  <text x="452" y="115" font-size="12" font-weight="700" fill="#1C1B1F">1. Modelos de programaci&#xf3;n (7B+)</text>
  <text x="452" y="135" font-family="'SF Mono'" font-size="11" fill="#34A853">Qwen2.5-Coder 7B: 72%</text>

  <text x="452" y="160" font-size="12" font-weight="700" fill="#1C1B1F">2. Prompts detallados</text>
  <text x="452" y="180" font-family="'SF Mono'" font-size="11" fill="#34A853">Firma + tipos + docstring</text>

  <text x="452" y="205" font-size="12" font-weight="700" fill="#1C1B1F">3. Establecer l&#xed;mites de iteraci&#xf3;n</text>
  <text x="452" y="225" font-family="'SF Mono'" font-size="11" fill="#34A853">max_iterations = 10-20</text>

  <text x="452" y="250" font-size="12" font-weight="700" fill="#1C1B1F">4. Revisar siempre el c&#xf3;digo</text>
  <text x="452" y="270" font-family="'SF Mono'" font-size="11" fill="#34A853">72% de precisi&#xf3;n ≠ c&#xf3;digo perfecto</text>

  <text x="452" y="295" font-size="12" font-weight="700" fill="#1C1B1F">5. Modelos especializados en c&#xf3;digo</text>
  <text x="452" y="315" font-family="'SF Mono'" font-size="11" fill="#34A853">Qwen, CodeLlama, DeepSeek</text>

  <text x="452" y="340" font-size="11" fill="#34A853" font-weight="600">Resultado: c&#xf3;digo de calidad, probado, listo para producci&#xf3;n</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
