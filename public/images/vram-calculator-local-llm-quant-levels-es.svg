  <text x="40" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">&#x1f4a1; Q5 es el punto &#xf3;ptimo recomendado: 95% de calidad con un 68.75% de reducci&#xf3;n de tama&#xf1;o.</text>
  <text x="40" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#49454F">Ejemplo: Llama 3.1 7B en Q5 = 4.4 GB (frente a 14 GB en FP16).</text>

