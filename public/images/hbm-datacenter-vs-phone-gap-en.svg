<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">On-Device vs Data-Center AI: The 14x Speed Gap</text>

  <!-- Left panel: Phone -->
  <rect x="28" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">Phone (Galaxy S26)</text>

  <text x="48" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Memory: LPDDR5X</text>
  <text x="48" y="136" font-family="'SF Mono', Monaco, monospace" font-size="15" font-weight="700" fill="#EA4335">85.6 GB/s</text>

  <text x="48" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">7B model, Q4 quantized (3.5 GB)</text>
  <text x="48" y="188" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">85.6 GB/s ÷ 3.5 GB</text>

  <line x1="48" y1="205" x2="348" y2="205" stroke="#F7F2FA" stroke-width="1"/>

  <text x="48" y="235" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#1C1B1F">~24 tok/s</text>
  <text x="48" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">theoretical maximum</text>
  <text x="48" y="278" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#EA4335">~8–15 tok/s</text>
  <text x="48" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">real-world (compute + cache overhead)</text>

  <!-- Right panel: Data center -->
  <rect x="432" y="55" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Data Center (Nvidia H100)</text>

  <text x="452" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Memory: HBM3E</text>
  <text x="452" y="136" font-family="'SF Mono', Monaco, monospace" font-size="15" font-weight="700" fill="#34A853">1.229 TB/s</text>

  <text x="452" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F">7B model, Q4 quantized (3.5 GB)</text>
  <text x="452" y="188" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">1,229 GB/s ÷ 3.5 GB</text>

  <line x1="452" y1="205" x2="752" y2="205" stroke="#F7F2FA" stroke-width="1"/>

  <text x="452" y="235" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#1C1B1F">~352 tok/s</text>
  <text x="452" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">theoretical maximum</text>
  <text x="452" y="278" font-family="'SF Mono', Monaco, monospace" font-size="18" font-weight="700" fill="#34A853">~200+ tok/s</text>
  <text x="452" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#79747E">real-world sustained throughput</text>

  <!-- Center gap badge -->
  <circle cx="400" cy="195" r="34" fill="#6750A4"/>
  <text x="400" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">14×</text>
  <text x="400" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">gap</text>

  <text x="400" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle">Same 3.5 GB model, same math — bandwidth alone explains the real-world speed difference.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
