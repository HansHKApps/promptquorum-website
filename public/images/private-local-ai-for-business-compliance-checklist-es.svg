<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <metadata>
    <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">On-Premises AI Compliance Checklist</dc:title>
    <dc:creator>PromptQuorum</dc:creator>
    <dc:rights>© PromptQuorum 2026</dc:rights>
    <dc:source>https://www.promptquorum.com/local-llms/private-local-ai-for-business</dc:source>
  </metadata>

  <rect width="800" height="420" fill="#FFFFFF"/>

  <text x="400" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Lista de cumplimiento: GDPR, HIPAA, SOC2</text>

  <!-- GDPR Section -->
  <rect x="28" y="55" width="220" height="165" rx="6" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="138" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1976D2" text-anchor="middle">GDPR (UE)</text>

  <circle cx="48" cy="110" r="6" fill="#2196F3"/>
  <text x="64" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Residencia de datos en la UE</text>

  <circle cx="48" cy="135" r="6" fill="#2196F3"/>
  <text x="64" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Acuerdo de tratamiento de datos</text>

  <circle cx="48" cy="160" r="6" fill="#2196F3"/>
  <text x="64" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Cifrado en reposo/tr&#xe1;nsito</text>

  <circle cx="48" cy="185" r="6" fill="#2196F3"/>
  <text x="64" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Derecho de supresi&#xf3;n (local)</text>

  <circle cx="48" cy="210" r="6" fill="#2196F3"/>
  <text x="64" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Registros de acceso y portabilidad</text>

  <!-- HIPAA Section -->
  <rect x="290" y="55" width="220" height="165" rx="6" fill="#FCE4EC" stroke="#EA4335" stroke-width="2"/>
  <text x="400" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">HIPAA (Sanidad)</text>

  <circle cx="310" cy="110" r="6" fill="#EA4335"/>
  <text x="326" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Cifrado AES-256</text>

  <circle cx="310" cy="135" r="6" fill="#EA4335"/>
  <text x="326" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Auditor&#xed;a (todas las consultas)</text>

  <circle cx="310" cy="160" r="6" fill="#EA4335"/>
  <text x="326" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Acceso por roles (RBAC)</text>

  <circle cx="310" cy="185" r="6" fill="#EA4335"/>
  <text x="326" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Acuerdo de socio comercial</text>

  <circle cx="310" cy="210" r="6" fill="#EA4335"/>
  <text x="326" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Seguridad f&#xed;sica del servidor</text>

  <!-- SOC2 Section -->
  <rect x="552" y="55" width="220" height="165" rx="6" fill="#F3E5F5" stroke="#6750A4" stroke-width="2"/>
  <text x="662" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6750A4" text-anchor="middle">SOC2 (Empresa)</text>

  <circle cx="572" cy="110" r="6" fill="#6750A4"/>
  <text x="588" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Registro de auditor&#xed;a (completo)</text>

  <circle cx="572" cy="135" r="6" fill="#6750A4"/>
  <text x="588" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Controles de acceso (MFA)</text>

  <circle cx="572" cy="160" r="6" fill="#6750A4"/>
  <text x="588" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Est&#xe1;ndar de cifrado</text>

  <circle cx="572" cy="185" r="6" fill="#6750A4"/>
  <text x="588" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Pol&#xed;tica de retenci&#xf3;n de datos</text>

  <circle cx="572" cy="210" r="6" fill="#6750A4"/>
  <text x="588" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#1C1B1F">Plan de respuesta a incidentes</text>

  <!-- Implementation Section -->
  <rect x="28" y="235" width="744" height="175" rx="6" fill="#FFF3E0" stroke="#F4B400" stroke-width="2"/>
  <text x="400" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F57F17" text-anchor="middle">Implementaci&#xf3;n: esencial para todos los despliegues</text>

  <text x="60" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Seguridad y cifrado:</text>
  <text x="80" y="313" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; TLS 1.3 para todas las comunicaciones de red</text>
  <text x="80" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Cifrado AES-256 para datos en reposo (PostgreSQL, S3)</text>

  <text x="60" y="355" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Monitorizaci&#xf3;n y auditor&#xed;a:</text>
  <text x="80" y="373" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Registra cada solicitud de inferencia (consulta, usuario, respuesta, marca de tiempo, c&#xf3;digos de error)</text>
  <text x="80" y="388" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x2022; Almacena los registros en formato a prueba de manipulaciones para revisi&#xf3;n regulatoria</text>

  <text x="792" y="410" font-family="system-ui, sans-serif" font-size="10" fill="#999999" text-anchor="end">promptquorum.com</text>
</svg>