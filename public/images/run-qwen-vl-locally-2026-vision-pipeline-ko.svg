<text x="30" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#49454F">네이티브 4096×4096 입력 해상도는 LLaVA 1.6(672×672)과 Llama 3.2 Vision(1120×1120)이 다운샘플링하며 놓치는 밀도 높은 CJK 텍스트도 읽어냅니다.</text>
