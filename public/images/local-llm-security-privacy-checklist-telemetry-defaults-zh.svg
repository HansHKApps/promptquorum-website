<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="320" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">遥测默认设置：Ollama、LM Studio、Jan AI、GPT4All</text>
  <text x="40" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">工具</text>
  <text x="220" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">遥测默认值</text>
  <text x="420" y="54" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">如何确认/禁用</text>
  <line x1="18" y1="63" x2="782" y2="63" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="18" y="59" width="764" height="46" fill="#E6F4EA" rx="4"/>
  <text x="40" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">Ollama ★</text>
  <text x="220" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">不收集</text>
  <text x="420" y="79" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">开源 — 无分析代码</text>
  <rect x="18" y="109" width="764" height="46" fill="#FEF7E0" rx="4"/>
  <text x="40" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">LM Studio</text>
  <text x="220" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">匿名分析已开启</text>
  <text x="420" y="129" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">设置 → 隐私 → 取消使用数据勾选</text>
  <rect x="18" y="159" width="764" height="46" fill="#E6F4EA" rx="4"/>
  <text x="40" y="179" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853">Jan AI ★</text>
  <text x="220" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">明确已禁用</text>
  <text x="420" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">开源 — 审计 github.com/janhq/jan</text>
  <rect x="18" y="209" width="764" height="46" fill="#FEF7E0" rx="4"/>
  <text x="40" y="229" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">GPT4All</text>
  <text x="220" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">首次启动时选择加入</text>
  <text x="420" y="229" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#49454F">设置 → 隐私 → 禁用分析</text>
  <text x="400" y="298" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Ollama和Jan AI默认不收集任何数据；LM Studio和GPT4All出厂即开启分析 — 请检查设置。</text>
<text x="792" y="315" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>