<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Privacy &amp; Local Control vs. Setup Convenience</text>

  <!-- Plot box -->
  <rect x="120" y="55" width="650" height="290" rx="6" fill="#FFFFFF" stroke="#E8DEF8" stroke-width="1.5"/>
  <line x1="445" y1="55" x2="445" y2="345" stroke="#F7F2FA" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="120" y1="200" x2="770" y2="200" stroke="#F7F2FA" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Axis labels -->
  <text x="445" y="378" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E" text-anchor="middle">Setup Convenience →</text>
  <text x="40" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#79747E" text-anchor="middle" transform="rotate(-90 40 200)">Privacy &amp; Local Control →</text>

  <!-- Home Assistant -->
  <circle cx="200" cy="95" r="14" fill="#34A853"/>
  <text x="200" y="99" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">HA</text>
  <text x="200" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">Home Assistant</text>
  <text x="200" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Local &amp; private, most setup</text>

  <!-- Apple Home -->
  <circle cx="430" cy="150" r="14" fill="#7D5260"/>
  <text x="430" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AH</text>
  <text x="430" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7D5260" text-anchor="middle">Apple Home</text>
  <text x="430" y="201" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Balanced, Apple hub</text>

  <!-- Google Home -->
  <circle cx="560" cy="250" r="14" fill="#F4B400"/>
  <text x="560" y="254" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">GH</text>
  <text x="560" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4B400" text-anchor="middle">Google Home</text>
  <text x="560" y="301" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle">Cloud-first, broad voice</text>

  <!-- Amazon Alexa -->
  <circle cx="700" cy="305" r="14" fill="#6750A4"/>
  <text x="700" y="309" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AA</text>
  <text x="700" y="332" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">Amazon Alexa</text>
  <text x="700" y="348" font-family="system-ui, sans-serif" font-size="11" fill="#49454F" text-anchor="middle" transform="translate(0,0)">Widest devices, cloud-first</text>

  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Home Assistant maximizes privacy and local control; Alexa and Google Home trade privacy for the easiest cloud-first setup.</text>
<text x="792" y="455" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
