<text x="400" y="308" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">하드웨어는 일회성 비용입니다 — Home Assistant, 기기, Frigate는 월 요금 없이 계속 작동합니다.</text>
