  <text x="525" y="140" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">Piper TTS</text>
  <text x="525" y="158" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F" text-anchor="middle">음성 합성</text>
  <text x="525" y="176" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#6750A4" text-anchor="middle">0.1–0.3초</text>
  <circle cx="670" cy="95" r="20" fill="#6750A4"/>
