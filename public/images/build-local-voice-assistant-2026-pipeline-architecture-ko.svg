  <line x1="40" y1="200" x2="760" y2="200" stroke="#E8DEF8" stroke-width="1.5"/>
  <rect x="60" y="220" width="680" height="72" rx="6" fill="#F7F2FA" stroke="#E8DEF8" stroke-width="1"/>
  <rect x="60" y="220" width="4" height="72" fill="#6750A4"/>
  <text x="80" y="245" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4">선택 사항: 웨이크 워드 게이트</text>
  <text x="80" y="265" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">OpenWakeWord(오픈소스) 또는 Porcupine이 CPU 약 2–5%로 상시 대기합니다.</text>
  <text x="80" y="282" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F">웨이크 워드가 감지될 때만 Whisper + LLM + Piper를 실행합니다.</text>
  <text x="400" y="335" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Whisper → Ollama → Piper: 음성을 텍스트로 변환, LLM이 응답 생성, Piper가 말합니다 — 데스크톱 GPU에서 총 1–2초.</text>
  <text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>