<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Worldbuilding: Concentric Ring Expansion</text>
  <text x="400" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Anchor to one sensory detail, then expand outward — stop before the world level</text>

  <!-- Concentric rings, center-left -->
  <circle cx="230" cy="225" r="145" fill="none" stroke="#E8DEF8" stroke-width="2"/>
  <circle cx="230" cy="225" r="115" fill="none" stroke="#D8C9EE" stroke-width="2"/>
  <circle cx="230" cy="225" r="85" fill="none" stroke="#B39DDB" stroke-width="2"/>
  <circle cx="230" cy="225" r="55" fill="none" stroke="#8A6FC0" stroke-width="2"/>
  <circle cx="230" cy="225" r="25" fill="#6750A4"/>
  <text x="230" y="229" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Anchor</text>

  <!-- Legend / expansion order, right side -->
  <circle cx="470" cy="98" r="8" fill="#6750A4"/>
  <text x="486" y="94" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">1. Anchor</text>
  <text x="486" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">One sensory detail — smell of cardamom, sound of a bell.</text>

  <circle cx="470" cy="150" r="8" fill="#8A6FC0"/>
  <text x="486" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">2. Room</text>
  <text x="486" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">What the anchor sits inside — objects, light, temperature.</text>

  <circle cx="470" cy="202" r="8" fill="#B39DDB"/>
  <text x="486" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">3. Building</text>
  <text x="486" y="214" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Structure that contains the room — function, materials.</text>

  <circle cx="470" cy="254" r="8" fill="#D8C9EE"/>
  <text x="486" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">4. Street</text>
  <text x="486" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Immediate surroundings — traffic, other buildings, weather.</text>

  <circle cx="470" cy="306" r="8" fill="#E8DEF8"/>
  <text x="486" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">5. District</text>
  <text x="486" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Stop ring — name where expansion ends before reaching the city.</text>

  <rect x="18" y="352" width="764" height="1.5" fill="#E8DEF8"/>
  <text x="400" y="376" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">Without a named stop ring, the model defaults to summarising the entire world.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
