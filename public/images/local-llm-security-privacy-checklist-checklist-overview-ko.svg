<svg viewBox="0 0 800 548" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="548" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">로컬 LLM 보안 체크리스트: 4개 그룹, 12단계</text>
  <rect x="20" y="44" width="4" height="18" fill="#6750A4" rx="2"/>
  <text x="30" y="58" font-size="13.5" font-weight="700" fill="#6750A4">출처 및 무결성</text>
  <circle cx="34" cy="75" r="7" fill="#6750A4" fill-opacity="0.15"/>
  <text x="34" y="79" font-size="9" font-weight="700" fill="#6750A4" text-anchor="middle">&#10003;</text>
  <text x="48" y="80" font-size="12" fill="#1C1B1F">신뢰할 수 있는 출처에서만 모델 다운로드</text>
  <circle cx="34" cy="99" r="7" fill="#6750A4" fill-opacity="0.15"/>
  <text x="34" y="103" font-size="9" font-weight="700" fill="#6750A4" text-anchor="middle">&#10003;</text>
  <text x="48" y="104" font-size="12" fill="#1C1B1F">민감한 용도는 체크섬 검증</text>
  <rect x="20" y="128" width="4" height="18" fill="#7D5260" rx="2"/>
  <text x="30" y="142" font-size="13.5" font-weight="700" fill="#7D5260">네트워크</text>
  <circle cx="34" cy="159" r="7" fill="#7D5260" fill-opacity="0.15"/>
  <text x="34" y="163" font-size="9" font-weight="700" fill="#7D5260" text-anchor="middle">&#10003;</text>
  <text x="48" y="164" font-size="12" fill="#1C1B1F">API가 localhost에만 바인딩되었는지 확인</text>
  <circle cx="34" cy="183" r="7" fill="#7D5260" fill-opacity="0.15"/>
  <text x="34" y="187" font-size="9" font-weight="700" fill="#7D5260" text-anchor="middle">&#10003;</text>
  <text x="48" y="188" font-size="12" fill="#1C1B1F">로컬 API를 인터넷에 노출하지 않기</text>
  <rect x="20" y="212" width="4" height="18" fill="#34A853" rx="2"/>
  <text x="30" y="226" font-size="13.5" font-weight="700" fill="#34A853">데이터 보호</text>
  <circle cx="34" cy="243" r="7" fill="#34A853" fill-opacity="0.15"/>
  <text x="34" y="247" font-size="9" font-weight="700" fill="#34A853" text-anchor="middle">&#10003;</text>
  <text x="48" y="248" font-size="12" fill="#1C1B1F">추론 도구의 텔레메트리 비활성화</text>
  <circle cx="34" cy="267" r="7" fill="#34A853" fill-opacity="0.15"/>
  <text x="34" y="271" font-size="9" font-weight="700" fill="#34A853" text-anchor="middle">&#10003;</text>
  <text x="48" y="272" font-size="12" fill="#1C1B1F">전체 디스크 암호화 활성화</text>
  <circle cx="34" cy="291" r="7" fill="#34A853" fill-opacity="0.15"/>
  <text x="34" y="295" font-size="9" font-weight="700" fill="#34A853" text-anchor="middle">&#10003;</text>
  <text x="48" y="296" font-size="12" fill="#1C1B1F">민감한 채팅 로그 암호화 저장</text>
  <rect x="20" y="320" width="4" height="18" fill="#F4B400" rx="2"/>
  <text x="30" y="334" font-size="13.5" font-weight="700" fill="#F4B400">접근 및 유지관리</text>
  <circle cx="34" cy="351" r="7" fill="#F4B400" fill-opacity="0.15"/>
  <text x="34" y="355" font-size="9" font-weight="700" fill="#F4B400" text-anchor="middle">&#10003;</text>
  <text x="48" y="356" font-size="12" fill="#1C1B1F">설치된 확장 프로그램과 플러그인 검토</text>
  <circle cx="34" cy="375" r="7" fill="#F4B400" fill-opacity="0.15"/>
  <text x="34" y="379" font-size="9" font-weight="700" fill="#F4B400" text-anchor="middle">&#10003;</text>
  <text x="48" y="380" font-size="12" fill="#1C1B1F">LLM 작업 전용 계정 사용</text>
  <circle cx="34" cy="399" r="7" fill="#F4B400" fill-opacity="0.15"/>
  <text x="34" y="403" font-size="9" font-weight="700" fill="#F4B400" text-anchor="middle">&#10003;</text>
  <text x="48" y="404" font-size="12" fill="#1C1B1F">통합 앱의 시스템 프롬프트 감사</text>
  <circle cx="34" cy="423" r="7" fill="#F4B400" fill-opacity="0.15"/>
  <text x="34" y="427" font-size="9" font-weight="700" fill="#F4B400" text-anchor="middle">&#10003;</text>
  <text x="48" y="428" font-size="12" fill="#1C1B1F">추론 도구를 최신 상태로 유지</text>
  <circle cx="34" cy="447" r="7" fill="#F4B400" fill-opacity="0.15"/>
  <text x="34" y="451" font-size="9" font-weight="700" fill="#F4B400" text-anchor="middle">&#10003;</text>
  <text x="48" y="452" font-size="12" fill="#1C1B1F">승인된 버전 문서화(규제 환경)</text>
  <text x="400" y="530" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">민감하거나 규제 대상 데이터를 다루기 전 모든 항목을 확인하세요.</text>
<text x="792" y="543" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>