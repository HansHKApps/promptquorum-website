<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1C1B1F" text-anchor="middle">Does This AI Workflow Trigger Saudi PDPL Article 29?</text>

  <rect x="220" y="48" width="360" height="46" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="400" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Prompt contains personal data of</text>
  <text x="400" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">a Saudi resident?</text>

  <line x1="290" y1="94" x2="150" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="200" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">NO</text>

  <line x1="510" y1="94" x2="640" y2="155" stroke="#6750A4" stroke-width="2"/>
  <text x="565" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">YES</text>

  <rect x="20" y="155" width="255" height="72" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="20" y="155" width="255" height="4" fill="#34A853"/>
  <text x="147" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">Article 29 Likely</text>
  <text x="147" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">Doesn't Apply</text>
  <text x="147" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">No personal data involved —</text>
  <text x="147" y="227" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">reassess if scope changes.</text>

  <rect x="480" y="155" width="300" height="52" rx="6" fill="#F7F2FA" stroke="#6750A4" stroke-width="1.5"/>
  <text x="630" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">Does inference run on Saudi-based</text>
  <text x="630" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1C1B1F" text-anchor="middle">infrastructure (on-premises or KSA cloud)?</text>

  <line x1="555" y1="207" x2="440" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="475" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">YES</text>

  <line x1="705" y1="207" x2="690" y2="280" stroke="#6750A4" stroke-width="2"/>
  <text x="700" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#79747E">NO</text>

  <rect x="310" y="280" width="260" height="74" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="310" y="280" width="260" height="4" fill="#34A853"/>
  <text x="440" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">No Cross-Border Transfer</text>
  <text x="440" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">No SDAIA adequacy check, SCCs,</text>
  <text x="440" y="337" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#49454F" text-anchor="middle">or national-security review.</text>

  <rect x="590" y="280" width="200" height="74" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="590" y="280" width="200" height="4" fill="#EA4335"/>
  <text x="690" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">Cross-Border Transfer</text>
  <text x="690" y="319" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">Triggered</text>
  <text x="690" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">SDAIA adequacy unresolved, SCCs</text>
  <text x="690" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#49454F" text-anchor="middle">required; CLOUD Act risk if US-HQ.</text>

  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">On-premises AI removes the Article 29 cross-border question at the inference step by design.</text>
<text x="792" y="475" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
