<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="340" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="17" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local RAG Query Types — What Healthy Answers Look Like</text>
  <rect x="0" y="38" width="800" height="36" fill="#6750A4"/>
  <text x="80" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Query Type</text>
  <text x="240" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Example Query</text>
  <text x="490" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Healthy Answer Pattern</text>
  <text x="710" y="61" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Failure Signal</text>
  <line x1="160" y1="38" x2="160" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="320" y1="38" x2="320" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <line x1="630" y1="38" x2="630" y2="254" stroke="#E8DEF8" stroke-width="1"/>
  <rect x="0" y="74" width="800" height="58" fill="#FFFFFF"/>
  <circle cx="30" cy="103" r="10" fill="#34A853"/>
  <text x="80" y="97" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Fact Recall</text>
  <text x="80" y="113" font-size="10" fill="#49454F" text-anchor="middle">grounding test</text>
  <text x="240" y="97" font-size="11" fill="#49454F" text-anchor="middle">"What sample size</text>
  <text x="240" y="112" font-size="11" fill="#49454F" text-anchor="middle">did Smith 2024 use?"</text>
  <text x="490" y="97" font-size="11" fill="#34A853" text-anchor="middle">Direct quote + citation</text>
  <text x="490" y="112" font-size="11" fill="#34A853" text-anchor="middle">from the source chunk</text>
  <text x="710" y="97" font-size="11" fill="#EA4335" text-anchor="middle">Generic answer,</text>
  <text x="710" y="112" font-size="11" fill="#EA4335" text-anchor="middle">no quote or citation</text>
  <rect x="0" y="132" width="800" height="58" fill="#F7F2FA"/>
  <circle cx="30" cy="161" r="10" fill="#6750A4"/>
  <text x="80" y="155" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Synthesis</text>
  <text x="80" y="171" font-size="10" fill="#49454F" text-anchor="middle">integration test</text>
  <text x="240" y="155" font-size="11" fill="#49454F" text-anchor="middle">"Summarize the main</text>
  <text x="240" y="170" font-size="11" fill="#49454F" text-anchor="middle">contribution."</text>
  <text x="490" y="155" font-size="11" fill="#34A853" text-anchor="middle">3–5 sentences from</text>
  <text x="490" y="170" font-size="11" fill="#34A853" text-anchor="middle">abstract + conclusion chunks</text>
  <text x="710" y="155" font-size="11" fill="#EA4335" text-anchor="middle">Restates title or</text>
  <text x="710" y="170" font-size="11" fill="#EA4335" text-anchor="middle">quotes one line</text>
  <rect x="0" y="190" width="800" height="64" fill="#FFFFFF"/>
  <circle cx="30" cy="222" r="10" fill="#F4B400"/>
  <text x="80" y="216" font-size="12" font-weight="700" fill="#1C1B1F" text-anchor="middle">Cross-Document</text>
  <text x="80" y="232" font-size="10" fill="#49454F" text-anchor="middle">retrieval test</text>
  <text x="240" y="213" font-size="11" fill="#49454F" text-anchor="middle">"How do Smith and</text>
  <text x="240" y="228" font-size="11" fill="#49454F" text-anchor="middle">Jones disagree</text>
  <text x="240" y="243" font-size="11" fill="#49454F" text-anchor="middle">on chunk overlap?"</text>
  <text x="490" y="216" font-size="11" fill="#34A853" text-anchor="middle">Quotes from both papers</text>
  <text x="490" y="231" font-size="11" fill="#34A853" text-anchor="middle">with explicit attribution</text>
  <text x="710" y="213" font-size="11" fill="#EA4335" text-anchor="middle">Cites only one paper</text>
  <text x="710" y="228" font-size="11" fill="#EA4335" text-anchor="middle">or invents a disagreement</text>
  <rect x="0" y="38" width="800" height="216" fill="none" stroke="#E8DEF8" stroke-width="1.5"/>
  <line x1="0" y1="132" x2="800" y2="132" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="0" y1="190" x2="800" y2="190" stroke="#F7F2FA" stroke-width="1"/>
  <line x1="18" y1="272" x2="782" y2="272" stroke="#E8DEF8" stroke-width="1.5"/>
  <text x="400" y="292" font-size="11" font-weight="600" fill="#1C1B1F" text-anchor="middle">Green = healthy · Red = retrieval broken (fix chunk size or embedder, not the answer model)</text>
  <text x="400" y="310" font-size="11" fill="#79747E" text-anchor="middle">Use all 3 query types as a test set after every config change — the failure pattern tells you which knob to turn</text>
  <text x="792" y="334" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text>
</svg>
