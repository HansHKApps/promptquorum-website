  <text x="400" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle">Velocidad ≈ ancho de banda de memoria ÷ tamaño del modelo. La mejora de la iGPU depende de los controladores: comprueba con ollama ps.</text>
