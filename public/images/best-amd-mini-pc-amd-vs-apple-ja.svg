<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Metadata -->
  <metadata>
    <dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">PromptQuorum</dc:creator>
    <dc:rights xmlns:dc="http://purl.org/dc/elements/1.1/">Copyright 2026 PromptQuorum</dc:rights>
  </metadata>

  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AMD Ryzen AI Max+ vs Apple Mac Studio M4 Max</text>

  <!-- Column headers -->
  <rect x="50" y="50" width="400" height="40" fill="#f0f0f0" rx="3"/>
  <text x="250" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">AMD Ryzen AI Max+ 395</text>

  <rect x="500" y="50" width="400" height="40" fill="#f0f0f0" rx="3"/>
  <text x="700" y="77" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Apple Mac Studio M4 Max</text>

  <!-- Unified Memory -->
  <rect x="50" y="110" width="400" height="70" fill="#fff8e1" stroke="#FF9800" stroke-width="1" rx="3"/>
  <text x="70" y="130" font-size="12" font-weight="bold" fill="#333">統一メモリ</text>
  <text x="70" y="150" font-size="11" fill="#666">64–128GB DDR5X-8000</text>
  <text x="70" y="165" font-size="11" fill="#666">VRAMボトルネックなし</text>

  <rect x="500" y="110" width="400" height="70" fill="#fff8e1" stroke="#FF9800" stroke-width="1" rx="3"/>
  <text x="520" y="130" font-size="12" font-weight="bold" fill="#333">統一メモリ</text>
  <text x="520" y="150" font-size="11" fill="#666">36–192GB LPDDR5X</text>
  <text x="520" y="165" font-size="11" fill="#666">同一アーキテクチャ</text>

  <!-- GPU -->
  <rect x="50" y="200" width="400" height="70" fill="#e3f2fd" stroke="#2196F3" stroke-width="1" rx="3"/>
  <text x="70" y="220" font-size="12" font-weight="bold" fill="#333">GPU (iGPU)</text>
  <text x="70" y="240" font-size="11" fill="#666">Radeon 8060S (RDNA 3.5)</text>
  <text x="70" y="255" font-size="11" fill="#666">RTX 4070相当性能</text>

  <rect x="500" y="200" width="400" height="70" fill="#e3f2fd" stroke="#2196F3" stroke-width="1" rx="3"/>
  <text x="520" y="220" font-size="12" font-weight="bold" fill="#333">GPU (iGPU)</text>
  <text x="520" y="240" font-size="11" fill="#666">M4 Max GPU (10–12コア)</text>
  <text x="520" y="255" font-size="11" fill="#666">RTX 4070互換性能</text>

  <!-- NPU -->
  <rect x="50" y="290" width="400" height="70" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="3"/>
  <text x="70" y="310" font-size="12" font-weight="bold" fill="#333">ニューラルエンジン</text>
  <text x="70" y="330" font-size="11" fill="#666">50 TOPS NPU (専用)</text>
  <text x="70" y="345" font-size="11" fill="#666">INT8/Q4加速</text>

  <rect x="500" y="290" width="400" height="70" fill="#f3e5f5" stroke="#9C27B0" stroke-width="1" rx="3"/>
  <text x="520" y="310" font-size="12" font-weight="bold" fill="#333">ニューラルエンジン</text>
  <text x="520" y="330" font-size="11" fill="#666">38 TOPS ML演算</text>
  <text x="520" y="345" font-size="11" fill="#666">統合型、専用でない</text>

  <!-- Price -->
  <rect x="50" y="380" width="400" height="70" fill="#c8e6c9" stroke="#4CAF50" stroke-width="1" rx="3"/>
  <text x="70" y="400" font-size="12" font-weight="bold" fill="#333">価格</text>
  <text x="70" y="420" font-size="11" fill="#666">¥130,000–205,000 JPY</text>
  <text x="70" y="435" font-size="11" fill="#666">40–60%安い</text>

  <rect x="500" y="380" width="400" height="70" fill="#ffccbc" stroke="#FF5722" stroke-width="1" rx="3"/>
  <text x="520" y="400" font-size="12" font-weight="bold" fill="#333">価格</text>
  <text x="520" y="420" font-size="11" fill="#666">¥465,000–930,000 JPY</text>
  <text x="520" y="435" font-size="11" fill="#666">フラッグシッププレミアム</text>

  <!-- OS & Software -->
  <rect x="50" y="470" width="400" height="70" fill="#e0f2f1" stroke="#009688" stroke-width="1" rx="3"/>
  <text x="70" y="490" font-size="12" font-weight="bold" fill="#333">オペレーティングシステム</text>
  <text x="70" y="510" font-size="11" fill="#666">Linux (ROCm 6.2+)</text>
  <text x="70" y="525" font-size="11" fill="#666">Ollama/vLLM/LM Studio</text>

  <rect x="500" y="470" width="400" height="70" fill="#e0f2f1" stroke="#009688" stroke-width="1" rx="3"/>
  <text x="520" y="490" font-size="12" font-weight="bold" fill="#333">オペレーティングシステム</text>
  <text x="520" y="510" font-size="11" fill="#666">macOS (MLX/Ollama)</text>
  <text x="520" y="525" font-size="11" fill="#666">広いアプリエコシステム</text>

  <!-- Power -->
  <rect x="50" y="560" width="400" height="70" fill="#fce4ec" stroke="#E91E63" stroke-width="1" rx="3"/>
  <text x="70" y="580" font-size="12" font-weight="bold" fill="#333">消費電力</text>
  <text x="70" y="600" font-size="11" fill="#666">65–120W (全システム)</text>
  <text x="70" y="615" font-size="11" fill="#666">静音パッシブ/小型ファン</text>

  <rect x="500" y="560" width="400" height="70" fill="#fce4ec" stroke="#E91E63" stroke-width="1" rx="3"/>
  <text x="520" y="580" font-size="12" font-weight="bold" fill="#333">消費電力</text>
  <text x="520" y="600" font-size="11" fill="#666">150–200W (システム)</text>
  <text x="520" y="615" font-size="11" fill="#666">アクティブ冷却必須</text>

  <!-- Footer -->
  <text x="970" y="645" font-size="10" fill="#999" text-anchor="end">PromptQuorum • 2026年5月</text>
</svg>