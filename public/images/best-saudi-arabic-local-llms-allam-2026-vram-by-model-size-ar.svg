  <text x="400" y="345" font-family="system-ui, sans-serif" font-size="12" fill="#49454F" text-anchor="middle">لا يوفّر ALLaM علناً سوى نموذج 7B (6–8 GB) — النماذج المماثلة من فئة 34B/70B القادرة على العربية</text>
