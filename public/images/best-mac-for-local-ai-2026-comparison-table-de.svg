  <text x="780" y="224" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#1C1B1F">ca. 3.699 €</text>
  <line x1="18" y1="236" x2="982" y2="236" stroke="#F7F2FA" stroke-width="1"/>

  <text x="30" y="266" font-family="system-ui, sans-serif" font-size="12" fill="#79747E">Mac Studio M5 Max 128 GB*</text>
  <text x="380" y="266" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#79747E">128 GB*</text>
  <text x="480" y="266" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#79747E">614 GB/s*</text>
  <text x="620" y="266" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#79747E">noch nicht messbar</text>
  <text x="780" y="266" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#79747E">nicht angekündigt</text>

  <rect x="28" y="292" width="944" height="1" fill="#E8DEF8"/>
  <text x="500" y="320" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">* Der Mac Studio M5 Max ist im Juli 2026 noch nicht erschienen — Spezifikationen und Preis sind unbestätigte Prognosen.</text>
  <text x="500" y="342" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6750A4" text-anchor="middle">Kaufen Sie zuerst nach Unified Memory, optimieren Sie danach die Bandbreite — der Speicher entscheidet, welche Modelle passen.</text>
<text x="992" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
