  <text x="480" y="182" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">614 GB/s</text>
  <text x="620" y="182" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#34A853">12-16 Tok/s</text>
  <text x="780" y="182" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#1C1B1F">ca. 5.299 €</text>
