  <rect width="1000" height="400" fill="#FFFFFF"/>
  <text x="500" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Mac Mini vs. MacBook Pro vs. Mac Studio für lokale KI</text>

  <text x="30" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Mac</text>
  <text x="380" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Speicher</text>
  <text x="480" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Bandbreite</text>
  <text x="620" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">70B-Tempo</text>
  <text x="780" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Preis (Jul. 2026)</text>
  <line x1="18" y1="72" x2="982" y2="72" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="30" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Mac Mini M5 Pro 64 GB</text>
  <text x="380" y="98" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">64 GB</text>
  <text x="480" y="98" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">307 GB/s</text>
  <text x="620" y="98" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#EA4335">8-12 Tok/s</text>
  <text x="780" y="98" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#1C1B1F">ca. 1.699 €</text>
  <line x1="18" y1="110" x2="982" y2="110" stroke="#F7F2FA" stroke-width="1"/>

  <text x="30" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">MacBook Pro 16" M5 Max 64 GB</text>
  <text x="380" y="140" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">64 GB</text>
  <text x="480" y="140" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">460 GB/s</text>
  <text x="620" y="140" font-family="'SF Mono', Monaco, monospace" font-size="11" font-weight="700" fill="#F4B400">7-11 Tok/s</text>
