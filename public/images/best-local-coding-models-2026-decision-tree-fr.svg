<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Arbre de décision : 6 questions pour choisir votre modèle</text>
  <line x1="18" y1="38" x2="782" y2="38" stroke="#E8DEF8" stroke-width="1.5"/>
  <circle cx="38" cy="65" r="16" fill="#6750A4"/>
  <text x="38" y="70" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="66" y="59" font-size="13" font-weight="700" fill="#1C1B1F">Quelle quantité de VRAM ?</text>
  <text x="66" y="76" font-size="11" fill="#49454F">&lt;12 Go → 7B · 12–16 Go → 7B ou Codestral 22B · 24 Go → 30B · 48 Go+ → DeepSeek V3 (complet)</text>
  <line x1="18" y1="92" x2="782" y2="92" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="116" r="16" fill="#6750A4"/>
  <text x="38" y="121" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="66" y="110" font-size="13" font-weight="700" fill="#1C1B1F">Produit commercial ?</text>
  <text x="66" y="127" font-size="11" fill="#49454F">Oui → préférer Apache 2.0 (Qwen3-Coder, DeepSeek, Granite). Éviter Codestral sans licence Mistral commerciale.</text>
  <line x1="18" y1="143" x2="782" y2="143" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="167" r="16" fill="#6750A4"/>
  <text x="38" y="172" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="66" y="161" font-size="13" font-weight="700" fill="#1C1B1F">Besoin d'un contexte supérieur à 32K ?</text>
  <text x="66" y="178" font-size="11" fill="#49454F">Oui → ignorer Codestral (limite 32K) et StarCoder 2 (limite 16K).</text>
  <line x1="18" y1="194" x2="782" y2="194" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="218" r="16" fill="#6750A4"/>
  <text x="38" y="223" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="66" y="212" font-size="13" font-weight="700" fill="#1C1B1F">Langages de niche (Rust, Lua, Haskell, Solidity) ?</text>
  <text x="66" y="229" font-size="11" fill="#49454F">Oui → StarCoder 2 15B malgré la limite de 16K. Meilleure couverture open-weight pour les langages de niche.</text>
  <line x1="18" y1="245" x2="782" y2="245" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="269" r="16" fill="#6750A4"/>
  <text x="38" y="274" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="66" y="263" font-size="13" font-weight="700" fill="#1C1B1F">Industrie réglementée — audit de procurement requis ?</text>
  <text x="66" y="280" font-size="11" fill="#49454F">Oui → Granite Code 34B : Apache 2.0 + documentation provenance données d'entraînement IBM.</text>
  <line x1="18" y1="296" x2="782" y2="296" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="38" cy="320" r="16" fill="#6750A4"/>
  <text x="38" y="325" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="66" y="314" font-size="13" font-weight="700" fill="#1C1B1F">Toujours incertain ?</text>
  <text x="66" y="331" font-size="11" fill="#49454F">Par défaut : Qwen3-Coder — 30B sur GPU 24 Go, 7B sur laptop ou GPU 8 Go. Réévaluer si besoin.</text>
  <line x1="18" y1="347" x2="782" y2="347" stroke="#F7F2FA" stroke-width="1"/>
  <text x="400" y="375" font-size="11" font-weight="600" fill="#79747E" text-anchor="middle">Répondre dans l'ordre · La première contrainte gagne · Mai 2026</text>
  <text x="400" y="400" font-size="11" font-weight="600" fill="#6750A4" text-anchor="middle">promptquorum.com</text>
</svg>
