<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">Linux에서 systemd 서비스로 Ollama 실행</text>

  <!-- Step 1 -->
  <circle cx="100" cy="120" r="24" fill="#6750A4"/>
  <text x="100" y="127" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="100" y="168" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">설치</text>
  <text x="100" y="188" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">curl -fsSL https://ollama.com/</text>
  <text x="100" y="200" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">install.sh | sh</text>
  <text x="100" y="216" font-size="9.5" fill="#79747E" text-anchor="middle">systemd 서비스로 등록</text>

  <text x="180" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <circle cx="280" cy="120" r="24" fill="#6750A4"/>
  <text x="280" y="127" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="280" y="168" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">상태 확인</text>
  <text x="280" y="188" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">systemctl status ollama</text>
  <text x="280" y="204" font-size="9.5" font-weight="700" fill="#34A853" text-anchor="middle">→ active (running)</text>

  <text x="360" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <circle cx="520" cy="120" r="24" fill="#6750A4"/>
  <text x="520" y="127" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="520" y="168" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">서비스 제어</text>
  <text x="520" y="188" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">systemctl start ollama</text>
  <text x="520" y="202" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">systemctl stop / restart</text>

  <text x="600" y="128" font-size="20" fill="#6750A4" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <circle cx="700" cy="120" r="24" fill="#6750A4"/>
  <text x="700" y="127" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="700" y="168" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle">로그 보기</text>
  <text x="700" y="188" font-family="'SF Mono', Monaco, monospace" font-size="9.5" fill="#49454F" text-anchor="middle">journalctl -u ollama -f</text>
  <text x="700" y="204" font-size="9.5" fill="#79747E" text-anchor="middle">서비스 로그 실시간 확인</text>

  <line x1="40" y1="250" x2="760" y2="250" stroke="#E8DEF8" stroke-width="1.5"/>

  <text x="400" y="284" font-size="13" font-weight="700" fill="#6750A4" text-anchor="middle">중요한 이유</text>
  <text x="400" y="310" font-size="12" fill="#49454F" text-anchor="middle">install.sh 스크립트가 Ollama를 systemd 서비스로 자동 등록합니다 -- 수동 unit 파일이 필요 없습니다.</text>
  <text x="400" y="330" font-size="12" fill="#49454F" text-anchor="middle">Ollama는 부팅 및 충돌 이후 추가 설정 없이 자동으로 재시작됩니다.</text>

  <rect x="40" y="352" width="720" height="34" rx="6" fill="#F7F2FA"/>
  <text x="400" y="374" font-family="system-ui, sans-serif" font-size="11.5" fill="#1C1B1F" text-anchor="middle">기본 설치 경로는 바이너리를 /usr/local/bin/ollama에, 서비스 유닛을 /etc/systemd/system/ollama.service에 배치합니다.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
