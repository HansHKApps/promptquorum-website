<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Local Whisper vs Cloud Speech-to-Text</text>
  <text x="400" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#79747E" text-anchor="middle">Cost, latency, and privacy compared (M5 Pro, whisper.cpp)</text>

  <!-- Left Panel: Cloud STT -->
  <rect x="28" y="65" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="28" y="65" width="340" height="4" rx="0" fill="#EA4335"/>
  <text x="198" y="92" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#EA4335" text-anchor="middle">Cloud STT APIs</text>

  <text x="48" y="122" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Cost per hour audio:</text>
  <text x="48" y="140" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#EA4335">$0.36–$1.44</text>

  <text x="48" y="168" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Latency:</text>
  <text x="48" y="186" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#EA4335">300–2000 ms</text>

  <text x="48" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Privacy:</text>
  <text x="48" y="232" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">Audio sent to Google, OpenAI,</text>
  <text x="48" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">or AssemblyAI servers</text>

  <text x="48" y="276" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Monthly cost (8h/day):</text>
  <text x="48" y="294" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#EA4335">$86–$345</text>

  <text x="48" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Offline capable:</text>
  <text x="200" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EA4335">No</text>

  <!-- Right Panel: Local Whisper -->
  <rect x="432" y="65" width="340" height="280" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="65" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="92" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Local Whisper (M5 Pro)</text>

  <text x="452" y="122" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Cost per hour audio:</text>
  <text x="452" y="140" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#34A853">$0</text>

  <text x="452" y="168" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Latency:</text>
  <text x="452" y="186" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#34A853">100–300 ms</text>

  <text x="452" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Privacy:</text>
  <text x="452" y="232" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">100% local — audio never</text>
  <text x="452" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#49454F">leaves the Mac</text>

  <text x="452" y="276" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Monthly cost (8h/day):</text>
  <text x="452" y="294" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="700" fill="#34A853">$0</text>

  <text x="452" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1C1B1F">Offline capable:</text>
  <text x="604" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34A853">Yes</text>

  <text x="400" y="372" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">At 100+ hours/month, local Whisper on an M5 Pro pays for itself vs. cloud APIs within 12 months.</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
