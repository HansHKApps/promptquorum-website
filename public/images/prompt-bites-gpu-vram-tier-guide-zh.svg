<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 18px; font-weight: 600; }
      .tier-label { fill: #FFFFFF; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .tier-budget { fill: #6750A4; }
      .tier-entry { fill: #7E57C2; }
      .tier-mid { fill: #9575CD; }
      .tier-high { fill: #CE93D8; }
      .gpu-card { fill: #F7F2FA; stroke: #6750A4; stroke-width: 1.5; }
      .gpu-name { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
      .gpu-vram { fill: #6750A4; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .gpu-info { fill: #79747E; font-family: system-ui, sans-serif; font-size: 10px; }
      .text-label { fill: #1C1B1F; font-family: system-ui, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400"/>

  <!-- Title -->
  <text x="400" y="28" class="title" text-anchor="middle">GPU显存分级指南 — 预算级到企业级</text>

  <!-- BUDGET TIER -->
  <rect x="20" y="45" width="180" height="25" class="tier-budget" rx="4"/>
  <text x="110" y="62" class="tier-label" text-anchor="middle">预算级 (4-8 GB)</text>

  <!-- RTX 3060 -->
  <rect x="20" y="75" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="110" y="93" class="gpu-name" text-anchor="middle">RTX 3060</text>
  <text x="110" y="109" class="gpu-vram" text-anchor="middle">12 GB GDDR6</text>
  <text x="110" y="123" class="gpu-info" text-anchor="middle">入门游戏/LLM</text>
  <text x="110" y="135" class="gpu-info" text-anchor="middle">$250-300</text>

  <!-- RTX 4060 -->
  <rect x="20" y="155" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="110" y="173" class="gpu-name" text-anchor="middle">RTX 4060</text>
  <text x="110" y="189" class="gpu-vram" text-anchor="middle">8 GB GDDR6</text>
  <text x="110" y="203" class="gpu-info" text-anchor="middle">紧凑、高效</text>
  <text x="110" y="215" class="gpu-info" text-anchor="middle">$150-200</text>

  <!-- ENTRY TIER -->
  <rect x="220" y="45" width="180" height="25" style="fill: #9575CD;" rx="4"/>
  <text x="310" y="62" class="tier-label" text-anchor="middle">入门级 (8-16 GB)</text>

  <!-- RTX 3080 -->
  <rect x="220" y="75" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="310" y="93" class="gpu-name" text-anchor="middle">RTX 3080</text>
  <text x="310" y="109" class="gpu-vram" text-anchor="middle">10 GB GDDR6X</text>
  <text x="310" y="123" class="gpu-info" text-anchor="middle">LLM性能优异</text>
  <text x="310" y="135" class="gpu-info" text-anchor="middle">$500-600</text>

  <!-- RTX 4090 -->
  <rect x="220" y="155" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="310" y="173" class="gpu-name" text-anchor="middle">RTX 4090</text>
  <text x="310" y="189" class="gpu-vram" text-anchor="middle">24 GB GDDR6X</text>
  <text x="310" y="203" class="gpu-info" text-anchor="middle">消费级顶级GPU</text>
  <text x="310" y="215" class="gpu-info" text-anchor="middle">$1500+</text>

  <!-- MID-RANGE TIER -->
  <rect x="420" y="45" width="180" height="25" style="fill: #CE93D8;" rx="4"/>
  <text x="510" y="62" class="tier-label" text-anchor="middle">中端级 (24+ GB)</text>

  <!-- L40 (NVIDIA) -->
  <rect x="420" y="75" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="510" y="93" class="gpu-name" text-anchor="middle">L40</text>
  <text x="510" y="109" class="gpu-vram" text-anchor="middle">48 GB GDDR6</text>
  <text x="510" y="123" class="gpu-info" text-anchor="middle">专业推理</text>
  <text x="510" y="135" class="gpu-info" text-anchor="middle">$6000+</text>

  <!-- H100 (partial visualization) -->
  <rect x="420" y="155" width="180" height="70" class="gpu-card" rx="4"/>
  <text x="510" y="173" class="gpu-name" text-anchor="middle">H100 PCIe</text>
  <text x="510" y="189" class="gpu-vram" text-anchor="middle">80 GB HBM3</text>
  <text x="510" y="203" class="gpu-info" text-anchor="middle">企业级</text>
  <text x="510" y="215" class="gpu-info" text-anchor="middle">$40,000+</text>

  <!-- ENTERPRISE TIER -->
  <rect x="620" y="45" width="160" height="25" style="fill: #6750A4;" rx="4"/>
  <text x="700" y="62" class="tier-label" text-anchor="middle">企业级</text>

  <!-- A100 40GB -->
  <rect x="620" y="75" width="160" height="70" class="gpu-card" rx="4"/>
  <text x="700" y="93" class="gpu-name" text-anchor="middle">A100 40GB</text>
  <text x="700" y="109" class="gpu-vram" text-anchor="middle">40 GB HBM2</text>
  <text x="700" y="123" class="gpu-info" text-anchor="middle">数据中心验证</text>
  <text x="700" y="135" class="gpu-info" text-anchor="middle">$10,000+</text>

  <!-- Multi-GPU Setup -->
  <rect x="620" y="155" width="160" height="70" class="gpu-card" rx="4"/>
  <text x="700" y="173" class="gpu-name" text-anchor="middle">2x+ GPU 方案</text>
  <text x="700" y="189" class="gpu-vram" text-anchor="middle">80-160+ GB</text>
  <text x="700" y="203" class="gpu-info" text-anchor="middle">分布式推理</text>
  <text x="700" y="215" class="gpu-info" text-anchor="middle">定制价格</text>

  <!-- Bottom info box -->
  <rect x="20" y="250" width="760" height="130" style="fill: #F7F2FA; stroke: #E8DEF8; stroke-width: 1;" rx="4"/>

  <text x="30" y="268" class="gpu-name">选择指南：</text>

  <text x="30" y="290" class="text-label">• 预算级 (4-8 GB)：Phi-4、Gemma 2B，适合入门项目。RTX 3060/4060性价比最优。</text>

  <text x="30" y="308" class="text-label">• 入门级 (8-16 GB)：Llama 3 8B、Mistral 7B，通用用途。RTX 3080提供优异LLM性能。</text>

  <text x="30" y="326" class="text-label">• 中端级 (24+ GB)：14B-70B 模型、Llama 3 70B Q4。L40 专业级，RTX 4090 消费级旗舰。</text>

  <text x="30" y="344" class="text-label">• 企业级：多GPU方案，A100/H100 用于分布式推理。云端扩展 (AWS、GCP、Azure)。</text>

  <text x="30" y="362" class="text-label">提示：考虑单位GB/月成本 — 数据中心GPU长期摊销；消费级GPU最适合个人使用。</text>
<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>