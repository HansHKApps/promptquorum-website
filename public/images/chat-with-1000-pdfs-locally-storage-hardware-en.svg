<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="28" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Storage Sizing & Hardware Requirements by Scale
  </text>

  <!-- Tier 1: 100-1,000 docs -->
  <rect x="40" y="65" width="180" height="220" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="40" y="65" width="180" height="4" fill="#34A853" rx="0"/>

  <text x="130" y="90" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">100-1,000 Docs</text>

  <text x="60" y="125" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Storage:</text>
  <text x="60" y="143" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~1-3 GB vectors</text>

  <text x="60" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Index time:</text>
  <text x="60" y="183" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~5-15 min</text>

  <text x="60" y="205" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Hardware:</text>
  <text x="60" y="223" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">16 GB RAM, any CPU/GPU</text>
  <text x="60" y="240" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">SSD optional</text>

  <text x="60" y="265" font-size="10" font-weight="700" fill="#34A853" font-family="system-ui, -apple-system, sans-serif">→ AnythingLLM</text>

  <!-- Tier 2: 1,000-5,000 docs -->
  <rect x="250" y="65" width="180" height="220" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="250" y="65" width="180" height="4" fill="#6750A4" rx="0"/>

  <text x="340" y="90" font-size="12" font-weight="700" fill="#6750A4" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1,000-5,000 Docs</text>

  <text x="270" y="125" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Storage:</text>
  <text x="270" y="143" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~3-8 GB vectors</text>

  <text x="270" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Index time:</text>
  <text x="270" y="183" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~30-60 min</text>

  <text x="270" y="205" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Hardware:</text>
  <text x="270" y="223" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">16 GB RAM, NVMe SSD</text>
  <text x="270" y="240" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">GPU optional</text>

  <text x="270" y="265" font-size="10" font-weight="700" fill="#6750A4" font-family="system-ui, -apple-system, sans-serif">→ LlamaIndex</text>

  <!-- Tier 3: 5,000-10,000 docs -->
  <rect x="460" y="65" width="180" height="220" rx="6" fill="#FFFFFF" stroke="#F4B400" stroke-width="2"/>
  <rect x="460" y="65" width="180" height="4" fill="#F4B400" rx="0"/>

  <text x="550" y="90" font-size="12" font-weight="700" fill="#F4B400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">5,000-10,000 Docs</text>

  <text x="480" y="125" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Storage:</text>
  <text x="480" y="143" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~5-15 GB vectors</text>

  <text x="480" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Index time:</text>
  <text x="480" y="183" font-size="10" fill="#49454F" font-family="'SF Mono', Monaco, monospace">~60-120 min</text>

  <text x="480" y="205" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Hardware:</text>
  <text x="480" y="223" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">32 GB RAM, NVMe SSD</text>
  <text x="480" y="240" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">GPU 8GB+ recommended</text>

  <text x="480" y="265" font-size="10" font-weight="700" fill="#F4B400" font-family="system-ui, -apple-system, sans-serif">→ ChromaDB+hybrid</text>

  <!-- Tier 4: 10,000+ docs -->
  <rect x="670" y="65" width="130" height="220" rx="6" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/>
  <rect x="670" y="65" width="130" height="4" fill="#EA4335" rx="0"/>

  <text x="735" y="90" font-size="11" font-weight="700" fill="#EA4335" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">10,000+ Docs</text>

  <text x="690" y="125" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Storage:</text>
  <text x="690" y="143" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">10-50+ GB</text>

  <text x="690" y="165" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Index time:</text>
  <text x="690" y="183" font-size="9" fill="#49454F" font-family="'SF Mono', Monaco, monospace">2-8 hours</text>

  <text x="690" y="205" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">Hardware:</text>
  <text x="690" y="223" font-size="8" fill="#49454F" font-family="'SF Mono', Monaco, monospace">32+ GB RAM</text>
  <text x="690" y="238" font-size="8" fill="#49454F" font-family="'SF Mono', Monaco, monospace">NVMe, GPU 12GB+</text>

  <text x="690" y="265" font-size="10" font-weight="700" fill="#EA4335" font-family="system-ui, -apple-system, sans-serif">→ Qdrant</text>

  <!-- Key facts -->
  <rect x="50" y="310" width="700" height="60" fill="#F7F2FA" rx="4" stroke="#E8DEF8" stroke-width="1"/>
  <text x="70" y="335" font-size="11" font-weight="700" fill="#1C1B1F" font-family="system-ui, -apple-system, sans-serif">Rule of thumb:</text>
  <text x="70" y="355" font-size="10" font-weight="600" fill="#49454F" font-family="system-ui, -apple-system, sans-serif">~10-30 MB per 100 PDF pages. 50,000 pages = 5-15 GB vectors. Indexing time scales linearly (~30-90 min per 5,000 PDFs on consumer hardware). RAM requirements spike during embedding — close other apps.</text>
</svg>