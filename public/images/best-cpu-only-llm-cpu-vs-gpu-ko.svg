<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2025 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="420" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle">CPU vs GPU: CPU 추론은 얼마나 느릴까?</text>

  <text x="40" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">하드웨어</text>
  <text x="300" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">Model</text>
  <text x="530" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">속도</text>
  <text x="650" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79747E">최고속 CPU 대비</text>
  <line x1="18" y1="74" x2="782" y2="74" stroke="#E8DEF8" stroke-width="1.5"/>

  <rect x="18" y="90" width="764" height="46" fill="#F7F2FA" rx="4"/>
  <text x="40" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6750A4">Apple M3 (CPU) &#9733;</text>
  <text x="300" y="110" font-size="12" fill="#1C1B1F">Phi-4 Mini 3.8B</text>
  <text x="530" y="110" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">14 tok/s</text>
  <text x="650" y="110" font-size="11" fill="#34A853" font-weight="700">테스트 중 가장 빠른 CPU</text>

  <text x="40" y="158" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">Intel i7-12700 (CPU)</text>
  <text x="300" y="158" font-size="12" fill="#49454F">Phi-4 Mini 3.8B</text>
  <text x="530" y="158" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">12 tok/s</text>
  <text x="650" y="158" font-size="11" fill="#49454F">AVX-512 활성화</text>
  <line x1="18" y1="170" x2="782" y2="170" stroke="#F7F2FA" stroke-width="1"/>

  <text x="40" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1B1F">AMD Ryzen 7 5700X (CPU)</text>
  <text x="300" y="198" font-size="12" fill="#49454F">Phi-4 Mini 3.8B</text>
  <text x="530" y="198" font-family="'SF Mono', Monaco, monospace" font-size="12" fill="#49454F">9 tok/s</text>
  <text x="650" y="198" font-size="11" fill="#49454F">구형 AVX2만 지원</text>
  <line x1="18" y1="210" x2="782" y2="210" stroke="#F7F2FA" stroke-width="1"/>

  <rect x="18" y="222" width="764" height="46" fill="#FEF7E0" rx="4"/>
  <text x="40" y="242" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7D5260">RTX 3060 (GPU, 12 GB)</text>
  <text x="300" y="242" font-size="12" fill="#1C1B1F">Phi-4 Mini 3.8B</text>
  <text x="530" y="242" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">80 tok/s</text>
  <text x="650" y="242" font-size="11" fill="#7D5260" font-weight="700">CPU보다 6.7배 빠름</text>

  <rect x="18" y="278" width="764" height="46" fill="#FCE8E6" rx="4"/>
  <text x="40" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EA4335">RTX 4090 (GPU, 24 GB)</text>
  <text x="300" y="298" font-size="12" fill="#1C1B1F">Llama 3.3 8B Q4</text>
  <text x="530" y="298" font-family="'SF Mono', Monaco, monospace" font-size="12" font-weight="700" fill="#1C1B1F">120 tok/s</text>
  <text x="650" y="298" font-size="11" fill="#EA4335" font-weight="700">CPU보다 30배 빠름</text>

  <text x="400" y="358" font-family="system-ui, sans-serif" font-size="11.5" fill="#49454F" text-anchor="middle">CPU는 GPU보다 6–30배 느리지만 전용 하드웨어 비용이 $0이며 모든 기기에서 작동합니다.</text>
<text x="792" y="415" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
