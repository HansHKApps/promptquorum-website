<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description rdf:about=""><dc:creator>PromptQuorum</dc:creator><dc:rights>© 2026 PromptQuorum. All rights reserved.</dc:rights><dc:source>https://www.promptquorum.com</dc:source></rdf:Description></rdf:RDF></metadata>
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1C1B1F" text-anchor="middle">Raspberry Pi vs Mini PC for Home Assistant</text>

  <!-- Left Panel: Raspberry Pi -->
  <rect x="28" y="55" width="340" height="290" rx="6" fill="#FFFFFF" stroke="#6750A4" stroke-width="2"/>
  <rect x="28" y="55" width="340" height="4" rx="0" fill="#6750A4"/>
  <text x="198" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#6750A4" text-anchor="middle">Raspberry Pi</text>
  <text x="198" y="102" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#79747E" text-anchor="middle">Best for: the basics</text>

  <line x1="48" y1="116" x2="348" y2="116" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="58" cy="140" r="4" fill="#34A853"/>
  <text x="72" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Low cost, low power draw</text>
  <circle cx="58" cy="168" r="4" fill="#34A853"/>
  <text x="72" y="173" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Dashboards &amp; automations</text>
  <circle cx="58" cy="196" r="4" fill="#34A853"/>
  <text x="72" y="201" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Zigbee/Z-Wave via USB stick</text>
  <circle cx="58" cy="224" r="4" fill="#EA4335"/>
  <text x="72" y="229" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Not enough for local AI</text>

  <line x1="48" y1="248" x2="348" y2="248" stroke="#F7F2FA" stroke-width="1"/>
  <text x="48" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">Skip if you also want:</text>
  <text x="48" y="290" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">Local LLM, larger Whisper</text>
  <text x="48" y="306" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">models, or Frigate detection</text>

  <!-- Right Panel: Mini PC -->
  <rect x="432" y="55" width="340" height="290" rx="6" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/>
  <rect x="432" y="55" width="340" height="4" rx="0" fill="#34A853"/>
  <text x="602" y="82" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#34A853" text-anchor="middle">Mini PC</text>
  <text x="602" y="102" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#79747E" text-anchor="middle">Best for: basics + local AI</text>

  <line x1="452" y1="116" x2="752" y2="116" stroke="#F7F2FA" stroke-width="1"/>
  <circle cx="462" cy="140" r="4" fill="#34A853"/>
  <text x="476" y="145" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Everything a Pi handles</text>
  <circle cx="462" cy="168" r="4" fill="#34A853"/>
  <text x="476" y="173" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Local LLM via Ollama</text>
  <circle cx="462" cy="196" r="4" fill="#34A853"/>
  <text x="476" y="201" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Larger Whisper voice models</text>
  <circle cx="462" cy="224" r="4" fill="#34A853"/>
  <text x="476" y="229" font-family="system-ui, sans-serif" font-size="12" fill="#1C1B1F">Frigate camera detection</text>

  <line x1="452" y1="248" x2="752" y2="248" stroke="#F7F2FA" stroke-width="1"/>
  <text x="452" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#79747E">Choose this if you plan to:</text>
  <text x="452" y="290" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">Run compute-heavy add-ons</text>
  <text x="452" y="306" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#49454F">on the same box as HAOS</text>

<text x="792" y="395" font-family="system-ui,sans-serif" font-size="9" fill="#BBBBBB" text-anchor="end">promptquorum.com</text></svg>
