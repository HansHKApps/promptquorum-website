<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <metadata>
    <dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Common On-Premises AI Deployment Mistakes</dc:title>
    <dc:creator>PromptQuorum</dc:creator>
    <dc:rights>© PromptQuorum 2026</dc:rights>
    <dc:source>https://www.promptquorum.com/local-llms/private-local-ai-for-business</dc:source>
  </metadata>

  <rect width="800" height="500" fill="#FFFFFF"/>

  <text x="400" y="35" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1C1B1F" text-anchor="middle">Errores comunes al desplegar on-premises</text>

  <!-- Mistake 1: Infrastructure Costs -->
  <rect x="40" y="70" width="340" height="180" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <circle cx="70" cy="95" r="18" fill="#FF9800"/>
  <text x="70" y="104" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">💰</text>
  <text x="115" y="100" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Costes de infraestructura</text>
  <text x="60" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x274c; Solo hardware: $2k&#x2013;8k</text>
  <text x="60" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Ocultos: refrigeraci&#xf3;n, consumo,</text>
  <text x="60" y="157" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">mejoras de red</text>
  <text x="60" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF9800">&#x2713; Presupuesta 3&#x2013;5&#xd7; el coste</text>
  <text x="60" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF9800">del hardware en 5 a&#xf1;os</text>
  <text x="60" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">Total: $10k&#x2013;40k de ciclo de vida</text>

  <!-- Mistake 2: Poor Scaling -->
  <rect x="420" y="70" width="340" height="180" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <circle cx="450" cy="95" r="18" fill="#9C27B0"/>
  <text x="450" y="104" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">📈</text>
  <text x="495" y="100" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Mala planificaci&#xf3;n del escalado</text>
  <text x="440" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x274c; Una sola GPU &#x2192; cuello de botella</text>
  <text x="440" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">No soporta el crecimiento del</text>
  <text x="440" y="157" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">tr&#xe1;fico en producci&#xf3;n</text>
  <text x="440" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9C27B0">&#x2713; Empieza con un setup</text>
  <text x="440" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9C27B0">multi-GPU (2&#x2013;4 GPU)</text>
  <text x="440" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">Planifica un crecimiento de 5&#x2013;10x</text>

  <!-- Mistake 3: Disaster Recovery -->
  <rect x="40" y="280" width="340" height="180" rx="8" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <circle cx="70" cy="305" r="18" fill="#E91E63"/>
  <text x="70" y="314" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">🔥</text>
  <text x="115" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Ignorar la recuperaci&#xf3;n ante desastres</text>
  <text x="60" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x274c; Sin copias ni replicaci&#xf3;n</text>
  <text x="60" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">Fallo de hardware = p&#xe9;rdida de datos,</text>
  <text x="60" y="367" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">cortes de d&#xed;as o semanas</text>
  <text x="60" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E91E63">&#x2713; Implementa replicaci&#xf3;n:</text>
  <text x="60" y="402" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#E91E63">RAID, hardware de respaldo</text>
  <text x="60" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">Los cortes cuestan $1k&#x2013;10k/h</text>

  <!-- Mistake 4: Security -->
  <rect x="420" y="280" width="340" height="180" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <circle cx="450" cy="305" r="18" fill="#1976D2"/>
  <text x="450" y="314" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">🔐</text>
  <text x="495" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1C1B1F">Postura de seguridad deficiente</text>
  <text x="440" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">&#x274c; Sin cifrado, controles de acceso</text>
  <text x="440" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">d&#xe9;biles, acceso sin supervisi&#xf3;n</text>
  <text x="440" y="367" font-family="system-ui, sans-serif" font-size="11" fill="#49454F">a datos sensibles</text>
  <text x="440" y="385" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1976D2">&#x2713; Implementa AES-256, TLS 1.3,</text>
  <text x="440" y="402" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1976D2">MFA y registro de auditor&#xed;a</text>
  <text x="440" y="420" font-family="system-ui, sans-serif" font-size="10" fill="#49454F">Coste de una brecha: $100k&#x2013;1M+</text>

  <text x="792" y="490" font-family="system-ui, sans-serif" font-size="10" fill="#999999" text-anchor="end">promptquorum.com</text>
</svg>
