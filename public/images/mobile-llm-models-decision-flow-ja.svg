<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290">
  <!-- Background -->
  <rect width="800" height="290" fill="#FFFFFF"/>

  <!-- Title -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="400" y="28">モバイルLLM選択 — 4ステップ</text>
  <!-- Subtitle -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#49454F" text-anchor="middle" x="400" y="47">インストール前にスマートフォンのRAMを確認してください</text>

  <!-- Step 1 -->
  <circle cx="100" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="100" y="128">1</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="100" y="163">RAMを確認</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="100" y="180">設定 &gt; 端末情報</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="100" y="193">最低 4 GB</text>

  <!-- Arrow 1 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="200" y="128">→</text>

  <!-- Step 2 -->
  <circle cx="300" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="300" y="128">2</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="300" y="163">クラス選択</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="300" y="180">4GB → Gemma 3 1B</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="300" y="193">8GB+ → Phi-4 Mini</text>

  <!-- Arrow 2 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="400" y="128">→</text>

  <!-- Step 3 -->
  <circle cx="500" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="500" y="128">3</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="500" y="163">用途選択</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="500" y="180">速度 → SmolLM 2</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="500" y="193">多言語 → Qwen 2.5</text>

  <!-- Arrow 3 -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="#6750A4" text-anchor="middle" x="600" y="128">→</text>

  <!-- Step 4 -->
  <circle cx="700" cy="120" r="22" fill="#6750A4"/>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" x="700" y="128">4</text>
  <text font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#1C1B1F" text-anchor="middle" x="700" y="163">インストール</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="700" y="180">Q4_K_M GGUF</text>
  <text font-family="'SF Mono',Monaco,monospace" font-size="10" fill="#49454F" text-anchor="middle" x="700" y="193">PocketPal AI · LM Studio</text>

  <!-- Divider -->
  <line x1="18" y1="245" x2="782" y2="245" stroke="#E8DEF8" stroke-width="1.5"/>

  <!-- Footer -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#49454F" text-anchor="middle" x="400" y="265">6モデルすべてQ4_K_M GGUFで入手可能 · ほとんどのハイエンド端末にはPhi-4 Mini · promptquorum.com</text>
  <!-- Attribution -->
  <text font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#79747E" text-anchor="middle" x="400" y="281">promptquorum.com</text>
</svg>
