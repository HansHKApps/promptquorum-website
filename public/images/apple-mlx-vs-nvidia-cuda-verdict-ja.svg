  <!-- Row 1: 速度 7-14B → NVIDIA -->
  <text x="154" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">—</text>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">速度（7–14Bモデル）</text>
  <text x="646" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A6B33">✓ 約2倍速いtok/s</text>
  <!-- Row 2: 速度 70B+ → Apple -->
  <text x="154" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6750A4">✓ 唯一の実行可能方法</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">速度（70B+モデル）</text>
  <text x="646" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">24GBでは70Bを収容不可</text>
  <!-- Row 3: 初期費用 → NVIDIA -->
  <text x="154" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">159,800円から</text>
  <text x="400" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">初期費用</text>
  <text x="646" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A6B33">✓ GPU+PC 約8万円</text>
  <!-- Row 4: 70Bコスト → Apple -->
  <text x="154" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6750A4">✓ 約599,800円</text>
  <text x="400" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">70B対応コスト</text>
  <text x="646" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">約75万円 マルチGPU</text>
  <!-- Row 5: 消費電力 → Apple -->
  <text x="154" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6750A4">✓ システム30–60W</text>
  <text x="400" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">消費電力</text>
  <text x="646" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">負荷時300–600W</text>
  <!-- Row 6: 騒音 → Apple -->
  <text x="154" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6750A4">✓ ほぼ無音</text>
  <text x="400" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">騒音レベル</text>
  <text x="646" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">GPUファンが聞こえる</text>
  <!-- Row 7: 携帯性 → Apple -->
  <text x="154" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6750A4">✓ ノート型あり</text>
  <text x="400" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">携帯性</text>
  <text x="646" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">デスクトップのみ</text>
  <!-- Row 8: ソフトウェア環境 → NVIDIA -->
  <text x="154" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">MLX（成長中）</text>
  <text x="400" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">ソフトウェア環境</text>
  <text x="646" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A6B33">✓ CUDA — 業界標準</text>
  <!-- Row 9: 学習・ファインチューニング → NVIDIA -->
  <text x="154" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">ファインチューニング限定</text>
  <text x="400" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">学習・ファインチューニング</text>
  <text x="646" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A6B33">✓ 完全サポート</text>
  <!-- Row 10: クロスプラットフォーム → NVIDIA -->
  <text x="154" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">macOSのみ</text>
  <text x="400" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">クロスプラットフォーム</text>
  <text x="646" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A6B33">✓ Linux + Windows</text>
  <!-- Row 11: 将来性 → 引き分け -->
  <text x="154" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#666">エコシステム成長中</text>
  <text x="400" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1C1B1F">将来性・引き分け</text>
  <text x="646" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#666">大規模インストールベース</text>
