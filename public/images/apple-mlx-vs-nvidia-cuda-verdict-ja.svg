  <rect x="120" y="272" width="200" height="36" fill="#6750A4" rx="4"/>
  <text x="220" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="white">Apple勝利</text>
