  <text x="580" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="white">NVIDIA勝利</text>
  <text x="580" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="white">5</text>
