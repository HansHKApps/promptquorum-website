    function renderSlide(slide, lang) {
      var articleUrl = BASE_URL + '?lang=' + lang;
      var footerLink = '<p style="position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #999;"><a href="' + articleUrl + '" target="_blank" rel="noopener" style="color: #999; text-decoration: none; border-bottom: 1px solid #ddd;">← Article</a></p>';
      var html = '';

      if (slide.type === 'title') {
        html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />' +
          '<h1>' + slide.h1 + '</h1>' +
          '<p>' + slide.subtitle + '</p>' +
          '<p style="margin-top: 32px; font-size: 16px; color: #79747e;"><a href="' + slide.link + '" target="_blank" rel="noopener">promptquorum.com/power-local-llm</a></p>';
      } else if (slide.type === 'list') {
        html = '<h2>' + slide.h2 + '</h2>';
        if (slide.intro) { html += '<p style="margin-bottom: 8px; font-size: clamp(12px,1.3vw,15px);">' + slide.intro + '</p>'; }
        html += '<ul style="font-size: clamp(12px,1.3vw,15px); margin-top: 8px;">';
        for (var i = 0; i < slide.items.length; i++) { html += '<li>' + slide.items[i] + '</li>'; }
        html += '</ul>' + footerLink;
      } else if (slide.type === 'table') {
        html = '<h2>' + slide.h2 + '</h2><table><tr>';
        for (var c = 0; c < slide.columns.length; c++) { html += '<th>' + slide.columns[c] + '</th>'; }
        html += '</tr>';
        for (var r = 0; r < slide.rows.length; r++) {
          html += '<tr>';
          for (var c2 = 0; c2 < slide.columns.length; c2++) { html += '<td>' + slide.rows[r][slide.columns[c2]] + '</td>'; }
          html += '</tr>';
        }
        html += '</table>' + footerLink;
      } else if (slide.type === 'numbered') {
        html = '<h2>' + slide.h2 + '</h2><ol style="font-size: clamp(12px,1.3vw,15px); margin-top: 8px; text-align: left; max-width: 700px;">';
        for (var n = 0; n < slide.items.length; n++) { html += '<li style="margin-bottom: 9px;">' + slide.items[n] + '</li>'; }
        html += '</ol>' + footerLink;
      } else if (slide.type === 'faq') {
        html = '<h2>' + slide.h2 + '</h2>';
        for (var f = 0; f < slide.faqs.length; f++) {
          html += '<div style="margin-bottom: 14px; text-align: left; max-width: 700px;"><strong style="font-size: clamp(12px,1.3vw,14px);">Q: ' + slide.faqs[f].q + '</strong><p style="margin-top: 6px; font-size: clamp(11px,1.2vw,13px); color: #49454f;">A: ' + slide.faqs[f].a + '</p></div>';
        }
        html += footerLink;
      } else if (slide.type === 'cta') {
        html = '<h2>' + slide.h2 + '</h2>' +
          '<p style="max-width: 600px; font-size: clamp(13px,1.4vw,16px);">' + slide.body + '</p>' +
          '<a href="' + slide.href + '" target="_blank" rel="noopener" style="display: inline-block; margin-top: 24px; padding: 14px 28px; background: #6750a4; color: white; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 16px;">' + slide.cta + '</a>';
      }

      return '<div class="slide ' + slide.type + '">' + html + '</div>';
    }

    var params = new URLSearchParams(window.location.search);
    var lang = params.get('lang') || 'en';
    var content = CONTENT[lang] || CONTENT.en;

    document.getElementById('header-title').textContent = content.title;
    var backLink = document.getElementById('back-link');
    backLink.href = BASE_URL + '?lang=' + lang;

    var container = document.getElementById('slides-container');
    for (var s = 0; s < content.slides.length; s++) {
      container.innerHTML += renderSlide(content.slides[s], lang);
    }

    var currentSlide = 0;
    var slides = document.querySelectorAll('.slide');
    var totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) { currentSlide = totalSlides - 1; }
      else if (n < 0) { currentSlide = 0; }
      for (var i = 0; i < slides.length; i++) { slides[i].classList.remove('active'); }
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') { changeSlide(-1); }
      if (e.key === 'ArrowRight') { changeSlide(1); }
    });

    window.addEventListener('beforeprint', function() {
      for (var i = 0; i < slides.length; i++) { slides[i].style.display = 'flex'; }
    });
    window.addEventListener('afterprint', function() {
      for (var i = 0; i < slides.length; i++) { slides[i].style.removeProperty('display'); }
      showSlide(currentSlide);
    });

    showSlide(0);
  </script>
