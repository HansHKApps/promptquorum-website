              { q: '运行无审查本地LLM合法吗？', a: '在大多数司法管辖区，运行是合法的——没有法律禁止持有开源AI软件。您用它生成和分发的内容与任何其他著作内容遵守相同法律：猥亵法、NCII法、诽谤法、未成年人内容法。运行合法≠无限制地发布合法。' },
              { q: 'Hermes 3和Dolphin 3.0有何区别？', a: 'Hermes 3是选择性无审查，指令遵循性极佳，接近基础Llama 3.3 70B模型。Dolphin 3.0在更广泛内容范围上无审查，但复杂多约束场景中指令遵循性略弱。散文质量重要时选Hermes 3；在16至24 GB系统上需要最广内容范围时选Dolphin 3.0。' },
              { q: '写黑暗小说需要无审查模型吗？', a: '大多数黑暗小说不需要。标准模型在正确提示下可生成暴力、道德复杂性、黑暗心理而不拒绝。它们可靠拒绝的是明确的性内容。先尝试标准模型——您可能不需要无审查版本。' },
            ],
          },
          {
            type: 'faq',
            h2: '常见问题（2/2）',
            faqs: [
              { q: '可以在SillyTavern或Agnai中使用无审查模型吗？', a: '可以。两者均连接到任何OpenAI兼容端点——包括本地11434端口运行的Ollama。拉取模型，启动ollama serve，在SillyTavern/Agnai选择OpenAI兼容API，指向http://localhost:11434/v1。不需要额外配置。' },
              { q: '在家庭网络上使用无审查模型安全吗？', a: '绑定到localhost时（Ollama和LM Studio的默认设置）是安全的。API只能从您的机器访问。不要在没有身份验证的情况下将Ollama API暴露到公共互联网。' },
              { q: '我本地生成的内容会怎么处理？', a: '不会自动发生任何事。内容不会发送到任何服务器，不会被云服务记录，也不会用于模型训练。它只存在于您的设备上。您控制保留什么、删除什么和分享什么。' },
            ],
          },
          {
            type: 'cta',
            h2: '试用PromptQuorum',
            body: '并排比较无审查和标准本地模型，跨模型测试提示词，构建一致的小说创作工作流。',
            cta: '免费试用PromptQuorum',
            href: 'https://www.promptquorum.com',
          },
        ],
      },
    };

    function renderSlide(slide, lang) {
      let html = '';
      const slug = 'uncensored-local-llm-creative-writing-ethics';
      const articleUrl = 'https://www.promptquorum.com/power-local-llm/' + slug + '?lang=' + lang;
      const footerHtml = '<p class="slide-footer"><a href="' + articleUrl + '" target="_blank" rel="noopener">← Article</a></p>';

      switch (slide.type) {
        case 'title':
          html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />'
            + '<h1>' + slide.h1 + '</h1>'
            + '<p>' + slide.subtitle + '</p>'
            + '<p style="margin-top: 32px; font-size: 15px; color: #79747e;"><a href="' + slide.link + '?lang=' + lang + '" target="_blank" rel="noopener" style="color:#6750a4; text-decoration:none; border-bottom:1px solid #c5b8f0;">' + slide.link.replace('https://www.promptquorum.com/', '') + '</a></p>';
          break;

        case 'list':
          html = '<h2>' + slide.h2 + '</h2>';
          if (slide.intro) html += '<p style="margin-bottom:10px;">' + slide.intro + '</p>';
          html += '<ul style="font-size: 1em; margin-top: 14px;">';
          slide.items.forEach(function(item) { html += '<li>' + item + '</li>'; });
          html += '</ul>' + footerHtml;
          break;

        case 'table':
          html = '<h2>' + slide.h2 + '</h2><table><tr>';
          slide.columns.forEach(function(col) { html += '<th>' + col + '</th>'; });
          html += '</tr>';
          slide.rows.forEach(function(row) {
            html += '<tr>';
            slide.columns.forEach(function(col) { html += '<td>' + row[col] + '</td>'; });
            html += '</tr>';
          });
          html += '</table>' + footerHtml;
          break;

        case 'comparison':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="margin-top: 36px; font-size: clamp(15px, 1.8vw, 20px); color: #b3261e;"><strong>' + slide.line1 + '</strong></p>'
            + '<p style="font-size: clamp(15px, 1.8vw, 20px); margin-top: 18px; color: #386a20;"><strong>' + slide.line2 + '</strong></p>'
            + '<p style="margin-top: 36px; font-size: clamp(14px, 1.5vw, 18px); color: #6750a4; font-style: italic;">' + slide.tip + '</p>'
            + footerHtml;
          break;

        case 'numbered':
          html = '<h2>' + slide.h2 + '</h2><ol style="font-size: 1em; margin-top: 14px;">';
          slide.items.forEach(function(item) { html += '<li>' + item + '</li>'; });
          html += '</ol>' + footerHtml;
          break;

        case 'faq':
          html = '<h2>' + slide.h2 + '</h2>';
          slide.faqs.forEach(function(faq) {
            html += '<div style="margin-bottom: 16px; text-align: left; max-width: 680px;"><strong style="font-size: clamp(13px, 1.4vw, 16px);">Q: ' + faq.q + '</strong><p style="margin-top: 5px; font-size: clamp(12px, 1.2vw, 14px); color: #49454f;">A: ' + faq.a + '</p></div>';
          });
          html += footerHtml;
          break;

        case 'cta':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="margin-top: 24px; max-width: 560px;">' + slide.body + '</p>'
            + '<a href="' + slide.href + '" target="_blank" rel="noopener" style="display:inline-block; margin-top:28px; padding:14px 28px; background:#6750a4; color:white; border-radius:8px; text-decoration:none; font-weight:700; font-size:clamp(14px,1.5vw,18px);">' + slide.cta + '</a>'
            + '<p style="margin-top: 20px; font-size: 13px; color: #79747e;">promptquorum.com</p>';
          break;
      }

      return '<div class="slide ' + slide.type + '">' + html + '</div>';
    }

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const content = CONTENT[lang] || CONTENT.en;

    document.getElementById('header-title').textContent = content.title;
    const backLink = document.getElementById('back-link');
    backLink.href = backLink.href + '?lang=' + lang;

    const container = document.getElementById('slides-container');
    content.slides.forEach(function(slide) {
      container.innerHTML += renderSlide(slide, lang);
    });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      slides.forEach(function(s) { s.classList.remove('active'); });
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', function() {
      slides.forEach(function(s) { s.style.display = 'flex'; });
    });
    window.addEventListener('afterprint', function() {
      slides.forEach(function(s) { s.style.removeProperty('display'); });
      showSlide(currentSlide);
    });

    showSlide(0);
  </script>
</body>
</html>
