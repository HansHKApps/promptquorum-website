    function renderSlide(slide, idx) {
      const head = (h2) => `<div class="slide-head"><span class="chip">${String(idx).padStart(2, '0')}</span><h2>${h2}</h2></div>`;
      let html = '';
      switch (slide.type) {
        case 'title':
          html = `<img src="/logo.svg" alt="PromptQuorum" class="logo" /><h1>${slide.h1}</h1><p>${slide.subtitle}</p><p class="link"><a href="${slide.link}">${slide.link.replace('https://www.', '')}</a></p>`;
          break;
        case 'list':
          html = head(slide.h2);
          if (slide.intro) html += `<p style="margin-bottom: 14px;">${slide.intro}</p>`;
          html += `<div class="cards${slide.items.length === 3 ? ' c3' : ''}">`;
          slide.items.forEach(item => { html += `<div class="card">${item}</div>`; });
          html += '</div>';
          break;
        case 'table':
          html = `${head(slide.h2)}<div class="table-wrap"><table><thead><tr>`;
          slide.columns.forEach(col => { html += `<th>${col}</th>`; });
          html += '</tr></thead><tbody>';
          slide.rows.forEach(row => {
            html += '<tr>';
            slide.columns.forEach(col => { html += `<td>${row[col]}</td>`; });
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          break;
        case 'numbered':
          html = `${head(slide.h2)}<div class="rows">`;
          slide.items.forEach((item, i) => { html += `<div class="row"><span class="num">${i + 1}</span><div class="card">${item}</div></div>`; });
          html += '</div>';
          break;
        case 'faq':
          html = `${head(slide.h2)}<div class="cards faq">`;
          slide.faqs.forEach(faq => {
            html += `<div class="card"><div class="faq-q">${faq.q}</div><div class="faq-a">${faq.a}</div></div>`;
          });
          html += '</div>';
          break;
        case 'comparison':
          html = `${head(slide.h2)}<div class="cards"><div class="card">${slide.line1}</div><div class="card">${slide.line2}</div></div><p style="margin-top: 16px; font-style: italic; color: var(--tink);">${slide.tip}</p>`;
          break;
        case 'cta':
          html = `<h2>${slide.h2}</h2><p>${slide.body}</p><a class="btn" href="${slide.href}">${slide.cta}</a>`;
          break;
      }
      return `<div class="slide ${slide.type} t${idx % 5}" data-lang="${lang}">${html}</div>`;
    }

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const isPrint = params.get('print') === '1';
    const content = CONTENT[lang] || CONTENT.en;

    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('header-title').textContent = content.title;
    document.getElementById('back-link').href = BACK_LINKS[lang] || BACK_LINKS.en;

    const container = document.getElementById('slides-container');
    content.slides.forEach((slide, i) => { container.innerHTML += renderSlide(slide, i); });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      else currentSlide = n;
      slides.forEach(slide => slide.classList.remove('active'));
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', () => {
      slides.forEach(slide => { slide.style.display = 'flex'; });
    });
    window.addEventListener('afterprint', () => {
      slides.forEach(slide => { slide.style.removeProperty('display'); });
      showSlide(currentSlide);
    });

    if (isPrint) {
      window.addEventListener('load', () => { window.print(); });
    }

    showSlide(0);
    </script>
