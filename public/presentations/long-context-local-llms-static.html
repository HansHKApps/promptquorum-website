                "<strong>48 GB ou mais:</strong> Gemma 4 31B (19 GB) exige cerca de 21 GiB a 256K. Mistral Small 3.2 24B (15 GB) exige 20 GiB a 128K com cache f16 e cerca de 10 GiB com q8_0."
            ]
        },
        {
            "type": "list",
            "h2": "Por que o contexto utilizável é menor que o máximo anunciado?",
            "items": [
                "<strong>A janela anunciada é um limite superior de arquitetura, não uma garantia de qualidade.</strong> Liu et al. (2023) constataram que modelos de linguagem respondem com mais precisão quando o texto relevante está no início ou no fim da entrada e com menos precisão quando está no meio: o efeito «lost in the middle».",
                "O RULER (Hsieh et al., 2024) testou 17 modelos que anunciam 32K tokens ou mais; só cerca de metade manteve desempenho satisfatório a 32K. O NoLiMa (Modarressi et al., 2025) testou 13 modelos que anunciam pelo menos 128K; a 32K, 11 deles caíram abaixo de 50 % da pontuação em contexto curto, e o GPT-4o caiu de 99.3 % para 69.7 %.",
                "Esses estudos são anteriores à maioria dos modelos deste guia, então leia-os como evidência do padrão, não como pontuação de algum modelo citado aqui. Para verificar um modelo você mesmo, esconda um fato a 10 %, 50 % e 90 % de um prompt longo, pergunte com outras palavras e repita a 32K, 64K e 128K."
            ]
        },
        {
            "type": "numbered",
            "h2": "Como ajustar o tamanho do contexto no Ollama",
            "items": [
                "<strong>Verificar o contexto ativo:</strong> Carregue um modelo e execute: ollama ps -- a coluna CONTEXT mostra o tamanho de contexto em uso",
                "<strong>Definir um padrão para todo o servidor:</strong> OLLAMA_CONTEXT_LENGTH=65536 ollama serve (ou use o controle deslizante de contexto do app do Ollama)",
                "<strong>Alterar para uma sessão:</strong> Dentro do ollama run, digite: /set parameter num_ctx 65536",
                "<strong>Criar um modelo personalizado com contexto fixo:</strong> Escreva um Modelfile com FROM qwen3.5:9b e PARAMETER num_ctx 131072 e execute: ollama create qwen3.5-9b-128k -f Modelfile",
                "<strong>Opcionalmente reduzir o cache KV:</strong> OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve -- q8_0 usa cerca de metade da memória do f16",
                "<strong>Verificar com ollama ps:</strong> Execute ollama ps de novo e confirme a coluna CONTEXT e a divisão de memória entre GPU e CPU"
            ]
        },
        {
            "type": "numbered",
            "h2": "Erros comuns com LLMs locais de contexto longo",
            "items": [
                "<strong>Confiar no contexto padrão:</strong> o Ollama usa 4K tokens por padrão abaixo de 24 GiB de VRAM, seja qual for o suporte do modelo, então um documento de 100 páginas é truncado antes de o modelo lê-lo. Defina o contexto explicitamente e confirme na coluna CONTEXT de <code>ollama ps</code>.",
                "<strong>Planejar a memória pelo tamanho do download:</strong> o cache KV pode superar os pesos. O Llama 3.1 8B é um download de 4.9 GB, mas exige cerca de 16 GiB de cache KV a 128K. Use a fórmula ou a tabela acima antes de aumentar o contexto.",
                "<strong>Presumir que toda tag tem a janela longa:</strong> na biblioteca do Ollama, <code>qwen3:14b</code> lista 40K enquanto <code>qwen3:30b</code> lista 256K. Leia o valor de contexto na página do modelo antes de planejar.",
                "<strong>Tratar a janela anunciada como a utilizável:</strong> RULER e NoLiMa encontraram quedas fortes de precisão a 32K em muitos modelos que anunciam 128K ou mais. Teste com seus próprios documentos no tamanho que pretende usar."
            ]
        },
        {
            "type": "faq",
            "h2": "Perguntas frequentes",
            "faqs": [
                {
                    "q": "Uma janela de contexto de 128K ainda é suficiente?",
                    "a": "128K tokens são cerca de 100.000 palavras, suficientes para a maioria dos documentos isolados. Um livro de 300 páginas costuma ter de 75.000 a 100.000 palavras, algo como 100K a 135K tokens, então normalmente excede uma janela de 128K ou mal cabe, sem espaço para perguntas e respostas. Uma janela de 256K comporta o livro e a resposta; além disso, use RAG ou divisão em partes."
                },
                {
                    "q": "Por que meu modelo local esquece o início do meu documento?",
                    "a": "Provavelmente o contexto ativo é menor que o seu documento. O Ollama usa por padrão 4K tokens em GPUs com menos de 24 GiB de VRAM, 32K de 24 a 48 GiB e 256K a partir de 48 GiB, seja qual for o suporte do modelo, e a entrada além do contexto é truncada. Confira a coluna CONTEXT do ollama ps e aumente com OLLAMA_CONTEXT_LENGTH, /set parameter num_ctx, um Modelfile ou a opção num_ctx da API."
                },
                {
                    "q": "Contexto longo ou RAG é melhor para perguntas e respostas sobre documentos?",
                    "a": "O RAG costuma custar menos memória e tempo quando a resposta está em poucos trechos de uma coleção grande, porque mantém o prompt em poucos milhares de tokens. O contexto longo é melhor quando o modelo precisa raciocinar sobre um documento coerente, como um contrato, uma base de código ou um capítulo de livro, em que a divisão em partes separaria referências cruzadas. Muitas configurações combinam os dois, recuperando seções inteiras em uma janela de 32K a 128K."
                }
            ]
        },
        {
            "type": "cta",
            "h2": "Experimente o PromptQuorum grátis",
            "body": "Compare lado a lado as saídas de LLMs locais e de APIs na nuvem. Teste tarefas de contexto longo com Llama, Qwen e Mistral, tudo em uma só ferramenta.",
            "cta": "Comece grátis",
            "href": "https://www.promptquorum.com/pt"
        }
    ]
},
            de: {
    "title": "Lokale LLMs mit langem Kontext 2026",
    "slides": [
        {
            "type": "title",
            "h1": "Lokale LLMs mit langem Kontext 2026",
            "subtitle": "Welche Modelle gehen über 128K hinaus?",
            "link": "https://www.promptquorum.com/de/local-llms/long-context-local-llms"
        },
        {
            "type": "list",
            "h2": "Zusammenfassung",
            "items": [
                "<strong>256K ist Standard, 1M ist möglich.</strong> Qwen3.5, Qwen3.8 und Gemma 4 (12B, 26B, 31B) nennen in der Ollama-Bibliothek 256K-Fenster. Nemotron 3 Nano 30B unterstützt 1M. Gemma 4 E2B/E4B, Mistral Small 3.2, gpt-oss 20B und Llama 3.1 8B bleiben bei 128K.",
                "<strong>Der KV-Cache bestimmt den Speicherbedarf, und er hängt von der Architektur ab.</strong> Bei 128K belegt der f16-Cache 16 GiB bei Llama 3.1 8B, 8 GiB bei Qwen3.8 27B, etwa 2,7 GiB bei Gemma 4 26B-A4B und etwa 0,75 GiB bei Nemotron 3 Nano.",
                "<strong>Hybride Architekturen machen lange Fenster günstig.</strong> Sliding-Window-Attention (Gemma 4, gpt-oss), Gated DeltaNet (Qwen3.5, Qwen3.8) und Mamba-2 (Nemotron 3 Nano) ersetzen viele Full-Attention-Schichten, und nur Full-Attention-Schichten wachsen mit dem Fenster.",
                "<strong>Ollama verwendet unter 24 GiB VRAM standardmäßig 4K Token</strong>, von 24 bis 48 GiB 32K und ab 48 GiB 256K. Setzen Sie den Kontext ausdrücklich und prüfen Sie ihn mit ollama ps.",
                "<strong>Der nutzbare Kontext ist kürzer als angegeben.</strong> RULER und NoLiMa fanden bei 32K deutliche Genauigkeitsverluste bei vielen Modellen, die 128K oder mehr angeben. Platzieren Sie kritische Fakten am Anfang oder Ende und testen Sie in Ihrer Zielgröße.",
                "<strong>Nach Aufgabe entscheiden.</strong> RAG eignet sich für die Suche über viele Dokumente. Langer Kontext eignet sich für Schlussfolgerungen über ein zusammenhängendes Dokument, etwa einen Vertrag, eine Codebasis oder ein Buch."
            ]
        },
        {
            "type": "list",
            "h2": "Was ist die Kontextlänge und warum ist sie für lokale LLMs wichtig?",
            "items": [
                "<strong>Die Kontextlänge ist die maximale Zahl an Token, die ein Modell in einer Anfrage verarbeiten kann: Ihr Prompt, alle Dokumente, der bisherige Gesprächsverlauf und die Antwort des Modells zusammengerechnet.</strong> Ein Token entspricht etwa 0,75 englischen Wörtern, 128K Token sind also etwa 100.000 Wörter und 256K Token etwa 200.000 Wörter.",
                "Das angegebene Fenster ist das Maximum, das die Modellarchitektur unterstützt. Das nutzbare Fenster ist die Länge, bei der die Antworten für Ihre Aufgabe genau bleiben, und es ist kürzer.",
                "Lange Fenster sind wichtig für ganze Codebasen, Verträge, lange Transkripte, Buchkapitel und Agenten-Sitzungen, in denen sich Tool-Ausgaben ansammeln. Die Ollama-Dokumentation empfiehlt mindestens 64.000 Token für Agenten, Websuche und Coding-Tools."
            ]
        },
        {
            "type": "table",
            "h2": "Welche lokalen LLMs unterstützen 2026 mehr als 128K Token?",
            "columns": [
                "Modell",
                "Angegebenes Fenster",
                "Längerer Kontext",
                "Ollama-Tag"
            ],
            "rows": [
                {
                    "Modell": "Nemotron 3 Nano 30B-A3B",
                    "Angegebenes Fenster": "1M (Standard 256K)",
                    "Längerer Kontext": "—",
                    "Ollama-Tag": "ollama run nemotron-3-nano:30b"
                },
                {
                    "Modell": "Qwen3.8 27B",
                    "Angegebenes Fenster": "256K",
                    "Längerer Kontext": "Bis 1M (YaRN)",
                    "Ollama-Tag": "ollama run qwen3.8:27b"
                },
                {
                    "Modell": "Qwen3.5 9B / 27B",
                    "Angegebenes Fenster": "256K",
                    "Längerer Kontext": "Bis 1,01M (YaRN)",
                    "Ollama-Tag": "ollama run qwen3.5:9b"
                },
                {
                    "Modell": "Gemma 4 12B / 26B / 31B",
                    "Angegebenes Fenster": "256K",
                    "Längerer Kontext": "—",
                    "Ollama-Tag": "ollama run gemma4:26b"
                },
                {
                    "Modell": "Gemma 4 E2B / E4B",
                    "Angegebenes Fenster": "128K",
                    "Längerer Kontext": "—",
                    "Ollama-Tag": "ollama run gemma4:e4b"
                },
                {
                    "Modell": "Llama 4 Scout 109B",
                    "Angegebenes Fenster": "10M angegeben",
                    "Längerer Kontext": "Benchmarks bei 128K",
                    "Ollama-Tag": "ollama run llama4:16x17b"
                },
                {
                    "Modell": "Mistral Small 3.2 24B",
                    "Angegebenes Fenster": "128K",
                    "Längerer Kontext": "—",
                    "Ollama-Tag": "ollama run mistral-small3.2"
                },
                {
                    "Modell": "Llama 3.1 8B",
                    "Angegebenes Fenster": "128K",
                    "Längerer Kontext": "—",
                    "Ollama-Tag": "ollama run llama3.1:8b"
                }
            ]
        },
        {
            "type": "list",
            "h2": "Wie viel Speicher braucht langer Kontext?",
            "items": [
                "<strong>Der Speicher für langen Kontext besteht aus den Modellgewichten plus dem KV-Cache, und der KV-Cache hängt von der Architektur ab, nicht nur vom Fenster.</strong> Der KV-Cache speichert die Attention-Keys und -Values jedes Tokens im Kontext und wird zusätzlich zu den Gewichten belegt.",
                "KV-Bytes pro Token = 2 (Keys und Values) × Full-Attention-Schichten × KV-Heads × Head-Dimension × Bytes pro Wert (2 beim Standard-f16-Cache). Llama 3.1 8B: 2 × 32 × 8 × 128 × 2 = 131.072 Bytes (128 KiB) pro Token, das sind 16 GiB bei 128K Token und mehr als das Dreifache seines 4,9-GB-Downloads.",
                "Neuere Architekturen senken diese Kosten. Gemma 4 nutzt in den meisten Schichten Sliding-Window-Attention (ein 1.024-Token-Fenster bei 12B, 26B und 31B), gpt-oss in jeder zweiten Schicht (128 Token), Qwen3.5 und Qwen3.8 nutzen in drei von vier Schichten lineare Gated-DeltaNet-Attention, und Nemotron 3 Nano hat nur 6 Attention-Schichten von 52. Nur Full-Attention-Schichten wachsen mit dem Fenster.",
                "Eine Quantisierung des KV-Cache verkleinert ihn: Laut Ollama-Dokumentation braucht q8_0 etwa halb so viel Speicher wie f16 und q4_0 etwa ein Viertel, bei q4_0 mit geringem bis mittlerem Genauigkeitsverlust."
            ]
        },
        {
            "type": "table",
            "h2": "Wie viel Speicher braucht langer Kontext?",
            "columns": [
                "Modell",
                "Download",
                "KV bei 32K",
                "KV bei 128K",
                "KV bei Maximalfenster"
            ],
            "rows": [
                {
                    "Modell": "Llama 3.1 8B",
                    "Download": "4,9 GB",
                    "KV bei 32K": "4 GiB",
                    "KV bei 128K": "16 GiB",
                    "KV bei Maximalfenster": "16 GiB (128K)"
                },
                {
                    "Modell": "Mistral Small 3.2 24B",
                    "Download": "15 GB",
                    "KV bei 32K": "5 GiB",
                    "KV bei 128K": "20 GiB",
                    "KV bei Maximalfenster": "20 GiB (128K)"
                },
                {
                    "Modell": "Qwen3.5 9B",
                    "Download": "6,6 GB",
                    "KV bei 32K": "1 GiB",
                    "KV bei 128K": "4 GiB",
                    "KV bei Maximalfenster": "8 GiB (256K)"
                },
                {
                    "Modell": "Gemma 4 12B",
                    "Download": "7,7 GB",
                    "KV bei 32K": "0,8 GiB",
                    "KV bei 128K": "2,3 GiB",
                    "KV bei Maximalfenster": "4,3 GiB (256K)"
                },
                {
                    "Modell": "Gemma 4 31B",
                    "Download": "19 GB",
                    "KV bei 32K": "3,3 GiB",
                    "KV bei 128K": "10,8 GiB",
                    "KV bei Maximalfenster": "20,8 GiB (256K)"
                },
                {
                    "Modell": "Qwen3.8 27B",
                    "Download": "18 GB",
                    "KV bei 32K": "2 GiB",
                    "KV bei 128K": "8 GiB",
                    "KV bei Maximalfenster": "16 GiB (256K)"
                },
                {
                    "Modell": "Qwen3 30B-A3B-2507",
                    "Download": "19 GB",
                    "KV bei 32K": "3 GiB",
                    "KV bei 128K": "12 GiB",
                    "KV bei Maximalfenster": "24 GiB (256K)"
                },
                {
                    "Modell": "Nemotron 3 Nano 30B-A3B",
                    "Download": "18 GB",
                    "KV bei 32K": "0,2 GiB",
                    "KV bei 128K": "0,8 GiB",
                    "KV bei Maximalfenster": "6 GiB (1M)"
                }
            ]
        },
        {
            "type": "list",
            "h2": "Welches Long-Context-Modell passt zu Ihrem Rechner?",
            "items": [
                "<strong>8 GB:</strong> Qwen3.5 4B (3,3 GB Download). Der KV-Cache beträgt 1 GiB bei 32K und 2 GiB bei 64K; 128K brauchen 4 GiB, was auf 8 GB knapp wird.",
                "<strong>16 GB:</strong> Qwen3.5 9B (6,6 GB) passt mit etwa 4 GiB KV-Cache in 128K. Gemma 4 12B (7,7 GB) passt mit etwa 4,3 GiB in sein volles 256K-Fenster.",
                "<strong>24 bis 32 GB:</strong> Gemma 4 26B-A4B (16 GB) braucht bei 256K etwa 5,2 GiB. Qwen3.8 27B (18 GB) braucht bei 128K etwa 8 GiB. gpt-oss 20B (14 GB) braucht bei seinem 128K-Maximum etwa 3 GiB.",
                "<strong>48 GB und mehr:</strong> Gemma 4 31B (19 GB) braucht bei 256K etwa 21 GiB. Mistral Small 3.2 24B (15 GB) braucht bei 128K 20 GiB mit f16-Cache und etwa 10 GiB mit q8_0."
            ]
        },
        {
            "type": "list",
            "h2": "Warum ist der nutzbare Kontext kürzer als das angegebene Maximum?",
            "items": [
                "<strong>Das angegebene Fenster ist eine architektonische Obergrenze, keine Qualitätsgarantie.</strong> Liu et al. (2023) stellten fest, dass Sprachmodelle am genauesten antworten, wenn der relevante Text am Anfang oder Ende der Eingabe steht, und weniger genau, wenn er in der Mitte steht: der „Lost in the Middle“-Effekt.",
                "RULER (Hsieh et al., 2024) testete 17 Modelle, die alle 32K Token oder mehr angeben; nur etwa die Hälfte behielt bei 32K eine zufriedenstellende Leistung. NoLiMa (Modarressi et al., 2025) testete 13 Modelle mit mindestens 128K; bei 32K fielen 11 davon unter 50 % ihres Kurzkontext-Werts, und GPT-4o sank von 99,3 % auf 69,7 %.",
                "Diese Studien sind älter als die meisten Modelle in diesem Leitfaden. Verstehen Sie sie als Beleg für das Muster, nicht als Messwerte für ein hier genanntes Modell. Um ein Modell selbst zu prüfen, verstecken Sie einen Fakt bei 10 %, 50 % und 90 % eines langen Prompts, fragen Sie mit anderen Worten danach und wiederholen Sie das bei 32K, 64K und 128K."
            ]
        },
        {
            "type": "numbered",
            "h2": "So stellen Sie die Kontextlänge in Ollama ein",
            "items": [
                "<strong>Aktiven Kontext prüfen:</strong> Laden Sie ein Modell und führen Sie aus: ollama ps -- die Spalte CONTEXT zeigt die verwendete Kontextlänge",
                "<strong>Standardwert für den ganzen Server setzen:</strong> OLLAMA_CONTEXT_LENGTH=65536 ollama serve (oder den Kontext-Schieberegler in der Ollama-App verwenden)",
                "<strong>Für eine Sitzung ändern:</strong> Geben Sie in ollama run ein: /set parameter num_ctx 65536",
                "<strong>Eigenes Modell mit festem Kontext erstellen:</strong> Schreiben Sie ein Modelfile mit FROM qwen3.5:9b und PARAMETER num_ctx 131072 und führen Sie aus: ollama create qwen3.5-9b-128k -f Modelfile",
                "<strong>Optional den KV-Cache verkleinern:</strong> OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 ollama serve -- q8_0 braucht etwa halb so viel Speicher wie f16",
                "<strong>Mit ollama ps überprüfen:</strong> Führen Sie ollama ps erneut aus und prüfen Sie die Spalte CONTEXT sowie die Aufteilung zwischen GPU und CPU"
            ]
        },
        {
            "type": "numbered",
            "h2": "Häufige Fehler bei lokalen LLMs mit langem Kontext",
            "items": [
                "<strong>Dem Standardkontext vertrauen:</strong> Ollama verwendet unter 24 GiB VRAM standardmäßig 4K Token, egal was das Modell unterstützt, ein 100-seitiges Dokument wird also abgeschnitten, bevor das Modell es liest. Setzen Sie den Kontext ausdrücklich und bestätigen Sie ihn in der Spalte CONTEXT von <code>ollama ps</code>.",
                "<strong>Den Speicher nach der Downloadgröße planen:</strong> Der KV-Cache kann größer sein als die Gewichte. Llama 3.1 8B ist ein 4,9-GB-Download, braucht bei 128K aber etwa 16 GiB KV-Cache. Nutzen Sie die Formel oder die Tabelle oben, bevor Sie den Kontext erhöhen.",
                "<strong>Annehmen, dass jedes Tag das lange Fenster hat:</strong> In der Ollama-Bibliothek nennt <code>qwen3:14b</code> 40K, <code>qwen3:30b</code> dagegen 256K. Lesen Sie die Kontextangabe auf der Modellseite, bevor Sie planen.",
                "<strong>Das angegebene Fenster mit dem nutzbaren Fenster gleichsetzen:</strong> RULER und NoLiMa fanden bei 32K starke Genauigkeitsverluste bei vielen Modellen, die 128K oder mehr angeben. Testen Sie mit eigenen Dokumenten in der Länge, die Sie nutzen wollen."
            ]
        },
        {
            "type": "faq",
            "h2": "Häufig gestellte Fragen",
            "faqs": [
                {
                    "q": "Reicht ein 128K-Kontextfenster noch aus?",
                    "a": "128K Token sind etwa 100.000 Wörter und genügen für die meisten einzelnen Dokumente. Ein Buch mit 300 Seiten umfasst typischerweise 75.000 bis 100.000 Wörter, grob 100K bis 135K Token, und überschreitet ein 128K-Fenster daher meist oder füllt es fast ganz aus, ohne Platz für Fragen und Antworten. Ein 256K-Fenster fasst das Buch und die Antwort; darüber hinaus nutzen Sie RAG oder Chunking."
                },
                {
                    "q": "Warum vergisst mein lokales Modell den Anfang meines Dokuments?",
                    "a": "Wahrscheinlich ist der aktive Kontext kleiner als Ihr Dokument. Ollama verwendet auf GPUs mit unter 24 GiB VRAM standardmäßig 4K Token, von 24 bis 48 GiB 32K und ab 48 GiB 256K, unabhängig davon, was das Modell unterstützt, und Eingaben über den Kontext hinaus werden abgeschnitten. Prüfen Sie die Spalte CONTEXT von ollama ps und erhöhen Sie ihn mit OLLAMA_CONTEXT_LENGTH, /set parameter num_ctx, einem Modelfile oder der API-Option num_ctx."
                },
                {
                    "q": "Ist langer Kontext oder RAG besser für Fragen zu Dokumenten?",
                    "a": "RAG ist meist günstiger bei Speicher und Zeit, wenn die Antwort in wenigen Passagen einer großen Sammlung steht, weil der Prompt auf wenige tausend Token begrenzt bleibt. Langer Kontext ist besser, wenn das Modell über ein zusammenhängendes Dokument schlussfolgern muss, etwa einen Vertrag, eine Codebasis oder ein Buchkapitel, in dem Chunking Querverweise zerschneiden würde. Viele Setups kombinieren beides, indem sie ganze Abschnitte in ein 32K- bis 128K-Fenster abrufen."
                }
            ]
        },
        {
            "type": "cta",
            "h2": "PromptQuorum kostenlos testen",
            "body": "Lokale LLM-Ausgaben mit Cloud-APIs vergleichen. Lange Kontext-Aufgaben auf Llama, Qwen und Mistral testen — alles in einem Tool.",
            "cta": "Kostenlos starten",
            "href": "https://www.promptquorum.com/de"
        }
    ]
},
            fr: {
    "title": "LLM locaux à contexte long 2026",
    "slides": [
        {
            "type": "title",
            "h1": "LLM locaux à contexte long 2026",
            "subtitle": "Quels modèles dépassent 128K ?",
            "link": "https://www.promptquorum.com/fr/local-llms/long-context-local-llms"
        },
        {
            "type": "list",
            "h2": "Points clés",
            "items": [
                "<strong>256K est courant, 1M est possible.</strong> Qwen3.5, Qwen3.8 et Gemma 4 (12B, 26B, 31B) annoncent des fenêtres de 256K dans la bibliothèque Ollama. Nemotron 3 Nano 30B prend en charge 1M. Gemma 4 E2B/E4B, Mistral Small 3.2, gpt-oss 20B et Llama 3.1 8B restent à 128K.",
                "<strong>Le cache KV décide de la mémoire, et il dépend de l'architecture.</strong> À 128K, le cache en f16 occupe 16 Gio pour Llama 3.1 8B, 8 Gio pour Qwen3.8 27B, environ 2.7 Gio pour Gemma 4 26B-A4B et environ 0.75 Gio pour Nemotron 3 Nano.",

        {
            "type": "faq",
            "h2": "자주 묻는 질문",
            "faqs": [
                {
                    "q": "128K 컨텍스트 윈도우는 아직 충분합니까?",
                    "a": "128K 토큰은 약 10만 단어로 대부분의 단일 문서에 충분합니다. 300쪽짜리 책은 보통 7만 5천~10만 단어, 대략 100K~135K 토큰이므로 128K 윈도우를 넘거나 질문과 답변을 위한 여유가 거의 없습니다. 256K 윈도우에는 책과 답변이 모두 들어가며, 그 이상은 RAG나 분할 처리를 사용하십시오."
                },
                {
                    "q": "로컬 모델이 문서의 시작 부분을 잊어버리는 이유는 무엇입니까?",
                    "a": "대부분 현재 컨텍스트가 문서보다 작기 때문입니다. Ollama는 모델이 지원하는 길이와 관계없이 VRAM 24 GiB 미만 GPU에서 기본값이 4K 토큰이고, 24~48 GiB에서 32K, 48 GiB 이상에서 256K이며, 컨텍스트를 넘는 입력은 잘립니다. ollama ps의 CONTEXT 열을 확인하고 OLLAMA_CONTEXT_LENGTH, /set parameter num_ctx, Modelfile, API의 num_ctx 옵션으로 늘리십시오."
                },
                {
                    "q": "문서 질의응답에는 긴 컨텍스트와 RAG 중 무엇이 더 낫습니까?",
                    "a": "답이 큰 문서 모음의 몇몇 구절에 있다면, 프롬프트를 수천 토큰으로 유지하는 RAG가 보통 메모리와 시간이 덜 듭니다. 계약서, 코드베이스, 책의 장처럼 모델이 하나로 이어진 문서 전체에 걸쳐 추론해야 하고 청크 분할이 상호 참조를 끊을 수 있다면 긴 컨텍스트가 더 낫습니다. 섹션 전체를 가져와 32K~128K 윈도우에 넣는 식으로 둘을 결합하는 구성도 많습니다."
                }
            ]
        },
        {
            "type": "cta",
            "h2": "PromptQuorum 무료로 체험하기",
            "body": "로컬 LLM 출력과 클라우드 API 출력을 나란히 비교하십시오. Llama, Qwen, Mistral에서 긴 컨텍스트 작업을 하나의 도구로 테스트할 수 있습니다.",
            "cta": "무료로 시작하기",
            "href": "https://www.promptquorum.com/ko"
        }
    ]
},
        };

        function renderSlide(slide, lang) {
            let html = '';
            const articleUrl = 'https://www.promptquorum.com' + (PATH_PREFIX[lang] || '') + '/local-llms/long-context-local-llms';
            const footerLink = `<p style="position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #999;"><a href="${articleUrl}" style="color: #999; text-decoration: none; border-bottom: 1px solid #ddd;">← Article</a></p>`;

            switch (slide.type) {
                case 'title':
                    html = `
                        <img src="/logo.svg" alt="PromptQuorum" class="logo" />
                        <h1>${slide.h1}</h1>
                        <p>${slide.subtitle}</p>
                        <p style="margin-top: 32px; font-size: 16px; color: #79747e;">
                            <a href="${slide.link}" style="color:#6750a4; text-decoration:none; border-bottom: 1px solid #6750a4;">${slide.link.replace('https://www.promptquorum.com/', '')}</a>
                        </p>
                        ${footerLink}
                    `;
                    break;

                case 'list':
                    html = `<h2>${slide.h2}</h2>`;
                    if (slide.intro) html += `<p style="margin-top:8px; margin-bottom:4px; font-size:clamp(14px,1.5vw,17px);">${slide.intro}</p>`;
                    html += '<ul style="margin-top: 16px;">';
                    slide.items.forEach(item => { html += `<li>${item}</li>`; });
                    html += '</ul>';
                    html += footerLink;
                    break;

                case 'table':
                    html = `<h2>${slide.h2}</h2>`;
                    html += '<table style="margin-top:16px;"><tr>';
                    slide.columns.forEach(col => { html += `<th>${col}</th>`; });
                    html += '</tr>';
                    slide.rows.forEach(row => {
                        html += '<tr>';
                        slide.columns.forEach(col => { html += `<td>${row[col]}</td>`; });
                        html += '</tr>';
                    });
                    html += '</table>';
                    html += footerLink;
                    break;

                case 'comparison':
                    html = `
                        <h2 style="font-size:clamp(28px,3.2vw,40px);">${slide.h2}</h2>
                        <p style="margin-top: 36px; font-size: clamp(18px,2.2vw,26px); color: #49454f;">${slide.line1}</p>
                        <p style="font-size: clamp(18px,2.2vw,26px); color: #49454f; margin-top:12px;">${slide.line2}</p>
                        <p style="margin-top: 36px; font-size: clamp(14px,1.6vw,18px); color: #6750a4; max-width:580px;">${slide.tip}</p>
                        ${footerLink}
                    `;
                    break;

                case 'numbered':
                    html = `<h2>${slide.h2}</h2>`;
                    html += '<ol style="margin-top: 16px;">';
                    slide.items.forEach(item => { html += `<li>${item}</li>`; });
                    html += '</ol>';
                    html += footerLink;
                    break;

                case 'faq':
                    html = `<h2>${slide.h2}</h2>`;
                    slide.faqs.forEach(faq => {
                        html += `<div style="margin-bottom: 16px; text-align: left; max-width: 640px;">
                            <strong style="font-size:clamp(13px,1.4vw,16px);">Q: ${faq.q}</strong>
                            <p style="margin-top: 6px; font-size:clamp(12px,1.3vw,15px); color:#49454f;">A: ${faq.a}</p>
                        </div>`;
                    });
                    html += footerLink;
                    break;

                case 'cta':
                    html = `
                        <h2 style="font-size:clamp(30px,3.5vw,44px);">${slide.h2}</h2>
                        <p style="margin-top: 20px; max-width: 560px;">${slide.body}</p>
                        <a href="${slide.href}" style="display: inline-block; margin-top: 28px; padding: 14px 28px; background: #6750a4; color: white; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 18px;">${slide.cta}</a>
                        ${footerLink}
                    `;
                    break;
            }

            return `<div class="slide ${slide.type}">${html}</div>`;
        }

        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang') || 'en';
        const isPrint = params.get('print') === '1';
        const content = CONTENT[lang] || CONTENT.en;

        // Update header
        document.getElementById('header-title').textContent = content.title;
        const backLink = document.getElementById('back-link');
        backLink.href = 'https://www.promptquorum.com' + (PATH_PREFIX[lang] || '') + '/local-llms/long-context-local-llms';
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : (CONTENT[lang] ? lang : 'en');
        if (lang === 'ar' && CONTENT.ar) document.documentElement.dir = 'rtl';

        // Render all slides
        const container = document.getElementById('slides-container');
        content.slides.forEach(slide => {
            container.innerHTML += renderSlide(slide, lang);
        });

        // Navigation
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        document.getElementById('totalSlides').textContent = totalSlides;

        function showSlide(n) {
            if (n >= totalSlides) currentSlide = totalSlides - 1;
            else if (n < 0) currentSlide = 0;
            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(n) {
            currentSlide += n;
            showSlide(currentSlide);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Print handlers — show all slides for PDF
        window.addEventListener('beforeprint', () => {
            slides.forEach(slide => { slide.style.display = 'flex'; });
        });
        window.addEventListener('afterprint', () => {
            slides.forEach(slide => { slide.style.removeProperty('display'); });
            showSlide(currentSlide);
        });

        if (isPrint) {
            window.addEventListener('load', () => { window.print(); });
        }

        showSlide(0);
    </script>
</body>
</html>
