                    slide.rows.forEach(row => {
                        html += '<tr>';
                        slide.columns.forEach(col => { html += `<td>${row[col]}</td>`; });
                        html += '</tr>';
                    });
                    html += '</table>';
                    html += footerLink;
                    break;

                case 'faq':
                    html = `<h2>${slide.h2}</h2><dl class="faq-list">`;
                    slide.faqs.forEach(faq => {
                        html += `<dt>${faq.q}</dt><dd>${faq.a}</dd>`;
                    });
                    html += '</dl>';
                    html += footerLink;
                    break;

                case 'cta':
                    html = `
                        <h2>${slide.h2}</h2>
                        <p style="max-width: 560px;">${slide.body}</p>
                        <a href="${slide.href}" target="_blank" rel="noopener" style="display:inline-block;margin-top:28px;padding:14px 28px;background:#6750a4;color:white;border-radius:8px;text-decoration:none;font-size:1.1em;font-weight:600;">${slide.cta}</a>
                        ${footerLink}
                    `;
                    break;
            }

            return `<div class="slide ${slide.type}" style="position:relative;">${html}</div>`;
        }

        // Language detection
        const params = new URLSearchParams(window.location.search);
        const lang = (['en','de','fr','ja','zh'].includes(params.get('lang'))) ? params.get('lang') : 'en';
        const isPrint = params.get('print') === '1';
        const content = CONTENT[lang] || CONTENT.en;

        // Update header
        document.getElementById('header-title').textContent = content.title;
        const backLink = document.getElementById('back-link');
        backLink.textContent = content.backLabel;
        backLink.target = '_blank';
        backLink.rel = 'noopener';
        if (lang !== 'en') backLink.href = ARTICLE_BASE + '?lang=' + lang;

        // Render all slides
        const container = document.getElementById('slides-container');
        content.slides.forEach(slide => {
            container.innerHTML += renderSlide(slide, lang);
        });

        // Navigation
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        document.getElementById('totalSlides').textContent = totalSlides;

        function showSlide(n) {
            if (n >= totalSlides) currentSlide = totalSlides - 1;
            else if (n < 0) currentSlide = 0;
            else currentSlide = n;
            slides.forEach(s => s.classList.remove('active'));
            slides[currentSlide].classList.add('active');
            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(n) { showSlide(currentSlide + n); }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   changeSlide(-1);
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlide(1);
        });

        window.addEventListener('beforeprint', () => { slides.forEach(s => { s.style.display = 'flex'; }); });
        window.addEventListener('afterprint',  () => { slides.forEach(s => { s.style.removeProperty('display'); }); showSlide(currentSlide); });

        if (isPrint) { window.addEventListener('load', () => { window.print(); }); }

        showSlide(0);
    </script>
</body>
</html>
