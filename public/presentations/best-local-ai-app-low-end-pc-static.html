          html += '</ul>'
          html += footer
          break

        case 'table':
          html = `<h2>${slide.h2}</h2><table>`
          html += '<tr>' + slide.columns.map(c => `<th>${c}</th>`).join('') + '</tr>'
          slide.rows.forEach(row => {
            html += '<tr>' + slide.columns.map(c => `<td>${row[c] ?? ''}</td>`).join('') + '</tr>'
          })
          html += '</table>'
          html += footer
          break

        case 'comparison':
          html = `<h2>${slide.h2}</h2>
            <p style="margin-top:32px;font-size:clamp(16px,1.8vw,22px);">${slide.line1}</p>
            <p style="font-size:clamp(16px,1.8vw,22px);">${slide.line2}</p>
            <p style="margin-top:28px;font-size:clamp(13px,1.4vw,17px);color:#6750a4;">${slide.tip}</p>
            ${footer}`
          break

        case 'numbered':
          html = `<h2>${slide.h2}</h2><ol style="text-align:left;margin:10px auto;max-width:680px;padding-left:24px;">`
          slide.items.forEach(item => { html += `<li style="font-size:clamp(13px,1.4vw,17px);margin-bottom:9px;line-height:1.5;">${item}</li>` })
          html += '</ol>'
          html += footer
          break

        case 'faq':
          html = `<h2>${slide.h2}</h2>`
          slide.faqs.forEach(f => {
            html += `<div style="margin-bottom:14px;text-align:left;max-width:720px;margin-left:auto;margin-right:auto;">
              <p style="font-weight:700;font-size:clamp(13px,1.4vw,16px);color:#1c1b1f;margin-bottom:4px;">Q: ${f.q}</p>
              <p style="font-size:clamp(12px,1.3vw,15px);color:#49454f;margin-bottom:0;">A: ${f.a}</p>
            </div>`
          })
          html += footer
          break

        case 'cta':
          html = `<h2>${slide.h2}</h2>
            <p style="max-width:560px;margin:0 auto 20px;">${slide.body}</p>
            <a href="${slide.href}" target="_blank" rel="noopener"
               style="display:inline-block;padding:14px 28px;background:#6750a4;color:white;border-radius:8px;text-decoration:none;font-weight:700;font-size:clamp(14px,1.6vw,18px);">
              ${slide.cta}
            </a>
            ${footer}`
          break
      }

      return `<div class="slide ${slide.type}">${html}</div>`
    }

    // ─── Init ───────────────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search)
    const lang = params.get('lang') || 'en'
    const isPrint = params.get('print') === '1'
    const content = CONTENT[lang] || CONTENT.en

    document.getElementById('header-title').textContent = content.title
    const backLink = document.getElementById('back-link')
    backLink.href = 'https://www.promptquorum.com/power-local-llm/best-local-ai-app-low-end-pc'

    const container = document.getElementById('slides-container')
    content.slides.forEach(slide => { container.innerHTML += renderSlide(slide, lang) })

    let currentSlide = 0
    const slides = document.querySelectorAll('.slide')
    const totalSlides = slides.length
    document.getElementById('totalSlides').textContent = totalSlides

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1
      else if (n < 0) currentSlide = 0
      slides.forEach(s => s.classList.remove('active'))
      slides[currentSlide].classList.add('active')
      document.getElementById('currentSlide').textContent = currentSlide + 1
      document.getElementById('prevBtn').disabled = currentSlide === 0
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1
    }

    function changeSlide(n) { currentSlide += n; showSlide(currentSlide) }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') changeSlide(-1)
      if (e.key === 'ArrowRight') changeSlide(1)
    })

    window.addEventListener('beforeprint', () => { slides.forEach(s => { s.style.display = 'flex' }) })
    window.addEventListener('afterprint', () => { slides.forEach(s => { s.style.removeProperty('display') }); showSlide(currentSlide) })

    if (isPrint) { window.addEventListener('load', () => { window.print() }) }

    showSlide(0)
  </script>
</body>
</html>
