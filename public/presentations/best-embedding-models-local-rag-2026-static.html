    function renderSlide(slide, lang) {
      let html = '';
      const articleUrl = BASE_URL + '?lang=' + lang;
      const footerLink = '<p style="position:absolute;bottom:16px;right:16px;font-size:11px;color:#999;"><a href="' + articleUrl + '" target="_blank" rel="noopener" style="color:#999;text-decoration:none;border-bottom:1px solid #ddd;">← Article</a></p>';

      switch (slide.type) {
        case 'title':
          html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />'
            + '<h1>' + slide.h1 + '</h1>'
            + '<p>' + slide.subtitle + '</p>'
            + '<p style="margin-top:32px;font-size:16px;color:#79747e;">'
            + '<a href="' + slide.link + '" target="_blank" rel="noopener">' + BASE_URL.replace('https://www.promptquorum.com/', '') + '</a>'
            + '</p>'
            + footerLink;
          break;

        case 'list':
          html = '<h2>' + slide.h2 + '</h2>';
          if (slide.intro) html += '<p>' + slide.intro + '</p>';
          html += '<ul style="font-size:1.1em;margin-top:16px;">';
          slide.items.forEach(function(item) { html += '<li>' + item + '</li>'; });
          html += '</ul>' + footerLink;
          break;

        case 'table':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<table><tr>';
          slide.columns.forEach(function(col) { html += '<th>' + col + '</th>'; });
          html += '</tr>';
          slide.rows.forEach(function(row) {
            html += '<tr>';
            if (Array.isArray(row)) {
              row.forEach(function(cell) { html += '<td>' + cell + '</td>'; });
            } else {
              slide.columns.forEach(function(col) { html += '<td>' + row[col] + '</td>'; });
            }
            html += '</tr>';
          });
          html += '</table>' + footerLink;
          break;

        case 'comparison':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="margin-top:36px;font-size:clamp(16px,1.8vw,22px);">' + slide.line1 + '</p>'
            + '<p style="font-size:clamp(16px,1.8vw,22px);margin-top:12px;">' + slide.line2 + '</p>'
            + '<p style="margin-top:36px;font-size:clamp(14px,1.5vw,18px);color:#6750a4;">' + slide.tip + '</p>'
            + footerLink;
          break;

        case 'numbered':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<ol style="font-size:clamp(13px,1.4vw,17px);margin-top:16px;text-align:left;max-width:640px;">';
          slide.items.forEach(function(item) { html += '<li style="margin-bottom:10px;">' + item + '</li>'; });
          html += '</ol>' + footerLink;
          break;

        case 'faq':
          html = '<h2>' + slide.h2 + '</h2>';
          slide.faqs.forEach(function(faq) {
            html += '<div style="margin-bottom:16px;text-align:left;max-width:700px;">'
              + '<strong style="font-size:clamp(13px,1.4vw,16px);">Q: ' + faq.q + '</strong>'
              + '<p style="margin-top:4px;font-size:clamp(12px,1.3vw,15px);color:#49454f;">A: ' + faq.a + '</p>'
              + '</div>';
          });
          html += footerLink;
          break;

        case 'cta':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="max-width:600px;">' + slide.body + '</p>'
            + '<a href="' + slide.href + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:24px;padding:14px 28px;background:#6750a4;color:white;border-radius:8px;text-decoration:none;font-weight:700;font-size:18px;">'
            + slide.cta + '</a>'
            + footerLink;
          break;

        default:
          html = '<p>Slide</p>';
      }

      return '<div class="slide ' + slide.type + '" data-lang="' + lang + '">' + html + '</div>';
    }

    var params = new URLSearchParams(window.location.search);
    var lang = params.get('lang');
    if (!lang || !CONTENT[lang]) lang = 'en';
    var isPrint = params.get('print') === '1';
    var content = CONTENT[lang];

    document.getElementById('header-title').textContent = content.title;
    var backLink = document.getElementById('back-link');
    backLink.href = BASE_URL + '?lang=' + lang;

    var container = document.getElementById('slides-container');
    content.slides.forEach(function(slide) {
      container.innerHTML += renderSlide(slide, lang);
    });

    var currentSlide = 0;
    var slides = document.querySelectorAll('.slide');
    var totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      slides.forEach(function(s) { s.classList.remove('active'); });
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', function() {
      slides.forEach(function(s) { s.style.display = 'flex'; });
    });
    window.addEventListener('afterprint', function() {
      slides.forEach(function(s) { s.style.removeProperty('display'); });
      showSlide(currentSlide);
    });

    if (isPrint) {
      window.addEventListener('load', function() { window.print(); });
    }

    showSlide(0);
    </script>
