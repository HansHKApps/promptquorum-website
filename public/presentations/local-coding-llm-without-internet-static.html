    function renderSlide(slide, lang) {
      const articleUrl = BASE_URL + '?lang=' + lang;
      const footerLink = '<p style="position:absolute;bottom:16px;right:16px;font-size:11px;color:#999;"><a href="' + articleUrl + '" target="_blank" rel="noopener" style="color:#999;text-decoration:none;border-bottom:1px solid #ddd;">← Article</a></p>';
      let html = '';

      switch (slide.type) {
        case 'title':
          html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />'
            + '<h1>' + slide.h1 + '</h1>'
            + '<p>' + slide.subtitle + '</p>'
            + '<p style="margin-top:32px;font-size:15px;color:#79747e;"><a href="' + slide.link + '?lang=' + lang + '" target="_blank" rel="noopener" style="color:#6750a4;">' + slide.link.replace('https://www.promptquorum.com/', '') + '</a></p>'
            + footerLink;
          break;

        case 'list':
          html = '<h2>' + slide.h2 + '</h2>';
          if (slide.intro) html += '<p style="margin-bottom:12px;">' + slide.intro + '</p>';
          html += '<ul>';
          slide.items.forEach(function(item) { html += '<li>' + item + '</li>'; });
          html += '</ul>';
          html += footerLink;
          break;

        case 'numbered':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<ol>';
          slide.items.forEach(function(item) { html += '<li>' + item + '</li>'; });
          html += '</ol>';
          html += footerLink;
          break;

        case 'table':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<table><thead><tr>';
          slide.columns.forEach(function(col) { html += '<th>' + col + '</th>'; });
          html += '</tr></thead><tbody>';
          slide.rows.forEach(function(row) {
            html += '<tr>';
            if (Array.isArray(row)) {
              row.forEach(function(cell) { html += '<td>' + cell + '</td>'; });
            } else {
              slide.columns.forEach(function(col) { html += '<td>' + row[col] + '</td>'; });
            }
            html += '</tr>';
          });
          html += '</tbody></table>';
          html += footerLink;
          break;

        case 'comparison':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="margin-top:32px;font-size:clamp(14px,1.6vw,18px);line-height:1.6;">' + slide.line1 + '</p>'
            + '<p style="margin-top:20px;font-size:clamp(14px,1.6vw,18px);line-height:1.6;">' + slide.line2 + '</p>'
            + '<p style="margin-top:32px;font-size:clamp(13px,1.4vw,15px);color:#6750a4;font-style:italic;">' + slide.tip + '</p>'
            + footerLink;
          break;

        case 'faq':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<div style="text-align:left;max-width:820px;width:100%;margin-top:12px;">';
          slide.faqs.forEach(function(faq) {
            html += '<div style="margin-bottom:14px;">'
              + '<p style="font-size:clamp(13px,1.3vw,15px);font-weight:600;color:#1c1b1f;">' + faq.q + '</p>'
              + '<p style="font-size:clamp(12px,1.2vw,14px);color:#49454f;margin-top:4px;">' + faq.a + '</p>'
              + '</div>';
          });
          html += '</div>';
          html += footerLink;
          break;

        case 'cta':
          html = '<h2>' + slide.h2 + '</h2>'
            + '<p style="margin-top:20px;max-width:640px;">' + slide.body + '</p>'
            + '<a href="' + slide.href + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:28px;padding:12px 28px;background:#6750a4;color:#fff;border-radius:24px;text-decoration:none;font-size:16px;font-weight:600;">' + slide.cta + '</a>'
            + footerLink;
          break;
      }

      return '<div class="slide ' + slide.type + '">' + html + '</div>';
    }

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const isPrint = params.get('print') === '1';
    const content = CONTENT[lang] || CONTENT.en;

    document.getElementById('header-title').textContent = content.title;
    const backLink = document.getElementById('back-link');
    backLink.href = BASE_URL + '?lang=' + lang;

    const container = document.getElementById('slides-container');
    content.slides.forEach(function(slide) {
      container.innerHTML += renderSlide(slide, lang);
    });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      slides.forEach(function(s) { s.classList.remove('active'); });
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', function() {
      slides.forEach(function(s) { s.style.display = 'flex'; });
    });
    window.addEventListener('afterprint', function() {
      slides.forEach(function(s) { s.style.removeProperty('display'); });
      showSlide(currentSlide);
    });

    if (isPrint) {
      window.addEventListener('load', function() { window.print(); });
    }

    showSlide(0);
  </script>
