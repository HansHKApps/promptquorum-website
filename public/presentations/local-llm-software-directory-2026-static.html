    function renderSlide(slide, lang) {
      const footer = '<p class="slide-footer"><a href="' + articleBase + '" target="_blank" rel="noopener">← Article</a></p>';
      let html = '';

      switch (slide.type) {
        case 'title':
          html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />' +
            '<h1>' + slide.h1 + '</h1>' +
            '<p>' + slide.subtitle + '</p>' +
            '<p style="margin-top:32px;font-size:15px;color:#6750a4;">' +
              '<a href="' + slide.link + '" target="_blank" rel="noopener">' + slide.link.replace('https://www.promptquorum.com/', '') + '</a>' +
            '</p>' + footer;
          break;

        case 'list':
          html = '<h2>' + slide.h2 + '</h2>';
          if (slide.intro) html += '<p>' + slide.intro + '</p>';
          html += '<ul style="font-size:1.1em;margin-top:12px;">';
          slide.items.forEach(item => { html += '<li>' + item + '</li>'; });
          html += '</ul>' + footer;
          break;

        case 'table': {
          html = '<h2>' + slide.h2 + '</h2>';
          const cols = slide.columns;
          html += '<table><tr>';
          cols.forEach(c => { html += '<th>' + c + '</th>'; });
          html += '</tr>';
          slide.rows.forEach(row => {
            html += '<tr>';
            cols.forEach(c => { html += '<td>' + (row[c] || '') + '</td>'; });
            html += '</tr>';
          });
          html += '</table>' + footer;
          break;
        }

        case 'numbered':
          html = '<h2>' + slide.h2 + '</h2>';
          html += '<ol style="font-size:1.05em;margin-top:12px;">';
          slide.items.forEach(item => { html += '<li>' + item + '</li>'; });
          html += '</ol>' + footer;
          break;

        case 'faq':
          html = '<h2>' + slide.h2 + '</h2>';
          slide.faqs.forEach(faq => {
            html += '<div style="margin-bottom:16px;text-align:left;max-width:700px;">' +
              '<strong>Q: ' + faq.q + '</strong>' +
              '<p style="margin-top:6px;">A: ' + faq.a + '</p>' +
              '</div>';
          });
          html += footer;
          break;

        case 'cta':
          html = '<h2>' + slide.h2 + '</h2>' +
            '<p style="margin-top:16px;font-size:1.1em;">' + slide.body + '</p>' +
            '<a href="' + slide.href + '" target="_blank" rel="noopener" ' +
              'style="display:inline-block;margin-top:24px;padding:12px 28px;background:#6750a4;color:white;border-radius:8px;text-decoration:none;font-weight:700;font-size:1.05em;">' +
              slide.cta + '</a>' + footer;
          break;
      }

      return '<div class="slide ' + slide.type + '">' + html + '</div>';
    }

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const content = CONTENT[lang] || CONTENT.en;

    const PATH_LANGS = ['de', 'fr', 'ja', 'zh', 'es', 'pt', 'ar'];
    const slug = 'local-llm-software-directory-2026';
    const articleBase = PATH_LANGS.includes(lang)
      ? 'https://www.promptquorum.com/' + lang + '/power-local-llm/' + slug
      : 'https://www.promptquorum.com/power-local-llm/' + slug;

    document.getElementById('header-title').textContent = content.title;
    const backLink = document.getElementById('back-link');
    backLink.href = articleBase;

    const container = document.getElementById('slides-container');
    content.slides.forEach(slide => {
      container.innerHTML += renderSlide(slide, lang);
    });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      slides.forEach(s => s.classList.remove('active'));
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlide += n;
      showSlide(currentSlide);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', () => {
      slides.forEach(s => { s.style.display = 'flex'; });
    });
    window.addEventListener('afterprint', () => {
      slides.forEach(s => { s.style.removeProperty('display'); });
      showSlide(currentSlide);
    });

    showSlide(0);
  </script>
