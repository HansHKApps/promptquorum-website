        let currentSlideIndex = 0;
        let lang = 'en';

        function getLang() {
            const params = new URLSearchParams(window.location.search);
            const l = params.get('lang');
            return (l && CONTENT[l]) ? l : 'en';
        }

        function footer(l) {
            return `<p style="position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #999;"><a href="${ARTICLE_URL}?lang=${l}" target="_blank" rel="noopener" style="color: #999; text-decoration: none; border-bottom: 1px solid #ddd;">← Article</a></p>`;
        }

        function renderSlide(slide, l, index) {
            const c = CONTENT[l] || CONTENT.en;
            let html = '';

            if (slide.type === 'title') {
                html = `<div class="slide title active" data-lang="${l}" style="position:relative;">
                    <img src="/logo.svg" alt="PromptQuorum" class="logo" />
                    <h1>${c.title}</h1>
                    <p>${c.intro}</p>
                    <p style="margin-top:16px;font-size:13px;"><a href="${ARTICLE_URL}?lang=${l}" target="_blank" rel="noopener">${ARTICLE_URL}</a></p>
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'list') {
                const items = slide.items.map(i => `<li>${i}</li>`).join('');
                html = `<div class="slide" data-lang="${l}" style="position:relative;">
                    <h2>${slide.heading}</h2>
                    <ul>${items}</ul>
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'numbered') {
                const items = slide.items.map(i => `<li>${i}</li>`).join('');
                html = `<div class="slide" data-lang="${l}" style="position:relative;">
                    <h2>${slide.heading}</h2>
                    <ol>${items}</ol>
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'table') {
                const ths = slide.cols.map(col => `<th>${col}</th>`).join('');
                const trs = slide.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('');
                html = `<div class="slide" data-lang="${l}" style="position:relative;">
                    <h2>${slide.heading}</h2>
                    <table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'comparison') {
                const leftPts = slide.left.points.map(p => `<li>${p}</li>`).join('');
                const rightPts = slide.right.points.map(p => `<li>${p}</li>`).join('');
                html = `<div class="slide" data-lang="${l}" style="position:relative;">
                    <h2>${slide.heading}</h2>
                    <div style="display:flex;gap:32px;justify-content:center;align-items:flex-start;width:100%;max-width:900px;">
                        <div style="flex:1;text-align:left;">
                            <p style="font-weight:700;color:#6750a4;margin-bottom:8px;">${slide.left.title}</p>
                            <ul>${leftPts}</ul>
                        </div>
                        <div style="width:2px;background:#e8e0f0;align-self:stretch;"></div>
                        <div style="flex:1;text-align:left;">
                            <p style="font-weight:700;color:#6750a4;margin-bottom:8px;">${slide.right.title}</p>
                            <ul>${rightPts}</ul>
                        </div>
                    </div>
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'faq') {
                const faqs = slide.faqs.map(faq => `
                    <div style="margin-bottom:14px;text-align:left;max-width:700px;margin-left:auto;margin-right:auto;">
                        <p style="font-weight:700;color:#1c1b1f;margin-bottom:4px;">${faq.q}</p>
                        <p style="font-size:clamp(13px,1.4vw,16px);margin-bottom:0;">${faq.a}</p>
                    </div>`).join('');
                html = `<div class="slide" data-lang="${l}" style="position:relative;">
                    <h2>${slide.heading}</h2>
                    ${faqs}
                    ${footer(l)}
                </div>`;
            } else if (slide.type === 'cta') {
                html = `<div class="slide title" data-lang="${l}" style="position:relative;">
                    <img src="/logo.svg" alt="PromptQuorum" class="logo" />
                    <h2>${slide.h2}</h2>
                    <p>${slide.body}</p>
                    <a href="${slide.href}" target="_blank" rel="noopener" style="display:inline-block;margin-top:20px;background:#6750a4;color:white;padding:12px 28px;border-radius:8px;font-weight:700;font-size:18px;text-decoration:none;border:none;">${slide.cta}</a>
                    ${footer(l)}
                </div>`;
            }

            return html;
        }

        function buildPresentation() {
            lang = getLang();
            const c = CONTENT[lang] || CONTENT.en;
            const container = document.getElementById('slides-container');
            container.innerHTML = '';

            c.slides.forEach((slide, index) => {
                const div = document.createElement('div');
                div.innerHTML = renderSlide(slide, lang, index);
                const el = div.firstElementChild;
                if (index !== 0) el.classList.remove('active');
                else el.classList.add('active');
                container.appendChild(el);
            });

            document.getElementById('header-title').textContent = c.title;
            document.getElementById('back-link').href = `${ARTICLE_URL}?lang=${lang}`;
            document.getElementById('totalSlides').textContent = c.slides.length;
            document.getElementById('currentSlide').textContent = 1;
            currentSlideIndex = 0;
            updateButtons();
        }

        function changeSlide(delta) {
            const lang2 = getLang();
            const c = CONTENT[lang2] || CONTENT.en;
            const slides = document.querySelectorAll('#slides-container .slide');
            if (slides.length === 0) return;

            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex = Math.max(0, Math.min(currentSlideIndex + delta, slides.length - 1));
            slides[currentSlideIndex].classList.add('active');
            document.getElementById('currentSlide').textContent = currentSlideIndex + 1;
            updateButtons();
        }

        function updateButtons() {
            const lang2 = getLang();
            const c = CONTENT[lang2] || CONTENT.en;
            const total = c.slides.length;
            document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
            document.getElementById('nextBtn').disabled = currentSlideIndex === total - 1;
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlide(1);
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') changeSlide(-1);
        });

        window.addEventListener('beforeprint', function() {
            document.querySelectorAll('#slides-container .slide').forEach(s => s.classList.add('active'));
        });

        window.addEventListener('afterprint', function() {
            const slides = document.querySelectorAll('#slides-container .slide');
            slides.forEach((s, i) => {
                s.classList.remove('active');
                if (i === currentSlideIndex) s.classList.add('active');
            });
        });

        buildPresentation();
    </script>
