                    },
                    {
                        type: 'table',
                        h2: '决策：选择你的框架',
                        columns: ['你的情况', '选择'],
                        rows: [
                            { '你的情况': 'VS Code中的编码任务（重构、调试、多文件）', '选择': 'Cline + Ollama + Qwen3-Coder 30B' },
                            { '你的情况': '已使用Continue.dev，需要更轻量的代理', '选择': 'Continue.dev Agent模式' },
                            { '你的情况': '驱动浏览器、查询DB、读取文件的代理', '选择': 'Cline + Ollama + MCP服务器' },
                            { '你的情况': '本地代码解释器REPL', '选择': 'OpenInterpreter（仅限监视）' },
                            { '你的情况': '具有确定性工具的生产工作流', '选择': 'LangGraph + Ollama + 真实测试套件' },
                            { '你的情况': '完全自主无监督代理', '选择': '等待 — 2026年框架无法实现这一点。' }

                    },
                    {
                        type: 'numbered',
                        h2: '常见错误',
                        items: [
                            '优化自主性 — "无监督多长时间"是错的；"完成任务需要多少次批准"才是对的。',
                            '对工具调用工作使用小模型 — 7B以下会发出格式错误的调用；使用Qwen3-Coder 30B或类似模型。',

                    {
                        type: 'cta',
                        h2: '找到合适的本地代理框架',
                        body: 'PromptQuorum帮助您比较代理任务的模型和框架组合。',
                        cta: '免费试用PromptQuorum',
                        href: 'https://www.promptquorum.com'
                    }
                ]
            }
        };

        // Utility: render slide to HTML
        function renderSlide(slide) {
            let html = '';

            switch (slide.type) {
                case 'title':
                    html = `
                        <img src="/logo.svg" alt="PromptQuorum" class="logo" />
                        <h1>${slide.h1}</h1>
                        <p>${slide.subtitle}</p>
                        <p style="margin-top: 40px; font-size: 18px; color: #79747e;">
                            <a href="${slide.link}">${slide.link.split('/').pop().replace(/-/g, ' ')}</a>
                        </p>
                    `;
                    break;

                case 'list':
                    html = `<h2>${slide.h2}</h2>`;
                    if (slide.intro) html += `<p>${slide.intro}</p>`;
                    html += '<ul style="font-size: 1.2em; margin-top: 20px;">';
                    slide.items.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ul>';
                    break;

                case 'numbered':
                    html = `<h2>${slide.h2}</h2>`;
                    html += '<ol style="font-size: 1.2em; margin-top: 20px; text-align: left; max-width: 640px; margin-left: auto; margin-right: auto;">';
                    slide.items.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += '</ol>';
                    break;

                case 'table':
                    html = `<h2>${slide.h2}</h2>`;
                    html += '<table><tr>';
                    slide.columns.forEach(col => {
                        html += `<th>${col}</th>`;
                    });
                    html += '</tr>';
                    slide.rows.forEach(row => {
                        html += '<tr>';
                        slide.columns.forEach(col => {
                            html += `<td>${row[col]}</td>`;
                        });
                        html += '</tr>';
                    });
                    html += '</table>';
                    break;

                case 'cta':
                    html = `
                        <h2 style="color: #6750a4;">${slide.h2}</h2>
                        <p style="margin-top: 30px; font-size: 1.2em;">${slide.body}</p>
                        <p style="margin-top: 40px;">
                            <a href="${slide.href}" style="display: inline-block; padding: 16px 40px; background: #6750a4; color: white; text-decoration: none; border-radius: 8px; font-size: 18px; font-weight: 700; transition: background 0.2s;">
                                ${slide.cta}
                            </a>
                        </p>
                    `;
                    break;
            }

            return `<div class="slide ${slide.type}" data-lang="${lang}" style="position: relative;">${html}<p style="position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #999;"><a href="https://www.promptquorum.com/power-local-llm/autonomous-local-agents-actually-work?lang=${lang}" target="_blank" rel="noopener" style="color: #999; text-decoration: none; border-bottom: 1px solid #ddd;">← Article</a></p></div>`;
        }

        // Main script
        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang') || 'en';
        const isPrint = params.get('print') === '1';
        const content = CONTENT[lang] || CONTENT.en;

        // Update header
        document.getElementById('header-title').textContent = content.title;
        const backLink = document.getElementById('back-link');
        backLink.href += `?lang=${lang}`;

        // Render slides
        const container = document.getElementById('slides-container');
        content.slides.forEach(slide => {
            container.innerHTML += renderSlide(slide);
        });

        // Initialize slide navigation
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        document.getElementById('totalSlides').textContent = totalSlides;

        function showSlide(n) {
            if (n >= totalSlides) currentSlide = totalSlides - 1;
            else if (n < 0) currentSlide = 0;

            slides.forEach(slide => slide.classList.remove('active'));
            slides[currentSlide].classList.add('active');

            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(n) {
            currentSlide += n;
            showSlide(currentSlide);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Print handlers — show all slides before browser's print layout, restore after
        window.addEventListener('beforeprint', () => {
            slides.forEach(slide => { slide.style.display = 'flex'; });
        });
        window.addEventListener('afterprint', () => {
            slides.forEach(slide => { slide.style.removeProperty('display'); });
            showSlide(currentSlide);
        });

        // Print trigger
        if (isPrint) {
            window.addEventListener('load', () => {
                window.print();
            });
        }

        showSlide(0);
    </script>
</body>
</html>
