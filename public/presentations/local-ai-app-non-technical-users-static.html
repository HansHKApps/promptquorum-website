    function renderSlide(slide, lang) {
      let html = '';
      const articleUrl = 'https://www.promptquorum.com/power-local-llm/local-ai-app-non-technical-users' + (lang !== 'en' ? '?lang=' + lang : '');
      const footerHtml = `<p class="slide-footer"><a href="${articleUrl}" target="_blank" rel="noopener">← Article</a></p>`;

      switch (slide.type) {
        case 'title':
          html = `
            <img src="/logo.svg" alt="PromptQuorum" class="logo" />
            <h1>${slide.h1}</h1>
            <p>${slide.subtitle}</p>
            <p style="margin-top: 32px; font-size: 16px;">
              <a href="${slide.link}" target="_blank" rel="noopener">${slide.link}</a>
            </p>
            ${footerHtml}
          `;
          break;

        case 'list':
          html = `<h2>${slide.h2}</h2>`;
          if (slide.intro) html += `<p style="margin-bottom: 10px; font-style: italic;">${slide.intro}</p>`;
          html += '<ul>';
          slide.items.forEach(item => { html += `<li>${item}</li>`; });
          html += '</ul>';
          html += footerHtml;
          break;

        case 'table': {
          html = `<h2>${slide.h2}</h2><table><tr>`;
          slide.columns.forEach(col => { html += `<th>${col}</th>`; });
          html += '</tr>';
          slide.rows.forEach(row => {
            html += '<tr>';
            slide.columns.forEach(col => { html += `<td>${row[col]}</td>`; });
            html += '</tr>';
          });
          html += '</table>';
          html += footerHtml;
          break;
        }

        case 'numbered':
          html = `<h2>${slide.h2}</h2><ol>`;
          slide.items.forEach(item => { html += `<li>${item}</li>`; });
          html += '</ol>';
          html += footerHtml;
          break;

        case 'faq':
          html = `<h2>${slide.h2}</h2>`;
          slide.faqs.forEach(faq => {
            html += `<div style="margin-bottom: 18px; text-align: left; max-width: 680px;"><strong>Q: ${faq.q}</strong><p style="margin-top: 6px;">A: ${faq.a}</p></div>`;
          });
          html += footerHtml;
          break;

        case 'cta':
          html = `
            <h2>${slide.h2}</h2>
            <p style="margin-top: 16px; max-width: 580px;">${slide.body}</p>
            <a href="${slide.href}" target="_blank" rel="noopener" style="display: inline-block; margin-top: 28px; padding: 14px 28px; background: #6750a4; color: white; border-radius: 8px; text-decoration: none; font-size: 17px; font-weight: 700;">${slide.cta}</a>
            ${footerHtml}
          `;
          break;
      }

      return `<div class="slide ${slide.type}">${html}</div>`;
    }

    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const isPrint = params.get('print') === '1';
    const content = CONTENT[lang] || CONTENT.en;

    document.getElementById('header-title').textContent = content.title;
    const backLink = document.getElementById('back-link');
    if (lang !== 'en') backLink.href += '?lang=' + lang;

    const container = document.getElementById('slides-container');
    content.slides.forEach(slide => { container.innerHTML += renderSlide(slide, lang); });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlide = totalSlides - 1;
      else if (n < 0) currentSlide = 0;
      slides.forEach(s => s.classList.remove('active'));
      slides[currentSlide].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlide + 1;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function changeSlide(n) { currentSlide += n; showSlide(currentSlide); }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', () => { slides.forEach(s => { s.style.display = 'flex'; }); });
    window.addEventListener('afterprint', () => { slides.forEach(s => { s.style.removeProperty('display'); }); showSlide(currentSlide); });

    if (isPrint) { window.addEventListener('load', () => { window.print(); }); }

    showSlide(0);
  </script>
