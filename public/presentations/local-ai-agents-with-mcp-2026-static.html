    function renderSlide(slide, articleUrl) {
      var footerLink = '<p style="position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #999;"><a href="' + articleUrl + '" target="_blank" rel="noopener" style="color: #999; text-decoration: none; border-bottom: 1px solid #ddd;">← Article</a></p>';
      var html = '';

      if (slide.type === 'title') {
        html = '<img src="/logo.svg" alt="PromptQuorum" class="logo" />'
          + '<h1>' + slide.h1 + '</h1>'
          + '<p>' + slide.subtitle + '</p>'
          + '<p style="margin-top: 40px; font-size: 18px; color: #79747e;"><a href="' + slide.link + '" target="_blank" rel="noopener">' + SLUG.replace(/-/g, ' ') + '</a></p>'
          + footerLink;
      } else if (slide.type === 'list') {
        html = '<h2>' + slide.h2 + '</h2>';
        if (slide.intro) { html += '<p style="margin-bottom: 12px; font-size: clamp(13px, 1.3vw, 15px);">' + slide.intro + '</p>'; }
        html += '<ul style="font-size: 1.1em; margin-top: 8px;">';
        for (var i = 0; i < slide.items.length; i++) { html += '<li>' + slide.items[i] + '</li>'; }
        html += '</ul>' + footerLink;
      } else if (slide.type === 'numbered') {
        html = '<h2>' + slide.h2 + '</h2>';
        html += '<ol style="font-size: 1.05em; margin-top: 12px;">';
        for (var i = 0; i < slide.items.length; i++) { html += '<li>' + slide.items[i] + '</li>'; }
        html += '</ol>' + footerLink;
      } else if (slide.type === 'table') {
        html = '<h2>' + slide.h2 + '</h2>';
        html += '<table style="margin-top: 12px;"><tr>';
        for (var i = 0; i < slide.columns.length; i++) { html += '<th>' + slide.columns[i] + '</th>'; }
        html += '</tr>';
        for (var r = 0; r < slide.rows.length; r++) {
          html += '<tr>';
          for (var c = 0; c < slide.columns.length; c++) { html += '<td>' + slide.rows[r][slide.columns[c]] + '</td>'; }
          html += '</tr>';
        }
        html += '</table>' + footerLink;
      } else if (slide.type === 'cta') {
        html = '<h2>' + slide.h2 + '</h2>'
          + '<p style="margin-top: 20px;">' + slide.body + '</p>'
          + '<a href="' + slide.href + '" target="_blank" rel="noopener" style="display: inline-block; margin-top: 24px; padding: 14px 28px; background: #6750a4; color: white; border-radius: 8px; text-decoration: none; font-size: 18px; font-weight: 700;">' + slide.cta + '</a>'
          + footerLink;
      }

      return '<div class="slide ' + slide.type + '">' + html + '</div>';
    }

    var params = new URLSearchParams(window.location.search);
    var lang = params.get('lang') || 'en';
    var isPrint = params.get('print') === '1';
    var content = CONTENT[lang] || CONTENT.en;
    var articleUrl = BASE_URL + '?lang=' + lang;

    document.getElementById('header-title').textContent = content.title;
    var backLink = document.getElementById('back-link');
    backLink.href = articleUrl;

    var container = document.getElementById('slides-container');
    for (var s = 0; s < content.slides.length; s++) {
      container.innerHTML += renderSlide(content.slides[s], articleUrl);
    }

    var currentSlideIdx = 0;
    var slides = document.querySelectorAll('.slide');
    var totalSlides = slides.length;
    document.getElementById('totalSlides').textContent = totalSlides;

    function showSlide(n) {
      if (n >= totalSlides) currentSlideIdx = totalSlides - 1;
      else if (n < 0) currentSlideIdx = 0;
      for (var i = 0; i < slides.length; i++) { slides[i].classList.remove('active'); }
      slides[currentSlideIdx].classList.add('active');
      document.getElementById('currentSlide').textContent = currentSlideIdx + 1;
      document.getElementById('prevBtn').disabled = currentSlideIdx === 0;
      document.getElementById('nextBtn').disabled = currentSlideIdx === totalSlides - 1;
    }

    function changeSlide(n) {
      currentSlideIdx += n;
      showSlide(currentSlideIdx);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    window.addEventListener('beforeprint', function() {
      for (var i = 0; i < slides.length; i++) { slides[i].style.display = 'flex'; }
    });
    window.addEventListener('afterprint', function() {
      for (var i = 0; i < slides.length; i++) { slides[i].style.removeProperty('display'); }
      showSlide(currentSlideIdx);
    });

    if (isPrint) {
      window.addEventListener('load', function() { window.print(); });
    }

    showSlide(0);
  </script>
