name: Daily IndexNow Submission

on:
  schedule:
    # Run every day at 2 AM UTC (10 PM EST / 7 PM PST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  submit-all-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Submit all pages to Bing IndexNow
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
        run: |
          # Fetch sitemap and extract all URLs
          echo "📥 Fetching sitemap from https://www.promptquorum.com/sitemap.xml..."
          SITEMAP=$(curl -s https://www.promptquorum.com/sitemap.xml)

          # Extract all <loc> URLs and build JSON array
          URLS=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -s .)
          TOTAL_URLS=$(echo "$URLS" | jq 'length')

          echo "📢 Submitting $TOTAL_URLS URLs to Bing IndexNow..."

          # Submit to IndexNow API
          RESPONSE=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST https://www.promptquorum.com/api/indexnow \
            -H "Content-Type: application/json" \
            -H "X-IndexNow-Secret: $INDEXNOW_SECRET" \
            -d "{\"urls\": $URLS}")
          echo "Status: $RESPONSE"
          cat /tmp/indexnow_response.txt
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Submission failed with status $RESPONSE"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: echo "⚠️ IndexNow submission failed. Check logs above."
