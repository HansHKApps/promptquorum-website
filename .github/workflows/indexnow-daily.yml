name: Weekly IndexNow Submission

on:
  schedule:
    # Every Sunday at 3 AM UTC — full sitemap resubmit to Bing IndexNow
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  submit-all-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Submit all pages to Bing IndexNow
        run: |
          INDEXNOW_KEY="2fd43c75367b4c029c9ea4eef7ad34f8"
          HOST="www.promptquorum.com"
          KEY_LOCATION="https://www.promptquorum.com/${INDEXNOW_KEY}.txt"

          # Fetch sitemap and extract all page URLs. /sitemap.xml is a
          # sitemapindex pointing at child sitemaps under /sitemaps/*.xml —
          # walk it and read real page URLs from each child.
          echo "📥 Fetching sitemap from https://${HOST}/sitemap.xml..."
          SITEMAP=$(curl -s "https://${HOST}/sitemap.xml")

          > /tmp/all_page_urls.txt

          if echo "$SITEMAP" | grep -q "<sitemapindex"; then
            echo "ℹ️ /sitemap.xml is a sitemap index — walking its child sitemaps."
            CHILD_SITEMAPS=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+')
            for child in $CHILD_SITEMAPS; do
              echo "  📥 Fetching child sitemap: $child"
              curl -s "$child" | grep -oP '(?<=<loc>)[^<]+' >> /tmp/all_page_urls.txt
            done
          else
            echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' >> /tmp/all_page_urls.txt
          fi

          # Extract all <loc> URLs (English canonical only — no /de /fr /ja /zh variants)
          URLS=$(grep -vP "/${HOST}/[a-z]{2}(/|$)" /tmp/all_page_urls.txt | jq -R . | jq -s .)
          TOTAL_URLS=$(echo "$URLS" | jq 'length')

          echo "📢 Submitting $TOTAL_URLS URLs to Bing IndexNow..."

          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$KEY_LOCATION" \
            --argjson urlList "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          RESPONSE=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Status: $RESPONSE"
          cat /tmp/indexnow_response.txt
          # 200 = OK, 202 = Accepted (both are success for IndexNow)
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
            echo "❌ Submission failed with status $RESPONSE"
            exit 1
          fi
          echo "✅ Successfully submitted $TOTAL_URLS URLs to Bing IndexNow"

      - name: Notify on failure
        if: failure()
        run: echo "⚠️ IndexNow submission failed. Check logs above."
