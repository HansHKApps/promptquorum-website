name: Model Name Validation (nightly)

# Runs the strict model-name check (unknown/stale model mentions) on a
# schedule, separate from the Vercel deploy path. prebuild runs this same
# validator with --warn-only so new violations never block a production
# deploy; this workflow is where they actually get reviewed and, if real
# debt, accepted via `npm run validate:models:strict -- --write-baseline`.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  validate-model-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate model names (strict)
        run: npm run validate:models:strict
