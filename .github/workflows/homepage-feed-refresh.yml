name: Homepage Content Feed Refresh

# Safety-net refresh for the homepage's Latest Posts / Recently Updated blocks
# and the "Articles Published" stat (src/components/home/LatestPostsBlock.tsx,
# RecentlyUpdatedBlock.tsx, ByTheNumbersBlock.tsx), which read from a
# generated JSON snapshot (src/generated/home-content-feed.json,
# scripts/generate-home-content-feed.mjs) rather than a live import — see that
# script's own header comment for why.
#
# `npm run build`'s prebuild chain (package.json) now regenerates this file
# fresh on every production build, so every push to main that triggers a
# Vercel deploy already ships an up-to-date snapshot — that's the primary fix
# (added 2026-09-22, after the count sat stale at 779 for two days). This
# weekly job is a secondary safety net only: it keeps the *committed* JSON in
# the repo in sync too (so a local `git pull` + dev server also shows current
# numbers), and catches drift on the rare chance a deploy is skipped. Only
# pushes when there's an actual diff — a no-op week costs nothing beyond CI
# minutes.
#
# By design this does NOT cover the homepage's other data-dependent blocks:
# Trending (needs a manual GSC export from Hans) and Recent Mentions (needs a
# manual backlink export) — neither can be regenerated from in-repo content
# alone.

on:
  schedule:
    - cron: '17 6 * * 0' # Sundays ~06:17 UTC — see ScheduleWakeup guidance on avoiding :00/:30
  workflow_dispatch: {}

concurrency:
  group: homepage-feed-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate homepage content feed
        run: node scripts/generate-home-content-feed.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/generated/home-content-feed.json
          if git diff --cached --quiet; then
            echo "No changes — homepage content feed already up to date."
            exit 0
          fi
          git commit -m "chore(homepage): weekly content feed refresh"
          git push
