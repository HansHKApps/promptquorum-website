name: Homepage Content Feed Refresh

# Weekly refresh for the homepage's Latest Posts / Recently Updated blocks
# (src/components/home/LatestPostsBlock.tsx, RecentlyUpdatedBlock.tsx), which
# read from a generated JSON snapshot (src/generated/home-content-feed.json,
# scripts/generate-home-content-feed.mjs) rather than a live import — see that
# script's own header comment for why. That snapshot only updates when
# regenerated + committed; a normal content PR that adds/updates an article
# doesn't automatically refresh it, so this catches that drift even if
# forgotten. Only pushes (and only then triggers a real Vercel deploy) when
# there's an actual diff — a no-op week costs nothing beyond CI minutes.
#
# By design this does NOT cover the homepage's other data-dependent blocks:
# Trending (needs a manual GSC export from Hans) and Recent Mentions (needs a
# manual backlink export) — neither can be regenerated from in-repo content
# alone.

on:
  schedule:
    - cron: '17 6 * * 0' # Sundays ~06:17 UTC — see ScheduleWakeup guidance on avoiding :00/:30
  workflow_dispatch: {}

concurrency:
  group: homepage-feed-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate homepage content feed
        run: node scripts/generate-home-content-feed.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/generated/home-content-feed.json
          if git diff --cached --quiet; then
            echo "No changes — homepage content feed already up to date."
            exit 0
          fi
          git commit -m "chore(homepage): weekly content feed refresh"
          git push
