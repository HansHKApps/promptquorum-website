<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptQuorum Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      width: 600px;
      max-height: 500px;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      padding: 14px 16px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .header button {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .header button:hover {
      background: rgba(255,255,255,0.3);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #999;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th {
      background: #fff;
      border-bottom: 2px solid #e5e7eb;
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #333;
    }

    tr:hover {
      background: #f9fafb;
    }

    .source-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 10px;
      color: white;
    }

    .source-badge.umami {
      background: #8b5cf6;
    }

    .source-badge.ga4 {
      background: #f97316;
    }

    .source-badge.vercel {
      background: #000;
    }

    .footer {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 10px 16px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PromptQuorum Outbound Tracker</h1>
    <button id="clearBtn">Clear</button>
  </div>

  <div class="content" id="content">
    <div class="empty">No events captured yet. Click an outbound link on PromptQuorum to see events here.</div>
  </div>

  <div class="footer">
    <div id="eventCount">0 events</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
